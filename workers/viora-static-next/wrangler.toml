name = "viora-static-next"
main = "./worker.js"
compatibility_date = "2026-11-12"

[assets]
directory = "../../web"
binding = "ASSETS"
run_worker_first = ["/*"]
html_handling = "auto-trailing-slash"

[[services]]
binding = "LEGACY"
service = "viora-static-git"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1
