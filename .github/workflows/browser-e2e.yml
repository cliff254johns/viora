name: VIORA browser and accessibility tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    if: ${{ secrets.VIORA_TEST_EMAIL != '' && secrets.VIORA_TEST_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VIORA_BASE_URL: https://viora.co.ke
          VIORA_TEST_EMAIL: ${{ secrets.VIORA_TEST_EMAIL }}
          VIORA_TEST_PASSWORD: ${{ secrets.VIORA_TEST_PASSWORD }}
