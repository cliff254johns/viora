name: VIORA Outreach checks
on:
  pull_request:
    branches: [main]
    paths: ["web/main.html","web/main.css","web/outreach.html","web/outreach.css","web/outreach.js","workers/viora-api/index.js","workers/viora-api/wrangler.toml","docs/GLOBAL-SALES-ENGINE.md","docs/OUTREACH-AUTOMATION-IMPLEMENTATION.md",".github/workflows/viora-outreach-check.yml"]
  push:
    branches: [feature/viora-outreach-enterprise-ui, feature/global-outreach-autonomy, feature/global-sales-engine]
    paths: ["web/main.html","web/main.css","web/outreach.html","web/outreach.css","web/outreach.js","workers/viora-api/index.js","workers/viora-api/wrangler.toml",".github/workflows/viora-outreach-check.yml"]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check outreach JavaScript syntax
        run: node --input-type=module --check < web/outreach.js
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --input-type=module --check < workers/viora-api/index.js
      - name: Verify separate frontend assets
        run: |
          grep -q 'href="/outreach.css?' web/outreach.html
          grep -q 'src="/outreach.js?' web/outreach.html
          test -s web/outreach.css
          test -s web/outreach.js
      - name: Verify VIORA navigation entry and admin/exec visibility
        run: |
          grep -q 'data-group="outreach"' web/main.html
          grep -q 'data-roles="admin,exec"' web/main.html
          grep -q 'href="/outreach.html"' web/main.html
          grep -q 'data-group="engineering-command"' web/main.html
          grep -q 'data-group="engineering-visuals"' web/main.html
          grep -q '/outreach/auto-reply' workers/viora-api/index.js
          grep -q 'publishOutreachEscalation' workers/viora-api/index.js
          grep -q '/outreach/campaign/queue' workers/viora-api/index.js
          grep -q 'runOutreachCampaignScheduler' workers/viora-api/index.js
          grep -q '/outreach/unsubscribe' workers/viora-api/index.js
          grep -q 'id="outboundEnabled"' web/outreach.html
          grep -q 'id="aiQueueCampaign"' web/outreach.html
          grep -q 'outreachLegalReviewComplete' workers/viora-api/index.js
          grep -q 'outreachValidateRegionalEligibility' workers/viora-api/index.js
          grep -q 'candidate.humanApproved !== true' workers/viora-api/index.js
          grep -q 'expectedApprovalDigest' workers/viora-api/index.js
          grep -q 'approvalDigest' workers/viora-api/index.js
          grep -q 'consentEvidence' workers/viora-api/index.js
          grep -q "countryCode === 'GB'" workers/viora-api/index.js
          grep -q "countryCode === 'US'" workers/viora-api/index.js
          grep -q 'canSpamAddressVerified' workers/viora-api/index.js
          grep -q 'List-Unsubscribe' workers/viora-api/index.js
          grep -q 'outreach/suppressions' workers/viora-api/index.js
      - name: Verify shared CRM and Communications integration
        run: |
          grep -Fq "onValue(ref(db,ORG+'/leads')" web/outreach.js
          grep -Fq "ORG+'/leads/'+id]:record" web/outreach.js
          grep -Fq "set(ref(db,ORG+'/commLog/'+commLogId),comm)" web/outreach.js
          grep -Fq "channel:'em'" web/outreach.js
          grep -Fq "source:'Outreach Centre'" web/outreach.js
