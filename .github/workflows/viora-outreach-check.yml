name: VIORA Outreach checks
on:
  pull_request:
    branches: [main]
    paths: ["web/main.html","web/main.css","web/outreach.html","web/outreach.css","web/outreach.js","web/main/campaign-accounts.js","workers/viora-api/index.js","workers/viora-api/wrangler.toml","docs/GLOBAL-SALES-ENGINE.md","docs/OUTREACH-AUTOMATION-IMPLEMENTATION.md",".github/workflows/viora-outreach-check.yml"]
  push:
    branches: [feature/viora-outreach-enterprise-ui, feature/global-outreach-autonomy, feature/global-sales-engine, release/outreach-controlled-rollout]
    paths: ["web/main.html","web/main.css","web/outreach.html","web/outreach.css","web/outreach.js","web/main/campaign-accounts.js","workers/viora-api/index.js","workers/viora-api/wrangler.toml",".github/workflows/viora-outreach-check.yml"]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check outreach JavaScript syntax
        run: node --input-type=module --check < web/outreach.js
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --input-type=module --check < workers/viora-api/index.js
      - name: Verify separate frontend assets
        run: |
          grep -q 'href="/outreach.css?' web/outreach.html
          grep -q 'src="/outreach.js?' web/outreach.html
          test -s web/outreach.css
          test -s web/outreach.js
      - name: Verify VIORA navigation entry and admin/exec visibility
        run: |
          grep -q 'data-group="outreach"' web/main.html
          grep -q 'data-roles="admin,exec"' web/main.html
          grep -q 'href="/outreach.html"' web/main.html
          grep -q 'data-group="engineering-command"' web/main.html
          grep -q 'data-group="engineering-visuals"' web/main.html
          grep -q '/outreach/auto-reply' workers/viora-api/index.js
          grep -q 'publishOutreachEscalation' workers/viora-api/index.js
          grep -q '/outreach/campaign/queue' workers/viora-api/index.js
          grep -q 'runOutreachCampaignScheduler' workers/viora-api/index.js
          grep -q '/outreach/unsubscribe' workers/viora-api/index.js
          grep -q 'id="outboundEnabled"' web/outreach.html
          grep -q 'id="aiQueueCampaign"' web/outreach.html
      - name: Verify shared CRM and Communications integration
        run: |
          grep -Fq "onValue(ref(db,ORG+'/leads')" web/outreach.js
          grep -Fq "ORG+'/leads/'+leadId]:lead" web/outreach.js
          grep -Fq "set(ref(db,ORG+'/commLog/'+commLogId),comm)" web/outreach.js
          grep -Fq "channel:'em'" web/outreach.js
          grep -Fq "source:'Outreach Centre'" web/outreach.js
      - name: Verify per-lead email activity capture
        run: |
          grep -Fq 'outreachHistory/' web/outreach.js
          grep -Fq "lastOutreachStatus:'sent'" web/outreach.js
          grep -Fq 'lastOutreachProviderId' web/outreach.js
          grep -Fq 'lastOutreachEmailId' web/outreach.js
          grep -Fq 'sendAttempted=true' web/outreach.js
          grep -Fq 'uncertainAddresses' web/outreach.js
          grep -Fq 'Do not resend uncertain recipients' web/outreach.js
          grep -Fq 'async function writeOutreachCampaignActivity' workers/viora-api/index.js
          grep -Fq "writeOutreachCampaignActivity(env, record, 'queued')" workers/viora-api/index.js
          grep -Fq "writeOutreachCampaignActivity(env, candidate, 'sending'" workers/viora-api/index.js
          grep -Fq "writeOutreachCampaignActivity(env, candidate, 'sent'" workers/viora-api/index.js
          grep -Fq "writeOutreachCampaignActivity(env, candidate, 'send_uncertain'" workers/viora-api/index.js
          grep -Fq "writeOutreachCampaignActivity(env, followRecord, 'queued')" workers/viora-api/index.js
      - name: Verify email automation is opt-in and social jobs remain independent
        run: |
          grep -Fq 'ENABLE_OUTREACH_EMAIL_AUTOMATION' workers/viora-api/scheduled-jobs.js
          grep -Fq 'ENABLE_OUTREACH_EMAIL_SENDING' workers/viora-api/index.js
          grep -Fq 'ENABLE_OUTREACH_EMAIL_SENDING = "false"' workers/viora-api/wrangler.toml
          grep -Fq "social_publish: () => publishDueScheduledPosts(env)" workers/viora-api/index.js
          grep -Fq 'for (const [job, run] of jobs)' workers/viora-api/scheduled-jobs.js
          grep -Fq 'keep_vars = true' workers/viora-api/wrangler.toml
          grep -Fq 'ENABLE_OUTREACH_EMAIL_AUTOMATION = "false"' workers/viora-api/wrangler.toml
          grep -Fq 'ENABLE_OUTREACH_EMAIL_SENDING = "false"' workers/viora-api/wrangler.toml
          grep -Fq 'error.status=res.status' web/outreach.js
          grep -Fq 'blockedSend=httpStatus===423' web/outreach.js
          grep -Fq "outcome=blockedSend?'blocked':uncertainSend?'send_uncertain':'failed'" web/outreach.js
          grep -Fq '[observability.logs]' workers/viora-api/wrangler.toml
          grep -Fq 'invocation_logs = true' workers/viora-api/wrangler.toml
          grep -Fq '[observability.traces]' workers/viora-api/wrangler.toml
          grep -Fq 'head_sampling_rate = 0.01' workers/viora-api/wrangler.toml
      - name: Verify durable Facebook publish claims and API connection checks
        run: |
          grep -Fq 'async function claimScheduledCampaignPost' workers/viora-api/index.js
          grep -Fq 'X-Firebase-ETag' workers/viora-api/index.js
          grep -Fq "'If-Match': etag" workers/viora-api/index.js
          grep -Fq "post.status = 'publish_uncertain'" workers/viora-api/index.js
          grep -Fq 'reconciliationRequired = true' workers/viora-api/index.js
          grep -Fq 'async function handleSocialConfigStatus' workers/viora-api/index.js
          grep -Fq "path === '/social/config/status'" workers/viora-api/index.js
          grep -Fq 'loadApiStatus' web/main/campaign-accounts.js
          grep -Fq 'API credentials missing' web/main/campaign-accounts.js
      - name: Run repository contract and unit tests
        run: npm test
      - name: Run available integration tests
        run: npm run test:integration
