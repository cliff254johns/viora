name: VIORA automatic engineering documentation
on:
  push:
    branches: [main]
    paths: ["web/**","workers/**","scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node scripts/generate-engineering-docs.mjs
      - name: Commit generated inventories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated
          git diff --cached --quiet || (git commit -m "docs: refresh generated engineering inventory" && git push)
