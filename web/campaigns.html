<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="VIORA Campaigns — social media command centre">
<meta name="theme-color" content="#6558f5">
<title>Campaigns — VIORA</title>

<!-- ── Favicon (root) ── -->
<link rel="icon" type="image/png" href="/viora.png" />
<link rel="apple-touch-icon" href="/viora.png" />

<!-- ── Fonts + icons + charts (CDN) ── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- /main.css intentionally removed — Orbit shell uses inline styles -->

<style>
/* ═══════════════════════════════════════════════════════════════
   Orbit shell — self-contained styles.
   These override / supplement /main.css so the shell renders
   correctly even if main.css is the older VIORA theme.
   Uses the same CSS variables as VIORA where possible.
   ═══════════════════════════════════════════════════════════════ */

:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f8f9fc;
  --text:#172033; --muted:#748096; --line:#e7eaf1;
  --accent:#6558f5; --accent2:#f05aa6;
  --good:#159b72; --warn:#d68b22; --bad:#d95368;
  --shadow:0 12px 34px rgba(24,36,68,.07); --radius:17px;

  /* Aliases so any older module using var(--text-primary) etc. still works */
  --text-primary: var(--text);
  --text-secondary: var(--muted);
  --text-light: var(--muted);
  --border-color: var(--line);
  --bg-input: var(--panel2);
  --bg-elev-1: var(--panel);
  --bg-elev-2: var(--panel2);
  --bg-glass: rgba(255,255,255,0.75);
  --accent-blue: var(--accent);
  --accent-green: var(--good);
  --accent-red: var(--bad);
  --accent-gold: var(--warn);
  --accent-orange: #ff9a3c;
  --accent-purple: #a855f7;
  --chart-text: var(--muted);
}

[data-theme="dark"]{
  --bg:#10131c; --panel:#191e2a; --panel2:#202636;
  --text:#edf1fb; --muted:#9aa5ba; --line:#2b3446;
  --accent:#8190ff; --accent2:#b18aff;
  --good:#48c99b; --warn:#f0b35c; --bad:#ff7188;
  --shadow:0 12px 34px rgba(0,0,0,.22);

  --bg-glass: rgba(25,30,42,0.75);
  --text-primary: var(--text);
  --text-secondary: var(--muted);
  --text-light: var(--muted);
  --border-color: var(--line);
  --bg-input: var(--panel2);
  --bg-elev-1: var(--panel);
  --bg-elev-2: var(--panel2);
  --chart-text: var(--muted);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* ── Sidebar ── */
.app{min-height:100vh}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:258px;
  background:var(--panel);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;
  z-index:20;transition:transform .25s ease;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 9px 22px}
.logo{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;
  background:linear-gradient(135deg,#6558f5,#e45fa8 60%,#20c8d8);
  box-shadow:0 7px 18px #6878ed55;
}
.brand strong{font-size:16px;letter-spacing:-.4px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;text-transform:uppercase}

.workspace{
  margin:0 4px 18px;padding:11px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;
  display:flex;align-items:center;gap:9px;
}
.workspace .avatar{
  width:31px;height:31px;border-radius:9px;background:#e8eaff;color:#4e5ce1;
  display:grid;place-items:center;font-weight:800;flex-shrink:0;
}
.workspace div:nth-child(2){flex:1;min-width:0}
.workspace b{display:block;font-size:12px}
.workspace small{color:var(--muted);font-size:10px}

.nav-label{
  padding:9px 11px 5px;color:var(--muted);font-size:10px;
  text-transform:uppercase;letter-spacing:1.2px;font-weight:800;
}
.nav{display:grid;gap:3px}
.nav button{
  border:0;background:transparent;color:var(--muted);
  padding:10px 11px;border-radius:10px;
  display:flex;align-items:center;gap:12px;
  text-align:left;width:100%;font-weight:600;font-size:12.5px;
  cursor:pointer;transition:background .15s ease,color .15s ease;
}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.ico{width:18px;text-align:center;font-size:16px;flex-shrink:0}

.sidebar-bottom{margin-top:auto;padding:12px 5px 0}
.planbox{background:linear-gradient(135deg,#283a88,#7047aa);color:#fff;padding:14px;border-radius:13px;margin-bottom:12px}
.planbox b{font-size:12px;display:block}
.planbox p{font-size:10px;opacity:.8;margin:5px 0 10px}
.planbox button{background:#fff;color:#33418e;border:0;border-radius:8px;padding:7px 10px;font-size:10px;font-weight:800;cursor:pointer}

/* ── Main ── */
.main{margin-left:258px;min-height:100vh}
.topbar{
  height:72px;padding:0 30px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:15;
}
.top-left{display:flex;align-items:center;gap:13px}
.hamb{display:none}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--text)}
.top-actions{display:flex;align-items:center;gap:9px}
.search{width:230px;position:relative}
.search input{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  padding:9px 12px 9px 34px;border-radius:10px;color:var(--text);outline:none;
}
.search span{position:absolute;left:11px;top:8px;color:var(--muted)}
.iconbtn{
  width:36px;height:36px;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;color:var(--muted);position:relative;cursor:pointer;
}
.dot{position:absolute;right:7px;top:6px;width:6px;height:6px;background:#ef5c75;border-radius:50%}
.userpic{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#d7ddff,#e9d7ff);color:#5548a7;font-weight:800;
  border:0;cursor:pointer;
}

.content{padding:27px 30px 50px;max-width:1600px;margin:auto}

/* ── Module content styles (used by -modules.js output) ── */
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.eyebrow{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:1.3px;text-transform:uppercase}
.pagehead h1{font-size:25px;letter-spacing:-.8px;margin:3px 0 4px}
.sub{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:10px;padding:9px 13px;font-weight:700;font-size:11px;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{
  background:linear-gradient(115deg,#6558f5,#a34ce8 58%,#e45fa8);
  border:0;color:#fff;box-shadow:0 8px 20px #7959ec38;
}
.btn.soft{background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.outline{background:transparent}
.btn-sm{padding:6px 10px;font-size:10.5px}
.btn-xs{padding:4px 8px;font-size:9.5px}

.grid{display:grid;gap:15px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.two{grid-template-columns:1.55fr 1fr}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:17px;
  box-shadow:var(--shadow);min-width:0;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(63,70,150,.12)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cardhead h3{font-size:13px;margin:0}

.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650}
.kpi-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:16px}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-1px;margin:8px 0 1px}
.trend{font-size:10px;color:var(--good)}

.muted{color:var(--muted)}
.small{font-size:10px}
.pill{font-size:9px;background:var(--panel2);padding:4px 8px;border-radius:20px;color:var(--muted);display:inline-block}

.status{
  display:inline-flex;align-items:center;gap:5px;border-radius:20px;
  padding:4px 8px;font-size:9px;font-weight:800;
  background:var(--panel2);color:var(--muted);white-space:nowrap;
}
.status:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.status.good{background:#159b7217;color:var(--good)}
.status.warn{background:#d68b2217;color:var(--warn)}
.status.bad{background:#d9536817;color:var(--bad)}

.notice{
  border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));
  background:color-mix(in srgb,var(--warn) 8%,var(--panel));
  border-radius:11px;padding:12px;font-size:10px;color:var(--text);
  margin-bottom:15px;
}

/* Table */
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.8px;padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:11px}
tr:last-child td{border-bottom:0}

/* Social accounts grid (used by campaign-accounts.js) */
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.account-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.account-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--platform-color,var(--accent));opacity:.9}
.account-head{display:flex;align-items:center;gap:10px}
.account-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;background:var(--platform-color,var(--accent));flex-shrink:0}
.account-body{flex:1;min-width:0}
.account-name{font-weight:700;font-size:13px}
.account-handle{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.account-meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.account-actions{display:flex;gap:6px;align-items:center;margin-top:auto}
.account-actions .btn{flex:1;justify-content:center;padding:7px 10px;font-size:10.5px}

/* Chart boxes (used by analytics) */
.chart-box{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);
  margin-bottom:15px;
}
.chart-box h4{font-size:13px;margin:0 0 12px}
.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:15px;
}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-card .number{font-size:26px;font-weight:800;letter-spacing:-1px}
.stat-card .label{font-size:11px;color:var(--muted)}
.table-wrapper{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);overflow:auto;margin-bottom:15px;
}
.empty{color:var(--muted);text-align:center;padding:24px}
.empty-state{color:var(--muted);text-align:center;padding:24px;font-size:.85rem}

/* Agent grid (used by agents module) */
.agentgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.agent{padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.agenttop{display:flex;justify-content:space-between;align-items:center}
.agenticon{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));display:grid;place-items:center;font-size:18px}
.agent h4{margin:10px 0 3px;font-size:12px}
.agent p{font-size:10px;color:var(--muted);margin:0 0 11px;min-height:30px}
.agentfoot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.switch{width:32px;height:18px;border-radius:20px;background:#aab2c3;position:relative;border:0;cursor:pointer;transition:background .18s ease}
.switch:after{content:"";position:absolute;width:12px;height:12px;left:3px;top:3px;background:#fff;border-radius:50%;transition:left .18s ease}
.switch.on{background:var(--good)}
.switch.on:after{left:17px}

/* Form */
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:10px;font-weight:750;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);background:var(--panel2);
  border-radius:9px;padding:10px;color:var(--text);outline:none;font-size:11px;
}
.field textarea{min-height:90px;resize:vertical}
.field.full{grid-column:1/-1}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.form-row > div{display:grid;gap:5px}
.form-row label{font-size:10px;font-weight:750;color:var(--muted)}
.form-row input,.form-row select,.form-row textarea{
  width:100%;border:1px solid var(--line);background:var(--panel2);
  border-radius:9px;padding:10px;color:var(--text);outline:none;font-size:11px;
}

/* Calendar */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{min-height:92px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px;font-size:10px}
.day b{display:block;margin-bottom:7px}
.event{background:color-mix(in srgb,var(--accent) 13%,var(--panel));color:var(--accent);border-radius:5px;padding:4px;margin:3px 0;font-size:8px;overflow:hidden}

/* Inbox */
.inbox{display:grid;grid-template-columns:280px 1fr 280px;min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.inboxlist{border-right:1px solid var(--line);background:var(--panel2);overflow:auto;max-height:620px}
.conversation{padding:12px;border-top:1px solid var(--line);cursor:pointer}
.conversation.active{background:var(--panel)}
.conversation b{font-size:12px}
.conversation .small{color:var(--muted);margin:2px 0}
.chat{display:flex;flex-direction:column;min-width:0}
.chathead{padding:13px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800}
.messages{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1;background:var(--panel2);overflow:auto;max-height:480px}
.bubble{max-width:78%;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:11px}
.bubble.mine{align-self:flex-end;background:color-mix(in srgb,var(--accent) 13%,var(--panel));border-color:transparent}
.reply{display:flex;padding:10px;gap:7px;border-top:1px solid var(--line)}
.reply input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px;color:var(--text)}
.profilepane{border-left:1px solid var(--line);padding:14px}

/* Integration grid */
.integration-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;display:grid}
.integration{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.integration .bigico{font-size:22px}
.integration b{display:block;font-size:11px;margin-top:8px}
.integration .small{color:var(--muted);margin-top:4px}

/* ── Modals ── */
.modalback, .modal-overlay{
  position:fixed;inset:0;background:#080d1b88;z-index:60;
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modalback.show, .modal-overlay.active{display:flex}
.modal{
  width:min(560px,100%);max-height:90vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:20px;box-shadow:0 25px 80px #0004;
}
.modal.large{width:min(640px,100%)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modalhead h3{margin:0;font-size:15px}
.modal h2{font-size:15px;margin:0 0 15px;display:flex;align-items:center;gap:10px}
.modal-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.close{border:0;background:var(--panel2);color:var(--text);border-radius:8px;width:30px;height:30px;cursor:pointer}

/* ── Toasts ── */
.toast{
  position:fixed;right:22px;bottom:22px;z-index:90;
  background:#1d2940;color:#fff;padding:12px 16px;border-radius:11px;
  box-shadow:var(--shadow);font-size:11px;
  opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}
#toastContainer{
  position:fixed;top:16px;right:16px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
#toastContainer .toast{
  position:relative;right:auto;bottom:auto;opacity:1;transform:none;
  pointer-events:auto;
}
#toastContainer .toast.error{background:#7a1f36}
#toastContainer .toast.success{background:#0e5a44}
#toastContainer .toast.warning{background:#7a5320}

/* ── Mobile overlay ── */
.mobile-overlay{display:none}
.mobile-overlay.show{display:block;position:fixed;inset:0;background:#0006;z-index:19}

/* ── Login gate ── */
.login-gate{
  position:fixed;inset:0;z-index:1000;
  background:
    radial-gradient(circle at 80% 15%,#6653dd 0,transparent 32%),
    radial-gradient(circle at 10% 90%,#168c9c 0,transparent 34%),
    #111426;
  display:grid;place-items:center;padding:20px;
}
.login-card{
  width:min(420px,100%);padding:30px;
  border:1px solid #ffffff22;border-radius:24px;
  background:#fffffff2;color:#182039;
  box-shadow:0 30px 100px #0007;
}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-mark{
  width:45px;height:45px;border-radius:15px;
  background:linear-gradient(135deg,#6558f5,#e45fa8,#20c8d8);
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;
  overflow:hidden;
}
.login-mark img{width:100%;height:100%;object-fit:cover;border-radius:15px}
.login-card h1{font-size:25px;margin:0 0 5px}
.login-card p{font-size:12px;color:#69728b}
.login-card label{display:block;font-size:11px;font-weight:800;margin:18px 0 6px}
.login-card input{
  width:100%;padding:13px;border:1px solid #dce0eb;
  border-radius:11px;background:#f8f9fd;color:#182039;outline:none;
}
.login-card input:focus{border-color:#6558f5;box-shadow:0 0 0 3px #6558f51c}
.login-card button{
  width:100%;padding:13px;margin-top:14px;border:0;
  border-radius:11px;color:#fff;font-weight:800;
  background:linear-gradient(110deg,#6558f5,#b34de4,#e45fa8);
}
.login-error{color:#c83e5c;font-size:11px;min-height:17px;margin-top:8px}
.login-note{font-size:10px;color:#7d8497;margin-top:16px;line-height:1.5}

/* ── Mobile bottom nav ── */
.mobile-nav{display:none}

/* ── Responsive ── */
@media(max-width:1100px){
  .sidebar{width:225px}
  .main{margin-left:225px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .agentgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%);width:270px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamb{display:inline-grid;place-items:center}
  .topbar{padding:0 14px;height:62px}
  .content{padding:20px 14px 100px}
  .search{display:none}
  .crumb{display:none}
  .pagehead{display:block}
  .pagehead .actions{margin-top:13px}
  .kpis{gap:9px}
  .card{padding:14px}
  .kpi-value{font-size:22px}
  .three,.agentgrid{grid-template-columns:1fr}
  .formgrid,.form-row{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .inbox{grid-template-columns:1fr}
  .profilepane{display:none}
  .login-card{padding:24px}

  .mobile-nav{
    display:grid;grid-template-columns:repeat(5,1fr);
    position:fixed;z-index:30;bottom:0;left:0;right:0;
    padding:8px 5px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--panel) 93%,transparent);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    box-shadow:0 -8px 30px rgba(0,0,0,.06);
  }
  [data-theme="dark"] .mobile-nav{box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  .mobile-nav button{
    border:0;background:transparent;color:var(--muted);
    font-size:9.5px;font-weight:700;display:grid;justify-items:center;gap:3px;
    padding:6px 0;cursor:pointer;border-radius:10px;
  }
  .mobile-nav button i{font-size:19px;line-height:1}
  .mobile-nav button.active{color:var(--accent)}
  .mobile-nav button.active::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);
  }
  .mobile-nav button{position:relative}
  .mnav-label{line-height:1}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
   
/* ═══════════════════════════════════════════════════════════════
   CREATIVE STUDIO — v2
   ═══════════════════════════════════════════════════════════════ */
.cs-wrap{display:flex;flex-direction:column;gap:16px}
.cs-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.cs-mode-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--panel);color:var(--text);text-align:left;cursor:pointer;
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.cs-mode-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.cs-mode-btn.active{
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,var(--panel));
}
.cs-mode-btn i{font-size:1.05rem;margin-bottom:6px;color:var(--muted)}
.cs-mode-btn.active i{color:var(--accent)}
.cs-mode-btn span{font-weight:800;font-size:13px}
.cs-mode-btn small{color:var(--muted);font-size:10.5px;font-weight:500;line-height:1.4}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cs-multi-hint{margin:10px 0}
.cs-actions{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.cs-actions .btn{flex:1;justify-content:center;min-width:160px}
.cs-recent{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.cs-recent-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cs-recent-head h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0}
.cs-recent-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cs-recent-item{
  flex:0 0 auto;width:110px;cursor:pointer;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--panel2);transition:border-color .15s ease,transform .15s ease;
}
.cs-recent-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.cs-recent-item img{width:100%;height:70px;object-fit:cover;display:block}
.cs-recent-meta{padding:5px 8px}
.cs-recent-model{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-recent-time{font-size:9px;color:var(--text-light);margin-top:1px}
.cs-image-preview{
  display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border-radius:12px;padding:12px;
  border:1px solid var(--line);min-height:180px;
}
.cs-image-preview img{max-width:100%;max-height:380px;border-radius:8px;display:block}
.cs-image-meta{
  display:flex;gap:14px;justify-content:center;
  margin-top:10px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;
}
.cs-image-meta i{opacity:.7;margin-right:3px}
.cs-image-actions{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.cs-error{
  padding:16px;border-radius:12px;
  background:color-mix(in srgb,var(--bad) 8%,var(--panel));
  border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line));
}
.cs-error-head{font-weight:800;color:var(--bad);margin-bottom:6px;font-size:12px}
.cs-error-body{font-size:11px;color:var(--text);margin-bottom:10px;line-height:1.5}
@media(max-width:900px){
  .cs-grid{grid-template-columns:1fr}
  .cs-mode{grid-template-columns:1fr}
}
   

/* ═══════════════════════════════════════════════════════════════
   POST LIBRARY + FANOUT DETAIL
   ═══════════════════════════════════════════════════════════════ */
.plib-toolbar{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.plib-filters{display:flex;gap:6px;flex-wrap:wrap}
.plib-filter-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;
  transition:all .15s ease;
}
.plib-filter-btn:hover{border-color:var(--accent);color:var(--text)}
.plib-filter-btn.active{
  background:color-mix(in srgb,var(--accent) 15%,var(--panel));
  border-color:var(--accent);color:var(--accent);
}
.plib-search-row{display:flex;gap:8px;flex-wrap:wrap}
.plib-search-row input,
.plib-search-row select{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;color:var(--text);font-size:12px;outline:none;
}
.plib-search-row input{flex:1;min-width:180px}
.plib-search-row select{min-width:140px}
.plib-search-row input:focus,
.plib-search-row select:focus{border-color:var(--accent)}

.plib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.plib-card{
  display:flex;gap:12px;padding:12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  cursor:pointer;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
  min-width:0;
}
.plib-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 28px rgba(24,36,68,.08)}
.plib-thumb{
  width:96px;height:96px;flex-shrink:0;border-radius:10px;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.plib-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.plib-thumb-empty{color:var(--muted);font-size:1.4rem;opacity:.4}
.plib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.plib-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plib-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:12px;
  font-size:9.5px;font-weight:800;letter-spacing:.3px;
  white-space:nowrap;
}
.plib-badge-good{background:#159b7217;color:var(--good)}
.plib-badge-warn{background:#d68b2217;color:var(--warn)}
.plib-badge-gray{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.plib-badge-info{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--accent)}
.plib-badge-bad{background:#d9536817;color:var(--bad)}
.plib-campaign{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plib-caption{
  font-size:12px;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.plib-chips{display:flex;flex-wrap:wrap;gap:4px}
.plib-chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
  font-size:9.5px;font-weight:600;color:var(--text);
  white-space:nowrap;
}
.plib-scheduled{
  font-size:10px;color:var(--warn);font-weight:600;
  display:flex;align-items:center;gap:4px;
}
.plib-stats{
  display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--muted);
  align-items:center;
}
.plib-stats span{display:inline-flex;align-items:center;gap:3px}
.plib-stats-empty{font-style:italic;color:var(--text-light);font-size:10.5px}
.plib-er{
  padding:2px 6px;border-radius:8px;
  background:color-mix(in srgb,var(--good) 15%,var(--panel));
  color:var(--good);font-weight:800;
}
.plib-actions{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px;
  border-top:1px solid var(--line);
}
.plib-actions .btn{font-size:10.5px;padding:5px 9px}

.plib-empty{
  grid-column:1/-1;text-align:center;padding:44px 24px;color:var(--muted);
}
.plib-empty-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.plib-empty-sub{font-size:12px;line-height:1.5}

/* ── Detail modal ── */
.plib-modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;gap:12px;
}
.plib-modal-head h3{margin:0;font-size:15px}
.plib-tabs{
  display:flex;gap:6px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px;
}
.plib-tab{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s ease;
}
.plib-tab:hover{border-color:var(--accent)}
.plib-tab.active{
  background:color-mix(in srgb,var(--accent) 12%,var(--panel));
  border-color:var(--accent);color:var(--accent);
}
.plib-detail-grid{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:20px;margin-bottom:20px}
.plib-detail-left{display:flex;flex-direction:column;gap:8px}
.plib-detail-img{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:8px;display:flex;align-items:center;justify-content:center;min-height:200px;
}
.plib-detail-img img{max-width:100%;max-height:300px;border-radius:8px;display:block}
.plib-detail-img-empty{
  background:var(--panel2);border:1px dashed var(--line);border-radius:12px;
  padding:40px 16px;text-align:center;color:var(--muted);
}
.plib-detail-img-meta{display:flex;gap:10px;font-size:10.5px;color:var(--muted);justify-content:center}
.plib-detail-img-actions{display:flex;gap:6px;justify-content:center}
.plib-detail-section{margin-bottom:16px}
.plib-detail-section h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
.plib-detail-row{display:flex;gap:8px;padding:4px 0;font-size:11.5px}
.plib-detail-label{color:var(--muted);min-width:80px;flex-shrink:0}
.plib-detail-caption{
  padding:10px;background:var(--panel2);border-radius:8px;
  font-size:12px;line-height:1.55;color:var(--text);white-space:pre-wrap;
}
.plib-detail-hashtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.plib-detail-utm code{
  font-family:monospace;font-size:10.5px;color:var(--accent);
  word-break:break-all;background:var(--panel2);padding:6px 8px;border-radius:6px;
  display:block;
}
.plib-stats-section{
  padding:14px;background:var(--panel2);border-radius:12px;
  border:1px solid var(--line);margin-bottom:16px;
}
.plib-stats-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.plib-stats-head h4{margin:0;font-size:12px}
.plib-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.plib-stat{text-align:center;padding:8px;background:var(--panel);border-radius:8px}
.plib-stat-num{font-size:16px;font-weight:800;letter-spacing:-.5px}
.plib-stat-lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.plib-stat-updated{font-size:10px;color:var(--muted);text-align:right;margin-top:8px}
.plib-detail-empty{
  padding:14px;background:var(--panel);border-radius:8px;
  color:var(--muted);font-size:12px;text-align:center;
}
.plib-history, .plib-compare{margin-bottom:16px}
.plib-history-head, .plib-compare-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.plib-history-head h4, .plib-compare-head h4{margin:0;font-size:12px}
.plib-compare-toggle{display:flex;gap:4px}
.plib-cmp-btn{
  padding:4px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;
}
.plib-cmp-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.plib-compare-chart{background:var(--panel2);border-radius:10px;padding:10px;border:1px solid var(--line)}
.plib-sched-banner{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;margin-bottom:16px;
  background:color-mix(in srgb,var(--warn) 8%,var(--panel));
  border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));
  border-radius:10px;font-size:12px;
}
.plib-sched-banner i{color:var(--warn);margin-top:3px;font-size:16px}
.plib-modal-actions{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
}
@media(max-width:760px){
  .plib-detail-grid{grid-template-columns:1fr}
  .plib-grid{grid-template-columns:1fr}
}
   
/* ═══════════════════════════════════════════════════════════════
   ADD-PLATFORM DIALOG + CAPTION CHOICE
   ═══════════════════════════════════════════════════════════════ */
.plib-caption-choice{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.plib-choice{
  display:flex;gap:10px;padding:12px;
  border:1.5px solid var(--line);border-radius:10px;
  background:var(--panel2);cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.plib-choice:hover{border-color:var(--accent)}
.plib-choice input[type="radio"]{margin-top:2px;flex-shrink:0;accent-color:var(--accent);width:auto}
.plib-choice input[type="radio"]:checked ~ div strong{color:var(--accent)}
.plib-choice:has(input:checked){
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 6%,var(--panel));
}
.plib-choice div{flex:1;min-width:0;font-size:12px;line-height:1.5}
.plib-choice strong{display:block;margin-bottom:2px;font-size:12px}
   
/* ═══════════════════════════════════════════════════════════════
   SHARED MODAL / FORM / BUTTON / BADGE STYLES
   ─────────────────────────────────────────────────────────────
   These classes are used by:
     • The AI composer (campaign-ai.js)
     • The Fanout Detail modal (orbit-modules.js)
     • The Add-platform dialog (orbit-modules.js)
     • The Edit-schedule dialog (orbit-modules.js)
     • Any dynamically-created modal in the campaigns shell

   They mirror the visual language of main.html so the composer
   looks identical here and in the main dashboard.
   ═══════════════════════════════════════════════════════════════ */

/* ── Modal shell ── */
.modal-overlay{
  position:fixed;inset:0;z-index:9000;
  background:rgba(8,13,27,0.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.active{display:flex}

.modal{
  width:min(560px,100%);
  max-height:92vh;overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 24px 80px rgba(6,12,30,0.28);
  animation:modal-fade-in .18s ease-out;
}
.modal.large{width:min(720px,100%)}
.modal.xl{width:min(1100px,100%)}
.modal h2{
  display:flex;align-items:center;gap:12px;
  margin:0 0 16px;font-size:16px;font-weight:800;
  letter-spacing:-.3px;
}
.modal h3{font-size:14px;margin:0}
.modal-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#6558f5,#a34ce8);
  color:#fff;font-size:16px;flex-shrink:0;
}
.modalhead{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
.modalhead h3{margin:0;font-size:15px}
.close{
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);border-radius:9px;
  width:32px;height:32px;font-size:18px;line-height:1;
  cursor:pointer;display:grid;place-items:center;
  transition:border-color .15s ease,color .15s ease;
}
.close:hover{border-color:var(--accent);color:var(--accent)}
.close-modal{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);font-size:20px;line-height:1;
  cursor:pointer;display:grid;place-items:center;
}

@keyframes modal-fade-in{
  from{opacity:0;transform:translateY(6px) scale(.99)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ── Form primitives ── */
.modal label,
.field label{
  display:block;
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);
  margin:14px 0 6px;
}
.modal label:first-of-type,
.field:first-of-type label{margin-top:0}

.modal input[type="text"],
.modal input[type="number"],
.modal input[type="email"],
.modal input[type="tel"],
.modal input[type="url"],
.modal input[type="date"],
.modal input[type="datetime-local"],
.modal input[type="password"],
.modal textarea,
.modal select,
.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  font-size:12.5px;
  outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
  font-family:inherit;
}
.modal input:focus,
.modal textarea:focus,
.modal select:focus,
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);
}
.modal textarea{min-height:80px;resize:vertical;line-height:1.5}

.modal input[type="checkbox"],
.modal input[type="radio"]{
  width:auto;accent-color:var(--accent);
  margin-right:6px;
}

.modal .field{margin-bottom:12px}
.modal .field.full{grid-column:1/-1}

.formgrid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.form-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin-bottom:12px;
}
.form-row > div{display:grid;gap:6px}
.form-row label{margin:0}

.form-section{
  font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.6px;
  color:var(--accent);
  margin:20px 0 10px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;
}
.form-section:first-of-type{margin-top:6px}

.form-actions{
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:20px;padding-top:16px;
  border-top:1px solid var(--line);
  flex-wrap:wrap;
}

/* ── Buttons (extend the existing .btn) ── */
.btn.primary,
.btn.btn-primary{
  background:linear-gradient(115deg,#6558f5,#a34ce8 58%,#e45fa8);
  border:0;color:#fff;
  box-shadow:0 6px 16px rgba(120,90,236,0.28);
}
.btn.primary:hover,
.btn.btn-primary:hover{box-shadow:0 10px 22px rgba(120,90,236,0.4)}

.btn.success,
.btn.btn-success{
  background:var(--good);border-color:var(--good);color:#fff;
}
.btn.success:hover{filter:brightness(1.06)}

.btn.gold,
.btn.btn-gold{
  background:linear-gradient(120deg,#e6a23c,#f0b35c);
  border:0;color:#fff;
  box-shadow:0 6px 14px rgba(214,139,34,0.24);
}

.btn.danger,
.btn.btn-danger{
  background:var(--bad);border-color:var(--bad);color:#fff;
}
.btn.danger:hover{filter:brightness(1.06)}

.btn.outline,
.btn.btn-outline{
  background:transparent;border-color:var(--line);color:var(--text);
}
.btn.outline:hover{border-color:var(--accent);color:var(--accent)}

.btn.soft,
.btn.btn-soft{
  background:color-mix(in srgb,var(--accent) 10%,var(--panel));
  border:1px solid transparent;
  color:var(--accent);
}
.btn.soft:hover{background:color-mix(in srgb,var(--accent) 16%,var(--panel))}

.btn:disabled,
.btn[disabled]{
  opacity:.55;cursor:not-allowed;
  transform:none!important;box-shadow:none!important;
}

.btn-sm,
.btn.btn-sm{padding:7px 11px;font-size:10.5px}
.btn-xs,
.btn.btn-xs{padding:5px 9px;font-size:9.5px}

/* ── Badges ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:12px;
  font-size:10px;font-weight:800;letter-spacing:.2px;
  background:var(--panel2);color:var(--muted);
  border:1px solid var(--line);
  white-space:nowrap;
}
.badge-purple{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent);border-color:transparent}
.badge-paid,
.badge-active,
.badge-completed{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good);border-color:transparent}
.badge-pending,
.badge-inprogress,
.badge-warn{background:color-mix(in srgb,var(--warn) 16%,var(--panel));color:var(--warn);border-color:transparent}
.badge-overdue,
.badge-failed,
.badge-urgent{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad);border-color:transparent}
.badge-draft,
.badge-gray{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.badge-sent{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--accent);border-color:transparent}

/* ── Empty states (extend the base rule) ── */
.modal .empty-state,
.empty-state{
  text-align:center;
  padding:24px 16px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.modal .empty-state i{opacity:.5}

/* ── Small utilities ── */
.small{font-size:10.5px}
.muted{color:var(--muted)}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:12px;
  background:var(--panel2);color:var(--muted);
  font-size:10px;font-weight:700;
  border:1px solid var(--line);
}

/* ═══════════════════════════════════════════════════════════════
   COMPOSER-SPECIFIC (campaign-ai.js)
   ─────────────────────────────────────────────────────────────
   The composer renders a lot of layout primitives that only exist
   in main.html. These local rules cover the pieces that break.
   ═══════════════════════════════════════════════════════════════ */

/* Two-column composer grid inside the modal */
.modal.xl > div[style*="grid-template-columns:1fr 1.4fr"]{
  align-items:start;
}

/* Platform chip grid */
.cc-platform-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:6px;
  margin-bottom:6px;
}
.cc-platform-chip{
  display:flex;align-items:flex-start;gap:8px;
  padding:9px 10px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--panel2);
  cursor:pointer;transition:all .15s ease;
}
.cc-platform-chip:hover{border-color:var(--accent)}
.cc-platform-chip.selected{
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,var(--panel));
}
.cc-platform-chip input[type="checkbox"]{margin:2px 0 0;flex-shrink:0}
.cc-platform-icon{font-size:16px;line-height:1;margin-top:2px}
.cc-platform-body{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.cc-platform-name{font-size:11px;font-weight:800;color:var(--text)}
.cc-platform-handle{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-platform-mode{font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* Per-platform preview card */
.cc-platform-preview{
  padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel2);
  margin-bottom:8px;
}
.cc-pp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cc-pp-icon{font-size:15px;line-height:1}
.cc-pp-name{font-size:12px;font-weight:800}
.cc-pp-handle{font-size:10.5px;color:var(--muted)}
.cc-pp-handle.cc-pp-warn{color:var(--warn)}
.cc-pp-mode{
  margin-left:auto;
  font-size:9px;text-transform:uppercase;letter-spacing:.4px;
  padding:2px 7px;border-radius:8px;
  background:var(--panel);color:var(--muted);
  border:1px solid var(--line);
}
.cc-pp-textarea{
  width:100%;min-height:80px;
  padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);
  color:var(--text);font-size:12px;line-height:1.5;
  resize:vertical;font-family:inherit;
}
.cc-pp-meta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:10px;color:var(--muted)}
.cc-pp-chars{font-variant-numeric:tabular-nums}
.cc-pp-over{color:var(--bad);font-weight:800}
.cc-pp-image-size{font-size:9.5px;color:var(--text-light)}
.cc-pp-hashtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cc-pp-tag{
  font-size:9.5px;font-weight:700;
  padding:2px 7px;border-radius:10px;
  cursor:pointer;
}
.cc-pp-tag:hover{opacity:.75}
.cc-pp-image-wrap{margin-top:8px}
.cc-pp-image{width:100%;max-height:200px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.cc-pp-image-empty{
  display:block;text-align:center;padding:20px;
  background:var(--panel);border:1px dashed var(--line);
  border-radius:8px;color:var(--text-light);font-size:11px;
}

/* Installment / list row inside modal */
.installment-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 10px;
  background:var(--panel2);border-radius:8px;
  margin-bottom:4px;
}

/* AI recorder panel */
.ai-rec-panel,
.ai-rec-loading{
  padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel2);
}
.ai-rec-loading{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);
}

/* Responsive: collapse the composer to single column on mobile */
@media(max-width:900px){
  .modal.xl{width:100%;padding:18px}
  .modal.xl > div[style*="grid-template-columns:1fr 1.4fr"]{
    grid-template-columns:1fr!important;
  }
  .formgrid,.form-row{grid-template-columns:1fr}
}
   
/* ═══════════════════════════════════════════════════════════════
   IMPORT MODAL — preview rows
   ═══════════════════════════════════════════════════════════════ */
.plib-import-summary{
  font-size:11px;
  padding:6px 10px;
  background:var(--panel2);
  border-radius:8px;
  margin-bottom:4px;
}
.plib-import-summary strong{color:var(--accent)}
.plib-import-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:4px;
  background:var(--panel);
  font-size:11.5px;
}
.plib-import-row i{width:16px;text-align:center;flex-shrink:0}
.plib-import-row-bad{
  border-color:color-mix(in srgb,var(--warn) 35%,var(--line));
  background:color-mix(in srgb,var(--warn) 6%,var(--panel));
}
   /* ═══════════════════════════════════════════════════════════════
   SIDEBAR — COLOURFUL SOCIAL MEDIA ICONS
   ═══════════════════════════════════════════════════════════════
   Brand-aware icons for the sidebar nav. Every social-media
   module gets its platform's colour; every non-social module
   gets a thematically-coloured icon so the sidebar doesn't look
   like an Excel menu.

   Icons inherit their brand colours on hover and when active.
   Default (inactive) icons keep a subtle tint so they're
   distinguishable at a glance without shouting.
   ═══════════════════════════════════════════════════════════════ */

/* Base: nav buttons normally show a muted icon. We override
   the .ico span so each module can paint its own colour. */
.nav button .ico,
.nav button .ico i {
  transition: color .18s ease, transform .18s ease, filter .18s ease;
}

.nav button:hover .ico i {
  transform: scale(1.12);
}

.nav button.active .ico i {
  filter: drop-shadow(0 0 6px currentColor);
}

/* ── Social media platform colours ──
   Each rule targets the specific module by its data-page attribute.
   Facebook blue, Instagram gradient, TikTok pink, YouTube red,
   LinkedIn blue, X/Twitter black-on-light, Threads black,
   Pinterest red, WhatsApp green, GBP multi-colour.
   The icons are Font Awesome "fa-brands" inside .ico. */

/* FACEBOOK — single blue */
.nav button[data-page="campaigns"] .ico i,
.nav button[data-page="publishing"] .ico i {
  color: #1877f2;
}

/* INSTAGRAM — gradient via background-clip trick on the icon */
.nav button[data-page="creative"] .ico i {
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.nav button[data-page="creative"]:hover .ico i {
  filter: drop-shadow(0 0 6px #dc2743aa);
}

/* TIKTOK — pink/cyan duotone simulated via gradient */
.nav button[data-page="calendar"] .ico i,
.nav button[data-page="overview"] .ico i {
  color: #ff0050;
}
.nav button[data-page="overview"]:hover .ico i {
  color: #00f2ea;
}

/* YOUTUBE — red */
.nav button[data-page="analytics"] .ico i {
  color: #ff0033;
}

/* LINKEDIN — corporate blue */
.nav button[data-page="crm"] .ico i {
  color: #0a66c2;
}

/* X / TWITTER — black in light theme, white in dark */
.nav button[data-page="listening"] .ico i {
  color: #0f1419;
}
[data-theme="dark"] .nav button[data-page="listening"] .ico i {
  color: #e7e9ea;
}

/* THREADS — black */
.nav button[data-page="automation"] .ico i {
  color: #101010;
}
[data-theme="dark"] .nav button[data-page="automation"] .ico i {
  color: #f5f5f5;
}

/* PINTEREST — red */
.nav button[data-page="media"] .ico i {
  color: #e60023;
}

/* WHATSAPP — green */
.nav button[data-page="inbox"] .ico i {
  color: #25d366;
}

/* GOOGLE BUSINESS — Google blue (simplified) */
.nav button[data-page="integrations"] .ico i {
  color: #4285f4;
}

/* ── Non-social modules — thematic colours ──
   These are NOT social platforms, so they get themed colours
   from the app's palette rather than brand colours. */

/* Overview — house icon in accent purple */
.nav button[data-page="overview"] .ico i {
  color: var(--accent);
}

/* Social accounts — share-nodes in accent pink */
.nav button[data-page="accounts"] .ico i {
  color: var(--accent2);
}

/* Content studio — pen in accent purple */
.nav button[data-page="content"] .ico i {
  color: #a855f7;
}

/* Publishing centre — paper-plane in cyan */
.nav button[data-page="publishing"] .ico i {
  color: #00c2d8;
}

/* AI agents — robot in violet */
.nav button[data-page="agents"] .ico i {
  color: #8b5cf6;
}

/* Competitors — flag in orange */
.nav button[data-page="competitors"] .ico i {
  color: #f97316;
}

/* Reports — file-lines in teal */
.nav button[data-page="reports"] .ico i {
  color: #14b8a6;
}

/* Clients — building in gold */
.nav button[data-page="clients"] .ico i {
  color: #d68b22;
}

/* Approvals — check-double in emerald */
.nav button[data-page="approvals"] .ico i {
  color: #10b981;
}

/* Brand knowledge — book in amber */
.nav button[data-page="knowledge"] .ico i {
  color: #f59e0b;
}

/* Team — users-gear in indigo */
.nav button[data-page="team"] .ico i {
  color: #6366f1;
}

/* Settings — gear in slate */
.nav button[data-page="settings"] .ico i {
  color: #64748b;
}

/* Platform admin — shield in crimson */
.nav button[data-page="admin"] .ico i {
  color: #dc2626;
}

/* ── Active state: keep the brand colour, add a left accent bar ──
   The .active class is already applied by orbit-shell.js. We just
   make sure the icon colour survives (it does by default) and add
   a subtle glow behind active items. */
.nav button.active {
  background: color-mix(in srgb, var(--accent) 10%, var(--panel));
  position: relative;
}

.nav button.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 25%;
  bottom: 25%;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: currentColor;
  opacity: 0.85;
}

/* Active item icon glows softly */
.nav button.active .ico i {
  filter: drop-shadow(0 0 4px currentColor);
}

/* ── Hover: subtle lift (already in base CSS, but ensure the
   colour survives the hover bg change) ── */
.nav button:hover {
  background: var(--panel2);
}
.nav button:hover .ico i {
  transform: scale(1.15) rotate(-3deg);
}

/* ── Mobile bottom nav — smaller but same colours ──
   The mobile nav uses <i class="fa-solid ..."> directly (not .ico),
   so we target it by [data-mnav]. */
.mobile-nav button[data-mnav="overview"] i     { color: var(--accent); }
.mobile-nav button[data-mnav="content"] i      { color: #a855f7; }
.mobile-nav button[data-mnav="calendar"] i     { color: #ff0050; }
.mobile-nav button[data-mnav="inbox"] i        { color: #25d366; }
.mobile-nav button[data-mnav="agents"] i       { color: #8b5cf6; }

.mobile-nav button.active i {
  filter: drop-shadow(0 0 4px currentColor);
  transform: scale(1.1);
}
.mobile-nav button i {
  transition: transform .18s ease, filter .18s ease;
}

/* ── Dark theme adjustments ──
   Some brand colours (X black, LinkedIn navy, Facebook blue) become
   invisible on dark backgrounds. We lighten them slightly in dark
   mode so they stay readable without losing identity. */
[data-theme="dark"] .nav button[data-page="campaigns"] .ico i,
[data-theme="dark"] .nav button[data-page="publishing"] .ico i {
  color: #4c8bf5;   /* lighter FB blue */
}

[data-theme="dark"] .nav button[data-page="crm"] .ico i {
  color: #4d9bdb;   /* lighter LinkedIn blue */
}

[data-theme="dark"] .nav button[data-page="youtube"],
[data-theme="dark"] .nav button[data-page="analytics"] .ico i {
  color: #ff3355;   /* brighter YT red */
}

[data-theme="dark"] .nav button[data-page="pinterest"] .ico i,
[data-theme="dark"] .nav button[data-page="media"] .ico i {
  color: #ff2d55;
}

/* Instagram gradient is already dark-safe (bright saturation) */
[data-theme="dark"] .nav button[data-page="creative"] .ico i {
  filter: brightness(1.1) saturate(1.15);
}

/* ── Accessibility: keep focus outline visible on keyboard nav ── */
.nav button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 10px;
}

/* ── Optional: subtle entrance animation on the sidebar icons ──
   Makes the app feel alive on first paint. Disabled for users who
   prefer reduced motion. */
@media (prefers-reduced-motion: no-preference) {
  .nav button .ico i {
    animation: sidebar-icon-in 0.35s ease-out backwards;
  }
  .nav button:nth-child(1) .ico i { animation-delay: 0.02s; }
  .nav button:nth-child(2) .ico i { animation-delay: 0.04s; }
  .nav button:nth-child(3) .ico i { animation-delay: 0.06s; }
  .nav button:nth-child(4) .ico i { animation-delay: 0.08s; }
  .nav button:nth-child(5) .ico i { animation-delay: 0.10s; }
  .nav button:nth-child(6) .ico i { animation-delay: 0.12s; }
  .nav button:nth-child(7) .ico i { animation-delay: 0.14s; }

  @keyframes sidebar-icon-in {
    from { opacity: 0; transform: translateX(-4px) scale(0.9); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
}
</style>
</head>
<body>

<!-- ═══════════════ LOGIN GATE ═══════════════ -->
<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-mark">
        <img src="/viora.png" alt="VIORA"
             onerror="this.style.display='none';this.parentNode.textContent='O';" />
      </div>
      <div>
        <strong style="font-size:18px">VIORA</strong>
        <div style="font-size:9px;letter-spacing:1.5px;color:#7b8196;font-weight:800">CAMPAIGNS MODULE</div>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in to the campaigns workspace.</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" placeholder="you@viora.io" autocomplete="email">
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    <button id="loginBtn">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
    </button>
    <div class="login-error" id="loginError"></div>
    <div class="login-note">
      Same Firebase credentials as the VIORA dashboard.
      <a href="/main.html" style="color:#6558f5;font-weight:700">← Back to Dashboard</a>
    </div>
  </div>
</div>

<!-- ═══════════════ APP SHELL ═══════════════ -->
<div class="app" id="App" style="display:none">
  <aside class="sidebar" id="sidebar">
    <!-- populated by -shell.js -->
  </aside>

  <div class="mobile-overlay" id="overlay"></div>

  <main class="main">

        <button class="iconbtn" id="helpBtn" title="Help">?</button>
        <button class="iconbtn" id="notifBtn" title="Notifications">♧<i class="dot"></i></button>

<!-- ═══════════════ MOBILE BOTTOM NAV ═══════════════ -->

  <button data-mnav="overview" class="active" type="button">
    <i class="fa-solid fa-house"></i><span class="mnav-label">Home</span>

<!-- ═══════════════ TOASTS ═══════════════ -->
<div class="toast" id="toast"></div>
<div id="toastContainer"></div>

<!-- ═══════════════ CAMPAIGN EDITOR MODAL ═══════════════ -->
<div class="modal-overlay" id="campaignEditorModal">
  <div class="modal large">
    <div class="modalhead">
      <h3 id="campEditorTitle">New campaign</h3>
      <button class="close" id="campEditorClose" type="button">×</button>
    </div>
    <form id="campaignEditorForm" novalidate>
      <input type="hidden" id="campEditId">

      <div class="field">
        <label>Campaign name *</label>
        <input id="campName" required maxlength="120" placeholder="e.g. Autumn product launch">
      </div>

      <div class="formgrid">
        <div class="field">
          <label>Status</label>
          <select id="campStatus">
            <option value="Planned">Planned</option>
            <option value="Active">Active</option>
            <option value="Paused">Paused</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="field">
          <label>Channel</label>
          <select id="campChannel">
            <option value="meta">Meta (Facebook/Instagram)</option>
            <option value="tiktok">TikTok</option>
            <option value="youtube">YouTube</option>
            <option value="google">Google Ads</option>
            <option value="linkedin">LinkedIn</option>
            <option value="x">X / Twitter</option>
            <option value="threads">Threads</option>
            <option value="pinterest">Pinterest</option>
            <option value="whatsapp">WhatsApp Business</option>
            <option value="gbp">Google Business Profile</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Budget (KES)</label>
          <input id="campBudget" type="number" min="0" step="100" value="0">
        </div>
        <div class="field">
          <label>Spent (KES)</label>
          <input id="campSpend" type="number" min="0" step="100" value="0">
        </div>
        <div class="field">
          <label>Start date</label>
          <input id="campStart" type="date">
        </div>
        <div class="field">
          <label>End date</label>
          <input id="campEnd" type="date">
        </div>
      </div>

      <div class="field">
        <label>Objective</label>
        <select id="campObjective">
          <option value="">— Select —</option>
          <option value="awareness">Brand awareness</option>
          <option value="engagement">Engagement</option>
          <option value="leads">Lead generation</option>
          <option value="sales">Sales / conversions</option>
          <option value="retention">Customer retention</option>
          <option value="launch">Product launch</option>
        </select>
      </div>

  import { initializeApp, getApps, getApp } from "firebase/app";

  const firebaseConfig = {

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
   forceLongPolling(db);
  const ROOT = 'viora_data';
  const ORG = 'orgs/viora';

  const ALLOWED_ROLES = new Set(['admin', 'exec', 'marketing']);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.replace('/main.html#login');
      return;

    try {
      const snap = await get(ref(db, `${ROOT}/${ORG}/users/${user.uid}`));
      const role = snap.exists() ? (snap.val()?.role || 'member') : 'member';
      if (!ALLOWED_ROLES.has(role)) {

                  font-weight:700;font-size:.85rem;">← Back to Dashboard</a>
            </div>
          </div>`;
        return;
      }
          // Authorized — load the campaigns bootstrap (which wires everything)

        console.error('[campaigns] bootstrap load failed:', err);

    } catch (e) {
      console.warn('[campaigns] auth check failed, redirecting:', e);
      window.location.replace('/main.html');
    }
  });

<!-- ═══════════════ THEME + TOPBAR WIRING ═══════════════ -->
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // Theme toggle (same storage key as the app)
  const savedTheme = localStorage.getItem('viora-theme') || 'light';
  document.documentElement.dataset.theme = savedTheme;
  $('themeBtn')?.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('viora-theme', next);
    setTimeout(() => {
      try { window.Orbit?.renderActiveOrbitModule?.(); } catch (_) {}
    }, 60);
  });

  // Help + notifications (simple UX placeholders, no stub — real app owns this)
  $('helpBtn')?.addEventListener('click', () => {
    alert('Use the sidebar to navigate modules. All changes save to Firebase.');
  });
  $('notifBtn')?.addEventListener('click', () => {
    try { window.Orbit?.navigate?.('inbox'); }
    catch (_) { alert('Inbox not ready yet — try again in a moment.'); }
  });

  // Search → jump to matching module
  $('globalSearch')?.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const mod = window.Orbit?.findModuleByName?.(q);
    if (mod) window.Orbit.navigate(mod);
    else alert('No module matches "' + q + '"');
  });
})();
</script>
