# Cloudflare Workers Builds deploys this config from the repository root.
# Keep the Worker entry point, static assets, and Workers AI binding together.
name = "viora-static-git"
main = "./worker.js"
compatibility_date = "2026-11-11"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"
