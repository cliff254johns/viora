<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A76B83">
<script src="/guard.js?v=2" defer></script>
<title>Salon &amp; Spa — Studio Manager</title>
<style>
:root{--primary:#A76B83;--accent:#D8BFA7;--success:#718B78;--warning:#D59A43;--danger:#C65361;--bg:#F8F4F1;--card:#FFFFFF;--border:#E8DDE2;--text:#30262D;--muted:#6E6169;--shadow:0 8px 28px rgba(70,42,57,.08);--radius:18px}
[data-theme="dark"]{--primary:#CE8EAA;--accent:#BCA187;--success:#91B49A;--warning:#E9B965;--danger:#EB8792;--bg:#191619;--card:#262126;--border:#403640;--text:#F5EDF2;--muted:#C4B6BF;--shadow:0 8px 28px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:9px 14px;background:var(--card);color:var(--text)}
button:active{transform:scale(.98)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
button.danger{color:var(--danger)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-size:16px}
label{display:grid;gap:5px;color:var(--muted);font-size:13px}
h1,h2,h3,p{margin-top:0}h1{font-size:26px;margin-bottom:5px}h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}
.app{display:none;min-height:100vh}
.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:var(--card);border-right:1px solid var(--border);padding:20px 14px;z-index:20;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;font-weight:800;font-size:18px}
.brandmark{display:grid;place-items:center;background:var(--primary);color:#fff;width:38px;height:38px;border-radius:14px;font-size:20px}
.nav{display:grid;gap:5px}
.nav button{text-align:left;border:0;background:transparent;display:flex;align-items:center;gap:12px;width:100%;font-weight:600}
.nav button.active{background:var(--primary);color:#fff;border-radius:14px}
.nav .navicon{width:24px;text-align:center;font-size:18px}
.sidefoot{margin-top:24px;border-top:1px solid var(--border);padding-top:14px}
.main{margin-left:248px;min-height:100vh}
.topbar{height:72px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 26px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar h2{margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--primary);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.content{padding:26px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0;position:relative}
.stat{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.stat strong{font-size:25px;display:block;margin-top:8px;overflow-wrap:anywhere}
.stat .ico{font-size:24px;background:color-mix(in srgb,var(--primary) 12%,var(--card));border-radius:13px;padding:10px;flex-shrink:0}
.hero{background:linear-gradient(125deg,var(--primary),color-mix(in srgb,var(--primary) 55%,var(--accent)));color:#fff;border:0;padding:24px;border-radius:24px;margin-bottom:18px}
.hero strong{font-size:32px;display:block;margin:8px 0}
.hero .pill{background:#ffffff2b;color:#fff}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
.sectionhead h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{min-height:118px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:8px;border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
.tile .ico{font-size:25px}.tile strong{font-size:15px}.tile small{color:var(--muted)}
.tile.img{background-size:cover;background-position:center;color:#fff;position:relative;overflow:hidden}
.tile.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6))}
.tile.img>*{position:relative;z-index:1}
.tablewrap{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td .actions{display:flex;flex-wrap:wrap;gap:6px}
td button{min-height:34px;padding:5px 9px;font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--success) 15%,var(--card));color:var(--success)}
.badge.warn{background:color-mix(in srgb,var(--warning) 16%,var(--card));color:var(--warning)}
.badge.bad{background:color-mix(in srgb,var(--danger) 13%,var(--card));color:var(--danger)}
.badge.gold{background:#C9A227;color:#3a2f00}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--card);vertical-align:middle;margin-right:8px;background:var(--bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.toolbar input{max-width:320px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .wide{grid-column:1/-1}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 20% 15%,color-mix(in srgb,var(--primary) 35%,transparent),transparent 45%),var(--bg)}
.loginbox{width:min(440px,100%);background:var(--card);border:1px solid var(--border);padding:28px;border-radius:26px;box-shadow:var(--shadow)}
.loginbox .brand{padding:0 0 20px}
.loginbox form{display:grid;gap:14px}
.notice{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warning) 13%,var(--card));border:1px solid color-mix(in srgb,var(--warning) 40%,var(--border));margin:14px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.bottomnav{display:none}.menuBtn{display:none}
.modalroot{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#120d12a6;padding:20px}
.modalroot.open{display:flex}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:grid;gap:8px}
.toast{padding:12px 16px;background:var(--text);color:var(--card);border-radius:12px;box-shadow:var(--shadow);max-width:340px}
.alertrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.alertdot{width:9px;height:9px;border-radius:50%;background:var(--warning);margin-top:7px;flex-shrink:0}
.mono{font-family:ui-monospace,SFMono-Regular,monospace}
.chart3d{display:flex;align-items:flex-end;gap:14px;height:220px;padding:24px 8px 28px}
.bar3d{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar3d .front{width:100%;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 60%,#000));border-radius:6px 6px 0 0;box-shadow:0 6px 14px rgba(167,107,131,.4)}
.bar3d .val{font-size:11px;font-weight:800;margin-bottom:4px}
.bar3d .lbl{position:absolute;bottom:-22px;font-size:11px;color:var(--muted);white-space:nowrap}
.donut{width:170px;height:170px;border-radius:50%;margin:0 auto;position:relative;box-shadow:inset 0 0 0 12px var(--card),0 8px 20px rgba(0,0,0,.15)}
.donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px;z-index:2;text-align:center;padding:30px}
.legend{display:grid;gap:6px;margin-top:14px;font-size:13px}
.legend .row{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.spark{width:100%;height:70px;overflow:visible}
.spark .line{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark .area{fill:var(--primary);opacity:.18}
.room3d{height:260px;perspective:900px;display:grid;place-items:center;margin:10px 0}
.floor{position:relative;width:260px;height:200px;transform:rotateX(60deg) rotateZ(-20deg);background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 40%,var(--card)) 0 20px,color-mix(in srgb,var(--accent) 25%,var(--card)) 20px 40px);border-radius:14px;box-shadow:0 30px 40px -20px rgba(0,0,0,.4)}
.chair{position:absolute;width:52px;height:52px}
.chair .seat{position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000));border-radius:14px;transform:translateZ(4px);box-shadow:0 6px 12px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.3)}
.chair.busy .seat{background:linear-gradient(135deg,var(--warning),#8a5a12)}
.cal{display:grid;grid-template-columns:60px repeat(7,minmax(0,1fr));gap:2px;font-size:12px}
.cal .hdr{padding:8px;font-weight:700;text-align:center;background:color-mix(in srgb,var(--primary) 8%,var(--card));border-radius:8px}
.cal .hr{padding:6px;text-align:right;color:var(--muted);font-weight:600}
.cal .slot{min-height:46px;border:1px dashed var(--border);border-radius:8px;padding:3px;position:relative;background:var(--card);cursor:pointer}
.cal .appt{position:absolute;left:2px;right:2px;top:2px;bottom:2px;border-radius:6px;padding:3px 6px;font-size:11px;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000))}
.cal .appt.arrived{background:linear-gradient(135deg,var(--warning),#8a5a12)}
.cal .appt.done{background:linear-gradient(135deg,var(--success),#3f5a48)}
#errorBanner{display:none;background:#C65361;color:#fff;padding:12px 16px;font:14px/1.4 system-ui;position:sticky;top:0;z-index:9999}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:transform .2s;width:min(290px,86vw);box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.backdrop{display:none;position:fixed;inset:0;background:#120d126b;z-index:19}.backdrop.open{display:block}.main{margin-left:0;padding-bottom:calc(80px + env(safe-area-inset-bottom))}.topbar{height:62px;padding:8px 12px}.menuBtn{display:inline-block;padding:8px 12px}.topbar h2{font-size:17px}.content{padding:15px 12px}.grid,.grid.two,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat strong{font-size:21px}.hero{padding:20px}.hero strong{font-size:28px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:110px;padding:13px}.bottomnav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:fixed;bottom:0;left:0;right:0;z-index:15;background:var(--card);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.bottomnav button{border:0;background:transparent;display:grid;place-items:center;gap:2px;min-height:52px;padding:5px;font-size:11px;color:var(--muted)}.bottomnav button.active{background:color-mix(in srgb,var(--primary) 16%,var(--card));color:var(--primary);border-radius:15px;font-weight:800}.bottomnav .navicon{font-size:19px}.tablewrap{overflow:visible}table,tbody,tr,td{display:block;width:100%}thead{display:none}tbody{display:grid;gap:10px}tr{border:1px solid var(--border);border-radius:14px;padding:8px 12px;background:var(--card);box-shadow:var(--shadow)}td{display:flex;justify-content:space-between;gap:12px;text-align:right;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}td:last-child{border-bottom:0}td:before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left;flex:0 0 38%;max-width:38%}td>*{min-width:0;max-width:62%}td .actions{justify-content:flex-end;max-width:62%}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.modalroot{align-items:flex-end;padding:0}.modal{width:100%;max-height:92vh;border-radius:22px 22px 0 0;padding:20px 15px calc(20px + env(safe-area-inset-bottom))}.modalfoot{display:grid;grid-template-columns:1fr}.modalfoot button{width:100%}.toasts{left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom))}.toast{max-width:none}.hide-mobile{display:none!important}.cal{font-size:10px;grid-template-columns:40px repeat(7,minmax(0,1fr))}}
@media print{body{background:#fff!important;color:#000!important}.sidebar,.topbar,.bottomnav,.toolbar,.no-print,button{display:none!important}.main{margin:0}.content{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<div id="errorBanner"></div>
<div id="loginScreen" class="login">
  <div class="loginbox">
    <div class="brand"><span class="brandmark">✿</span><span>Salon &amp; Spa<small style="display:block;color:var(--muted);font-size:12px;font-weight:500">Studio management</small></span></div>
    <h1>Karibu back.</h1><p class="muted">Your beauty business, beautifully organised.</p>
    <form id="loginForm">
      <label>Demo account
        <select id="loginRole">
          <option value="owner">Owner — Amina</option>
          <option value="manager">Manager — Wanjiku</option>
          <option value="receptionist">Receptionist — Njeri</option>
          <option value="stylist">Stylist — Faith</option>
          <option value="cashier">Cashier — Brian</option>
          <option value="storekeeper">Storekeeper — Mercy</option>
          <option value="developer">Developer — Demo</option>
        </select>
      </label>
      <label>Demo PIN<input id="loginPin" type="password" inputmode="numeric" value="1234" autocomplete="off" required></label>
      <button class="primary" type="submit">Enter workspace →</button>
    </form>
    <div class="notice">Demo authentication only. PIN is <b>1234</b>.</div>
  </div>
</div>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="brandmark">✿</span><span>Salon &amp; Spa<small style="display:block;color:var(--muted);font-size:11px;font-weight:500">STUDIO MANAGER</small></span></div>
    <div class="nav" id="sideNav"></div>
    <div class="sidefoot">
      <button style="width:100%;text-align:left" data-go="settings">⚙️ Settings</button>
      <button style="width:100%;text-align:left;margin-top:6px" id="logoutBtn">↪ Log out</button>
    </div>
  </aside>
  <div id="backdrop" class="backdrop"></div>
  <div class="main">
    <header class="topbar">
      <button class="menuBtn" id="menuBtn" aria-label="Open menu">☰</button>
      <h2 id="pageTitle">Overview</h2>
      <span id="storageBadge" class="pill">● Local</span>
      <span class="pill hide-mobile">Local mode</span>
      <button id="notifBtn" aria-label="Notifications">🔔 <span id="notifCount"></span></button>
    </header>
    <main id="view" class="content"></main>
  </div>
  <nav id="bottomNav" class="bottomnav"></nav>
</div>
<div id="modalRoot" class="modalroot" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modalhead"><h2 id="modalTitle">Details</h2><button id="modalClose" aria-label="Close">✕</button></div>
    <div id="modalBody"></div>
    <div id="modalFoot" class="modalfoot"></div>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Global safety net ---------- */
function showError(msg){
  var b=document.getElementById('errorBanner');
  if(b){b.style.display='block';b.textContent='App error: '+msg+'. Reload the page.';}
  console.error('[Salon]',msg);
}
window.addEventListener('error',function(e){showError(e.message||'unknown');});

/* ---------- Utilities ---------- */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return [].slice.call(document.querySelectorAll(s))};
function money(cents){return new Intl.NumberFormat('en-KE',{style:'currency',currency:'KES',maximumFractionDigits:2}).format((Number(cents)||0)/100);}
function moneyShort(cents){return new Intl.NumberFormat('en-KE',{style:'currency',currency:'KES',maximumFractionDigits:0}).format((Number(cents)||0)/100);}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Nairobi'});}
function nowText(){return new Date().toLocaleString('en-KE',{timeZone:'Africa/Nairobi'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);}
function clone(x){return JSON.parse(JSON.stringify(x));}
function toMin(t){var a=String(t||'00:00').split(':');return (Number(a[0])||0)*60+(Number(a[1])||0);}
function fromMin(n){var h=Math.floor(n/60),m=n%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function weekDays(){var d=new Date();var day=(d.getDay()+6)%7;var mon=new Date(d);mon.setDate(d.getDate()-day);var out=[];for(var i=0;i<7;i++){var x=new Date(mon);x.setDate(mon.getDate()+i);out.push(x.toLocaleDateString('en-CA'));}return out;}

/* ---------- Image helper (CDN) ---------- */
var IMG=(function(){
  function service(cat,name){
    var k=((name||'')+' '+(cat||'')).toLowerCase();
    if(k.indexOf('braid')>=0)return 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400&q=70&auto=format&fit=crop';
    if(k.indexOf('wash')>=0||k.indexOf('blow')>=0)return 'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=400&q=70&auto=format&fit=crop';
    if(k.indexOf('nail')>=0||k.indexOf('mani')>=0||k.indexOf('gel')>=0)return 'https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400&q=70&auto=format&fit=crop';
    if(k.indexOf('massage')>=0)return 'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=400&q=70&auto=format&fit=crop';
    if(k.indexOf('facial')>=0||k.indexOf('spa')>=0)return 'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400&q=70&auto=format&fit=crop';
    if(k.indexOf('kid')>=0||k.indexOf('trim')>=0)return 'https://images.unsplash.com/photo-1512690459411-b9245aed614b?w=400&q=70&auto=format&fit=crop';
    if(cat==='Hair')return 'https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400&q=70&auto=format&fit=crop';
    if(cat==='Nails')return 'https://images.unsplash.com/photo-1632345031435-8727f6897d53?w=400&q=70&auto=format&fit=crop';
    return 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=400&q=70&auto=format&fit=crop';
  }
  function product(cat){
    if(cat==='Haircare')return 'https://images.unsplash.com/photo-1571875257727-256c39da42af?w=300&q=70&auto=format&fit=crop';
    if(cat==='Nails')return 'https://images.unsplash.com/photo-1610992235683-e39abc5e4fcf?w=300&q=70&auto=format&fit=crop';
    if(cat==='Spa')return 'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=300&q=70&auto=format&fit=crop';
    return 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=300&q=70&auto=format&fit=crop';
  }
  function avatar(name){
    return 'https://api.dicebear.com/7.x/notionists/svg?seed='+encodeURIComponent(name||'x')+'&backgroundColor=a76b83,d8bfa7,718b78';
  }
  return {service:service,product:product,avatar:avatar};
})();

/* ---------- Sample data (IMG is defined above — safe) ---------- */
function makeSample(){
  return {
    schemaVersion:2,
    services:[
      {id:'s1',name:'Wash & Blow-dry',category:'Hair',duration:45,price:180000,cost:45000,vat:true,active:true,img:IMG.service('Hair','Wash'),consume:[{productId:'p1',qty:1}]},
      {id:'s2',name:'Knotless Braids',category:'Braiding',duration:180,price:450000,cost:120000,vat:true,active:true,img:IMG.service('Braiding','Braids'),consume:[{productId:'p2',qty:1}]},

/* ---------- Domain helpers ---------- */
function serviceById(id){return State.db.services.find(function(s){return s.id===id;});}
function productById(id){return State.db.products.find(function(p){return p.id===id;});}
function clientById(id){return State.db.clients.find(function(c){return c.id===id;});}
function staffById(id){return State.db.staff.find(function(s){return s.id===id;});}
function clientName(id){var c=clientById(id);return c?c.name:'Unknown';}
function serviceName(id){var s=serviceById(id);return s?s.name:'Unknown';}
function staffName(id){var s=staffById(id);return s?s.name:'Unassigned';}
function productName(id){var p=productById(id);return p?p.name:'Unknown';}
function serviceDur(id){var s=serviceById(id);return s?s.duration:0;}
function todayBookings(){return State.db.bookings.filter(function(b){return b.date===today();});}
function todaySales(){return State.db.sales.filter(function(s){return s.date===today();});}
function tierFor(points){if(points>=200)return 'gold';if(points>=100)return 'silver';return 'basic';}
function hasOverlap(staffId,date,startMin,duration,excludeId){
  return State.db.bookings.some(function(b){
    if(b.id===excludeId)return false;
    if(b.staffId!==staffId||b.date!==date)return false;
    if(b.status!=='Booked'&&b.status!=='Arrived')return false;
    var bStart=toMin(b.time),bDur=serviceDur(b.serviceId);
    return startMin<bStart+bDur&&bStart<startMin+duration;
  });
}

function firingRules(){
  var rules=[];
  var low=State.db.products.filter(function(p){return p.qty<=p.min;});
  if(low.length)rules.push({id:'lowstock',name:'Retail stock running low',desc:low.length+' product(s) at/below reorder',records:low.map(function(p){return p.name;}),action:'Review retail stock',page:'inventory',level:'warn'});
  var noShows=todayBookings().filter(function(b){return b.status==='No-show';});
  if(noShows.length)rules.push({id:'noshow',name:'Appointment no-show',desc:noShows.length+' client(s) marked no-show today',records:noShows.map(function(b){return clientName(b.clientId);}),action:'Review bookings',page:'bookings',level:'bad'});
  var credit=State.db.clients.filter(function(c){return (c.credit||0)>0;});
  if(credit.length)rules.push({id:'credit',name:'Outstanding client balances',desc:credit.length+' client balance(s) need review',records:credit.map(function(c){return c.name;}),action:'Review clients',page:'clients',level:'warn'});
  if(!State.db.shift||!State.db.shift.open)rules.push({id:'shift',name:'Till shift not open',desc:'Open a shift before taking payments',records:['Current till'],action:'Open till shift',page:'pos',level:'warn'});
  rules.push({id:'backup',name:'Backup reminder',desc:'Export a JSON backup at the end of the day',records:['Local data'],action:'Open settings',page:'settings',level:'idle'});
  rules.push({id:'daily',name:'Daily sales summary',desc:todaySales().length+' completed transaction(s) today',records:[money(todaySales().reduce(function(n,s){return n+s.total;},0))],action:'View reports',page:'reports',level:'idle'});
  return rules.filter(function(r){return !State.db.dismissed[r.id]||State.db.dismissed[r.id]!==today();});
}

function toast(msg){var el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toasts').appendChild(el);setTimeout(function(){el.remove();},3500);}
function openModal(title,body,foot){

function closeModal(){$('#modalRoot').classList.remove('open');}
function statCard(label,value,ico,meta){
  return '<div class="card stat"><div><div class="muted">'+esc(label)+'</div><strong>'+value+'</strong><div class="small muted">'+esc(meta||'')+'</div></div><span class="ico">'+ico+'</span></div>';
}
function table(headers,rows){
  var h='<div class="tablewrap"><table><thead><tr>'+headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
  if(!rows.length){h+='<tr><td colspan="'+headers.length+'"><div class="empty">Nothing to show yet.</div></td></tr>';}
  else{h+=rows.map(function(r){return '<tr>'+r.map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';}).join('');}
  return h+'</tbody></table></div>';
}
function pageHead(title,desc,actions){
  return '<div class="sectionhead" style="margin-top:0"><div><h1>'+title+'</h1><div class="muted">'+desc+'</div></div><div class="toolbar no-print">'+(actions||'')+'</div></div>';
}
function barChart3D(series){
  if(!series.length)return '<div class="empty">No data.</div>';
  var max=1;series.forEach(function(s){if(s.value>max)max=s.value;});
  return '<div class="chart3d">'+series.map(function(s){
    var h=Math.max(4,(s.value/max)*170);
    return '<div class="bar3d"><div class="val">'+esc(s.display||s.value)+'</div><div class="front" style="height:'+h+'px"></div><div class="lbl">'+esc(s.label)+'</div></div>';
  }).join('')+'</div>';
}
function donutChart(items,centerLabel){
  if(!items.length)return '<div class="empty">No data.</div>';
  var total=0;items.forEach(function(i){total+=i.value;});
  if(!total)total=1;
  var colors=['#A76B83','#D8BFA7','#718B78','#D59A43','#C65361','#8E7CC3'];
  var angle=0;var stops=[];
  items.forEach(function(it,i){var start=angle;var end=angle+(it.value/total)*360;stops.push(colors[i%colors.length]+' '+start+'deg '+end+'deg');angle=end;});
  var legend=items.map(function(it,i){return '<div class="row"><span class="sw" style="background:'+colors[i%colors.length]+'"></span><span style="flex:1">'+esc(it.label)+'</span><b>'+esc(it.display||money(it.value))+'</b></div>';}).join('');
  return '<div class="donut" style="background:conic-gradient('+stops.join(',')+')"><div class="center">'+esc(centerLabel||'')+'</div></div><div class="legend">'+legend+'</div>';
}
function sparkChart(values){
  if(!values.length)return '';
  var max=1;values.forEach(function(v){if(v>max)max=v;});
  var w=300,h=70;
  var pts=values.map(function(v,i){return [(i/(values.length-1||1))*w,h-(v/max)*(h-10)-5];});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var area='M0,'+h+' L'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L')+' L'+w+','+h+' Z';
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path class="area" d="'+area+'"/><path class="line" d="'+line+'"/></svg>';
}
function chairsView(){
  var stylists=State.db.staff.filter(function(s){return s.role==='stylist'&&s.active;});
  var busy=todayBookings().filter(function(b){return b.status==='Arrived';}).map(function(b){return b.staffId;});
  var pos=[{x:20,y:30},{x:110,y:20},{x:180,y:70},{x:60,y:130}];
  var chairs=stylists.slice(0,4).map(function(s,i){
    var cls=busy.indexOf(s.id)>=0?'busy':'';
    return '<div class="chair '+cls+'" style="left:'+pos[i].x+'px;top:'+pos[i].y+'px"><div class="seat"></div></div>';
  }).join('');
  return '<div class="room3d"><div class="floor">'+chairs+'</div></div><div class="small muted" style="text-align:center">'+stylists.length+' chairs · '+busy.length+' occupied</div>';
}

function saveBooking(existing){
  var f=$('#bookingForm');
  if(!f.reportValidity())return;
  var d={};[].slice.call(f.elements).forEach(function(el){if(el.name)d[el.name]=el.value;});
  var startMin=toMin(d.time),dur=serviceDur(d.serviceId);
  if(hasOverlap(d.staffId,d.date,startMin,dur,existing)){toast('That stylist already has a booking at this time.');return;}
  var payload={clientId:d.clientId,serviceId:d.serviceId,staffId:d.staffId,date:d.date,time:d.time,source:d.source,deposit:Math.round((Number(d.deposit)||0)*100),recurrence:d.recurrence||''};
  if(existing){
    var b=State.db.bookings.find(function(x){return x.id===existing;});
    Object.assign(b,payload);
    log('booking','Updated appointment');
  }else{
    var newId=uid('b');
    State.db.bookings.push(Object.assign({id:newId,status:'Booked'},payload));
    if(d.recurrence==='weekly'||d.recurrence==='fortnightly'){
      var weeks=d.recurrence==='fortnightly'?2:1;
      var base=new Date(d.date);
      for(var i=1;i<12;i++){
        var dt=new Date(base);dt.setDate(dt.getDate()+i*7*weeks);
        State.db.bookings.push(Object.assign({},payload,{id:uid('b'),status:'Booked',date:dt.toLocaleDateString('en-CA'),recurrence:''}));
      }
    }
    log('booking','Created appointment');
  }
  saveDB();closeModal();renderPage();toast('Booking saved.');
}
function setBookingStatus(bid,status){
  var b=State.db.bookings.find(function(x){return x.id===bid;});
  if(!b)return;
  b.status=status;
  if(status==='No-show'&&b.deposit>0){State.db.expenses.push({id:uid('ex'),category:'No-show fee',amount:b.deposit,date:today()});b.deposit=0;}
  log('booking','Appointment marked '+status);
  saveDB();renderPage();toast('Appointment marked '+status+'.');
}

function addCart(type,itemId){
  var item=type==='service'?serviceById(itemId):productById(itemId);
  if(!item)return;
  if(type==='product'&&item.qty<1){toast('Out of stock.');return;}
  var found=State.cart.find(function(x){return x.type===type&&x.id===itemId;});
  if(found){
    if(type==='product'&&found.qty>=item.qty){toast('Not enough stock.');return;}
    found.qty++;
  }else{
    State.cart.push({type:type,id:itemId,name:item.name,price:item.price,qty:1});
  }
  updateCartUI();
}
function updateCartUI(){
  var el=$('#cartItems');if(!el)return;
  if(!State.cart.length){el.innerHTML='<div class="empty">Add a treatment or product to begin.</div>';}
  else{
    el.innerHTML=State.cart.map(function(i,n){
      return '<div class="alertrow"><div style="flex:1"><b>'+esc(i.name)+'</b><div class="muted small">'+money(i.price)+' each</div></div><button data-qty="'+n+':-1">−</button><b style="padding:10px 2px">'+i.qty+'</b><button data-qty="'+n+':1">+</button><button class="danger" data-remove="'+n+'">×</button></div>';
    }).join('');
    $$('#cartItems [data-qty]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-qty').split(':');changeQty(Number(p[0]),Number(p[1]));};});
    $$('#cartItems [data-remove]').forEach(function(b){b.onclick=function(){removeCart(Number(b.getAttribute('data-remove')));};});
  }
  var gross=State.cart.reduce(function(n,i){return n+i.price*i.qty;},0);
  var disc=Math.min(gross,Math.max(0,Math.round((Number($('#discountInput')&&$('#discountInput').value||0))*100)));
  var promo=State.promoApplied||0;
  var total=Math.max(0,gross-disc-promo);
  var vat=Math.round(total*State.db.settings.vat/(100+State.db.settings.vat));
  if($('#cartSubtotal'))$('#cartSubtotal').textContent=money(gross-disc-promo);
  if($('#cartVat'))$('#cartVat').textContent=money(vat);
  if($('#cartTotal'))$('#cartTotal').textContent=money(total);
  var aiEl=$('#aiSuggest');
  if(aiEl){
    var sug=aiSuggestions();
    if(sug.length){
      aiEl.innerHTML='<div class="small muted" style="margin-bottom:6px">💡 Clients who buy this also add:</div>'+sug.map(function(s){return '<button data-sug="'+s.type+':'+s.id+'" style="margin:2px">+ '+esc(s.name)+'</button>';}).join('');
      $$('#aiSuggest [data-sug]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-sug').split(':');addCart(p[0],p[1]);};});
    }else{aiEl.innerHTML='';}
  }
}
function aiSuggestions(){
  var want=State.cart.filter(function(i){return i.type==='service';}).map(function(i){return i.id;});
  if(!want.length)return [];
  var counts={};
  State.db.sales.forEach(function(s){
    var has=want.some(function(id){return s.items.some(function(it){return it.type==='service'&&it.id===id;});});
    if(!has)return;
    s.items.forEach(function(it){
      if(want.indexOf(it.id)>=0)return;
      counts[it.type+':'+it.id]=(counts[it.type+':'+it.id]||0)+1;
    });
  });
  return Object.keys(counts).map(function(k){
    var p=k.split(':');
    var item=p[0]==='service'?serviceById(p[1]):productById(p[1]);
    return {type:p[0],id:p[1],name:item?item.name:'?',n:counts[k]};
  }).sort(function(a,b){return b.n-a.n;}).slice(0,3);
}
function changeQty(n,d){
  if(!State.cart[n])return;
  State.cart[n].qty+=d;
  if(State.cart[n].qty<=0)State.cart.splice(n,1);
  else if(State.cart[n].type==='product'){
    var p=productById(State.cart[n].id);
    if(State.cart[n].qty>p.qty){State.cart[n].qty=p.qty;toast('Limited to current stock.');}
  }
  updateCartUI();
}
function removeCart(n){State.cart.splice(n,1);updateCartUI();}
function clearCart(){if(State.cart.length&&!confirm('Clear current sale?'))return;State.cart=[];State.promoApplied=0;State.promoCode=null;updateCartUI();}
function holdCart(){if(!State.cart.length){toast('Nothing to hold.');return;}State.db.heldCart=clone(State.cart);State.cart=[];saveDB();updateCartUI();toast('Sale held.');}
function resumeCart(){if(!State.db.heldCart||!State.db.heldCart.length){toast('No held sale.');return;}if(State.cart.length&&!confirm('Replace current cart?'))return;State.cart=clone(State.db.heldCart);State.db.heldCart=[];saveDB();updateCartUI();}
function applyPromo(){
  var code=($('#promoInput')&&$('#promoInput').value||'').trim().toUpperCase();
  if(!code){State.promoApplied=0;State.promoCode=null;updateCartUI();return;}
  var p=State.db.promos.find(function(x){return x.code===code&&x.active&&new Date(x.expiresAt)>new Date()&&x.used<x.maxUses;});
  if(!p){State.promoApplied=0;State.promoCode=null;updateCartUI();return;}
  var gross=State.cart.reduce(function(n,i){return n+i.price*i.qty;},0);
  if(gross<p.minSpend){State.promoApplied=0;State.promoCode=null;updateCartUI();return;}
  State.promoApplied=p.type==='pct'?Math.round(gross*p.value/100):p.value;
  State.promoCode=p.code;
  updateCartUI();
}

function closeShift(){
  var expected=State.db.shift.opening+todaySales().reduce(function(n,s){return n+s.payments.filter(function(p){return p.method==='Cash';}).reduce(function(a,p){return a+p.amount;},0);},0);
  openModal('Close till shift','<p>Expected cash: <b>'+money(expected)+'</b></p><form id="closeShiftForm"><label>Counted cash (Ksh)<input name="counted" type="number" min="0" step="1" value="'+(expected/100).toFixed(2)+'" required></label><label>Note<textarea name="note" rows="2"></textarea></label></form>','<button id="cancelCloseShift">Cancel</button><button class="primary" id="saveCloseShift">Reconcile & close</button>');

  $('#saveCloseShift').onclick=function(){

function checkout(){
  if(!State.cart.length){toast('Add at least one item.');return;}
  var gross=State.cart.reduce(function(n,i){return n+i.price*i.qty;},0);
  var disc=Math.min(gross,Math.max(0,Math.round((Number($('#discountInput')&&$('#discountInput').value||0))*100)));
  var promo=State.promoApplied||0;
  var total=Math.max(0,gross-disc-promo);
  var body='<form id="payForm" class="formgrid">'
    +'<label>Method<select name="method" id="payMethod"><option>Cash</option><option>M-Pesa</option></select></label>'
    +'<label>Amount tendered (Ksh)<input name="tendered" type="number" min="0" step="1" value="'+(total/100).toFixed(2)+'"></label>'
    +'<label class="wide" id="mpesaWrap" style="display:none">M-Pesa reference<input name="mpesa" placeholder="e.g. QAB12CD34"></label>'
    +'<p class="wide muted small">Total due: <b>'+money(total)+'</b>. Demo only — no real M-Pesa request.</p>'
    +'</form>';
  openModal('Take payment',body,'<button id="cancelPay">Cancel</button><button class="primary" id="completeSaleBtn">Complete sale</button>');
  $('#payMethod').onchange=function(){var w=$('#mpesaWrap');if(w)w.style.display=this.value==='M-Pesa'?'grid':'none';};
  $('#cancelPay').onclick=closeModal;
  $('#completeSaleBtn').onclick=function(){completeSale(gross,disc,promo,total);};
}
function completeSale(gross,disc,promo,total){
  var f=$('#payForm');
  if(!f.reportValidity())return;
  var fd=new FormData(f);
  var method=fd.get('method');
  var tender=Math.round(Number(fd.get('tendered'))*100);
  if(method==='Cash'&&tender<total){toast('Cash tendered is less than total.');return;}
  var payments=[{method:method,amount:total}];
  if(method==='M-Pesa')payments[0].ref=fd.get('mpesa')||('DEMO-'+Date.now().toString().slice(-6));
  for(var i=0;i<State.cart.length;i++){
    var it=State.cart[i];
    if(it.type==='product'){
      var p=productById(it.id);
      if(!p||p.qty<it.qty){toast('Stock changed for '+it.name+'; sale not completed.');return;}
    }
  }
  var items=clone(State.cart);
  items.forEach(function(i){
    if(i.type==='product'){
      var p=productById(i.id);
      p.qty-=i.qty;
      State.db.stockMoves.push({id:uid('sm'),productId:p.id,qty:-i.qty,reason:'Sale',time:nowText()});
    }else{
      var svc=serviceById(i.id);
      (svc&&svc.consume||[]).forEach(function(c){
        var pr=productById(c.productId);
        if(pr){pr.qty=Math.max(0,pr.qty-c.qty*i.qty);State.db.stockMoves.push({id:uid('sm'),productId:pr.id,qty:-c.qty*i.qty,reason:'Recipe: '+svc.name,time:nowText()});}
      });
    }
  });
  var clientId=$('#saleClient')&&$('#saleClient').value||'';
  var vat=Math.round(total*State.db.settings.vat/(100+State.db.settings.vat));
  var sale={id:uid('sale'),ref:'SS-'+Date.now().toString().slice(-8),date:today(),time:nowText(),items:items,gross:gross,discount:disc+promo,total:total,vat:vat,payments:payments,clientId:clientId,by:State.session.name,refunded:false};
  State.db.sales.push(sale);
  if(State.promoCode){
    var pr=State.db.promos.find(function(x){return x.code===State.promoCode;});
    if(pr)pr.used++;
  }
  if(clientId){
    var c=clientById(clientId);
    if(c){c.points=(c.points||0)+Math.floor(total/10000);var nt=tierFor(c.points);if(nt!==c.tier){c.tier=nt;toast(c.name+' upgraded to '+nt+' tier!');}}
  }
  log('sale','Completed '+sale.ref+' for '+money(total));
  saveDB();
  State.cart=[];State.promoApplied=0;State.promoCode=null;
  closeModal();renderPage();
  var change=method==='Cash'?Math.max(0,tender-total):0;
  toast('Sale completed.'+(change?' Change: '+money(change):''));
  if(confirm('Sale complete. Print receipt now?'))printReceipt(sale.id);
}
function printReceipt(sid){
  var s=State.db.sales.find(function(x){return x.id===sid;});
  if(!s)return;
  var w=window.open('','_blank','width=420,height=700');
  if(!w){toast('Pop-up blocked. Allow pop-ups to print.');return;}
  var doc=w.document;
  doc.write('<!doctype html><html><head><title>Receipt</title><style>body{font:14px system-ui;max-width:360px;margin:20px auto;color:#000}h2,p{text-align:center}table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px dashed #aaa}.total{font-weight:bold;font-size:18px}</style></head><body></body></html>');
  doc.close();
  var body=doc.body;
  var h=doc.createElement('h2');h.textContent='Salon & Spa';body.appendChild(h);
  var p=doc.createElement('p');p.innerHTML='Beauty Studio · Nairobi<br>Phone: 0712 345 678';body.appendChild(p);
  var hr=doc.createElement('hr');body.appendChild(hr);
  var info=doc.createElement('p');info.innerHTML='Receipt: '+esc(s.ref)+'<br>'+esc(s.time)+'<br>Served by '+esc(s.by);body.appendChild(info);
  var tbl=doc.createElement('table');
  s.items.forEach(function(i){
    var tr=doc.createElement('tr');
    var td1=doc.createElement('td');td1.textContent=i.name+' × '+i.qty;
    var td2=doc.createElement('td');td2.style.textAlign='right';td2.textContent=money(i.price*i.qty);
    tr.appendChild(td1);tr.appendChild(td2);tbl.appendChild(tr);
  });
  body.appendChild(tbl);
  var totals=doc.createElement('p');
  totals.innerHTML='Subtotal: '+money(s.gross)+'<br>Discount: '+money(s.discount)+'<br>VAT included: '+money(s.vat);
  body.appendChild(totals);
  var total=doc.createElement('p');total.className='total';total.textContent='TOTAL '+money(s.total);body.appendChild(total);
  var pay=doc.createElement('p');pay.textContent='Payment: '+s.payments.map(function(p){return p.method+(p.ref?' ('+p.ref+')':'');}).join(', ');body.appendChild(pay);
  var h2=doc.createElement('hr');body.appendChild(h2);
  var thanks=doc.createElement('p');thanks.textContent='Asante! Karibu tena';body.appendChild(thanks);
  setTimeout(function(){w.print();},250);
}

    if(x.barcode&&State.db.products.some(function(p){return p.id!==pid&&p.barcode===x.barcode;})){toast('Barcode already assigned.');return;}
    if(pid){
      var p=productById(pid);
      if(p.qty!==x.qty)State.db.stockMoves.push({id:uid('sm'),productId:pid,qty:x.qty-p.qty,reason:'Catalogue adjustment',time:nowText()});

      State.db.stockMoves.push({id:uid('sm'),productId:nid,qty:x.qty,reason:'Opening stock',time:nowText()});
    }
    log('inventory',(pid?'Updated':'Added')+' product '+x.name);
    saveDB();closeModal();renderPage();toast('Product saved.');
  };

        var incoming=obj.data||obj;

        if(!confirm('Replace current data with backup?'))return;

function downloadBlob(blob,name){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

      hits.push('<div class="alertrow"><div style="flex:1"><b>🧴 '+esc(p.name)+'</b><div class="small muted">SKU '+esc(p.sku)+' · Stock '+p.qty+' · '+money(p.price)+'</div></div><button data-lookup-add="'+p.id+'">Add to sale</button></div>');
    }
  });
  State.db.clients.forEach(function(c){
    if([c.name,c.phone,('CLIENT-'+c.id).toLowerCase()].join(' ').toLowerCase().indexOf(q)>=0){
      hits.push('<div class="alertrow"><div style="flex:1"><b>💗 '+esc(c.name)+'</b><div class="small muted">'+esc(c.phone)+' · '+(c.points||0)+' pts</div></div><button data-lookup-checkin="'+c.id+'">Check in</button></div>');

function scanOpen(mode){
  var labels={pos:'Scan into sale',client:'Scan client card',staff:'Scan staff badge',stocktake:'Stock-take scan',appointment:'Arrival scan',lookup:'Lookup'};
  var body='<div class="notice">Camera needs HTTPS/localhost. Local file? Use manual entry.</div>'
    +'<form id="scanForm"><label>Code<input name="code" id="scanCode" autocomplete="off" placeholder="Scan or type…" autofocus required></label></form>'
    +'<div class="small muted" id="scanStatus" style="margin-top:8px">Ready for manual or keyboard-wedge scanning.</div>';
  openModal(labels[mode]||'Scanner',body,'<button id="cancelScan">Cancel</button><button class="primary" id="processScan">Process</button>');
  $('#cancelScan').onclick=function(){stopScanner();closeModal();};
  $('#processScan').onclick=function(){processScan(mode);};
  $('#scanCode').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();processScan(mode);}};
}
function processScan(mode){
  var code=($('#scanCode')&&$('#scanCode').value||'').trim();
  if(!code){toast('Enter a code.');return;}
  var p=null,c=null,s=null;
  State.db.products.forEach(function(x){if(x.barcode===code||(x.sku&&x.sku.toLowerCase()===code.toLowerCase()))p=x;});
  State.db.clients.forEach(function(x){if(('CLIENT-'+x.id).toLowerCase()===code.toLowerCase()||x.phone===code)c=x;});
  State.db.staff.forEach(function(x){if(x.barcode&&x.barcode.toLowerCase()===code.toLowerCase())s=x;});
  stopScanner();closeModal();
  if(mode==='pos'){
    if(p){addCart('product',p.id);navigate('pos');toast(p.name+' added.');}
    else{toast('No product matched.');}
    return;
  }
  if(mode==='client'||mode==='appointment'){
    if(c){checkinClient(c.id);navigate('checkin');}
    else{toast('No client matched.');}
    return;
  }
  if(mode==='staff'){
    if(s){toggleAttendance(s.id);navigate('staff');}
    else{toast('No staff matched.');}
    return;
  }
  if(mode==='stocktake'){
    if(p){openStockTake(p.id);}
    else{toast('No product matched.');}
    return;
  }
  doLookup();
}
function openStockTake(pid){

}

/* ---------- Wire global buttons once ---------- */
function wireShell(){
  var menuBtn=$('#menuBtn');if(menuBtn)menuBtn.onclick=function(){var s=$('#sidebar');if(s.classList.contains('open'))closeDrawer();else openDrawer();};
  var bd=$('#backdrop');if(bd)bd.onclick=closeDrawer;
  var lb=$('#logoutBtn');if(lb)lb.onclick=logout;
  var mc=$('#modalClose');if(mc)mc.onclick=closeModal;
  var mr=$('#modalRoot');if(mr)mr.onclick=function(e){if(e.target===mr)closeModal();};
  var nb=$('#notifBtn');if(nb)nb.onclick=showNotifications;
  // sidefoot settings buttons use data-go
  $$('.sidefoot [data-go]').forEach(function(b){b.onclick=function(){navigate(b.getAttribute('data-go'));};});
  // modal escape & focus trap
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeModal();closeDrawer();stopScanner();}
    if(e.key==='Tab'&&mr&&mr.classList.contains('open')){
      var els=[].slice.call(mr.querySelectorAll('button,input,select,textarea')).filter(function(x){return !x.disabled;});
      if(!els.length)return;
      var first=els[0],last=els[els.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
    // shortcuts
    if(State.session&&e.altKey){
      var map={n:'bookings',t:'pos',c:'calendar',i:'inventory',r:'reports',d:'dashboard'};
      if(map[e.key]){e.preventDefault();navigate(map[e.key]);}
    }
    if(e.key==='F2'&&State.page==='pos'){e.preventDefault();openLookup();}
  });
}

/* ---------- Boot ---------- */
function boot(){
  try{
    loadDB();
    document.documentElement.setAttribute('data-theme',(State.db.settings&&State.db.settings.theme)||'light');
    wireShell();
    // Restore session?
    try{
      var s=sessionStorage.getItem('salonSession');
      if(s){
        State.session=JSON.parse(s);
        $('#loginScreen').style.display='none';
        $('#app').style.display='block';
        renderShell();renderPage();
      }
    }catch(e){}
    // Login form
    var lf=$('#loginForm');
    if(lf)lf.addEventListener('submit',function(e){
      e.preventDefault();
      var role=$('#loginRole').value;
      var pin=$('#loginPin').value;
      login(role,pin,function(err){
        if(err){toast(err);return;}
        $('#loginScreen').style.display='none';
        $('#app').style.display='block';
        navigate('dashboard');
      });
    });
  }catch(err){
    showError(err.message||String(err));
  }
}

// Kick off
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}

})();
</script>
</body>
</html>
