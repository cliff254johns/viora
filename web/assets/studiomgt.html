audit:[],integrations:[{name:'M-Pesa',status:'Setup required',description:'Payment collection and reconciliation'},{name:'Email / SMS',status:'Setup required',description:'Booking reminders and delivery notices'},{name:'Cloud photo storage',status:'Setup required',description:'Gallery delivery and backup'},{name:'Accounting export',status:'Available',description:'CSV export for bookkeeping'}]
};
let db,session=null,page='dashboard',searchTerm='',filterStatus='All',filterBranch='All branches',filterOpen=false,scanBuffer='',lastReceipt=null,toastTimer;
function load(){try{const x=localStorage.getItem('studioflow_db_v1');db=x?JSON.parse(x):structuredClone(seed)}catch(e){db=structuredClone(seed)}if(!db||typeof db!=='object'||!db.settings||!Array.isArray(db.bookings)||!Array.isArray(db.sales)||!Array.isArray(db.products))db=structuredClone(seed);for(const key of ['users','clients','services','products','bookings','sales','expenses','equipment','tasks','audit','integrations'])if(!Array.isArray(db[key]))db[key]=structuredClone(seed[key]||[]);if(!Array.isArray(db.settings.branches)||!db.settings.branches.length)db.settings.branches=['Nairobi Studio','Kisumu Studio'];if(!['light','dark'].includes(db.settings.theme))db.settings.theme='light';}
function save(){try{localStorage.setItem('studioflow_db_v1',JSON.stringify(db));return true}catch(e){notify('Storage is full or unavailable. Export a backup before continuing.');return false}}
function log(action,detail){db.audit.unshift({id:uid(),at:new Date().toISOString(),user:session?.name||'System',action,detail});db.audit=db.audit.slice(0,500);save()}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3200)}
function roleCan(action){const role=session?.role;const matrix={Owner:['*'],Manager:['dashboard','bookings','clients','services','products','sales','expenses','equipment','tasks','reports','automations'],Photographer:['dashboard','bookings','clients','equipment','tasks','gallery'],Reception:['dashboard','bookings','clients','sales','services','products','gallery']};return !!session&&(matrix[role]||[]).includes('*')||(matrix[role]||[]).includes(action)}
function allowed(p){if(!roleCan(p)){notify('Your account does not have permission to open this section.');return false}return true}
function branchMatch(x){if(session&&session.role!=='Owner')return !x.branch||x.branch===session.branch;return filterBranch==='All branches'||!x.branch||x.branch===filterBranch}
function client(id){return db.clients.find(x=>x.id===id)?.name||'Walk-in client'}
function service(id){return db.services.find(x=>x.id===id)?.name||'Service removed'}
function userName(id){return db.users.find(x=>x.id===id)?.name||'Unassigned'}
function activeBookings(){return db.bookings.filter(x=>branchMatch(x)&&x.date===today()&&x.status!=='Cancelled')}
function allRevenue(){return db.sales.filter(branchMatch).reduce((a,x)=>a+Number(x.paid||0),0)}
function openBalance(){return db.sales.filter(branchMatch).reduce((a,x)=>a+Math.max(0,Number(x.total||0)-Number(x.paid||0)),0)}
function img(q){return 'https://images.unsplash.com/'+q+'?auto=format&fit=crop&w=800&q=75'}
const galleryItems=[
{title:'Portrait studio',kind:'Studio service',description:'Portrait lighting and posing setup',url:img('photo-1534528741775-53994a69daeb')},
{title:'Wedding coverage',kind:'Photography service',description:'Wedding moments and event coverage',url:img('photo-1519741497674-611481863552')},
{title:'Camera equipment',kind:'Studio equipment',description:'Professional camera and lens kit',url:img('photo-1516035069371-29a1b244cc32')},
{title:'Studio interior',kind:'Facilities',description:'A bright studio shooting space',url:img('photo-1600210492486-724fe5c67fb0')},
{title:'Product photography',kind:'Commercial service',description:'Controlled lighting for product images',url:img('photo-1542038784456-1ea8e935640e')},
{title:'Photo prints',kind:'Products',description:'Printed photographs and client albums',url:img('photo-1516035069371-29a1b244cc32')}
];
const nav=[['dashboard','▦','Dashboard'],['bookings','▣','Bookings'],['clients','♙','Clients'],['sales','▤','Sales & receipts'],['services','✦','Services'],['products','▧','Products & stock'],['equipment','◈','Equipment'],['gallery','▧','Studio gallery'],['tasks','☷','Tasks'],['reports','▥','Reports'],['automations','⚙','Automation'],['settings','⚙','Settings'],['users','♙','Users & security']];
function applyTheme(){document.documentElement.dataset.theme=db.settings.theme||'light';}
function shell(){const root=$('#root');root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="logo" id="brandLogo">${db.settings.logo?`<img src="${esc(db.settings.logo)}" style="width:100%;height:100%;object-fit:contain">`:'SF'}</div><div><strong>${esc(db.settings.studio)}</strong><small>Studio operations</small></div></div><nav class="nav">${nav.filter(n=>roleCan(n[0])).map(n=>`<button data-page="${n[0]}" class="${page===n[0]?'active':''}"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="side-bottom"><div class="muted" style="padding:4px 8px;font-size:11px">SIGNED IN AS</div><div style="padding:0 8px"><strong>${esc(session.name)}</strong><div class="muted">${esc(session.role)}</div></div><button id="themeSide">◐ Switch appearance</button><button id="logoutSide" class="danger">⇥ Log out</button></div></aside><main class="main"><header class="topbar"><div class="top-left"><div><h1 id="topTitle">${nav.find(n=>n[0]===page)?.[2]||'Dashboard'}</h1><p id="topSubtitle">Photography studio operations</p></div></div><div class="top-actions"><select class="branch-select" id="branchSelect" aria-label="Choose branch">${(session.role==='Owner'?['All branches',...db.settings.branches]:[session.branch]).map(b=>`<option ${filterBranch===b?'selected':''}>${esc(b)}</option>`).join('')}</select><button id="themeTop" title="Switch light or dark theme" aria-label="Switch theme">◐</button><span class="user-label muted">${esc(session.name)}</span><button id="logoutTop" title="Log out">⇥</button></div></header><section class="content" id="content"></section></main></div><nav class="mobile-nav">${[['dashboard','▦','Home'],['bookings','▣','Bookings'],['clients','♙','Clients'],['sales','▤','Sales'],['products','▧','Stock']].filter(n=>roleCan(n[0])).map(n=>`<button data-page="${n[0]}" class="${page===n[0]?'active':''}"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}<button id="mobileMore"><span class="ico">•••</span>More</button></nav>`;

function panel(title,content,subtitle=''){return `<section class="panel"><div class="panel-head"><div><h3>${title}</h3>${subtitle?`<p>${subtitle}</p>`:''}</div></div>${content}</section>`}
function btn(label,action,cls=''){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function render(){applyTheme();if(!session){login();return}const c=$('#content');const pages={dashboard:dashboardPage,bookings:bookingsPage,clients:clientsPage,sales:salesPage,services:servicesPage,products:productsPage,equipment:equipmentPage,gallery:galleryPage,tasks:tasksPage,reports:reportsPage,automations:automationsPage,settings:settingsPage,users:usersPage};c.innerHTML=(pages[page]||dashboardPage)();wire();$('#topTitle').textContent=nav.find(n=>n[0]===page)?.[2]||'Dashboard';}
function dashboardPage(){
const todays=activeBookings(), revenue=allRevenue(), low=db.products.filter(p=>branchMatch(p)&&p.stock<=p.min);
const rows=db.bookings.filter(branchMatch).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
const max=Math.max(1,...Array.from({length:7},(_,i)=>db.sales.filter(s=>branchMatch(s)&&s.date===dateKey(new Date(Date.now()-(6-i)*86400000))).reduce((a,s)=>a+s.paid,0)));
const bars=Array.from({length:7},(_,i)=>{const d=new Date(Date.now()-(6-i)*86400000),date=dateKey(d),v=db.sales.filter(s=>branchMatch(s)&&s.date===date).reduce((a,s)=>a+s.paid,0);return `<div class="bar-col" title="${esc(date)}: ${money(v)}"><div class="bar" style="height:${Math.max(3,v/max*145)}px"></div><span class="bar-label">${d.toLocaleDateString('en',{weekday:'short'})}</span></div>`}).join('');
return `${pageHead('Studio overview','A live view of bookings, payments, stock and studio work.',btn('＋ New booking','new-booking','primary')+btn('＋ Record sale','new-sale'))}<div class="notice">Operational workspace · ${esc(filterBranch)} · ${new Date().toLocaleDateString()}</div><div class="stats">${stat("Today's bookings",todays.length,'▣',`${db.bookings.filter(x=>branchMatch(x)&&x.date===today()&&x.status==='Confirmed').length} confirmed`)}${stat('Payments recorded',money(revenue),'↗','Total payments recorded in sales')}${stat('Outstanding balance',money(openBalance()),'◷','Calculated from recorded sales')}${stat('Low-stock items',low.length,'▧',low.length?`${low.map(x=>esc(x.name)).join(', ')}`:'No stock alerts')}</div><div class="grid2">${panel('Booking schedule',`<div class="session-list">${todays.length?todays.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(b=>`<div class="session"><div class="timebox">${esc(b.time)}</div><div><strong>${esc(client(b.clientId))}</strong><small>${esc(service(b.serviceId))} · ${esc(b.branch)}</small></div><span class="status ${esc(b.status)}">${esc(b.status)}</span></div>`).join(''):'<div class="empty">No bookings scheduled for today.</div>'}<div style="margin-top:12px">${btn('View all bookings','go-bookings','small')}</div></div>`,'Today’s studio sessions')}${panel('Payments trend',`<div class="bar-chart">${bars}</div><p class="muted" style="font-size:11px;margin-bottom:0">Recorded payments by day. Unrecorded transactions are not included.</p>`,'Last 7 calendar days')}</div><div class="grid2">${panel('Recent bookings',table(['Date / time','Client','Service','Branch','Status'],rows.map(b=>[esc(b.date+' '+b.time),esc(client(b.clientId)),esc(service(b.serviceId)),esc(b.branch),`<span class="status ${esc(b.status)}">${esc(b.status)}</span>`])))}${panel('Needs attention',`<div class="session-list">${low.map(p=>`<div class="session"><div class="stat-icon">▧</div><div><strong>${esc(p.name)}</strong><small>${p.stock} left · minimum ${p.min}</small></div>${btn('Edit','edit-product:'+p.id,'small')}</div>`).join('')||'<div class="muted">Stock levels look healthy.</div>'}${db.tasks.filter(t=>t.status!=='Done').slice(0,3).map(t=>`<div class="session"><div class="stat-icon">☷</div><div><strong>${esc(t.title)}</strong><small>${esc(t.due)} · ${esc(t.priority)} priority</small></div>${btn('Open tasks','go-tasks','small')}</div>`).join('')}</div>`)}</div>`;
}
function table(headers,rows){if(!rows.length)return '<div class="empty">No records match this view yet.</div>';return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function toolbar(placeholder,statuses=true){return `<div class="filters"><input id="searchBox" placeholder="${placeholder}" value="${esc(searchTerm)}" aria-label="Search records">${statuses?`<select id="statusFilter" aria-label="Filter by status"><option>All</option>${['Pending','Confirmed','Completed','Cancelled','Paid','Partial','Overdue','Open','In progress','Done','Active','Inactive','Available','Maintenance'].map(s=>`<option ${filterStatus===s?'selected':''}>${s}</option>`).join('')}</select>`:''}<button id="filterToggle" aria-expanded="${filterOpen}">☷ Filters</button>${btn('Reset','reset-filters','small')}</div>${filterOpen?`<div class="filters"><span class="muted">Branch is controlled by the branch selector above.</span><label class="inline-check"><input type="checkbox" id="todayOnly"> Today only</label></div>`:''}`}
function bookingsPage(){let arr=db.bookings.filter(branchMatch).filter(b=>(client(b.clientId)+' '+service(b.serviceId)+' '+b.date+' '+b.branch).toLowerCase().includes(searchTerm.toLowerCase())).filter(b=>filterStatus==='All'||b.status===filterStatus);if($('#todayOnly')?.checked)arr=arr.filter(b=>b.date===today());return `${pageHead('Bookings & sessions','Schedule sessions, assign photographers and track deposits.',btn('＋ Add booking','new-booking','primary'))}${toolbar('Search client, service, date...')}${panel('Booking register',table(['Date','Time','Client','Service','Photographer','Branch','Total','Deposit','Status','Actions'],arr.map(b=>[esc(b.date),esc(b.time),esc(client(b.clientId)),esc(service(b.serviceId)),esc(userName(b.photographer)),esc(b.branch),money(b.amount),money(b.deposit),`<span class="status ${esc(b.status)}">${esc(b.status)}</span>`,`${btn('Edit','edit-booking:'+b.id,'small')}`])))}`}
function clientsPage(){const arr=db.clients.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(searchTerm.toLowerCase()));return `${pageHead('Client records','A single client record connects bookings, sales and communication.',btn('＋ Add client','new-client','primary'))}${toolbar('Search name, phone or email...',false)}${panel('Clients',table(['Client','Phone','Email','Notes','Actions'],arr.map(c=>[esc(c.name),esc(c.phone),esc(c.email),esc(c.notes),btn('Edit','edit-client:'+c.id,'small')])))} `}
function salesPage(){const arr=db.sales.filter(branchMatch).filter(s=>(client(s.clientId)+' '+s.id+' '+s.method+' '+s.date).toLowerCase().includes(searchTerm.toLowerCase())).filter(s=>filterStatus==='All'||s.status===filterStatus);return `${pageHead('Sales & receipts','Record payments and product/service sales. Receipts use the same transaction record.',btn('＋ Record sale','new-sale','primary'))}${toolbar('Search receipt, client, method...')}${panel('Sales register',table(['Receipt','Date','Client','Items','Total','Paid','Balance','Method','Status','Actions'],arr.map(s=>[esc(s.id.toUpperCase()),esc(s.date),esc(client(s.clientId)),esc(s.items.map(i=>i.name+' ×'+i.qty).join(', ')),money(s.total),money(s.paid),money(Math.max(0,s.total-s.paid)),esc(s.method),`<span class="status ${s.paid>=s.total?'Paid':'Pending'}">${esc(s.status)}</span>`,btn('Receipt','receipt:'+s.id,'small')+' '+btn('Payment','payment:'+s.id,'small')])))} `}
function servicesPage(){const arr=db.services.filter(s=>(s.name+' '+s.category).toLowerCase().includes(searchTerm.toLowerCase())).filter(s=>filterStatus==='All'||(filterStatus==='Active'?s.active:filterStatus==='Inactive'?!s.active:true));return `${pageHead('Services & packages','Set service pricing, duration and availability.',btn('＋ Add service','new-service','primary'))}${toolbar('Search services or category...')}${panel('Service catalogue',table(['Service','Category','Duration','Price','Availability','Actions'],arr.map(s=>[esc(s.name),esc(s.category),s.duration+' min',money(s.price),`<span class="status ${s.active?'Active':'Cancelled'}">${s.active?'Active':'Inactive'}</span>`,btn('Edit','edit-service:'+s.id,'small')])))} `}
function productsPage(){const arr=db.products.filter(branchMatch).filter(p=>(p.name+' '+p.sku+' '+p.barcode+' '+p.category).toLowerCase().includes(searchTerm.toLowerCase())).filter(p=>filterStatus==='All'||(filterStatus==='Low stock'?p.stock<=p.min:true));return `${pageHead('Products & inventory','Track prints, albums, delivery media and studio supplies. Stock decrements when a product is sold.',btn('＋ Add product','new-product','primary')+btn('▦ Scan barcode','scan-barcode'))}${toolbar('Search product, SKU or barcode...')}${panel('Inventory register',table(['Product','SKU / barcode','Category','Branch','Price','Stock','Minimum','Status','Actions'],arr.map(p=>[esc(p.name),esc(p.sku)+'<br>'+esc(p.barcode),esc(p.category),esc(p.branch),money(p.price),String(p.stock),String(p.min),`<span class="status ${p.stock<=p.min?'Overdue':'Active'}">${p.stock<=p.min?'Low stock':'In stock'}</span>`,btn('Edit','edit-product:'+p.id,'small')])))}<div class="notice" style="margin-top:12px">Offline barcode: this prototype supports keyboard-wedge USB/Bluetooth scanners and manual barcode entry without internet. Camera-based scanning requires a compatible browser/library and is not bundled.</div>`}
function equipmentPage(){const arr=db.equipment.filter(branchMatch).filter(e=>(e.name+' '+e.serial+' '+e.category).toLowerCase().includes(searchTerm.toLowerCase())).filter(e=>filterStatus==='All'||e.status===filterStatus);return `${pageHead('Equipment & facilities','Track cameras, lenses, lighting kits, studio spaces and maintenance.',btn('＋ Add equipment','new-equipment','primary'))}${toolbar('Search equipment or serial...')}${panel('Equipment register',table(['Equipment','Category','Serial','Branch','Last service','Status','Actions'],arr.map(e=>[esc(e.name),esc(e.category),esc(e.serial),esc(e.branch),esc(e.lastService),`<span class="status ${e.status==='Available'?'Active':'Pending'}">${esc(e.status)}</span>`,btn('Edit','edit-equipment:'+e.id,'small')])))} `}
function galleryPage(){return `${pageHead('Studio gallery & services','Reference images for studio spaces, services, products and equipment.',btn('＋ Add gallery item','new-gallery'))}<div class="notice">These sample reference photos load from Unsplash and require internet access. Upload your own studio images in Settings to customize branding; this demo does not upload or host client galleries.</div><div class="gallery">${galleryItems.map((g,i)=>`<article class="card photo-card"><img loading="lazy" src="${esc(g.url)}" alt="${esc(g.title)}" onerror="this.style.display='none'"><div class="pad"><strong>${esc(g.title)}</strong><p>${esc(g.kind)}</p><p>${esc(g.description)}</p><button class="small" data-action="gallery-info:${i}">View details</button></div></article>`).join('')}</div>`}
function tasksPage(){const arr=db.tasks.filter(t=>(t.title+' '+t.status+' '+t.priority).toLowerCase().includes(searchTerm.toLowerCase())).filter(t=>filterStatus==='All'||t.status===filterStatus);return `${pageHead('Tasks & delegation','Assign operational tasks, due dates and priorities.',btn('＋ Create task','new-task','primary'))}${toolbar('Search tasks...')}${panel('Task board',table(['Task','Assigned to','Due date','Priority','Status','Actions'],arr.map(t=>[esc(t.title),esc(userName(t.owner)),esc(t.due),esc(t.priority),`<span class="status ${t.status==='Done'?'Completed':'Pending'}">${esc(t.status)}</span>`,btn(t.status==='Done'?'Reopen':'Mark done','task-toggle:'+t.id,'small')+' '+btn('Edit','edit-task:'+t.id,'small')])))} `}
function reportsPage(){const rev=db.sales.filter(branchMatch).reduce((a,s)=>a+s.total,0),paid=allRevenue(),expenses=db.expenses.filter(branchMatch).reduce((a,e)=>a+e.amount,0),bookingCount=db.bookings.filter(branchMatch).length;return `${pageHead('Reports & intelligence','Operational summaries calculated from saved records.',btn('⇩ Export CSV','export-csv','primary')+btn('⇩ Backup JSON','backup'))}<div class="stats">${stat('Sales value',money(rev),'▤','Value of recorded sales')}${stat('Payments collected',money(paid),'↗','Recorded payments only')}${stat('Expenses recorded',money(expenses),'↘','Manually recorded expenses')}${stat('Bookings',bookingCount,'▣','All bookings in selected branch scope')}</div><div class="grid2">${panel('Financial summary',table(['Measure','Value'],[['Sales value',money(rev)],['Payments collected',money(paid)],['Outstanding balance',money(openBalance())],['Recorded expenses',money(expenses)],['Collected less expenses',money(paid-expenses)]]))}${panel('Operational checks',`<div class="session-list"><div class="session"><div class="stat-icon">▣</div><div><strong>${db.bookings.filter(b=>b.status==='Pending'&&branchMatch(b)).length} pending bookings</strong><small>Review deposits and confirm sessions.</small></div></div><div class="session"><div class="stat-icon">▧</div><div><strong>${db.products.filter(p=>p.stock<=p.min&&branchMatch(p)).length} low-stock products</strong><small>Reorder or adjust minimum levels.</small></div></div><div class="session"><div class="stat-icon">☷</div><div><strong>${db.tasks.filter(t=>t.status!=='Done').length} open tasks</strong><small>Check owners and due dates.</small></div></div></div>`)} </div><div class="notice">Reports reflect the records currently saved in this browser. This prototype does not connect to bank, M-Pesa, tax, payroll or external accounting data.</div>`}
function automationsPage(){return `${pageHead('Automation & integrations','Rule-based actions and integration readiness. No external service is called unless configured.',btn('＋ Create rule','new-rule','primary'))}<div class="grid2">${panel('Available automations',`<div class="session-list"><div class="session"><div class="stat-icon">◷</div><div><strong>Booking reminder queue</strong><small>Find upcoming sessions needing client confirmation.</small></div>${btn('Run check','run-reminders','small')}</div><div class="session"><div class="stat-icon">▧</div><div><strong>Low-stock monitor</strong><small>Check products at or below their reorder threshold.</small></div>${btn('Run check','run-stock','small')}</div><div class="session"><div class="stat-icon">↔</div><div><strong>Payment balance review</strong><small>Identify sales with remaining balances.</small></div>${btn('Run check','run-balances','small')}</div><div class="session"><div class="stat-icon">☷</div><div><strong>Overdue task review</strong><small>Find unfinished tasks whose due date has passed.</small></div>${btn('Run check','run-tasks','small')}</div></div>`)}${panel('Integration status',table(['Integration','Purpose','Status'],db.integrations.map(i=>[esc(i.name),esc(i.description),`<span class="status ${i.status==='Available'?'Active':'Pending'}">${esc(i.status)}</span>`])))} </div><div id="automationOutput"></div><div class="notice">Automation here means local rule checks and generated work queues. Email/SMS, M-Pesa, online galleries, cloud backups, AI decisions and unattended actions are not connected; configure provider credentials and server-side workflows before production use.</div>`}
function settingsPage(){return `${pageHead('Studio settings','Manage studio identity, branches, theme and local data.',btn('Save settings','save-settings','primary'))}<div class="grid2">${panel('Studio profile',`<div class="field"><label>Studio name</label><input id="studioName" value="${esc(db.settings.studio)}"></div><div class="field"><label>Logo image URL or data URL</label><input id="logoUrl" value="${esc(db.settings.logo||'')}" placeholder="https://... or choose an image below"></div><div class="field"><label>Upload logo image (local preview)</label><input id="logoFile" type="file" accept="image/*"></div><div class="field"><label>Branches (one per line)</label><textarea id="branches">${esc(db.settings.branches.join('\\n'))}</textarea></div><div class="field"><label>Appearance</label><select id="themeChoice"><option value="light" ${db.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${db.settings.theme==='dark'?'selected':''}>Dark</option></select></div>`)}${panel('Data and installation',`<p class="muted">Records are saved to this browser's local storage. They are not synced across staff devices.</p><div class="actions">${btn('Export backup JSON','backup')}${btn('Import backup JSON','import-backup')}${btn('Export CSV','export-csv')}</div><div class="field" style="margin-top:14px"><label>Install as app</label><p class="muted">Use your browser menu and choose “Add to Home screen”. For a true installable PWA, deploy with HTTPS and add a manifest and service worker.</p></div><div class="field"><label>Data reset</label><button class="danger" data-action="reset-demo">Reset demo data</button><small class="muted">This clears local records in this browser and restores sample data.</small></div>`)} </div><div class="notice">Security note: browser-local PINs and role checks are for prototype demonstration only. Production authentication needs a server, hashed credentials, session expiry, enforced API permissions, encrypted backups and recovery controls.</div>`}
function usersPage(){return `${pageHead('Users & security','Prototype role-based views with audit events. Production security must be enforced server-side.',btn('＋ Add user','new-user','primary'))}${panel('User accounts',table(['Name','Username','Role','Branch','Status','Actions'],db.users.map(u=>[esc(u.name),esc(u.username),esc(u.role),esc(u.branch),`<span class="status ${u.active?'Active':'Cancelled'}">${u.active?'Active':'Inactive'}</span>`,btn('Edit','edit-user:'+u.id,'small')])))}<div class="grid2" style="margin-top:16px">${panel('Security layers',`<ul><li>Role-based navigation and action checks in this browser</li><li>Audit log for changes and key actions</li><li>Branch-level display filtering</li><li>Data export for backup and recovery</li><li>Production requirements: server-side authorization, encrypted transport/storage, MFA, rate limits, backups and monitoring</li></ul>`)}${panel('Recent audit trail',table(['Time','User','Action','Details'],db.audit.slice(0,8).map(a=>[esc(new Date(a.at).toLocaleString()),esc(a.user),esc(a.action),esc(a.detail)])))}</div>`}
function login(){const root=$('#root');root.innerHTML=`<div class="login-wrap"><form class="login-card" id="loginForm"><div class="login-mark">${db.settings.logo?`<img src="${esc(db.settings.logo)}" style="width:100%;height:100%;object-fit:contain">`:'SF'}</div><h1>${esc(db.settings.studio)}</h1><p>Sign in to your studio workspace.</p><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required placeholder="Enter username"></div><div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" required placeholder="Enter PIN"></div><div class="field"><label>Workspace</label><select id="loginBranch">${db.settings.branches.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div><button class="primary" type="submit">Sign in</button><div class="demo"><strong>Demo accounts</strong><br>Owner: owner / 2468<br>Manager: manager / 2468<br>Photographer: photo / 2468<br>Reception: desk / 2468</div><p style="font-size:11px;margin:14px 0 0">Demonstration login only. Do not use real credentials.</p></form></div>`;
$('#loginForm').onsubmit=e=>{e.preventDefault();const u=db.users.find(x=>x.username===$('#loginUser').value.trim()&&x.pin===$('#loginPin').value&&x.active);if(!u){notify('Login failed. Check username and PIN.');return}session={...u};filterBranch=u.role==='Owner'?'All branches':u.branch;page='dashboard';log('Login',u.role+' signed in');shell();render()}}
function modal(title,body,onSave,saveLabel='Save'){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3><button type="button" id="modalClose" aria-label="Close">✕</button></div><form id="modalForm">${body}<div class="modal-foot"><button type="button" id="modalCancel">Cancel</button>${onSave?`<button class="primary" type="submit">${saveLabel}</button>`:''}</div></form></section></div>`;$('#modalClose').onclick=$('#modalCancel').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};if(onSave)$('#modalForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target),e.target)}}
function closeModal(){$('#modalRoot').innerHTML=''}
function field(label,name,value='',type='text',opts=null,required=false){let input=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(typeof o==='string'?o:o.value)}" ${String(typeof o==='string'?o:o.value)===String(value)?'selected':''}>${esc(typeof o==='string'?o:o.label)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'step="any"':''}>`;return `<div class="field"><label>${label}</label>${input}</div>`}
function clientOptions(){return db.clients.map(c=>({value:c.id,label:c.name+' · '+c.phone}))}
function serviceOptions(){return db.services.filter(s=>s.active).map(s=>({value:s.id,label:s.name+' · '+money(s.price)}))}
function branchOptions(){return session?.role==='Owner'?db.settings.branches:[session?.branch].filter(Boolean)}
function newBooking(id){if(!roleCan('bookings')){notify('You do not have permission to manage bookings.');return}const b=db.bookings.find(x=>x.id===id)||{clientId:db.clients[0]?.id||'',serviceId:db.services[0]?.id||'',date:today(),time:'10:00',branch:session.role==='Owner'?db.settings.branches[0]:session.branch,status:'Pending',amount:0,deposit:0,photographer:db.users.find(u=>u.role==='Photographer')?.id||'',notes:''};modal(id?'Edit booking':'New booking',`<div class="form-grid">${field('Client','clientId',b.clientId,'text',clientOptions(),true)}${field('Service','serviceId',b.serviceId,'text',serviceOptions(),true)}${field('Date','date',b.date,'date',null,true)}${field('Time','time',b.time,'time',null,true)}${field('Branch','branch',b.branch,'text',branchOptions(),true)}${field('Photographer','photographer',b.photographer,'text',db.users.filter(u=>u.active&&['Photographer','Manager','Owner'].includes(u.role)).map(u=>({value:u.id,label:u.name})),true)}${field('Status','status',b.status,'text',['Pending','Confirmed','Completed','Cancelled'])}${field('Total price (KES)','amount',b.amount,'number',null,true)}${field('Deposit received (KES)','deposit',b.deposit,'number',null,true)}<div class="full">${field('Session notes','notes',b.notes)}</div></div>`,f=>{const x=Object.fromEntries(f);x.amount=Number(x.amount);x.deposit=Number(x.deposit);if(!Number.isFinite(x.amount)||!Number.isFinite(x.deposit)||x.amount<0||x.deposit<0){notify('Booking total and deposit must be valid non-negative amounts.');return}if(x.deposit>x.amount){notify('Deposit cannot exceed the booking total.');return}const collision=db.bookings.some(y=>y.id!==id&&y.branch===x.branch&&y.date===x.date&&y.time===x.time&&y.status!=='Cancelled'&&x.status!=='Cancelled');if(collision&&!confirm('Another active booking exists for this branch at this time. Save anyway?'))return;if(id)Object.assign(b,x);else db.bookings.unshift({id:uid(),...x});save();log(id?'Updated booking':'Created booking',client(x.clientId)+' · '+x.date+' '+x.time);closeModal();render();notify('Booking saved.')})}
function newClient(id){if(!roleCan('clients')){notify('You do not have permission to manage clients.');return}const c=db.clients.find(x=>x.id===id)||{name:'',phone:'',email:'',notes:''};modal(id?'Edit client':'Add client',`<div class="form-grid">${field('Full name','name',c.name,'text',null,true)}${field('Phone','phone',c.phone,'tel',null,true)}${field('Email','email',c.email,'email') }<div class="full">${field('Notes','notes',c.notes)}</div></div>`,f=>{const x=Object.fromEntries(f);if(id)Object.assign(c,x);else db.clients.unshift({id:uid(),...x});save();log(id?'Updated client':'Created client',x.name);closeModal();render();notify('Client saved.')})}
function newService(id){if(!roleCan('services')){notify('You do not have permission to manage services.');return}const s=db.services.find(x=>x.id===id)||{name:'',category:'Studio',price:0,duration:60,active:true};modal(id?'Edit service':'Add service',`<div class="form-grid">${field('Service name','name',s.name,'text',null,true)}${field('Category','category',s.category,'text',null,true)}${field('Price (KES)','price',s.price,'number',null,true)}${field('Duration (minutes)','duration',s.duration,'number',null,true)}${field('Availability','active',String(s.active),'text',[{value:'true',label:'Active'},{value:'false',label:'Inactive'}])}</div>`,f=>{const x=Object.fromEntries(f);x.price=+x.price;x.duration=+x.duration;x.active=x.active==='true';if(!Number.isFinite(x.price)||!Number.isFinite(x.duration)||x.price<0||x.duration<1||!Number.isInteger(x.duration)){notify('Price must be a valid non-negative amount and duration a whole number of at least one minute.');return}if(id)Object.assign(s,x);else db.services.push({id:uid(),...x});save();log(id?'Updated service':'Created service',x.name);closeModal();render();notify('Service saved.')})}
function newProduct(id){if(!roleCan('products')){notify('You do not have permission to manage products.');return}const p=db.products.find(x=>x.id===id)||{name:'',sku:'',barcode:'',category:'Prints',price:0,cost:0,stock:0,min:0,branch:session.role==='Owner'?db.settings.branches[0]:session.branch};modal(id?'Edit product':'Add product',`<div class="form-grid">${field('Product name','name',p.name,'text',null,true)}${field('SKU','sku',p.sku,'text',null,true)}${field('Barcode','barcode',p.barcode)}${field('Category','category',p.category,'text',null,true)}${field('Selling price (KES)','price',p.price,'number',null,true)}${field('Unit cost (KES)','cost',p.cost,'number',null,true)}${field('Stock quantity','stock',p.stock,'number',null,true)}${field('Low-stock threshold','min',p.min,'number',null,true)}${field('Branch','branch',p.branch,'text',branchOptions(),true)}</div>`,f=>{const x=Object.fromEntries(f);['price','cost','stock','min'].forEach(k=>x[k]=+x[k]);if([x.price,x.cost,x.stock,x.min].some(v=>!Number.isFinite(v)||v<0)||!Number.isInteger(x.stock)||!Number.isInteger(x.min)){notify('Prices and costs must be valid non-negative amounts; stock and minimum levels must be non-negative whole numbers.');return}if(db.products.some(y=>y.id!==id&&y.barcode&&y.barcode===x.barcode)){notify('That barcode is already assigned to another product.');return}if(id)Object.assign(p,x);else db.products.push({id:uid(),...x});save();log(id?'Updated product':'Created product',x.name);closeModal();render();notify('Product saved.')})}
function newSale(){if(!roleCan('sales')){notify('You do not have permission to record sales.');return}let items=[{type:'service',id:db.services[0]?.id||'',qty:1},{type:'product',id:'',qty:0}];modal('Record sale & payment',`<div class="form-grid">${field('Client','clientId',db.clients[0]?.id||'','text',[{value:'',label:'Walk-in client'},...clientOptions()])}${field('Branch','branch',session.role==='Owner'?db.settings.branches[0]:session.branch,'text',branchOptions(),true)}${field('Payment method','method','M-Pesa','text',['M-Pesa','Cash','Card','Bank transfer','Other'],true)}${field('Amount paid now (KES)','paid','0','number',null,true)}</div><div class="notice">Add one or more line items below. Inventory stock is reduced for product lines when the sale is saved.</div><div id="saleLines"></div><button type="button" id="addSaleLine">＋ Add line item</button><div id="saleTotal" style="font-weight:750;margin-top:12px">Total: KES 0</div>`,f=>{const x=Object.fromEntries(f);const rawLines=[...$('#saleLines').querySelectorAll('.sale-line')].map(el=>({type:el.querySelector('[name=type]').value,id:el.querySelector('[name=item]').value,qty:Number(el.querySelector('[name=qty]').value)}));if(rawLines.some(l=>l.id&&(!Number.isFinite(l.qty)||l.qty<=0||(l.type==='product'&&!Number.isInteger(l.qty))))){notify('Quantities must be greater than zero; product quantities must be whole numbers.');return}const lines=rawLines.filter(l=>l.id&&l.qty>0);if(!lines.length){notify('Add at least one item.');return}const chosen=lines.map(l=>{const it=l.type==='service'?db.services.find(z=>z.id===l.id):db.products.find(z=>z.id===l.id);return it?{...l,name:it.name,price:Number(it.price)}:null}).filter(Boolean);if(chosen.length!==lines.length){notify('An item is no longer available.');return}const productDemand={};for(const l of chosen)if(l.type==='product'){productDemand[l.id]=(productDemand[l.id]||0)+l.qty;const p=db.products.find(z=>z.id===l.id);if(p.branch!==x.branch){notify(p.name+' belongs to '+p.branch+'. Choose that branch before selling it.');return}}for(const [pid,qty] of Object.entries(productDemand)){const p=db.products.find(z=>z.id===pid);if(!p||!Number.isInteger(qty)||p.stock<qty){notify('Insufficient stock for '+(p?.name||'a product')+'. Sale was not saved.');return}}const total=chosen.reduce((a,l)=>a+l.price*l.qty,0),paid=Number(x.paid);if(!Number.isFinite(total)||total<=0){notify('Sale total must be greater than zero.');return}if(!Number.isFinite(paid)||paid<0||paid>total){notify('Payment must be between zero and the sale total.');return}chosen.forEach(l=>{if(l.type==='product')db.products.find(p=>p.id===l.id).stock-=l.qty});const sale={id:'r'+uid(),date:today(),clientId:x.clientId,items:chosen,total,paid,method:x.method,status:paid>=total?'Paid':paid>0?'Partial':'Pending',branch:x.branch,createdBy:session.id};db.sales.unshift(sale);save();log('Recorded sale',sale.id+' · '+money(total));lastReceipt=sale.id;closeModal();render();showReceipt(sale.id);notify('Sale saved and stock updated.')},'Save sale');function redraw(){const container=$('#saleLines');if(!container)return;container.innerHTML=items.map((l,i)=>`<div class="sale-line" style="display:grid;grid-template-columns:100px minmax(0,1fr) 70px 32px;gap:7px;margin-bottom:8px"><select name="type" data-i="${i}"><option value="service" ${l.type==='service'?'selected':''}>Service</option><option value="product" ${l.type==='product'?'selected':''}>Product</option></select><select name="item" data-i="${i}">${(l.type==='service'?db.services.filter(s=>s.active):db.products).map(it=>`<option value="${it.id}" ${l.id===it.id?'selected':''}>${esc(it.name)} · ${money(it.price)}</option>`).join('')}</select><input name="qty" type="number" min="1" step="1" value="${l.qty||1}" required><button type="button" data-remove="${i}" aria-label="Remove line">×</button></div>`).join('');const calc=()=>{const total=[...container.querySelectorAll('.sale-line')].reduce((sum,el)=>{const type=el.querySelector('[name=type]').value,id=el.querySelector('[name=item]').value,qty=Number(el.querySelector('[name=qty]').value)||0,it=(type==='service'?db.services:db.products).find(z=>z.id===id);return sum+(it?it.price*qty:0)},0);$('#saleTotal').textContent='Total: '+money(total)};container.querySelectorAll('[name=type]').forEach(el=>el.onchange=()=>{items[Number(el.dataset.i)].type=el.value;items[Number(el.dataset.i)].id=(el.value==='service'?db.services[0]?.id:db.products[0]?.id)||'';redraw()});container.querySelectorAll('[name=item]').forEach(el=>el.onchange=()=>{items[Number(el.dataset.i)].id=el.value;calc()});container.querySelectorAll('[name=qty]').forEach(el=>el.oninput=calc);container.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{items.splice(Number(el.dataset.remove),1);redraw()});calc()}redraw();$('#addSaleLine').onclick=()=>{items.push({type:'product',id:db.products[0]?.id||'',qty:1});redraw()}}
function payment(id){if(!roleCan('sales')){notify('You do not have permission to record payments.');return}const s=db.sales.find(x=>x.id===id);if(!s)return;modal('Record payment',`<p>Receipt ${esc(s.id.toUpperCase())} · Current balance <strong>${money(s.total-s.paid)}</strong></p>${field('Payment amount (KES)','amount',Math.max(0,s.total-s.paid),'number',null,true)}${field('Payment method','method',s.method,'text',['M-Pesa','Cash','Card','Bank transfer','Other'],true)}`,f=>{const x=Object.fromEntries(f),n=Number(x.amount);if(!Number.isFinite(n)||n<=0||n>s.total-s.paid){notify('Enter a valid amount above zero and no greater than the balance.');return}s.paid+=n;s.method=x.method;s.status=s.paid>=s.total?'Paid':'Partial';save();log('Recorded payment',s.id+' · '+money(n));closeModal();render();showReceipt(s.id);notify('Payment recorded.')})}
function showReceipt(id){const s=db.sales.find(x=>x.id===id);if(!s)return;const content=`<div class="receipt"><h2>${esc(db.settings.studio)}</h2><p style="text-align:center">PAYMENT RECEIPT</p><hr><p><strong>Receipt:</strong> ${esc(s.id.toUpperCase())}<br><strong>Date:</strong> ${esc(s.date)}<br><strong>Client:</strong> ${esc(client(s.clientId))}<br><strong>Branch:</strong> ${esc(s.branch)}<br><strong>Payment method:</strong> ${esc(s.method)}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div class="total">Total: ${money(s.total)}<br>Paid: ${money(s.paid)}<br>Balance: ${money(Math.max(0,s.total-s.paid))}</div><p style="text-align:center;margin-top:24px">Thank you for choosing our studio.</p></div>`;modal('Receipt preview',content,null);const foot=$('#modalForm .modal-foot');foot.innerHTML=`<button type="button" id="receiptClose">Close</button><button type="button" id="receiptPrint" class="primary">Print / Save PDF</button>`;$('#receiptClose').onclick=closeModal;$('#receiptPrint').onclick=()=>{const w=window.open('','_blank','width=700,height=800');if(!w){notify('Allow pop-ups to print the receipt, or try again.');return}w.document.write('<!doctype html><html><head><title>Receipt '+esc(s.id)+'</title><meta charset="utf-8"><style>body{font:14px Arial;padding:20px}.receipt{max-width:520px;margin:auto}.receipt table{width:100%;border-collapse:collapse}.receipt td,.receipt th{border-bottom:1px solid #ddd;padding:8px;text-align:left}.total{text-align:right;font-weight:bold;line-height:1.8}</style></head><body>'+content+'<script>window.onload=()=>window.print()<\\/script></body></html>');w.document.close()}}
function newEquipment(id){if(!roleCan('equipment')){notify('You do not have permission to manage equipment.');return}const e=db.equipment.find(x=>x.id===id)||{name:'',category:'Camera',serial:'',branch:session.role==='Owner'?db.settings.branches[0]:session.branch,status:'Available',lastService:today()};modal(id?'Edit equipment':'Add equipment',`<div class="form-grid">${field('Equipment name','name',e.name,'text',null,true)}${field('Category','category',e.category,'text',['Camera','Lens','Lighting','Tripod','Computer','Studio facility','Other'],true)}${field('Serial / asset tag','serial',e.serial)}${field('Branch','branch',e.branch,'text',branchOptions(),true)}${field('Status','status',e.status,'text',['Available','In use','Maintenance','Retired'])}${field('Last service date','lastService',e.lastService,'date')}</div>`,f=>{const x=Object.fromEntries(f);if(id)Object.assign(e,x);else db.equipment.push({id:uid(),...x});save();log(id?'Updated equipment':'Added equipment',x.name);closeModal();render();notify('Equipment saved.')})}
function newTask(id){if(!roleCan('tasks')){notify('You do not have permission to manage tasks.');return}const t=db.tasks.find(x=>x.id===id)||{title:'',owner:session.id,due:today(),status:'Open',priority:'Normal'};modal(id?'Edit task':'Create task',`<div class="form-grid">${field('Task','title',t.title,'text',null,true)}${field('Assigned user','owner',t.owner,'text',db.users.filter(u=>u.active).map(u=>({value:u.id,label:u.name})),true)}${field('Due date','due',t.due,'date',null,true)}${field('Priority','priority',t.priority,'text',['Low','Normal','High'])}${field('Status','status',t.status,'text',['Open','In progress','Done'])}</div>`,f=>{const x=Object.fromEntries(f);if(id)Object.assign(t,x);else db.tasks.unshift({id:uid(),...x});save();log(id?'Updated task':'Created task',x.title);closeModal();render();notify('Task saved.')})}
function newUser(id){if(session.role!=='Owner'){notify('Only the owner can manage user accounts.');return}const u=db.users.find(x=>x.id===id)||{name:'',username:'',pin:'',role:'Reception',branch:db.settings.branches[0],active:true};modal(id?'Edit user':'Add user',`<div class="form-grid">${field('Full name','name',u.name,'text',null,true)}${field('Username','username',u.username,'text',null,true)}${field('PIN (demo only)','pin',u.pin,'password',null,true)}${field('Role','role',u.role,'text',['Owner','Manager','Photographer','Reception'],true)}${field('Branch','branch',u.branch,'text',['All branches',...db.settings.branches],true)}${field('Account status','active',String(u.active),'text',[{value:'true',label:'Active'},{value:'false',label:'Inactive'}])}</div>`,f=>{const x=Object.fromEntries(f);if(db.users.some(z=>z.id!==id&&z.username===x.username)){notify('Username already exists.');return}x.active=x.active==='true';if(id)Object.assign(u,x);else db.users.push({id:uid(),...x});save();log(id?'Updated user':'Created user',x.username+' · '+x.role);closeModal();render();notify('User saved.')})}
function newRule(){if(!roleCan('automations')){notify('You do not have permission to manage automation.');return}modal('Create local automation rule',`<p class="muted">Choose a built-in check to run manually. This demo does not schedule background jobs.</p>${field('Rule name','name','Daily stock check','text',null,true)}${field('Rule type','type','stock','text',[{value:'stock',label:'Low-stock check'},{value:'balances',label:'Outstanding payment review'},{value:'bookings',label:'Upcoming booking review'},{value:'tasks',label:'Overdue task review'}],true)}`,f=>{const x=Object.fromEntries(f);db.integrations.push({name:'Rule: '+x.name,status:'Local rule',description:'Rule type: '+x.type});save();log('Created automation rule',x.name+' / '+x.type);closeModal();render();notify('Local rule added to integration list.')})}
function newGallery(){if(!roleCan('gallery')){notify('You do not have permission to manage gallery references.');return}modal('Add a gallery reference',`${field('Title','title','','text',null,true)}${field('Image URL','url','','url',null,true)}${field('Category','category','Studio service','text',['Studio service','Photography service','Products','Equipment','Facilities'],true)}<p class="muted">This adds a reference link in this browser only. Use images you own or are licensed to use.</p>`,f=>{const x=Object.fromEntries(f);galleryItems.push({title:x.title,kind:x.category,description:'Custom reference image',url:x.url});closeModal();render();notify('Image reference added for this session.')})}
function scanBarcode(){modal('Barcode lookup',`${field('Scan or type barcode','barcode','','text',null,true)}<p class="muted">A paired USB/Bluetooth scanner that types digits into this field can work offline. If your scanner adds Enter, it will submit.</p>`,f=>{const code=f.get('barcode').trim(),p=db.products.find(x=>x.barcode===code||x.sku.toLowerCase()===code.toLowerCase());if(!p){notify('No product matches that barcode. Add the product first.');return}closeModal();newProduct(p.id);notify('Product found: '+p.name) },'Find product');$('#modalForm [name=barcode]').focus()}
function saveSettings(){if(!roleCan('settings')){notify('You do not have permission to change settings.');return}const name=$('#studioName').value.trim(),branches=$('#branches').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!name||!branches.length){notify('Studio name and at least one branch are required.');return}db.settings.studio=name;db.settings.logo=$('#logoUrl').value.trim();db.settings.branches=[...new Set(branches)];db.settings.theme=$('#themeChoice').value;if(session.role!=='Owner'&&!db.settings.branches.includes(session.branch)){notify("Keep the signed-in user branch in the branch list or reassign that user first.");return}if(!db.settings.branches.includes(filterBranch))filterBranch='All branches';save();log('Updated settings','Studio profile and branches');shell();render();notify('Settings saved.')}
function runAutomation(type){if(!roleCan('automations')){notify('You do not have permission to run automation checks.');return}let lines=[];if(type==='run-stock')lines=db.products.filter(p=>branchMatch(p)&&p.stock<=p.min).map(p=>`Reorder review: ${p.name} has ${p.stock} units (minimum ${p.min}).`);if(type==='run-balances')lines=db.sales.filter(branchMatch).filter(s=>s.total>s.paid).map(s=>`${client(s.clientId)} · ${s.id} · balance ${money(s.total-s.paid)}.`);if(type==='run-reminders')lines=db.bookings.filter(branchMatch).filter(b=>b.status==='Pending'||b.status==='Confirmed').sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`${b.date} ${b.time} · ${client(b.clientId)} · ${b.status}.`);if(type==='run-tasks')lines=db.tasks.filter(t=>t.status!=='Done'&&t.due<today()).map(t=>`${t.title} · due ${t.due} · ${userName(t.owner)}.`);const out=$('#automationOutput');out.innerHTML=panel('Automation check results',lines.length?`<ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:'<p class="muted">No matching records found.</p>');log('Ran automation check',type+' · '+lines.length+' result(s)');notify('Check completed: '+lines.length+' result(s).')}
function exportCSV(){const rows=[['Receipt','Date','Client','Items','Total','Paid','Balance','Method','Branch','Status'],...db.sales.filter(branchMatch).map(s=>[s.id,s.date,client(s.clientId),s.items.map(i=>i.name+' x'+i.qty).join('; '),s.total,s.paid,s.total-s.paid,s.method,s.branch,s.status])];download('studioflow-sales.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');log('Exported sales CSV','Sales rows: '+(rows.length-1))}
function backup(){download('studioflow-backup.json',JSON.stringify(db,null,2),'application/json');log('Exported backup','JSON backup downloaded')}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(){modal('Import JSON backup',`${field('Choose backup file','file','','file',null,true)}<p class="muted">Import replaces current local data. Export a backup first.</p>`,async f=>{const file=f.get('file');if(!file||!file.size){notify('Choose a JSON file.');return}try{const obj=JSON.parse(await file.text());if(!obj.settings||typeof obj.settings!=='object'||!Array.isArray(obj.settings.branches)||!['users','clients','services','products','bookings','sales','expenses','equipment','tasks','audit','integrations'].every(k=>Array.isArray(obj[k])))throw new Error('Invalid backup format');if(!confirm('Replace the current local database with this backup?'))return;db=obj;save();closeModal();shell();render();notify('Backup imported.')}catch(e){notify('Could not import: invalid or unreadable backup.')}},'Import backup')}
function wire(){const c=$('#content');c.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));const s=$('#searchBox');if(s)s.addEventListener('input',e=>{searchTerm=e.target.value;const pos=e.target.selectionStart;render();const next=$('#searchBox');if(next){next.focus();next.setSelectionRange(pos,pos)}});const sf=$('#statusFilter');if(sf)sf.onchange=e=>{filterStatus=e.target.value;render()};const ft=$('#filterToggle');if(ft)ft.onclick=()=>{filterOpen=!filterOpen;render()};const todayOnly=$('#todayOnly');if(todayOnly)todayOnly.onchange=()=>render();const logoFile=$('#logoFile');if(logoFile)logoFile.onchange=()=>{const file=logoFile.files[0];if(file){if(file.size>500000){notify('Please use a logo image under 500 KB.');return}const reader=new FileReader();reader.onload=()=>{$('#logoUrl').value=reader.result};reader.readAsDataURL(file)}}}
function action(a){if(a==='new-booking')return newBooking();if(a.startsWith('edit-booking:'))return newBooking(a.split(':')[1]);if(a==='new-client')return newClient();if(a.startsWith('edit-client:'))return newClient(a.split(':')[1]);if(a==='new-service')return newService();if(a.startsWith('edit-service:'))return newService(a.split(':')[1]);if(a==='new-product')return newProduct();if(a.startsWith('edit-product:'))return newProduct(a.split(':')[1]);if(a==='new-sale')return newSale();if(a.startsWith('receipt:'))return showReceipt(a.split(':')[1]);if(a.startsWith('payment:'))return payment(a.split(':')[1]);if(a==='new-equipment')return newEquipment();if(a.startsWith('edit-equipment:'))return newEquipment(a.split(':')[1]);if(a==='new-task')return newTask();if(a.startsWith('edit-task:'))return newTask(a.split(':')[1]);if(a.startsWith('task-toggle:')){const t=db.tasks.find(x=>x.id===a.split(':')[1]);if(t){t.status=t.status==='Done'?'Open':'Done';save();log('Changed task status',t.title+' · '+t.status);render()}return}if(a==='new-user')return newUser();if(a.startsWith('edit-user:'))return newUser(a.split(':')[1]);if(a==='new-rule')return newRule();if(a==='new-gallery')return newGallery();if(a==='scan-barcode')return scanBarcode();if(a==='save-settings')return saveSettings();if(a==='backup')return backup();if(a==='export-csv')return exportCSV();if(a==='import-backup')return importBackup();if(a==='reset-demo'){if(confirm('Reset all StudioFlow data in this browser to the original sample dataset?')){db=structuredClone(seed);save();filterBranch='All branches';log('Reset demo data','Seed data restored');shell();render();notify('Demo data restored.')}return}if(a==='filter-toggle'){filterOpen=!filterOpen;render();return}if(a==='reset-filters'){searchTerm='';filterStatus='All';filterOpen=false;render();return}if(a==='go-bookings')return go('bookings');if(a==='go-tasks')return go('tasks');if(a.startsWith('gallery-info:')){const g=galleryItems[Number(a.split(':')[1])];return modal(g.title,`<img src="${esc(g.url)}" alt="${esc(g.title)}" style="width:100%;max-height:300px;object-fit:cover;border-radius:7px"><p>${esc(g.description)}</p><p class="muted">${esc(g.kind)}</p>`,null)}if(a.startsWith('run-'))return runAutomation(a);notify('Action is not available.')}
function logout(){if(session)log('Logout',session.name+' signed out');session=null;page='dashboard';closeModal();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='F2'&&session){e.preventDefault();scanBarcode()}});
load();applyTheme();login();
})();
</script>
