function login(){ $('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="brand"><div class="logo">F</div><div><strong>Fieldwise</strong><small>Farm Management Information System</small></div></div><h1>Sign in to your farm</h1><p class="muted">Choose a demo role and enter its PIN to explore access levels.</p><form id="loginform"><div class="field"><label>User role</label><select name="user" required>${db.users.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc(u.role)}</option>`).join('')}</select></div><div class="field"><label>PIN</label><input name="pin" type="password" inputmode="numeric" placeholder="Enter PIN" required maxlength="12"></div><button class="primary" type="submit">Sign in</button></form><div class="notice" style="margin-top:16px;margin-bottom:0">Demo PINs: Admin 1234 · Supervisor 2345 · Worker 3456 · Finance 4567. This local prototype is not production authentication.</div></div></div>`;$('#loginform').addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target),u=db.users.find(x=>x.id===fd.get('user'));if(!u||u.pin!==fd.get('pin'))return toast('Incorrect PIN');db.loggedIn={id:u.id,name:u.name,role:u.role,branch:u.branch};db.settings.branch=u.branch;audit('Login',`${u.role} signed in`);save();render()})}
const navItems=[['dashboard','▦','Dashboard','Overview'],['crops','♧','Crop production','OPERATIONS'],['livestock','♢','Livestock & poultry',''],['inventory','▤','Inventory & tools',''],['sales','↗','Sales & receipts','BUSINESS'],['finance','＄','Finance',''],['workforce','♙','Workforce',''],['tasks','✓','Tasks & automation','INTELLIGENCE'],['reports','▥','Reports & analytics',''],['catalog','▧','Products & services',''],['settings','⚙','Settings & security','ADMINISTRATION']];
const titles={dashboard:['Farm overview','Your operations, output and costs in one workspace.'],crops:['Crop production','Track plots, planting, crop stages and harvest forecasts.'],livestock:['Livestock & poultry','Animal health, care schedules and daily production.'],inventory:['Inventory & tools','Manage inputs, supplies, equipment and barcode lookups.'],sales:['Sales & receipts','Record produce sales, payments and printable receipts.'],finance:['Farm finances','Review expenses, sales, outstanding payments and margin.'],workforce:['Workforce','Manage farm workers, roles and assigned work.'],tasks:['Tasks & automation','Task execution, reminders and rule-based alerts.'],reports:['Reports & analytics','Use recorded data to understand farm performance.'],catalog:['Products & services','Maintain products, equipment services and facilities.'],settings:['Settings & security','Farm identity, branches, theme, access levels and audit history.']};
function shell(){let nav=navItems.map(([k,ic,t,g])=>`${g?`<div class="navlabel">${g}</div>`:''}<button class="navbtn ${page===k?'active':''}" data-page="${k}"><span class="ico">${ic}</span><span>${t}</span></button>`).join('');return `<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo" id="sidebarlogo">${db.settings.logo?`<img src="${db.settings.logo}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`:'F'}</div><div><strong>${esc(db.settings.farmName)}</strong><small>Farm operations</small></div></div><nav class="navgroup">${nav}</nav><div class="sidebarbottom"><button data-page="settings" class="navbtn"><span class="ico">⚙</span> Settings</button><button id="logout" class="navbtn"><span class="ico">↪</span> Log out</button><div class="userline"><div class="avatar">${esc((db.loggedIn.name||'U').slice(0,1))}</div><div><strong>${esc(db.loggedIn.name)}</strong><div class="tiny muted">${esc(role())}</div></div></div></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="iconbtn mobilemenu" id="menubtn" aria-label="Open menu">☰</button><select id="branchselect" class="branchselect" aria-label="Select branch"><option value="all" ${filterBranch==='all'?'selected':''}>All branches</option>${db.branches.map(b=>`<option value="${b.id}" ${filterBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><span class="badge">DEMO DATA</span><span class="badge ${navigator.onLine?'green':'amber'}">${navigator.onLine?'Online':'Offline'}</span></div><div class="top-actions"><button id="syncbtn" class="desktoponly">↻ Sync status</button><button id="themebtn" class="iconbtn" title="Toggle light and dark theme">${db.settings.theme==='dark'?'☼':'◐'}</button><button id="logout2" class="desktoponly">Log out</button></div></header><section class="content" id="view"></section></main></div><nav class="mobile-nav">${[['dashboard','▦','Home'],['crops','♧','Crops'],['inventory','▤','Stock'],['sales','↗','Sales'],['tasks','✓','Tasks']].map(([k,i,t])=>`<button class="${page===k?'active':''}" data-page="${k}"><span class="ico">${i}</span>${t}</button>`).join('')}</nav>`}
function pageHead(k,actions=''){let t=titles[k]||['',''];return `<div class="pagehead"><div><h1>${t[0]}</h1><p>${t[1]}</p></div><div class="actions">${actions}</div></div>`}
function stat(label,value,icon,foot='From recorded data'){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function table(headers,rows,empty='No records found'){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty"><strong>${empty}</strong>Add a record or change your filters.</div>`}
function filters(categories=[],statuses=[]){return `<div class="filters"><div class="field search"><label>Search records</label><input id="searchbox" placeholder="Search name, code, customer…" value="${esc(search)}"></div>${categories.length?`<div class="field"><label>Category</label><select id="catfilter"><option>All</option>${categories.map(x=>`<option ${filterCategory===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`:''}${statuses.length?`<div class="field"><label>Status</label><select id="statusfilter"><option>All</option>${statuses.map(x=>`<option ${filterStatus===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`:''}<button id="filtertoggle" aria-expanded="${activeFilter}">☷ ${activeFilter?'Hide filters':'Filters'}</button><button id="clearfilters">Clear</button></div>${activeFilter?`<div class="notice">Branch scope: ${esc(filterBranch==='all'?'All branches':branchName(filterBranch))}. Use search, category and status above to narrow results.</div>`:''}`}
function dashboard(){let sales=visible(db.sales),expenses=visible(db.expenses),products=visible(db.products),crops=visible(db.crops),animals=visible(db.animals),tasks=visible(db.tasks);let revenue=sum(sales,'total'),cost=sum(expenses,'amount'),due=sum(sales,'total')-sum(sales,'paid'),low=products.filter(p=>p.qty<=p.min);let last7=Array.from({length:7},(_,i)=>shift(i-6));let vals=last7.map(d=>sum(sales.filter(s=>s.date===d),'total'));let max=Math.max(1,...vals);return `${pageHead('dashboard',`<button id="addtask">＋ New task</button><button class="primary" id="quickSale">＋ Record sale</button>`)}<div class="notice"><strong>Prototype with sample records.</strong> Replace the sample entries with your own farm data before relying on reports. ${navigator.onLine?'Local records are saved on this device. Connect a backend to share live data across devices.':'Offline mode: records can be entered and saved locally. Sync is not connected to a server.'} <strong>${esc(role())}</strong> access.</div><div class="grid stats">${stat('Recorded sales',money(revenue),'↗',`${sales.length} transactions in selected scope`)}${stat('Recorded expenses',money(cost),'＄',`${expenses.length} expense records`)}${stat('Outstanding payments',money(due),'◷','Sales less payments received')}${stat('Low-stock items',low.length,'▤',`${products.length} tracked stock items`)}</div><div class="grid cols2"><div class="card"><div class="sectionhead"><h2>Sales — last 7 days</h2><span class="badge">KES</span></div><div class="chart">${vals.map((v,i)=>`<div class="barcol"><span class="barval">${v?Math.round(v/1000*10)/10+'k':'0'}</span><div class="bar" style="height:${Math.max(3,v/max*100)}%"></div><span class="barlabel">${last7[i].slice(5)}</span></div>`).join('')}</div><p class="tiny muted">Values are calculated from saved sales records. No forecast data is included.</p></div><div class="card"><div class="sectionhead"><h2>Farm activity</h2><button class="small" data-page="tasks">View tasks</button></div><div class="activity">${tasks.filter(t=>t.status!=='Done').slice(0,4).map(t=>`<div class="activityrow"><span class="dot" style="background:${t.priority==='High'?'var(--red)':'var(--green)'}"></span><div style="flex:1"><strong>${esc(t.title)}</strong><div class="tiny muted">${esc(t.assigned)} · Due ${esc(t.due)}</div></div><span class="badge ${t.priority==='High'?'red':''}">${esc(t.priority)}</span></div>`).join('')||'<div class="empty">No open tasks.</div>'}</div></div></div><div class="card" style="margin-top:15px"><div class="sectionhead"><h2>Quick actions</h2><span class="muted tiny">Tap to open a working form</span></div><div class="quickgrid"><button class="quick" id="addcrop"><span class="qico">♧</span><span>Add crop</span></button><button class="quick" id="addanimal"><span class="qico">♢</span><span>Record livestock</span></button><button class="quick" id="addproduct"><span class="qico">▤</span><span>Add stock item</span></button><button class="quick" id="addexpense"><span class="qico">＄</span><span>Record expense</span></button></div></div><div class="grid cols2" style="margin-top:15px"><div class="card"><div class="sectionhead"><h2>Stock requiring attention</h2><button class="small" data-page="inventory">Open inventory</button></div>${table(['Item','On hand','Reorder at','Branch'],low.slice(0,5).map(p=>`<tr><td>${esc(p.name)}</td><td><span class="badge red">${p.qty} ${esc(p.unit)}</span></td><td>${p.min}</td><td>${esc(branchName(p.branch))}</td></tr>`),'All tracked items are above reorder level')}</div><div class="card"><div class="sectionhead"><h2>Production snapshot</h2><button class="small" data-page="livestock">View livestock</button></div>${animals.slice(0,4).map(a=>`<div class="securityline"><div><strong>${esc(a.name)}</strong><div class="tiny muted">${esc(a.type)} · ${a.count} head/birds</div></div><div style="text-align:right"><strong>${a.production} ${esc(a.unit)}</strong><div class="tiny muted">${esc(a.health)}</div></div></div>`).join('')||'<div class="empty">No livestock records yet.</div>'}</div></div>`}
function cropsPage(){let arr=visible(db.crops).filter(x=>(filterCategory==='All'||x.stage===filterCategory));return `${pageHead('crops',`<button id="addcrop" class="primary">＋ Add crop / plot</button>`)}${filters(['Growing','Flowering','Planted','Ready to harvest','Harvested'],[])}<div class="grid productgrid">${arr.map(c=>`<article class="product"><img src="${c.name.toLowerCase().includes('tomato')?images.tomato:images.field}" alt="Farm crop" loading="lazy"><div class="productbody"><strong>${esc(c.name)} — ${esc(c.plot)}</strong><div class="muted tiny">${c.area} ${esc(c.unit)} · Planted ${esc(c.planted)}</div><div class="productfoot"><span class="badge">${esc(c.stage)}</span><button class="small" data-edit="crop:${c.id}">Edit</button></div><div class="tiny muted" style="margin-top:8px">Expected harvest: ${esc(c.harvest||'Not set')}<br>${esc(c.notes||'No notes')}</div></div></article>`).join('')||'<div class="card empty">No crop records found.</div>'}</div>`}
function livestockPage(){let arr=visible(db.animals).filter(x=>(filterCategory==='All'||x.type===filterCategory)&&(filterStatus==='All'||x.health===filterStatus));return `${pageHead('livestock',`<button id="addanimal" class="primary">＋ Add animal / flock</button>`)}${filters(['Cattle','Poultry','Goats','Sheep','Pigs','Other'],['Healthy','Monitor','Treatment'])}<div class="grid cols2">${arr.map(a=>`<div class="card"><div class="imgrow"><img src="${a.type==='Poultry'?images.poultry:images.cows}" alt="${esc(a.type)}"><div style="flex:1"><h2 style="margin:0">${esc(a.name)}</h2><span class="muted tiny">${esc(a.type)} · ${esc(branchName(a.branch))}</span></div><button class="small" data-edit="animal:${a.id}">Edit</button></div><div class="grid cols3" style="margin-top:14px;gap:8px"><div><div class="muted tiny">Head / birds</div><strong>${a.count}</strong></div><div><div class="muted tiny">Daily output</div><strong>${a.production} ${esc(a.unit)}</strong></div><div><div class="muted tiny">Health</div><span class="badge ${a.health==='Healthy'?'green':a.health==='Monitor'?'amber':'red'}">${esc(a.health)}</span></div></div><div class="subtleline"></div><div class="tiny muted">Last care: ${esc(a.lastCare||'Not recorded')} · Next care: ${esc(a.nextCare||'Not scheduled')}</div></div>`).join('')||'<div class="card empty">No livestock records found.</div>'}</div>`}
function inventoryPage(){let arr=visible(db.products).filter(p=>(filterCategory==='All'||p.category===filterCategory)&&(filterStatus==='All'||(filterStatus==='Low stock'?p.qty<=p.min:p.category===filterStatus)));return `${pageHead('inventory',`<button id="scanopen">▦ Scan barcode</button><button id="addproduct" class="primary">＋ Add item</button>`)}${filters([...new Set(db.products.map(p=>p.category)),'Low stock'],[])}<div class="grid stats">${stat('Stock items',arr.length,'▤','Items in current filter')}${stat('Inventory cost value',money(sum(arr.map(p=>({v:p.qty*p.cost})),'v')),'＄','Quantity × recorded unit cost')}${stat('Potential sales value',money(sum(arr.map(p=>({v:p.qty*p.price})),'v')),'↗','Quantity × selling price')}${stat('Reorder alerts',arr.filter(p=>p.qty<=p.min).length,'!','At or below reorder level')}</div><div class="card"><div class="sectionhead"><h2>Inventory register</h2><button id="exportinventory" class="small">Export CSV</button></div>${table(['Item','SKU / barcode','Category','On hand','Unit cost','Sell price','Branch','Status','Actions'],arr.map(p=>`<tr><td><div class="imgrow"><img src="${esc(productImage(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='${images.tools}'"><div><strong>${esc(p.name)}</strong><div class="tiny muted">${esc(p.unit)}</div></div></div></td><td>${esc(p.sku)}<div class="tiny muted">${esc(p.barcode||'No barcode')}</div></td><td>${esc(p.category)}</td><td>${p.qty}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${esc(branchName(p.branch))}</td><td><span class="badge ${p.qty<=p.min?'red':'green'}">${p.qty<=p.min?'Reorder':'In stock'}</span></td><td><button class="small" data-adjust="${p.id}">Adjust</button> <button class="small" data-edit="product:${p.id}">Edit</button></td></tr>`),'No inventory items yet')}</div><div id="scannerarea"></div>`}
function salesPage(){let arr=visible(db.sales).filter(s=>filterStatus==='All'||(filterStatus==='Paid'?s.paid>=s.total:s.paid<s.total));return `${pageHead('sales',`<button id="quickSale" class="primary">＋ Record sale</button>`)}${filters([],['Paid','Part paid'])}<div class="card"><div class="sectionhead"><h2>Sales ledger</h2><button id="exportSales" class="small">Export CSV</button></div>${table(['Receipt','Date','Customer','Item','Qty','Total','Paid','Balance','Method','Branch','Actions'],arr.map(s=>`<tr><td><strong>${esc(s.receipt||s.id)}</strong></td><td>${esc(s.date)}</td><td>${esc(s.customer)}</td><td>${esc(s.item)}</td><td>${s.qty} ${esc(s.unit||'')}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(Math.max(0,s.total-s.paid))}</td><td>${esc(s.method)}</td><td>${esc(branchName(s.branch))}</td><td><button class="small" data-receipt="${s.id}">Receipt</button></td></tr>`),'No sales recorded yet')}</div>`}
function financePage(){if(!canFinance())return `${pageHead('finance')}<div class="notice warn">Finance records are restricted. Sign in as Admin or Finance Officer to access this module.</div>`;let sales=visible(db.sales),ex=visible(db.expenses);return `${pageHead('finance',`<button id="addexpense" class="primary">＋ Record expense</button>`)}<div class="grid stats">${stat('Sales recorded',money(sum(sales,'total')),'↗')}${stat('Expenses recorded',money(sum(ex,'amount')),'＄')}${stat('Net cash movement',money(sum(sales,'paid')-sum(ex,'amount')),'⇄','Payments received less recorded expenses')}${stat('Customer balances',money(sum(sales,'total')-sum(sales,'paid')),'◷','Not a full accounting profit figure')}</div><div class="card"><div class="sectionhead"><h2>Expense register</h2><button id="exportExpenses" class="small">Export CSV</button></div>${table(['Date','Category','Description','Amount','Branch','Action'],ex.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td>${esc(branchName(e.branch))}</td><td><button class="small" data-edit="expense:${e.id}">Edit</button></td></tr>`),'No expenses recorded')}</div><div class="card" style="margin-top:15px"><h2>Important accounting note</h2><p class="muted">This prototype tracks operational cash and recorded expenses. It is not a complete double-entry accounting ledger, tax engine, payroll calculation, or bank/M-Pesa reconciliation integration.</p></div>`}
function workforcePage(){return `${pageHead('workforce',`${canWrite()?'<button id="addworker" class="primary">＋ Add worker</button>':''}`)}<div class="card">${table(['Name','Role','Phone','Branch','Status','Actions'],visible(db.workers).map(w=>`<tr><td><strong>${esc(w.name)}</strong></td><td>${esc(w.role)}</td><td>${esc(w.phone||'Not set')}</td><td>${esc(branchName(w.branch))}</td><td><span class="badge green">${esc(w.status)}</span></td><td>${canManage()?`<button class="small" data-edit="worker:${w.id}">Edit</button>`:'—'}</td></tr>`),'No workers recorded')}</div><div class="notice" style="margin-top:14px">Access to tasks and financial records is controlled by the selected demo role. Real employee accounts require a server-backed identity system.</div>`}
function tasksPage(){let arr=visible(db.tasks).filter(t=>filterStatus==='All'||t.status===filterStatus);return `${pageHead('tasks',`<button id="addtask" class="primary">＋ Create task</button><button id="runrules">Run alert rules</button>`)}${filters([],['Pending','In progress','Done'])}<div class="grid cols2">${arr.map(t=>`<div class="card"><div class="sectionhead"><span class="badge ${t.status==='Done'?'green':t.priority==='High'?'red':'amber'}">${esc(t.status)} · ${esc(t.priority)}</span><button class="small" data-edit="task:${t.id}">Edit</button></div><h2>${esc(t.title)}</h2><div class="muted tiny">Assigned to ${esc(t.assigned)} · Due ${esc(t.due)}</div><div class="tiny muted" style="margin-top:8px">Branch: ${esc(branchName(t.branch))}</div><div class="actions" style="margin-top:13px"><button class="small" data-taskdone="${t.id}">${t.status==='Done'?'Reopen task':'Mark done'}</button></div></div>`).join('')||'<div class="card empty">No tasks match the filter.</div>'}</div><div class="card" style="margin-top:15px"><h2>Rule-based automations</h2><div class="securityline"><div><strong>Low-stock alert</strong><div class="muted tiny">Flags items at or below their reorder quantity.</div></div><span class="badge">${db.products.filter(p=>p.qty<=p.min).length} alert(s)</span></div><div class="securityline"><div><strong>Overdue task alert</strong><div class="muted tiny">Checks due dates and unfinished tasks.</div></div><span class="badge">${db.tasks.filter(t=>t.status!=='Done'&&t.due<today()).length} alert(s)</span></div><div class="securityline"><div><strong>Animal care due</strong><div class="muted tiny">Checks next-care dates in livestock records.</div></div><span class="badge">${db.animals.filter(a=>a.nextCare&&a.nextCare<=today()).length} alert(s)</span></div><p class="tiny muted">Rules run locally when requested; background notifications, autonomous purchasing and AI-generated decisions are not connected.</p></div>`}
function reportsPage(){let sales=visible(db.sales),ex=visible(db.expenses),products=visible(db.products),crops=visible(db.crops),animals=visible(db.animals);let totalOutput=animals.reduce((s,a)=>s+(Number(a.production)||0),0);return `${pageHead('reports',`<button id="printreport">Print report</button><button id="exportReport" class="primary">Download CSV summary</button>`)}<div class="grid stats">${stat('Sales value',money(sum(sales,'total')),'↗')}${stat('Recorded expenses',money(sum(ex,'amount')),'＄')}${stat('Recorded crops',crops.length,'♧')}${stat('Livestock units',sum(animals,'count'),'♢')}</div><div class="grid cols2"><div class="card"><h2>Sales by transaction</h2><div class="chart">${sales.slice(-7).map((s,i)=>`<div class="barcol"><span class="barval">${Math.round(s.total/100)/10}k</span><div class="bar ${i%2?'alt':''}" style="height:${Math.max(3,s.total/Math.max(1,...sales.map(x=>x.total))*100)}%"></div><span class="barlabel">${esc(s.date.slice(5))}</span></div>`).join('')||'<p class="muted">No sales data.</p>'}</div></div><div class="card"><h2>Production records</h2>${table(['Unit','Type','Count','Daily output'],animals.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${a.count}</td><td>${a.production} ${esc(a.unit)}</td></tr>`),'No production data')}</div></div><div class="card" style="margin-top:15px"><h2>Report definitions</h2><p class="muted">Reports summarize saved records only. Crop yield per acre, cost per litre/egg, mortality rate and profit by production unit require more detailed input-cost allocation and historical production entries than this first prototype currently captures.</p></div>`}

g><div class="muted tiny">${esc(s.category)} · ${esc(s.description)}</div><div class="productfoot"><strong>${money(s.price)} / ${esc(s.unit)}</strong><button class="small" data-edit="service:${s.id}">Edit</button></div></div></article>`).join('')||'<div class="card empty">No services.</div>'}</div>`}

function openForm(kind,record=null){if(!canWrite()&&!['task'].includes(kind)){toast('Your access level cannot create this record.');return}if(['branch','user','worker'].includes(kind)&&!canManage()){toast('Admin access required.');return}if(kind==='expense'&&!canFinance()){toast('Finance access required.');return}modalKind=kind;let defs=fields[kind];if(!defs)return;let html=defs.map(([key,label,type,reqOrOpts])=>{let required=typeof reqOrOpts==='boolean'?reqOrOpts:false,opts=Array.isArray(reqOrOpts)?reqOrOpts:null,val=record?.[key]??(key==='date'||key==='planted'?today():key==='branch'?currentBranch()==='all'?db.settings.branch:currentBranch():key==='min'?5:key==='qty'||key==='cost'||key==='price'||key==='total'||key==='paid'||key==='count'||key==='area'||key==='production'?0:key==='stage'?'Growing':key==='health'?'Healthy':key==='status'?'Pending':key==='priority'?'Normal':key==='method'?'M-Pesa':'');let input;if(type==='select')input=`<select name="${key}" ${required?'required':''}>${(opts||[]).map(o=>`<option ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='branch')input=`<select name="${key}">${db.branches.map(b=>`<option value="${b.id}" ${val===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`;else input=`<input name="${key}" type="${type}" value="${esc(val)}" ${required?'required':''} ${type==='number'?'step="any" min="0"':''} ${key==='barcode'?'inputmode="numeric"':''}>`;return `<div class="field ${['notes','description','image'].includes(key)?'span2':''}"><label>${label}${required?' *':''}</label>${input}</div>`}).join('');$('#modalroot').innerHTML=`<div class="modalback" id="backdrop"><div class="modal"><div class="modalhead"><h2>${record?'Edit':'Add'} ${kind==='crop'?'crop / plot':kind==='animal'?'animal / flock':kind==='product'?'inventory item':kind==='sale'?'sale':kind==='expense'?'expense':kind==='task'?'task':kind==='worker'?'worker':kind==='service'?'service / facility':kind}</h2><button id="closemodal" aria-label="Close">✕</button></div><form id="recordform"><div class="formgrid">${html}</div>${kind==='product'?'<div class="tiny muted">Barcode can be typed manually or scanned from Inventory using a supported device camera.</div>':''}<div class="modalactions"><button type="button" id="cancelmodal">Cancel</button><button class="primary" type="submit">${record?'Save changes':'Save record'}</button></div></form></div></div>`;$('#closemodal').onclick=closeModal;$('#cancelmodal').onclick=closeModal;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});$('#recordform').addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target),obj={};for(let [k,v] of fd.entries())obj[k]=['qty','min','cost','price','area','count','production','amount','total','paid'].includes(k)?Number(v):v;if(kind==='sale'){if(!obj.customer?.trim()||!obj.item?.trim())return toast('Enter a customer and item.');if(!Number.isFinite(obj.qty)||obj.qty<=0||!Number.isFinite(obj.total)||obj.total<0||!Number.isFinite(obj.paid)||obj.paid<0)return toast('Enter valid quantity and payment amounts.');if(obj.paid>obj.total)return toast('Payment received cannot exceed sale total.');const matchingProducts=db.products.filter(p=>p.name.trim().toLowerCase()===obj.item.trim().toLowerCase());const soldItem=matchingProducts.find(p=>p.branch===obj.branch);if(matchingProducts.length&&!soldItem)return toast('This product is not stocked at the selected branch. Select the correct branch or item.');if(soldItem&&soldItem.qty<obj.qty)return toast(`Insufficient stock for ${soldItem.name}. Available: ${soldItem.qty} ${soldItem.unit}.`);obj.receipt=record?.receipt||'REC-'+String(Date.now()).slice(-6);obj.id=record?.id||id();if(soldItem){soldItem.qty=Number(soldItem.qty)-Number(obj.qty);audit('Stock deducted for sale',`${soldItem.name}: -${obj.qty} ${soldItem.unit}`)}db.sales.unshift(obj);audit('Sale recorded',`${obj.receipt}: ${obj.item} — ${money(obj.total)}`);save();closeModal();receipt(obj.id);render();return}if(kind==='product'){if(['qty','min','cost','price'].some(k=>!Number.isFinite(obj[k])||obj[k]<0))return toast('Stock, reorder level, cost and selling price must be zero or greater.');if(obj.barcode&&db.products.some(p=>p.barcode===obj.barcode&&p.id!==record?.id))return toast('That barcode is already assigned to another item.');if(obj.sku&&db.products.some(p=>String(p.sku).toLowerCase()===String(obj.sku).toLowerCase()&&p.id!==record?.id))return toast('That SKU is already assigned to another item.');}if(kind==='expense'&&(!Number.isFinite(obj.amount)||obj.amount<0))return toast('Expense amount must be zero or greater.');if(record){Object.assign(record,obj);audit(`${kind} updated`,obj.name||obj.title||obj.description||kind)}else{obj.id=id();if(kind==='product'&&!obj.image)obj.image=images.tools;if(kind==='service'&&!obj.image)obj.image=images.tools;if(kind==='sale')obj.receipt='REC-'+String(Date.now()).slice(-6);db[collection(kind)].unshift(obj);audit(`${kind} created`,obj.name||obj.title||obj.description||kind)}save();closeModal();render();toast('Record saved on this device')})}

function adjustStock(pid){let p=db.products.find(x=>x.id===pid);if(!p)return;let value=prompt(`Adjust stock for ${p.name}. Enter signed quantity (e.g. 5 or -2):`,'0');if(value===null)return;let n=Number(value);if(!Number.isFinite(n)||!Number.isInteger(n)||p.qty+n<0)return toast('Enter a whole-number adjustment that does not make stock negative.');p.qty+=n;audit('Stock adjusted',`${p.name}: ${n>0?'+':''}${n}`);save();render();toast('Stock updated')}
function receipt(sid){let s=db.sales.find(x=>x.id===sid);if(!s)return;$('#modalroot').innerHTML=`<div class="modalback"><div class="modal" id="receiptpaper"><div class="modalhead"><h2>Sales receipt</h2><button id="closereceipt">✕</button></div><div style="text-align:center;padding:8px 0 15px"><h1>${esc(db.settings.farmName)}</h1><p class="muted">Farm sales receipt</p><strong>${esc(s.receipt||s.id)}</strong></div><div class="securityline"><span>Date</span><strong>${esc(s.date)}</strong></div><div class="securityline"><span>Customer</span><strong>${esc(s.customer)}</strong></div><div class="securityline"><span>Item</span><strong>${esc(s.item)}</strong></div><div class="securityline"><span>Quantity</span><strong>${s.qty} ${esc(s.unit||'')}</strong></div><div class="securityline"><span>Total</span><strong>${money(s.total)}</strong></div><div class="securityline"><span>Paid</span><strong>${money(s.paid)}</strong></div><div class="securityline"><span>Balance</span><strong>${money(Math.max(0,s.total-s.paid))}</strong></div><div class="securityline"><span>Payment method</span><strong>${esc(s.method)}</strong></div><p class="muted tiny" style="text-align:center;margin-top:20px">Thank you. Keep this receipt for your records.</p><div class="modalactions noprint"><button id="closereceipt2">Close</button><button class="primary" id="printreceipt">Print / Save PDF</button><button id="downloadreceipt">Download receipt</button></div></div></div>`;$('#closereceipt').onclick=closeModal;$('#closereceipt2').onclick=closeModal;$('#printreceipt').onclick=()=>window.print();$('#downloadreceipt').onclick=()=>{let text0=`${db.settings.farmName}\nSALES RECEIPT\nReceipt: ${s.receipt||s.id}\nDate: ${s.date}\nCustomer: ${s.customer}\nItem: ${s.item}\nQuantity: ${s.qty} ${s.unit||''}\nTotal: ${money(s.total)}\nPaid: ${money(s.paid)}\nBalance: ${money(Math.max(0,s.total-s.paid))}\nMethod: ${s.method}\nBranch: ${branchName(s.branch)}\n`;download(text0,`${s.receipt||'receipt'}.txt`,'text/plain')};}
function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(arr){if(!arr.length)return '';let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];return [keys.join(','),...arr.map(x=>keys.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(','))].join('\r\n')}
function exportCSV(name,arr){download(csv(arr),`fieldwise-${name}-${today()}.csv`,'text/csv;charset=utf-8');audit('CSV exported',name);toast('CSV export prepared')}

function exportReport(){let data=[{metric:'Sales total KES',value:sum(visible(db.sales),'total')},{metric:'Payments received KES',value:sum(visible(db.sales),'paid')},{metric:'Outstanding KES',value:sum(visible(db.sales),'total')-sum(visible(db.sales),'paid')},{metric:'Expenses KES',value:sum(visible(db.expenses),'amount')},{metric:'Crop records',value:visible(db.crops).length},{metric:'Livestock count',value:sum(visible(db.animals),'count')}];exportCSV('report-summary',data)}
function restoreAll(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj.settings||!Array.isArray(obj.products)||!Array.isArray(obj.sales))throw Error('This does not look like a Fieldwise backup.');if(confirm('Replace current local records with the imported backup?')){db=obj;db.loggedIn={id:'u1',name:'Farm Admin',role:'Admin',branch:db.settings.branch||'main'};save();render();toast('Backup imported')}}catch(err){toast('Import failed: '+err.message)}e.target.value=''};r.readAsText(f)}
function saveSettings(e){e.preventDefault();let fd=new FormData(e.target);db.settings.farmName=fd.get('farmName');db.settings.mode=fd.get('mode');let file=fd.get('logoFile');if(file&&file.size){if(file.size>900000){toast('Choose a logo under 900 KB.');return}let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();audit('Farm settings updated','Name, mode and logo');render()};r.readAsDataURL(file)}else{save();audit('Farm settings updated','Name and operating model');render()}}
function runRules(){let alerts=[];db.products.filter(p=>p.qty<=p.min).forEach(p=>alerts.push(`Low stock: ${p.name} (${p.qty} ${p.unit} left)`));db.tasks.filter(t=>t.status!=='Done'&&t.due<today()).forEach(t=>alerts.push(`Overdue task: ${t.title}`));db.animals.filter(a=>a.nextCare&&a.nextCare<=today()).forEach(a=>alerts.push(`Animal care due: ${a.name}`));audit('Automation rules run',`${alerts.length} alert(s) generated`);save();alert(alerts.length?alerts.join('\n'):'No current rule alerts.');render()}
async function scanner(){let host=$('#scannerarea');if(!host)return;host.innerHTML=`<div class="card scannerbox"><div class="sectionhead"><h2>Barcode scanner</h2><button id="closescan">Close</button></div><p class="muted tiny">Barcode scanning is processed on-device when the browser supports BarcodeDetector. A camera needs permission. Manual lookup works offline in all supported browsers.</p><div class="field"><label>Enter or scan barcode</label><input id="barcodeinput" placeholder="Type barcode and press Enter"></div><div class="actions"><button id="lookupbarcode" class="primary">Find item</button><button id="startcamera">Use camera</button></div><div id="camerahost"></div><div id="scanresult"></div></div>`;$('#closescan').onclick=()=>{stopScanner();host.innerHTML=''};const lookup=()=>{let code=$('#barcodeinput').value.trim(),p=db.products.find(x=>x.barcode===code||x.sku.toLowerCase()===code.toLowerCase());$('#scanresult').innerHTML=p?`<div class="notice" style="margin-top:10px"><strong>${esc(p.name)}</strong><br>On hand: ${p.qty} ${esc(p.unit)} · Reorder at ${p.min}<br>Branch: ${esc(branchName(p.branch))}<br><button class="small" id="adjustfound">Adjust stock</button> <button class="small" id="editfound">Edit item</button></div>`:`<div class="notice warn" style="margin-top:10px">No matching item. Check the code or add the item with this barcode.</div>`;$('#adjustfound')?.addEventListener('click',()=>adjustStock(p.id));$('#editfound')?.addEventListener('click',()=>openForm('product',p))};$('#lookupbarcode').onclick=lookup;$('#barcodeinput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();lookup()}};$('#startcamera').onclick=async()=>{let c=$('#camerahost');if(!('BarcodeDetector'in window)){c.innerHTML='<p class="notice warn">This browser does not expose BarcodeDetector. Use a compatible browser or enter the barcode manually. No external scanner library is loaded.</p>';return}try{let detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});c.innerHTML='<video id="scanvideo" autoplay playsinline muted></video><p class="tiny muted">Point the camera at a barcode. Keep the device steady.</p>';$('#scanvideo').srcObject=scanStream;let video=$('#scanvideo');let loop=async()=>{if(!scanStream||!video.isConnected)return;try{let codes=await detector.detect(video);if(codes.length){$('#barcodeinput').value=codes[0].rawValue;lookup();stopScanner();return}}catch(e){}requestAnimationFrame(loop)};video.onloadedmetadata=()=>requestAnimationFrame(loop)}catch(e){c.innerHTML='<p class="notice warn">Camera unavailable or permission denied. Use manual barcode entry.</p>'}}}
function stopScanner(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
window.addEventListener('online',()=>{document.querySelector('.topbar .badge')?.classList.replace('amber','green');toast('Connection restored. Local records remain on this device.')});window.addEventListener('offline',()=>toast('Offline mode. Changes are saved locally.'));
load();if(db.loggedIn){db.loggedIn=null}login();
})();
</script></body></html>
