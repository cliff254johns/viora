      if (!business || !business.items) return;
      const uniqueMap = new Map();

    }

    function enforceCleanBusiness() {
      let usafi = businesses.find(b => b.name === "Usafi Cleaning (Main)");
      if (!usafi) {
        usafi = { id: 1745000000001, name: "Usafi Cleaning (Main)", phone: "0746332443", address: "Meru Town", items: [] };
        businesses.push(usafi);
      }
      usafi.items = buildCleanPriceList();
      deduplicateBusinessItems(usafi);
      deduplicateAllBusinesses();
      saveAll();
    }

    function sanitizeOrders() {
      orders = orders.map(o => { if(!o.status) o.status='pending'; if(!o.createdAt) o.createdAt=new Date().toLocaleString(); return o; });
      saveAll();
    }

    function renderCategoryFilters() {
      const grid = document.getElementById('categoryFilterGrid');
      let html = `<div class="filter-chip ${!window.activeCategoryFilter ? 'active' : ''}" data-category="">All</div>`;
      categories.forEach(cat => { html += `<div class="filter-chip ${window.activeCategoryFilter === cat ? 'active' : ''}" data-category="${cat}">${cat}</div>`; });
      grid.innerHTML = html;
      document.querySelectorAll('.filter-chip').forEach(chip => chip.addEventListener('click', ()=>{
        window.activeCategoryFilter = chip.dataset.category || '';
        renderCategoryFilters();
        renderCustomerItems();
      }));
    }

    function renderCustomerItems() {
      let allItems = [];
      businesses.forEach(b => { if(b.items) b.items.forEach(item => allItems.push({...item, businessName: b.name})); });
      
      // STRONG DEDUPLICATION: by name+price+business (case-insensitive)
      const uniqueMap = new Map();
      for (const item of allItems) {
        const key = `${item.name.trim().toLowerCase()}|${item.price}|${item.businessName}`;
        if (!uniqueMap.has(key)) uniqueMap.set(key, item);
      }
      let filtered = Array.from(uniqueMap.values());
      
      const term = (document.getElementById('customerSearch')?.value || '').toLowerCase();
      if (term) filtered = filtered.filter(i => i.name.toLowerCase().includes(term));
      if (window.activeCategoryFilter) filtered = filtered.filter(i => i.category === window.activeCategoryFilter);
      
      const sort = document.getElementById('priceSort')?.value;
      if(sort==='low-high') filtered.sort((a,b)=>a.price-b.price);
      if(sort==='high-low') filtered.sort((a,b)=>b.price-a.price);
      
      const container = document.getElementById('customerItemsContainer');
      if(filtered.length === 0) { container.innerHTML = '<div style="text-align:center;padding:50px;font-size:1.2rem;">✨ No services found</div>'; return; }
      container.innerHTML = filtered.map(item => `
        <div class="item-card">
          <img class="card-img" src="${item.image || defaultImages.general}" onerror="this.src='${defaultImages.general}'">
          <div class="card-body">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="business-name"><i class="fas fa-store"></i> ${escapeHtml(item.businessName)}</div>
            <div class="item-price">KSh ${item.price}</div>
            <button class="add-to-cart-btn" data-name="${escapeHtml(item.name)}" data-price="${item.price}" data-business="${escapeHtml(item.businessName)}"><i class="fas fa-cart-plus"></i> Add to Cart</button>
          </div>
        </div>`).join('');
      attachCartEvents();
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function attachCartEvents() {
      document.querySelectorAll('.add-to-cart-btn').forEach(btn => btn.addEventListener('click', (e)=>{
        const name = btn.dataset.name, price = parseInt(btn.dataset.price), business = btn.dataset.business;
        const existing = cart.find(i => i.item === name && i.business === business);
        existing ? existing.quantity++ : cart.push({ item: name, price, business, quantity:1 });
        updateCartUI();
        btn.innerHTML = '<i class="fas fa-check"></i> Added!';
        setTimeout(()=> btn.innerHTML = '<i class="fas fa-cart-plus"></i> Add to Cart', 1000);
      }));
    }

    function updateCartUI() { document.getElementById('cartItemCount').innerText = cart.reduce((s,i)=>s+i.quantity,0); }

    function showCartModal() {
      if(!cart.length) return alert("Cart empty");
      const modal = document.createElement('div'); modal.className='modal'; modal.style.display='flex';
      const subtotal = cart.reduce((s,i)=>s+(i.price*i.quantity),0);
      const cartItemsHtml = cart.map((item, idx) => `
        <div class="cart-item-row">
          <span><strong>${item.quantity}x</strong> ${item.item} (${item.business}) - KSh ${item.price * item.quantity}</span>
          <i class="fas fa-trash-alt remove-cart-item" data-index="${idx}" style="cursor:pointer; color:#dc3545;"></i>
        </div>
      `).join('');
      modal.innerHTML = `
        <div class="modal-card">
          <h3 style="font-size:1.6rem;">🧺 Your Order</h3>
          <div id="cartItemsList">${cartItemsHtml}</div>
          <hr style="margin:16px 0;">
          <div class="form-group"><input id="custNameCart" placeholder="Full Name" style="font-size:1rem;"></div>
          <div class="form-group"><input id="custPhoneCart" placeholder="Phone" style="font-size:1rem;"></div>
          <div class="form-group"><input id="custAddressCart" placeholder="Pickup Address" style="font-size:1rem;"></div>
          <p style="font-size:1.2rem; font-weight:bold;">Total: KSh ${subtotal}</p>
          <button id="confirmCartOrder" class="btn-sm">Confirm Order</button>
          <button id="closeCartModal" class="btn-sm btn-outline">Cancel</button>
        </div>`;
      document.body.appendChild(modal);
      document.querySelectorAll('.remove-cart-item').forEach(icon => {
        icon.addEventListener('click', (e) => {
          const index = parseInt(icon.dataset.index);
          cart.splice(index, 1);
          updateCartUI();
          modal.remove();
          if (cart.length > 0) showCartModal();
        });
      });
      document.getElementById('confirmCartOrder').onclick = ()=>{
        const name = document.getElementById('custNameCart').value, phone = document.getElementById('custPhoneCart').value, addr = document.getElementById('custAddressCart').value;
        if(!name||!phone||!addr) return alert("Fill all fields");
        const orderItems = cart.map(c=>({ itemName: c.item, quantity: c.quantity, price: c.price, business: c.business }));
        const newOrder = { id: Date.now(), customerName: name, customerPhone: phone, customerAddress: addr, items: orderItems, mealSubtotal: subtotal, commission: Math.floor(subtotal*COMMISSION_RATE), totalPaid: subtotal, status: 'pending', createdAt: new Date().toLocaleString() };
        orders.unshift(newOrder);
        saveAll();
        window.open(`https://wa.me/${SUPPORT_WA}?text=🆕 ORDER #${newOrder.id} by ${name}. Total KSh ${subtotal}. Address: ${addr}`, '_blank');
        alert(`✅ Order placed! ID: #${newOrder.id}`);
        cart = []; updateCartUI(); modal.remove(); renderAdminAllOrders();
      };
      document.getElementById('closeCartModal').onclick = ()=>modal.remove();
    }

    function renderAdminAllOrders() {
      const pane = document.getElementById('adminAllOrders');
      if(!pane) return;
      pane.innerHTML = orders.length ? `<h3 style="font-size:1.4rem;">📦 All Orders</h3><table><thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${orders.map(o=>`<tr><td>#${o.id}</td><td>${o.customerName}<br><small>${o.customerPhone}</small></td><td>${o.items.map(i=>`${i.quantity}x ${i.itemName}`).join(', ')}</td><td>KSh ${o.mealSubtotal}</td><td><span class="badge-${o.status==='delivered'?'success':'warning'}">${o.status}</span></td><td><button class="btn-sm mark-delivered" data-id="${o.id}">✅ Deliver</button> <button class="btn-sm btn-danger delete-order" data-id="${o.id}">🗑</button></td></tr>`).join('')}</tbody></table>` : '<p>No orders</p>';
      document.querySelectorAll('.mark-delivered').forEach(b=>b.addEventListener('click',()=>{ const o=orders.find(o=>o.id==b.dataset.id); if(o){o.status='delivered'; saveAll(); renderAdminAllOrders();} }));
      document.querySelectorAll('.delete-order').forEach(b=>b.addEventListener('click',()=>{ if(confirm('Delete?')){ orders=orders.filter(o=>o.id!=b.dataset.id); saveAll(); renderAdminAllOrders();} }));
    }

    function renderAdminItemManager() {
      const c=document.getElementById('adminItemManager');
      c.innerHTML=`<h3 style="font-size:1.4rem;">🧼 Manage Services (Zero Duplicates)</h3><div id="itemsListAdmin"></div><hr style="margin:20px 0;"><h4>Add Service</h4><div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;"><input id="newItemName" placeholder="Name" style="flex:2; padding:12px;"><input id="newItemPrice" placeholder="Price" type="number" style="flex:1;"><select id="newItemCategory" style="flex:1;">${categories.map(cat=>`<option>${cat}</option>`).join('')}</select><button id="addItemBtn" class="btn-sm">Add</button></div><div id="duplicateWarning" class="duplicate-warning"></div>`;
      const biz = businesses.find(b=>b.name==="Usafi Cleaning (Main)") || businesses[0];
      const list=document.getElementById('itemsListAdmin');
      const renderList=()=>{ if(biz.items) list.innerHTML=biz.items.map((it,idx)=>`<div style="background:#f2efe9;border-radius:24px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;"><span><strong style="font-size:1.1rem;">${escapeHtml(it.name)}</strong> - KSh ${it.price} (${it.category})</span><span><button class="btn-sm edit-item" data-idx="${idx}">Edit</button> <button class="btn-sm btn-danger delete-item" data-idx="${idx}">Del</button></span></div>`).join(''); else list.innerHTML='<p>No services</p>'; };
      renderList();
      document.getElementById('addItemBtn').onclick=()=>{
        const n=document.getElementById('newItemName').value.trim(), p=parseInt(document.getElementById('newItemPrice').value), cat=document.getElementById('newItemCategory').value;
        if(n&&p){
          if(biz.items.some(it => it.name.toLowerCase()===n.toLowerCase() && it.price===p)) { document.getElementById('duplicateWarning').innerText='⚠️ Duplicate service! Same name and price exists.'; setTimeout(()=>document.getElementById('duplicateWarning').innerText='',2000); return; }
          biz.items.push({name:n, price:p, category:cat, image:defaultImages.general});
          deduplicateBusinessItems(biz); saveAll(); renderList(); renderCustomerItems(); renderCategoryFilters();
        }
      };
      document.querySelectorAll('.edit-item').forEach(btn=>btn.addEventListener('click',()=>{ const it=biz.items[btn.dataset.idx]; const nn=prompt('Name',it.name); const np=prompt('Price',it.price); const nc=prompt('Category',it.category); if(nn&&np&&nc){ if(biz.items.some((item,idx)=> idx!=btn.dataset.idx && item.name.toLowerCase()===nn.toLowerCase() && item.price===parseInt(np))){ alert('Duplicate not allowed'); return; } it.name=nn; it.price=parseInt(np); it.category=nc; deduplicateBusinessItems(biz); saveAll(); renderList(); renderCustomerItems(); renderCategoryFilters(); } }));
      document.querySelectorAll('.delete-item').forEach(btn=>btn.addEventListener('click',()=>{ if(confirm('Delete?')){ biz.items.splice(btn.dataset.idx,1); deduplicateBusinessItems(biz); saveAll(); renderList(); renderCustomerItems(); renderCategoryFilters(); } }));
    }

    function resetUsafiItems() {
      const biz = businesses.find(b=>b.name==="Usafi Cleaning (Main)") || businesses[0];
      if(biz) { biz.items = buildCleanPriceList(); deduplicateBusinessItems(biz); saveAll(); renderAll(); alert("✅ Reset to clean, deduplicated price list. No duplicates anywhere."); }
    }

    function updateAdminStats() {
      const totalCom = orders.filter(o=>o.status==='delivered').reduce((s,o)=>s+(o.commission||0),0);
      document.getElementById('adminStatsOverview').innerHTML = `<div class="stat-card"><h3>💰 Commission</h3><div class="value">KSh ${totalCom}</div></div><div class="stat-card"><h3>📦 Delivered</h3><div class="value">${orders.filter(o=>o.status==='delivered').length}</div></div>`;
    }

    function renderAll() {
      renderCategoryFilters();
      renderCustomerItems();
      updateAdminStats();
      if(document.getElementById('adminAllOrders')) renderAdminAllOrders();
    }

    // INIT
    enforceCleanBusiness();
    deduplicateAllBusinesses();
    sanitizeOrders();
    renderAll();

    document.getElementById('priceSort')?.addEventListener('change', renderCustomerItems);
    document.getElementById('customerSearch')?.addEventListener('input', renderCustomerItems);
    document.getElementById('trackOrderBtn')?.addEventListener('click', ()=>{
      const id = document.getElementById('trackOrderId').value;
      const order = orders.find(o=>o.id==id);
      const res = document.getElementById('trackResult');
      if(!order) res.innerHTML='<p>❌ Not found</p>';
      else { const steps=['pending','processing','delivered']; const cur=steps.indexOf(order.status); res.innerHTML = `<div class="track-progress">${steps.map((s,i)=>`<div class="progress-step"><span class="${i<=cur?'badge-success':'badge-warning'}">${s.toUpperCase()}</span></div>`).join('')}</div><p>Status: ${order.status} | Total: KSh ${order.totalPaid}</p>`; }
    });
    document.getElementById('cartIcon').addEventListener('click', showCartModal);
    document.getElementById('secretAdminTrigger').onclick = ()=>document.getElementById('adminModal').style.display='flex';
    document.getElementById('closeAdminModal').onclick = ()=>document.getElementById('adminModal').style.display='none';
    document.getElementById('verifyAdminBtn').onclick = ()=>{
      if(document.getElementById('adminPassword').value==='laundry2025'){
        document.getElementById('adminModal').style.display='none';
        document.getElementById('adminDashboardPanel').style.display='flex';
        renderAdminAllOrders(); renderAdminItemManager(); updateAdminStats();
      } else alert('Wrong password');
    };
    document.getElementById('closeAdminPanel').onclick = ()=>document.getElementById('adminDashboardPanel').style.display='none';
    document.getElementById('resetToFullPriceListBtn').addEventListener('click', resetUsafiItems);
    document.querySelectorAll('.admin-subtab').forEach(t=>t.addEventListener('click', ()=>{
      document.querySelectorAll('.admin-subtab').forEach(s=>s.classList.remove('active'));
      t.classList.add('active');
      const map = { 'all-orders':'adminAllOrders', 'item-manager':'adminItemManager' };
      document.querySelectorAll('.admin-pane').forEach(p=>p.classList.remove('active-admin-pane'));
      document.getElementById(map[t.dataset.admin]).classList.add('active-admin-pane');
    }));
  })();
</script>
</body>
</html>
