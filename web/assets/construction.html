<title>SiteCredit — Hardware Trade Operations</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --sidebar-bg:#0f172a; --sidebar-text:#e2e8f0; --sidebar-hover:#1e293b; --sidebar-active:#334155;
  --bg:#f1f5f9; --card-bg:#fff; --text:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --border:#e2e8f0; --primary:#3b82f6; --primary-dark:#2563eb; --success:#10b981;
  --warning:#f59e0b; --danger:#ef4444; --info:#06b6d4;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -2px rgba(0,0,0,.04);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sidebar-width:260px; --header-height:64px; --transition:.2s ease;
  --chart-1:#3b82f6; --chart-2:#10b981; --chart-3:#f59e0b; --chart-4:#ef4444; --chart-5:#8b5cf6; --chart-6:#06b6d4;
}
[data-theme="dark"] {
  --bg:#0f172a; --card-bg:#1e293b; --text:#f1f5f9; --text-secondary:#cbd5e1; --text-muted:#64748b;
  --border:#334155; --sidebar-bg:#020617; --sidebar-text:#cbd5e1; --sidebar-hover:#1e293b; --sidebar-active:#334155;
}
body {
  font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5;
  -webkit-font-smoothing: antialiased; transition: background .2s,color .2s; overflow-x: hidden;
}
.app-container { display: flex; min-height: 100vh; position: relative; }
/* SIDEBAR */
.sidebar {
  width: var(--sidebar-width); background: var(--sidebar-bg); color: var(--sidebar-text);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100; transition: transform .2s; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
.sidebar.collapsed { width: 72px; }
.sidebar.collapsed .sidebar-label,.sidebar.collapsed .sidebar-brand-text,.sidebar.collapsed .sidebar-footer-text,.sidebar.collapsed .sidebar-section { display: none; }
.sidebar.collapsed .sidebar-item { justify-content: center; padding: 12px; }
.sidebar.collapsed .sidebar-item .sidebar-icon { margin-right: 0; }
.sidebar-brand {
  display: flex; align-items: center; padding: 16px 20px; height: var(--header-height);
  border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
}
.sidebar-brand-icon {
  width: 36px; height: 36px; background: var(--primary); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; color: #fff;
  font-weight: 700; font-size: 18px; margin-right: 12px; flex-shrink: 0; overflow: hidden;
}
.sidebar-brand-icon img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-brand-text { font-weight: 700; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; }
.sidebar-brand-text span { color: #60a5fa; }
.sidebar-nav { flex: 1; padding: 12px 8px; }
.sidebar-section {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-muted); padding: 16px 16px 6px; font-weight: 600;
  white-space: nowrap; overflow: hidden;
}
.sidebar-item {
  display: flex; align-items: center; padding: 10px 16px; border-radius: var(--radius-sm);
  cursor: pointer; color: var(--sidebar-text); transition: background .15s;
  font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden;
  margin-bottom: 2px; user-select: none;
}
.sidebar-item:hover { background: var(--sidebar-hover); }
.sidebar-item.active { background: var(--sidebar-active); color: #fff; }
.sidebar-icon {
  width: 20px; height: 20px; margin-right: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: .8;
}
.sidebar-icon svg { width: 100%; height: 100%; }
.sidebar-footer {
  padding: 16px; border-top: 1px solid rgba(255,255,255,.06);
  font-size: 12px; color: var(--text-muted); flex-shrink: 0;
}
/* MAIN */
.main-wrapper {
  flex: 1; margin-left: var(--sidebar-width); transition: margin-left .2s;
  display: flex; flex-direction: column; min-height: 100vh;
}
.sidebar.collapsed ~ .main-wrapper { margin-left: 72px; }
.app-header {
  height: var(--header-height); background: var(--card-bg);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 20px; gap: 12px; position: sticky; top: 0; z-index: 50;
  padding-top: env(safe-area-inset-top);
}
.header-menu-btn {
  display: none; background: none; border: none; color: var(--text);
  cursor: pointer; padding: 8px; border-radius: var(--radius-sm);
}
.header-menu-btn:hover { background: var(--bg); }
.header-search { flex: 1; max-width: 480px; position: relative; }
.header-search input {
  width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
  font-size: 14px; outline: none;
}
.header-search .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-muted); pointer-events: none;
}
.header-search .search-kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: var(--text-muted); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; pointer-events: none;
}
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.header-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: none; border: 1px solid transparent; color: var(--text-secondary);
  cursor: pointer; position: relative;
}
.header-btn:hover { background: var(--bg); color: var(--text); }
.header-btn svg { width: 18px; height: 18px; }
.header-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent;
}
.header-avatar:hover { border-color: var(--primary); }
.offline-badge {
  display: none; align-items: center; gap: 4px; font-size: 11px;
  padding: 4px 8px; border-radius: 20px; background: var(--warning);
  color: #000; font-weight: 600;
}
.offline-badge.visible { display: flex; }
.content-area { flex: 1; padding: 24px; max-width: 1400px; width: 100%; margin: 0 auto; }
.page-view { display: none; animation: fadeIn .25s; }
.page-view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
/* COMPONENTS */
.card {
  background: var(--card-bg); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  padding: 20px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.card-title { font-size: 16px; font-weight: 600; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2,1fr); }
.grid-3 { grid-template-columns: repeat(3,1fr); }
.grid-4 { grid-template-columns: repeat(4,1fr); }
.kpi-card {
  background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border);
  padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
}
.kpi-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.kpi-sub { font-size: 12px; color: var(--text-muted); }
.kpi-danger .kpi-value { color: var(--danger); }
.kpi-warning .kpi-value { color: var(--warning); }
.kpi-success .kpi-value { color: var(--success); }
/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
  cursor: pointer; border: 1px solid transparent; transition: all .15s;
  white-space: nowrap; user-select: none; font-family: var(--font);
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-warning { background: var(--warning); color: #000; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: none; }
.btn-ghost:hover { background: var(--bg); color: var(--text); }
.btn-block { width: 100%; }
/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .03em;
}
.badge-success { background: #d1fae5; color: #065f46; }
.badge-warning { background: #fef3c7; color: #92400e; }
.badge-danger { background: #fee2e2; color: #991b1b; }
.badge-info { background: #cffafe; color: #155e75; }
.badge-neutral { background: var(--bg); color: var(--text-secondary); }
[data-theme="dark"] .badge-success { background: #064e3b; color: #6ee7b7; }
[data-theme="dark"] .badge-warning { background: #78350f; color: #fcd34d; }
[data-theme="dark"] .badge-danger { background: #7f1d1d; color: #fca5a5; }
[data-theme="dark"] .badge-info { background: #164e63; color: #67e8f9; }
/* Tables */
.table-wrapper { overflow-x: auto; border-radius: var(--radius-sm); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
  border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--card-bg);
}
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg); }
/* Forms */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-secondary); }
.form-label .required { color: var(--danger); }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--font);
  outline: none; transition: border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); }
.form-input.error, .form-select.error { border-color: var(--danger); }
.form-error { font-size: 12px; color: var(--danger); margin-top: 4px; display: none; }
.form-error.visible { display: block; }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 16px;
  backdrop-filter: blur(2px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column;
  animation: modalIn .2s;
}
.modal.modal-lg { max-width: 800px; }
.modal.modal-xl { max-width: 1000px; }
@keyframes modalIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  font-size: 22px; line-height: 1; width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 16px 20px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; flex-wrap: wrap;
}
/* Toast */
.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  padding-bottom: env(safe-area-inset-bottom);
}
.toast {
  background: var(--card-bg); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500;
  animation: toastIn .25s; pointer-events: auto; max-width: 360px;
}
.toast-success { border-left: 4px solid var(--success); }
.toast-error { border-left: 4px solid var(--danger); }
.toast-warning { border-left: 4px solid var(--warning); }
.toast-info { border-left: 4px solid var(--info); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
/* Empty */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state p { font-size: 14px; }
/* Command palette */
.command-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 250;
  display: none; align-items: flex-start; justify-content: center;
  padding-top: 15vh; backdrop-filter: blur(2px);
}
.command-overlay.open { display: flex; }
.command-palette {
  background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 60vh; display: flex; flex-direction: column;
  overflow: hidden; animation: modalIn .15s;
}
.command-input {
  width: 100%; padding: 16px 20px; border: none; background: transparent;
  color: var(--text); font-size: 16px; outline: none; font-family: var(--font);
  border-bottom: 1px solid var(--border);
}
.command-results { overflow-y: auto; flex: 1; padding: 8px; }
.command-item {
  padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: center; gap: 10px; font-size: 14px;
}
.command-item:hover, .command-item.selected { background: var(--bg); }
.command-item .cmd-type {
  font-size: 10px; text-transform: uppercase; color: var(--text-muted);
  font-weight: 600; margin-left: auto;
}
/* Tour */
.tour-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 400; display: none; }
.tour-overlay.open { display: block; }
.tour-tooltip {
  position: fixed; z-index: 401; background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 20px; max-width: 340px; border: 1px solid var(--border);
}
.tour-tooltip h3 { font-size: 16px; margin-bottom: 8px; }
.tour-tooltip p { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.6; }
.tour-tooltip .tour-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour-tooltip .tour-step { font-size: 12px; color: var(--text-muted); }
.tour-highlight {
  position: fixed; z-index: 399; border: 3px solid var(--primary); border-radius: var(--radius);
  box-shadow: 0 0 0 9999px rgba(0,0,0,.6); pointer-events: none; transition: all .3s;
}
/* Bottom nav */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card-bg); border-top: 1px solid var(--border); z-index: 90;
  padding: 4px 0 env(safe-area-inset-bottom,4px);
}
.bottom-nav-inner { display: flex; align-items: center; justify-content: space-around; }
.bottom-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px; flex: 1; cursor: pointer; color: var(--text-muted);
  font-size: 10px; font-weight: 500; border: none; background: none;
  transition: color .15s;
}
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item svg { width: 22px; height: 22px; }
/* Mobile more menu */
.mobile-more-menu {
  position: fixed; inset: 0; background: var(--bg); z-index: 95;
  display: none; flex-direction: column; padding: 16px; overflow-y: auto;
  padding-top: calc(16px + env(safe-area-inset-top));
}
.mobile-more-menu.open { display: flex; }
.mobile-more-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding: 8px 0;
}
.mobile-more-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.mobile-more-tile {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px;
  background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border);
  cursor: pointer; text-align: center; font-size: 12px; font-weight: 500;
}
.mobile-more-tile:hover { background: var(--bg); }
.mobile-more-tile svg { width: 24px; height: 24px; color: var(--primary); }
/* Chart styles */
.chart-svg { width: 100%; height: auto; display: block; }
.chart-tooltip {
  position: fixed; background: var(--text); color: var(--card-bg);
  padding: 6px 10px; border-radius: 6px; font-size: 12px; pointer-events: none;
  z-index: 300; opacity: 0; transition: opacity .15s; white-space: nowrap;
}
.chart-tooltip.visible { opacity: 1; }
.donut-center-text { font-family: var(--font); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
/* Image styling */
.product-thumb {
  width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--border);
  display: block; flex-shrink: 0;
}
.product-cell { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.customer-avatar {
  width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; color: #fff; font-size: 14px; flex-shrink: 0;
}
.card-hero {
  width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-sm);
  display: block; margin-bottom: 12px; background: var(--border);
}
.tile-icon-lg {
  width: 48px; height: 48px; border-radius: 12px; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary); flex-shrink: 0;
}
.tile-icon-lg svg { width: 24px; height: 24px; }
/* Responsive */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2,1fr); }
  .grid-3 { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); width: var(--sidebar-width); }
  .sidebar.mobile-open { transform: translateX(0); }
  .main-wrapper { margin-left: 0 !important; }
  .header-menu-btn { display: flex; }
  .content-area { padding: 16px; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr; }
  .bottom-nav { display: block; }
  .header-search { display: none; }
  .kpi-value { font-size: 20px; }
  .modal { max-width: 100%; margin: 0; border-radius: var(--radius); max-height: calc(100vh - 32px); }
  .form-row { flex-direction: column; gap: 0; }
  .page-view { padding-bottom: 20px; }
  .header-actions .header-btn:not(.header-btn-essential) { display: none; }
  .app-header { padding: 0 12px; padding-top: env(safe-area-inset-top); }
  .mobile-more-grid { grid-template-columns: repeat(3,1fr); }
}
@media (max-width: 480px) {
  .mobile-more-grid { grid-template-columns: repeat(2,1fr); }
  .kpi-card,.card { padding: 14px; }
  .btn { font-size: 13px; padding: 7px 12px; }
}
/* Print */
@media print {
  .sidebar,.app-header,.bottom-nav,.no-print,.toast-container,.modal-overlay,
  .command-overlay,.tour-overlay,.tour-highlight,.tour-tooltip,.chart-tooltip { display: none !important; }
  .main-wrapper { margin-left: 0 !important; }
  .content-area { padding: 0; }
  .card { border: none; box-shadow: none; page-break-inside: avoid; }
  body { background: #fff !important; color: #000 !important; }
  table { font-size: 12px; }
  .print-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .print-logo { max-height: 60px; max-width: 160px; }

<script>
(function(){
'use strict';

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));
const uid = (prefix = 'id') => prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);
const nowISO = () => new Date().toISOString();
const fmt = (n) => Number(n || 0).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQty = (n) => Number(n || 0).toLocaleString('en-KE', { maximumFractionDigits: 2 });
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtDateTime = (d) => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / 86400000);
const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const debounce = (fn, ms = 300) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; };
const shortMoney = (n) => {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
  return Math.round(n).toString();
};

/* Product image library — real photos from Unsplash */
const PRODUCT_IMAGES = {
  'Cement': 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=200&q=70&auto=format&fit=crop',
  'Steel': 'https://images.unsplash.com/photo-1565008576549-57569a49371d?w=200&q=70&auto=format&fit=crop',
  'Ballast': 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=200&q=70&auto=format&fit=crop',
  'Sand': 'https://images.unsplash.com/photo-1591024051790-d3e3d0f6c88b?w=200&q=70&auto=format&fit=crop',
  'Stone': 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=200&q=70&auto=format&fit=crop',
  'Roofing': 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=200&q=70&auto=format&fit=crop',
  'Nails': 'https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=200&q=70&auto=format&fit=crop',
  'Wire': 'https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=200&q=70&auto=format&fit=crop',
  'PVC': 'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?w=200&q=70&auto=format&fit=crop',
  'Water Tank': 'https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=200&q=70&auto=format&fit=crop',
  'Paint': 'https://images.unsplash.com/photo-1562259949-e8e7689d7828?w=200&q=70&auto=format&fit=crop',
  'Cable': 'https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=200&q=70&auto=format&fit=crop',
  'Door': 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=200&q=70&auto=format&fit=crop',
  'Window': 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=200&q=70&auto=format&fit=crop',
  'Gypsum': 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=200&q=70&auto=format&fit=crop',
  'Ceiling': 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=200&q=70&auto=format&fit=crop',
  'default': 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=200&q=70&auto=format&fit=crop'
};
function getProductImage(name) {
  if (!name) return PRODUCT_IMAGES.default;
  for (const key of Object.keys(PRODUCT_IMAGES)) {
    if (key !== 'default' && name.toLowerCase().includes(key.toLowerCase())) return PRODUCT_IMAGES[key];
  }
  return PRODUCT_IMAGES.default;
}
function getCustomerColor(name) {
  const colors = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4','#ef4444','#6366f1'];
  let hash = 0;
  for (let i = 0; i < (name||'').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}
function getInitials(name) {
  return (name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

/* ============================================================
   TOAST
   ============================================================ */
const Toast = {
  show(msg, type = 'info', duration = 3200) {
    const container = $('#toastContainer');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warning' ? '⚠' : 'ℹ'}</span><span>${escapeHtml(msg)}</span>`;
    container.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 250); }, duration);
  },
  success: (m) => Toast.show(m, 'success'),
  error: (m) => Toast.show(m, 'error', 4500),
  warning: (m) => Toast.show(m, 'warning', 4000),
  info: (m) => Toast.show(m, 'info'),
};

/* ============================================================
   MODAL
   ============================================================ */
const Modal = {
  open(title, bodyHtml, footerHtml, size = '') {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = bodyHtml;
    $('#modalFooter').innerHTML = footerHtml || '';
    const modal = $('#modal');
    modal.className = 'modal' + (size === 'lg' ? ' modal-lg' : size === 'xl' ? ' modal-xl' : '');
    $('#modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  },
  close() {
    $('#modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  },
  confirm(title, message, onConfirm, confirmText = 'Confirm', danger = false) {
    Modal.open(title,
      `<p style="font-size:14px; color:var(--text-secondary); line-height:1.7;">${escapeHtml(message)}</p>`,
      `<button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Cancel</button>
       <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modalConfirmBtn">${escapeHtml(confirmText)}</button>`
    );
    $('#modalConfirmBtn').onclick = () => { Modal.close(); onConfirm(); };
  }
};

/* ============================================================
   STORAGE
   ============================================================ */
const StorageService = {
  prefix: 'sitecredit_',
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(this.prefix + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try {
      localStorage.setItem(this.prefix + key, JSON.stringify(value));
      return true;
    } catch (e) {
      if (e.name === 'QuotaExceededError') Toast.error('Storage full! Export a backup and clear old data.');
      return false;
    }
  },
  remove(key) { localStorage.removeItem(this.prefix + key); },
  usage() {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(this.prefix)) total += (localStorage.getItem(k) || '').length;
    }
    return total;
  },
  clearAll() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(this.prefix)) keys.push(k);
    }
    keys.forEach(k => localStorage.removeItem(k));
  }
};

/* ============================================================
   CHART ENGINE (SVG)
   ============================================================ */
const Charts = {
  line(data, opts = {}) {
    const { width = 500, height = 200, padding = 30, color = 'var(--chart-1)', fill = true, grid = true, labels = [] } = opts;
    if (!data.length) return `<div class="empty-state"><p>No data</p></div>`;
    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const range = max - min || 1;
    const innerW = width - padding * 2;
    const innerH = height - padding * 2;
    const stepX = data.length > 1 ? innerW / (data.length - 1) : innerW;
    const points = data.map((v, i) => {
      const x = padding + i * stepX;
      const y = padding + innerH - ((v - min) / range) * innerH;
      return [x, y];
    });
    let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none" style="height:${height}px">`;
    if (grid) {
      for (let i = 0; i <= 4; i++) {
        const y = padding + (innerH / 4) * i;
        const val = max - (range / 4) * i;
        svg += `<line x1="${padding}" y1="${y}" x2="${width-padding}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/>`;
        svg += `<text x="${padding-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${shortMoney(val)}</text>`;
      }
    }
    if (fill) {
      const path = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
      svg += `<path d="${path} L${points[points.length-1][0]},${height-padding} L${points[0][0]},${height-padding} Z" fill="${color}" opacity="0.15"/>`;
    }
    const polyline = points.map(p => p.join(',')).join(' ');
    svg += `<polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    points.forEach((p, i) => {
      svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"><title>${labels[i] || ''}: ${shortMoney(data[i])}</title></circle>`;
    });
    labels.forEach((lbl, i) => {
      if (i % Math.ceil(labels.length / 6) === 0 || i === labels.length - 1) {
        const x = padding + i * stepX;
        svg += `<text x="${x}" y="${height - 8}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${escapeHtml(lbl)}</text>`;
      }
    });
    svg += '</svg>';
    return svg;
  },
  bar(data, opts = {}) {
    const { width = 500, height = 200, padding = 30, labels = [], color = 'var(--chart-1)', horizontal = false } = opts;
    if (!data.length) return `<div class="empty-state"><p>No data</p></div>`;
    const max = Math.max(...data, 1);
    if (horizontal) {
      const innerW = width - padding * 2 - 80;
      const rowH = (height - padding * 2) / data.length;
      let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none" style="height:${height}px">`;
      data.forEach((v, i) => {
        const bw = (v / max) * innerW;
        const y = padding + i * rowH + rowH / 2 - 10;
        svg += `<text x="${padding-6}" y="${y+14}" text-anchor="end" font-size="10" fill="var(--text-secondary)">${escapeHtml((labels[i]||'').slice(0,12))}</text>`;
        svg += `<rect x="${padding}" y="${y}" width="${innerW}" height="20" fill="var(--border)" rx="3"/>`;
        svg += `<rect x="${padding}" y="${y}" width="${bw}" height="20" fill="${color}" rx="3"><title>${labels[i]}: ${shortMoney(v)}</title></rect>`;
        svg += `<text x="${padding+bw+6}" y="${y+14}" font-size="10" fill="var(--text)">${shortMoney(v)}</text>`;
      });
      svg += '</svg>';
      return svg;
    }
    const innerW = width - padding * 2;
    const innerH = height - padding * 2;
    const stepX = innerW / data.length;
    const barW = Math.min(stepX * 0.6, 40);
    let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" preserveAspectRatio="none" style="height:${height}px">`;
    for (let i = 0; i <= 4; i++) {
      const y = padding + (innerH / 4) * i;
      const val = max - (max / 4) * i;
      svg += `<line x1="${padding}" y1="${y}" x2="${width-padding}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/>`;
      svg += `<text x="${padding-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${shortMoney(val)}</text>`;
    }
    data.forEach((v, i) => {
      const bh = (v / max) * innerH;
      const x = padding + i * stepX + (stepX - barW) / 2;
      const y = padding + innerH - bh;
      svg += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${color}" rx="3"><title>${labels[i]||''}: ${shortMoney(v)}</title></rect>`;
      if (labels[i]) {
        svg += `<text x="${x + barW/2}" y="${height - 8}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${escapeHtml((labels[i]||'').slice(0,8))}</text>`;
      }
    });
    svg += '</svg>';
    return svg;
  },
  donut(data, opts = {}) {
    const { width = 200, height = 200, colors = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'], labels = [] } = opts;
    if (!data.length) return `<div class="empty-state"><p>No data</p></div>`;
    const total = data.reduce((s, v) => s + v, 0) || 1;
    const cx = width / 2, cy = height / 2;
    const outerR = Math.min(width, height) * 0.4;
    const innerR = outerR * 0.6;
    let startAngle = -Math.PI / 2;
    let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" style="height:${height}px">`;
    data.forEach((v, i) => {
      if (v === 0) return;
      const angle = (v / total) * Math.PI * 2;
      const endAngle = startAngle + angle;
      const x1 = cx + outerR * Math.cos(startAngle);
      const y1 = cy + outerR * Math.sin(startAngle);
      const x2 = cx + outerR * Math.cos(endAngle);
      const y2 = cy + outerR * Math.sin(endAngle);
      const ix1 = cx + innerR * Math.cos(endAngle);
      const iy1 = cy + innerR * Math.sin(endAngle);
      const ix2 = cx + innerR * Math.cos(startAngle);
      const iy2 = cy + innerR * Math.sin(startAngle);
      const large = angle > Math.PI ? 1 : 0;
      svg += `<path d="M${x1},${y1} A${outerR},${outerR} 0 ${large} 1 ${x2},${y2} L${ix1},${iy1} A${innerR},${innerR} 0 ${large} 0 ${ix2},${iy2} Z" fill="${colors[i % colors.length]}"><title>${labels[i]||''}: ${shortMoney(v)}</title></path>`;
      startAngle = endAngle;
    });
    svg += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="donut-center-text" font-size="11" fill="var(--text-muted)">TOTAL</text>`;
    svg += `<text x="${cx}" y="${cy + 16}" text-anchor="middle" class="donut-center-text" font-size="16" font-weight="700" fill="var(--text)">${shortMoney(total)}</text>`;
    svg += '</svg>';
    return svg;
  },
  legend(labels, colors) {
    return `<div class="legend">${labels.map((l, i) => `<span><i style="background:${colors[i % colors.length]}"></i>${escapeHtml(l)}</span>`).join('')}</div>`;
  }
};

    StorageService.set('offlineQueue', this.offlineQueue);

  add(collection, item) {
    if (!this.data[collection]) this.data[collection] = [];
    item.id = item.id || uid(collection.slice(0, 3));
    item.createdAt = item.createdAt || nowISO();
    this.data[collection].push(item);
    this.persist(collection);
    return item;
  },

  update(collection, id, patch) {
    const list = this.data[collection] || [];
    const idx = list.findIndex(x => x.id === id);
    if (idx >= 0) {
      list[idx] = { ...list[idx], ...patch, updatedAt: nowISO() };
      this.persist(collection);
      return list[idx];
    }
    return null;
  },

  find(collection, id) { return (this.data[collection] || []).find(x => x.id === id) || null; },

  remove(collection, id) {
    const list = this.data[collection] || [];
    const idx = list.findIndex(x => x.id === id);
    if (idx >= 0) { list.splice(idx, 1); this.persist(collection); return true; }
    return false;
  },

const Auth = {
  login(username, password) {
    const user = State.getCollection('users').find(u => u.username === username && u.password === password && u.active !== false);
    if (!user) return { success: false, error: 'Invalid username or password.' };
    State.currentUser = user;
    StorageService.set('session', { userId: user.id, loginAt: nowISO() });
    State.audit('login', { username });
    return { success: true, user };
  },
  logout() {
    if (State.currentUser) State.audit('logout', {});
    State.currentUser = null;
    StorageService.remove('session');
    App.renderLogin();
  },
  restoreSession() {
    const session = StorageService.get('session', null);
    if (session) {
      const user = State.find('users', session.userId);
      if (user && user.active !== false) { State.currentUser = user; return true; }
    }
    return false;
  },
  hasPermission(perm) {
    if (!State.currentUser) return false;
    const role = State.getCollection('roles').find(r => r.name.toLowerCase().includes(State.currentUser.role.toLowerCase()) || r.id === 'role_' + State.currentUser.role);
    if (!role) return State.currentUser.role === 'owner';
    return role.permissions.includes('*') || role.permissions.includes(perm);
  },
};

const Format = {
  money(n) {
    const settings = State.getCollection('settings');
    const cur = settings && settings.currency ? settings.currency : 'KES';
    return cur + ' ' + fmt(n);
  },
  date: fmtDate,
  datetime: fmtDateTime,
  number: fmtQty,
  statusBadge(status) {
    const map = {
      active:'badge-success', completed:'badge-success', paid:'badge-success', verified:'badge-success', resolved:'badge-success', approved:'badge-success', funded:'badge-success', in_stock:'badge-success',
      watchlist:'badge-warning', paused:'badge-warning', pending:'badge-warning', under_review:'badge-warning', awaiting_customer:'badge-warning', low_stock:'badge-warning',
      in_transit:'badge-info', sent:'badge-info', confirmed:'badge-info', requested:'badge-info', new:'badge-info', high_confidence:'badge-info', medium_confidence:'badge-info', low_confidence:'badge-warning',
      suspended:'badge-danger', blocked:'badge-danger', disputed:'badge-danger', loss_making:'badge-danger', overdue:'badge-danger', rejected:'badge-danger', out_of_stock:'badge-danger',
      open:'badge-warning', closed:'badge-neutral', profitable:'badge-success', marginal:'badge-warning'
    };
    return `<span class="badge ${map[status] || 'badge-neutral'}">${escapeHtml(status.replace(/_/g, ' '))}</span>`;
  }
};

/* ============================================================
   RISK ENGINE
   ============================================================ */
const RiskEngine = {
  calculate(customerId) {
    const customer = State.find('customers', customerId);
    if (!customer) return null;
    const invoices = State.getCollection('invoices').filter(i => i.customerId === customerId);
    const disputes = State.getCollection('disputes').filter(d => d.customerId === customerId);
    const payments = State.getCollection('payments').filter(p => p.customerId === customerId);

    let score = 50;
    const totalInvoiced = invoices.reduce((s, i) => s + i.total, 0);
    const totalPaid = invoices.reduce((s, i) => s + (i.amountPaid || 0), 0);
    const payRatio = totalInvoiced > 0 ? totalPaid / totalInvoiced : 1;
    score += (payRatio - 0.5) * 60;
    const overdueCount = invoices.filter(i => i.status !== 'paid' && new Date(i.dueDate) < new Date()).length;
    score -= Math.min(overdueCount * 8, 30);
    const outstanding = invoices.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
    const util = customer.creditLimit > 0 ? outstanding / customer.creditLimit : 0;
    score -= util * 30;
    score -= Math.min(disputes.length * 5, 20);
    const months = customer.createdAt ? Math.floor(daysBetween(customer.createdAt, nowISO()) / 30) : 0;
    score += Math.min(months * 2, 15);
    const returnsCount = State.getCollection('returns').filter(r => r.customerId === customerId).length;
    score -= Math.min(returnsCount * 4, 12);
    score = clamp(Math.round(score), 0, 100);
    let grade = 'E';
    if (score >= 85) grade = 'A';
    else if (score >= 70) grade = 'B';
    else if (score >= 55) grade = 'C';
    else if (score >= 40) grade = 'D';
    const reasons = [];
    if (payRatio < 0.7) reasons.push('Low payment ratio');
    if (overdueCount > 0) reasons.push(`${overdueCount} overdue invoice(s)`);
    if (util > 0.8) reasons.push('High credit utilization');
    if (disputes.length > 0) reasons.push(`${disputes.length} dispute(s)`);
    if (months < 3) reasons.push('New relationship');
    let action = 'Maintain';
    if (score >= 85) action = 'Increase limit';
    else if (score >= 55) action = 'Review';
    else if (score >= 40) action = 'Reduce limit';
    else action = 'Stop supply';
    return { score, grade, reasons, action, recommendedLimit: Math.round(score / 100 * (customer.creditLimit || 500000)) };
  }
};

/* ============================================================
   FORECAST ENGINE
   ============================================================ */
const ForecastEngine = {
  forecast(productId, days = 30) {
    const orders = State.getCollection('orders');
    const productOrders = orders.flatMap(o => o.items || []).filter(i => i.productId === productId);
    const recent = productOrders.filter(i => (Date.now() - new Date(i.createdAt || i.date).getTime()) < 90 * 86400000);
    const totalQty = recent.reduce((s, i) => s + i.qty, 0);
    const avgDaily = totalQty / 90;
    const forecast = avgDaily * days;
    const confidence = recent.length > 5 ? 'high_confidence' : recent.length > 2 ? 'medium_confidence' : 'low_confidence';
    const product = State.find('products', productId);
    const stock = product ? product.stockQty : 0;
    const reorder = Math.max(0, Math.ceil(forecast + (product ? product.reorderLevel : 20) - stock));
    return { productId, days, forecast: Math.round(forecast), confidence, recommendedReorder: reorder, avgDaily: avgDaily.toFixed(2) };
  }
};

/* ============================================================
   ROUTE OPTIMIZER
   ============================================================ */
const RouteOptimizer = {
  optimize(stops, startLat = -1.2921, startLng = 36.8219) {
    if (stops.length <= 1) return stops;
    const remaining = [...stops];
    const route = [];
    let current = { lat: startLat, lng: startLng };
    while (remaining.length) {
      let nearestIdx = 0, nearestDist = Infinity;
      remaining.forEach((s, i) => {
        const d = Math.hypot((s.lat || 0) - current.lat, (s.lng || 0) - current.lng);
        if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
      });
      const next = remaining.splice(nearestIdx, 1)[0];
      route.push({ ...next, distFromPrev: nearestDist.toFixed(2) });
      current = next;
    }
    return route;
  }
};

/* ============================================================
   DUNNING ENGINE (WhatsApp / SMS)
   ============================================================ */
const Dunning = {
  buildMessage(invoiceId, stage) {
    const inv = State.find('invoices', invoiceId);
    if (!inv) return '';
    const cust = State.find('customers', inv.customerId);
    const settings = State.getCollection('settings');
    const template = settings.dunningTemplates[stage] || settings.dunningTemplates.after7;
    const outstanding = inv.total - (inv.amountPaid || 0);
    return template
      .replace(/{customer}/g, cust ? cust.name : 'Customer')
      .replace(/{invoice}/g, inv.invoiceNumber)
      .replace(/{amount}/g, Format.money(outstanding))
      .replace(/{dueDate}/g, Format.date(inv.dueDate))
      .replace(/{business}/g, settings.businessName);
  },
  sendWhatsApp(invoiceId, stage = 'after7') {
    const inv = State.find('invoices', invoiceId);
    if (!inv) return;
    const cust = State.find('customers', inv.customerId);
    const msg = this.buildMessage(invoiceId, stage);
    const phone = (cust && cust.phone || '').replace(/\s+/g, '').replace(/^0/, '254').replace(/^\+/, '');
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  },
  sendSMS(invoiceId, stage = 'after7') {
    const inv = State.find('invoices', invoiceId);
    if (!inv) return;
    const cust = State.find('customers', inv.customerId);
    const msg = this.buildMessage(invoiceId, stage);
    const phone = (cust && cust.phone || '').replace(/\s+/g, '');
    window.open(`sms:${phone}?body=${encodeURIComponent(msg)}`, '_blank');
  }
};

      disputes: () => this.renderDisputes(),
      collections: () => this.renderCollections(),
      credit: () => this.renderCreditControl(),
      risk: () => this.renderRiskScoring(),
      promises: () => this.renderPromises(),
      inventory: () => this.renderInventory(),
      forecasting: () => this.renderForecasting(),
      procurement: () => this.renderProcurement(),
      finance: () => this.renderFinance(),
      routes: () => this.renderRoutes(),
      reports: () => this.renderReports(),
      approvals: () => this.renderApprovals(),
      settings: () => this.renderSettings(),
      audit: () => this.renderAudit(),
      notifications: () => this.renderNotifications(),
    };
    const fn = renderers[page];
    if (fn) fn();
    else this.renderDashboard();
  },

  pageHeader(title, subtitle, actionsHtml = '') {
    return `
      <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
        <div>
          <h1 style="font-size:22px; font-weight:700; letter-spacing:-0.02em;">${escapeHtml(title)}</h1>
          ${subtitle ? `<p class="text-sm text-secondary mt-1">${escapeHtml(subtitle)}</p>` : ''}
        </div>
        <div class="flex gap-2 flex-wrap">${actionsHtml}</div>
      </div>
    `;
  },

  emptyState(msg) {
    return `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0h-2.586a1 1 0 0 0-.707.293l-2.414 2.414a1 1 0 0 1-.707.293h-3.172a1 1 0 0 1-.707-.293l-2.414-2.414A1 1 0 0 0 6.586 13H4"/></svg>
      <p>${escapeHtml(msg)}</p>
    </div>`;
  },

  avatar(name, size = 40) {
    return `<div class="customer-avatar" style="background:${getCustomerColor(name)};width:${size}px;height:${size}px;font-size:${size/3}px;">${getInitials(name)}</div>`;
  },

  /* ---------- DASHBOARD ---------- */
  renderDashboard() {
    const invoices = State.getCollection('invoices');
    const payments = State.getCollection('payments');
    const deliveries = State.getCollection('deliveries');
    const disputes = State.getCollection('disputes');
    const customers = State.getCollection('customers');
    const projects = State.getCollection('projects');
    const products = State.getCollection('products');
    const orders = State.getCollection('orders');
    const today = todayISO();
    const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

    const totalReceivables = invoices.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
    const overdue = invoices.filter(i => i.status !== 'paid' && new Date(i.dueDate) < new Date());
    const overdueAmount = overdue.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
    const todaySales = orders.filter(o => o.date === today).reduce((s, o) => s + o.total, 0);
    const todayDeliveries = deliveries.filter(d => d.date === today).length;
    const pendingDeliveries = deliveries.filter(d => d.status !== 'verified').length;
    const disputedValue = disputes.filter(d => d.status !== 'resolved' && d.status !== 'credited').reduce((s, d) => s + (d.amount || 0), 0);
    const cashCollectedWeek = payments.filter(p => p.date >= weekAgo).reduce((s, p) => s + p.amount, 0);
    const lowStock = products.filter(p => p.stockQty <= p.reorderLevel);

    // Revenue trend (last 14 days)
    const revenueByDay = {};
    orders.forEach(o => { revenueByDay[o.date] = (revenueByDay[o.date] || 0) + o.total; });
    const revenueLabels = [], revenueData = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
      revenueLabels.push(new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }));
      revenueData.push(revenueByDay[d] || 0);
    }

    // Aging buckets
    const buckets = { Current: 0, '1-30': 0, '31-60': 0, '61-90': 0, '90+': 0 };
    invoices.filter(i => i.status !== 'paid').forEach(i => {
      const days = daysBetween(i.dueDate, today);
      const key = days <= 0 ? 'Current' : days <= 30 ? '1-30' : days <= 60 ? '31-60' : days <= 90 ? '61-90' : '90+';
      buckets[key] += (i.total - (i.amountPaid || 0));
    });

    // Category split
    const categoryTotals = {};
    products.forEach(p => { categoryTotals[p.category] = (categoryTotals[p.category] || 0) + (p.unitPrice * p.stockQty); });
    const categoryLabels = Object.keys(categoryTotals);
    const categoryData = Object.values(categoryTotals);

    // Project margin chart
    const projectLabels = projects.slice(0, 6).map(p => p.name.slice(0, 15));
    const projectMargins = projects.slice(0, 6).map(p => {
      const pInv = invoices.filter(i => i.projectId === p.id);
      const inv = pInv.reduce((s, i) => s + i.total, 0);
      return p.budget > 0 ? Math.max(0, ((p.budget - inv) / p.budget) * 100) : 0;
    });

    // Delivery status donut
    const deliveryStatus = { verified: 0, in_transit: 0, exception: 0, pending: 0 };
    deliveries.forEach(d => { deliveryStatus[d.status] = (deliveryStatus[d.status] || 0) + 1; });

    const topCustomers = customers.map(c => {
      const inv = invoices.filter(i => i.customerId === c.id);
      const out = inv.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
      return { ...c, outstanding: out };
    }).sort((a, b) => b.outstanding - a.outstanding).slice(0, 5);

    const kpi = (label, value, sub = '', cls = '') => `
      <div class="kpi-card ${cls}">
        <div class="kpi-label">${label}</div>
        <div class="kpi-value">${value}</div>
        ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
      </div>
    `;

    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Dashboard', 'Know who owes you, what they received, and whether the job is still profitable.',
          `<button class="btn btn-primary btn-sm" onclick="SiteCredit.App.showNewOrderModal()">+ New Order</button>
           <button class="btn btn-secondary btn-sm" onclick="SiteCredit.App.showRecordPaymentModal()">Record Payment</button>`)}
        <div class="grid grid-4 mb-4">
          ${kpi('Total Receivables', Format.money(totalReceivables), `${invoices.filter(i=>i.status!=='paid').length} open invoices`)}
          ${kpi('Overdue', Format.money(overdueAmount), `${overdue.length} overdue invoice(s)`, 'kpi-danger')}
          ${kpi("Today's Sales", Format.money(todaySales), '', 'kpi-success')}
          ${kpi('Cash Collected (Week)', Format.money(cashCollectedWeek), '', 'kpi-success')}
        </div>
        <div class="grid grid-4 mb-4">
          ${kpi("Today's Deliveries", todayDeliveries, '')}
          ${kpi('Pending Deliveries', pendingDeliveries, '')}
          ${kpi('Disputed Value', Format.money(disputedValue), `${disputes.filter(d=>d.status!=='resolved').length} open`, 'kpi-warning')}
          ${kpi('Low Stock Alerts', lowStock.length, 'items below reorder', lowStock.length ? 'kpi-warning' : '')}
        </div>
        <div class="grid grid-2 mb-4">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Revenue — Last 14 Days</h3></div>
            ${Charts.line(revenueData, { width: 600, height: 220, color: 'var(--chart-1)', labels: revenueLabels })}
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Aging Breakdown</h3></div>
            ${Charts.bar(Object.values(buckets), { width: 600, height: 220, color: 'var(--chart-3)', labels: Object.keys(buckets) })}
          </div>
        </div>
        <div class="grid grid-3 mb-4">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Stock by Category</h3></div>
            ${Charts.donut(categoryData, { width: 220, height: 220, labels: categoryLabels })}
            ${Charts.legend(categoryLabels, ['#3b82f6','#10b981','#f59e0b','#ef4444'])}
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Delivery Status</h3></div>
            ${Charts.donut(Object.values(deliveryStatus), { width: 220, height: 220, labels: Object.keys(deliveryStatus), colors: ['#10b981','#3b82f6','#ef4444','#f59e0b'] })}
            ${Charts.legend(Object.keys(deliveryStatus), ['#10b981','#3b82f6','#ef4444','#f59e0b'])}
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Top Project Margins</h3></div>
            ${Charts.bar(projectMargins, { width: 300, height: 220, horizontal: true, color: 'var(--chart-2)', labels: projectLabels })}
          </div>
        </div>
        <div class="grid grid-2 mb-4">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Top Customers by Outstanding</h3></div>
            ${topCustomers.length ? `<div class="table-wrapper"><table>
              <thead><tr><th>Customer</th><th>Type</th><th class="text-right">Outstanding</th><th>Status</th></tr></thead>
              <tbody>${topCustomers.map(c => `
                <tr>
                  <td><div class="product-cell">${this.avatar(c.name, 32)}<span class="font-semibold">${escapeHtml(c.name)}</span></div></td>
                  <td class="text-sm text-secondary">${escapeHtml(c.type)}</td>
                  <td class="text-right font-semibold">${Format.money(c.outstanding)}</td>
                  <td>${Format.statusBadge(c.creditStatus)}</td>
                </tr>
              `).join('')}</tbody>
            </table></div>` : this.emptyState('No outstanding balances')}
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Recent Orders</h3></div>
            <div class="table-wrapper"><table>
              <thead><tr><th>Order #</th><th>Date</th><th class="text-right">Total</th><th>Status</th></tr></thead>
              <tbody>${orders.slice(-5).reverse().map(o => `<tr><td>${escapeHtml(o.orderNumber)}</td><td>${Format.date(o.date)}</td><td class="text-right">${Format.money(o.total)}</td><td>${Format.statusBadge(o.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-muted">No orders yet</td></tr>'}</tbody>
            </table></div>
          </div>
        </div>
        <div class="card mb-4">
          <div class="card-header"><h3 class="card-title">Quick Actions</h3></div>
          <div class="grid grid-3 gap-2">
            <button class="btn btn-secondary" onclick="SiteCredit.App.showNewCustomerModal()">+ New Customer</button>
            <button class="btn btn-secondary" onclick="SiteCredit.App.showNewProjectModal()">+ New Project</button>
            <button class="btn btn-secondary" onclick="SiteCredit.App.showNewOrderModal()">+ New Order</button>
            <button class="btn btn-secondary" onclick="SiteCredit.App.showRecordPaymentModal()">Record Payment</button>
            <button class="btn btn-secondary" onclick="SiteCredit.App.navigate('reports')">Generate Report</button>
            <button class="btn btn-secondary" onclick="SiteCredit.App.navigate('disputes')">View Disputes</button>
          </div>
        </div>
      </div>
    `;
  },

  /* ---------- CUSTOMERS ---------- */
  renderCustomers() {
    const customers = State.getCollection('customers');
    const invoices = State.getCollection('invoices');
    const search = (window._custSearch || '').toLowerCase();
    const filtered = customers.filter(c => !search || c.name.toLowerCase().includes(search) || (c.phone || '').includes(search));
    const getOutstanding = (id) => invoices.filter(i => i.customerId === id).reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);

    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Customers & Contractors', `${filtered.length} customer(s)`, `
          <input type="text" class="form-input" style="width:200px;" placeholder="Search customers..." id="custSearchInput" value="${escapeHtml(window._custSearch || '')}">
          <button class="btn btn-primary btn-sm" onclick="SiteCredit.App.showNewCustomerModal()">+ New Customer</button>
        `)}
        <div class="card">
          ${filtered.length ? `<div class="table-wrapper"><table>
            <thead><tr><th>Customer</th><th>Type</th><th>Phone</th><th class="text-right">Outstanding</th><th>Credit Limit</th><th>Utilization</th><th>Status</th><th></th></tr></thead>
            <tbody>${filtered.map(c => {
              const out = getOutstanding(c.id);
              const util = c.creditLimit > 0 ? clamp(out / c.creditLimit * 100, 0, 100) : 0;
              return `
              <tr>
                <td><div class="product-cell">${this.avatar(c.name, 36)}<span class="font-semibold">${escapeHtml(c.name)}</span></div></td>
                <td class="text-sm text-secondary">${escapeHtml(c.type)}</td>
                <td class="text-sm">${escapeHtml(c.phone || '—')}</td>
                <td class="text-right font-semibold">${Format.money(out)}</td>
                <td>${Format.money(c.creditLimit)}</td>
                <td style="min-width:100px;">
                  <div class="progress-bar"><div class="progress-bar-fill" style="width:${util}%; background:${util>80?'var(--danger)':util>50?'var(--warning)':'var(--success)'};"></div></div>
                  <span class="text-xs text-muted">${util.toFixed(0)}%</span>
                </td>
                <td>${Format.statusBadge(c.creditStatus)}</td>
                <td><button class="btn btn-ghost btn-sm" onclick="SiteCredit.App.showCustomerDetail('${c.id}')">View</button></td>
              </tr>
            `}).join('')}</tbody>
          </table></div>` : this.emptyState('No customers found')}
        </div>
      </div>
    `;
    const input = $('#custSearchInput');
    if (input) input.addEventListener('input', debounce((e) => { window._custSearch = e.target.value; this.renderCustomers(); }, 300));
  },

  showCustomerDetail(id) {
    const c = State.find('customers', id);
    if (!c) return;
    const invoices = State.getCollection('invoices').filter(i => i.customerId === id);
    const projects = State.getCollection('projects').filter(p => p.customerId === id);
    const disputes = State.getCollection('disputes').filter(d => d.customerId === id);
    const risk = RiskEngine.calculate(id);
    const outstanding = invoices.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
    const util = c.creditLimit > 0 ? clamp(outstanding / c.creditLimit * 100, 0, 100) : 0;

    Modal.open(`Customer: ${escapeHtml(c.name)}`, `
      <div class="flex items-center gap-3 mb-3">
        ${this.avatar(c.name, 56)}
        <div>
          <div class="font-semibold">${escapeHtml(c.name)}</div>
          <div class="text-sm text-secondary">${escapeHtml(c.type)} · ${escapeHtml(c.phone || '')}</div>
        </div>
      </div>
      <div class="grid grid-2 gap-3 mb-3">
        <div><span class="text-xs text-muted">Email</span><div class="font-semibold">${escapeHtml(c.email || '—')}</div></div>
        <div><span class="text-xs text-muted">Tax ID / PIN</span><div class="font-semibold">${escapeHtml(c.taxId || '—')}</div></div>
        <div><span class="text-xs text-muted">Credit Limit</span><div class="font-semibold">${Format.money(c.creditLimit)}</div></div>
        <div><span class="text-xs text-muted">Payment Terms</span><div class="font-semibold">${c.paymentTerms} days</div></div>
      </div>
      <div class="mb-3">
        <div class="flex justify-between text-sm mb-1"><span>Credit Utilization</span><span class="font-semibold">${util.toFixed(0)}%</span></div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${util}%; background:${util>80?'var(--danger)':util>50?'var(--warning)':'var(--success)'};"></div></div>
      </div>
      <div class="grid grid-3 gap-2 mb-3">
        <div class="kpi-card"><div class="kpi-label">Outstanding</div><div class="kpi-value" style="font-size:18px;">${Format.money(outstanding)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Risk Score</div><div class="kpi-value" style="font-size:18px;">${risk ? risk.score + '/100 (' + risk.grade + ')' : '—'}</div></div>
        <div class="kpi-card"><div class="kpi-label">Projects</div><div class="kpi-value" style="font-size:18px;">${projects.length}</div></div>
      </div>
      <h4 class="font-semibold mb-2">Invoices</h4>
      ${invoices.length ? `<div class="table-wrapper"><table>
        <thead><tr><th>Invoice</th><th>Due</th><th class="text-right">Total</th><th>Status</th><th></th></tr></thead>
        <tbody>${invoices.map(i => `<tr><td>${escapeHtml(i.invoiceNumber)}</td><td>${Format.date(i.dueDate)}</td><td class="text-right">${Format.money(i.total)}</td><td>${Format.statusBadge(i.status)}</td><td><button class="btn btn-ghost btn-sm" onclick="SiteCredit.App.showReminder('${i.id}')">Remind</button></td></tr>`).join('')}</tbody>
      </table></div>` : '<p class="text-sm text-muted">No invoices</p>'}
      ${disputes.length ? `<h4 class="font-semibold mt-3 mb-2">Disputes</h4><p class="text-sm">${disputes.length} dispute(s) — ${Format.money(disputes.reduce((s,d)=>s+d.amount,0))} total</p>` : ''}
    `, `
      <button class="btn btn-secondary" onclick="SiteCredit.App.showStatement('${id}')">Print Statement</button>
      <button class="btn btn-primary" onclick="SiteCredit.Modal.close()">Close</button>
    `, 'lg');
  },

  showStatement(customerId) {
    const c = State.find('customers', customerId);
    const invoices = State.getCollection('invoices').filter(i => i.customerId === customerId);
    const settings = State.getCollection('settings');
    const outstanding = invoices.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
    const html = `
      <div class="print-header">
        <div>
          ${settings.logo ? `<img src="${settings.logo}" class="print-logo">` : `<div style="font-size:20px;font-weight:700;">${escapeHtml(settings.businessName)}</div>`}
          <div class="text-sm text-secondary mt-1">${escapeHtml(settings.address)}<br>${escapeHtml(settings.phone)} · ${escapeHtml(settings.email)}</div>
        </div>
        <div class="text-right">
          <h2 style="font-size:18px;">STATEMENT OF ACCOUNT</h2>
          <div class="text-sm text-secondary">Date: ${Format.date(todayISO())}</div>
          <div class="text-sm text-secondary">Customer: ${escapeHtml(c.name)}</div>
        </div>
      </div>
      <table class="print-table">
        <thead><tr><th>Invoice #</th><th>Date</th><th>Due Date</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead>
        <tbody>${invoices.map(i => `
          <tr><td>${escapeHtml(i.invoiceNumber)}</td><td>${Format.date(i.date)}</td><td>${Format.date(i.dueDate)}</td><td>${Format.money(i.total)}</td><td>${Format.money(i.amountPaid||0)}</td><td>${Format.money(i.total-(i.amountPaid||0))}</td><td>${escapeHtml(i.status)}</td></tr>

    Modal.open('Customer Statement', html, `<button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button><button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Close</button>`, 'lg');
  },

  showReminder(invoiceId) {
    const inv = State.find('invoices', invoiceId);
    const cust = State.find('customers', inv.customerId);
    const stages = [
      { key: 'beforeDue', label: 'Before due' },
      { key: 'onDue', label: 'On due' },
      { key: 'after7', label: '7 days overdue' },
      { key: 'after14', label: '14 days overdue' },
      { key: 'after30', label: '30 days overdue' },
      { key: 'after60', label: '60 days overdue' },
      { key: 'after90', label: '90+ days overdue' },
    ];
    Modal.open('Send Payment Reminder', `
      <p class="text-sm text-secondary mb-3">Invoice ${escapeHtml(inv.invoiceNumber)} · ${escapeHtml(cust.name)} · Outstanding: ${Format.money(inv.total - (inv.amountPaid || 0))}</p>
      <div class="form-group">
        <label class="form-label">Reminder Stage</label>
        <select class="form-select" id="reminderStage">${stages.map(s => `<option value="${s.key}">${s.label}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Message Preview</label>
        <textarea class="form-textarea" id="reminderText" style="min-height:120px;"></textarea>
      </div>
    `, `
      <button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Cancel</button>
      <button class="btn btn-success" id="sendWhatsAppBtn">📱 WhatsApp</button>
      <button class="btn btn-secondary" id="sendSMSBtn">💬 SMS</button>
    `);
    const updatePreview = () => {
      const stage = $('#reminderStage').value;
      $('#reminderText').value = Dunning.buildMessage(invoiceId, stage);
    };
    updatePreview();
    $('#reminderStage').onchange = updatePreview;
    $('#sendWhatsAppBtn').onclick = () => { Dunning.sendWhatsApp(invoiceId, $('#reminderStage').value); Modal.close(); State.audit('reminder_sent', { invoiceId, channel: 'whatsapp' }); Toast.success('WhatsApp opened'); };
    $('#sendSMSBtn').onclick = () => { Dunning.sendSMS(invoiceId, $('#reminderStage').value); Modal.close(); State.audit('reminder_sent', { invoiceId, channel: 'sms' }); Toast.success('SMS opened'); };
  },

  showNewCustomerModal() {
    Modal.open('New Customer', `
      <form id="newCustomerForm">
        <div class="form-group"><label class="form-label">Name <span class="required">*</span></label><input class="form-input" id="ncName" required></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="ncType"><option>individual</option><option>fundi</option><option>contractor</option><option>developer</option><option>company</option><option>institution</option></select></div>
          <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="ncPhone"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Credit Limit</label><input class="form-input" type="number" id="ncLimit" value="500000"></div>
          <div class="form-group"><label class="form-label">Payment Terms (days)</label><input class="form-input" type="number" id="ncTerms" value="30"></div>
        </div>
      </form>
    `, `<button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Cancel</button>
        <button class="btn btn-primary" id="saveCustomerBtn">Save Customer</button>`);

      State.audit('customer_created', { name });
      Modal.close();
      Toast.success('Customer created');
      this.renderCustomers();
    };

  showNewProjectModal() {
    const customers = State.getCollection('customers');

  showNewOrderModal() {
    const customers = State.getCollection('customers');
    const projects = State.getCollection('projects');
    const products = State.getCollection('products');
    Modal.open('New Order', `
      <div class="form-group"><label class="form-label">Customer</label><select class="form-select" id="noCustomer">${customers.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Project</label><select class="form-select" id="noProject"><option value="">— None —</option>${projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Product</label><select class="form-select" id="noProduct">${products.map(p => `<option value="${p.id}">${escapeHtml(p.name)} — ${Format.money(p.unitPrice)}</option>`).join('')}</select></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Quantity</label><input class="form-input" type="number" id="noQty" value="1" min="1"></div>
        <div class="form-group"><label class="form-label">Payment Type</label><select class="form-select" id="noPayType"><option value="credit">Credit</option><option value="cash">Cash</option></select></div>
      </div>
    `, `<button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Cancel</button>
        <button class="btn btn-primary" id="saveOrderBtn">Create Order</button>`);
    $('#saveOrderBtn').onclick = () => {
      const customerId = $('#noCustomer').value;
      const productId = $('#noProduct').value;
      const qty = Number($('#noQty').value) || 1;
      const product = State.find('products', productId);
      const customer = State.find('customers', customerId);
      const payType = $('#noPayType').value;
      if (payType === 'credit') {
        const invoices = State.getCollection('invoices').filter(i => i.customerId === customerId);
        const outstanding = invoices.reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
        const newTotal = qty * product.unitPrice * 1.16;
        if (outstanding + newTotal > customer.creditLimit || customer.stopSupply) {
          Toast.error(`Credit limit exceeded or supply stopped for ${customer.name}.`);
          return;
        }
      }
      const subtotal = qty * product.unitPrice;
      const tax = subtotal * 0.16;
      State.add('orders', {
        orderNumber: 'ORD-' + String(1001 + State.getCollection('orders').length),
        customerId, projectId: $('#noProject').value || null,
        date: todayISO(), items: [{ productId, name: product.name, qty, unit: product.unit, unitPrice: product.unitPrice, subtotal }],
        subtotal, tax, total: subtotal + tax, status: 'confirmed', paymentType: payType,
        createdBy: State.currentUser.id, createdAt: nowISO()
      });
      State.audit('order_created', { customerId, productId, qty });
      Modal.close();
      Toast.success('Order created');
      this.navigate('orders');
    };
  },

  showRecordPaymentModal() {
    const invoices = State.getCollection('invoices').filter(i => i.status !== 'paid');
    if (!invoices.length) { Toast.info('No outstanding invoices'); return; }
    Modal.open('Record Payment', `
      <div class="form-group"><label class="form-label">Invoice</label><select class="form-select" id="rpInvoice">${invoices.map(i => `<option value="${i.id}">${escapeHtml(i.invoiceNumber)} — ${Format.money(i.total - (i.amountPaid||0))} due</option>`).join('')}</select></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Amount</label><input class="form-input" type="number" id="rpAmount" required></div>
        <div class="form-group"><label class="form-label">Method</label><select class="form-select" id="rpMethod"><option>M-Pesa</option><option>Bank Transfer</option><option>Cash</option><option>Cheque</option></select></div>
      </div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="rpDate" value="${todayISO()}"></div>
    `, `<button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Cancel</button>
        <button class="btn btn-primary" id="savePaymentBtn">Record Payment</button>`);
    const sel = $('#rpInvoice');
    const updateAmount = () => {
      const inv = State.find('invoices', sel.value);
      if (inv) $('#rpAmount').value = (inv.total - (inv.amountPaid || 0)).toFixed(2);
    };
    sel.addEventListener('change', updateAmount);
    updateAmount();
    $('#savePaymentBtn').onclick = () => {
      const invId = sel.value;
      const amount = Number($('#rpAmount').value);
      if (!amount || amount <= 0) { Toast.error('Enter a valid amount'); return; }
      const inv = State.find('invoices', invId);
      const newPaid = (inv.amountPaid || 0) + amount;
      State.update('invoices', invId, { amountPaid: newPaid, status: newPaid >= inv.total ? 'paid' : 'partial' });
      State.add('payments', {
        receiptNumber: 'RCP-' + String(1001 + State.getCollection('payments').length),
        invoiceId: invId, customerId: inv.customerId, amount, method: $('#rpMethod').value,
        date: $('#rpDate').value, recordedBy: State.currentUser.id, createdAt: nowISO()
      });
      State.audit('payment_recorded', { invoiceId: invId, amount });
      Modal.close();
      Toast.success('Payment recorded');
      this.navigate(State.currentPage);
    };
  },

  /* ---------- PROJECTS ---------- */
  renderProjects() {

    $('#contentArea').innerHTML = `
      <div class="page-view active">

          ${projects.map(p => {
            const inv = invoices.filter(i => i.projectId === p.id);
            const invoiced = inv.reduce((s, i) => s + i.total, 0);
            const paid = inv.reduce((s, i) => s + (i.amountPaid || 0), 0);
            const margin = p.budget > 0 ? ((p.budget - invoiced) / p.budget * 100) : 0;

            return `<div class="card cursor-pointer" onclick="SiteCredit.App.showProjectDetail('${p.id}')">

              <div class="text-sm font-semibold"><span class="text-muted">Outstanding:</span> ${Format.money(invoiced - paid)}</div>

          }).join('')}

      </div>
    `;
  },

  /* ---------- COLLECTIONS ---------- */
  renderCollections() {
    const invoices = State.getCollection('invoices').filter(i => i.status !== 'paid');
    const customers = State.getCollection('customers');
    const getName = (id) => { const c = customers.find(x => x.id === id); return c ? c.name : '—'; };
    const today = new Date();
    const aging = (inv) => {
      const days = daysBetween(inv.dueDate, today);
      if (days <= 0) return 'Current';
      if (days <= 30) return '1-30';
      if (days <= 60) return '31-60';
      if (days <= 90) return '61-90';
      return '90+';
    };
    const buckets = { Current: 0, '1-30': 0, '31-60': 0, '61-90': 0, '90+': 0 };
    invoices.forEach(i => { buckets[aging(i)] += (i.total - (i.amountPaid || 0)); });

    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Collections Dashboard', `${invoices.length} outstanding invoice(s)`, `<button class="btn btn-primary btn-sm" onclick="SiteCredit.App.showRecordPaymentModal()">Record Payment</button>`)}
        <div class="grid grid-4 mb-4">
          ${Object.entries(buckets).map(([k, v]) => `
            <div class="kpi-card ${k === '90+' && v > 0 ? 'kpi-danger' : k === '61-90' && v > 0 ? 'kpi-warning' : ''}">
              <div class="kpi-label">${k} days</div>
              <div class="kpi-value" style="font-size:18px;">${Format.money(v)}</div>
            </div>
          `).join('')}
        </div>
        <div class="card mb-4">
          <div class="card-header"><h3 class="card-title">Aging Bar Chart</h3></div>
          ${Charts.bar(Object.values(buckets), { width: 700, height: 220, color: 'var(--chart-4)', labels: Object.keys(buckets) })}
        </div>
        <div class="card">
          <div class="card-header"><h3 class="card-title">Outstanding Invoices</h3></div>
          ${invoices.length ? `<div class="table-wrapper"><table>
            <thead><tr><th>Invoice</th><th>Customer</th><th>Due Date</th><th>Days Overdue</th><th class="text-right">Balance</th><th>Bucket</th><th></th></tr></thead>
            <tbody>${invoices.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate)).map(i => {
              const days = daysBetween(i.dueDate, today);
              return `<tr>
                <td class="font-semibold">${escapeHtml(i.invoiceNumber)}</td>
                <td>${escapeHtml(getName(i.customerId))}</td>
                <td>${Format.date(i.dueDate)}</td>
                <td class="${days > 0 ? 'text-danger font-semibold' : 'text-muted'}">${days > 0 ? days + ' days' : '—'}</td>
                <td class="text-right font-semibold">${Format.money(i.total - (i.amountPaid||0))}</td>
                <td>${aging(i)}</td>
                <td><button class="btn btn-ghost btn-sm" onclick="SiteCredit.App.showReminder('${i.id}')">Remind</button></td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>` : this.emptyState('No outstanding invoices')}
        </div>
      </div>
    `;
  },
