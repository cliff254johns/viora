  generateReport(name) {
    const settings = State.getCollection('settings');
    let html = '';
    switch (name) {
      case 'Daily Sales': {
        const orders = State.getCollection('orders');
        const byDate = {};
        orders.forEach(o => { byDate[o.date] = (byDate[o.date] || 0) + o.total; });
        html = `<h2>${escapeHtml(settings.businessName)} — Daily Sales</h2><table class="print-table"><thead><tr><th>Date</th><th class="text-right">Sales</th></tr></thead><tbody>${Object.entries(byDate).sort().map(([d, v]) => `<tr><td>${Format.date(d)}</td><td class="text-right">${Format.money(v)}</td></tr>`).join('')}</tbody></table>`;
        break;
      }
      case 'Aging Report': {
        const invoices = State.getCollection('invoices').filter(i => i.status !== 'paid');
        const buckets = { Current: 0, '1-30': 0, '31-60': 0, '61-90': 0, '90+': 0 };
        invoices.forEach(i => {
          const days = daysBetween(i.dueDate, todayISO());
          const key = days <= 0 ? 'Current' : days <= 30 ? '1-30' : days <= 60 ? '31-60' : days <= 90 ? '61-90' : '90+';
          buckets[key] += (i.total - (i.amountPaid || 0));
        });
        html = `<h2>${escapeHtml(settings.businessName)} — Aging Report</h2><table class="print-table"><thead><tr><th>Bucket</th><th class="text-right">Amount</th></tr></thead><tbody>${Object.entries(buckets).map(([k, v]) => `<tr><td>${k}</td><td class="text-right">${Format.money(v)}</td></tr>`).join('')}</tbody></table>`;
        break;
      }
      case 'Credit Exposure': {
        const customers = State.getCollection('customers');
        const invoices = State.getCollection('invoices');
        html = `<h2>${escapeHtml(settings.businessName)} — Credit Exposure</h2><table class="print-table"><thead><tr><th>Customer</th><th class="text-right">Outstanding</th><th class="text-right">Limit</th></tr></thead><tbody>${customers.map(c => {
          const out = invoices.filter(i => i.customerId === c.id).reduce((s, i) => s + (i.total - (i.amountPaid || 0)), 0);
          return `<tr><td>${escapeHtml(c.name)}</td><td class="text-right">${Format.money(out)}</td><td class="text-right">${Format.money(c.creditLimit)}</td></tr>`;
        }).join('')}</tbody></table>`;
        break;
      }
      default: {
        html = `<h2>${escapeHtml(settings.businessName)} — ${escapeHtml(name)}</h2><p>Report generated on ${Format.date(todayISO())}.</p><p class="text-sm text-secondary">This report is available in the full system. Export to CSV or print for records.</p>`;
      }
    }
    Modal.open(name, html, `<button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button><button class="btn btn-secondary" onclick="SiteCredit.Modal.close()">Close</button>`, 'lg');
  },

  /* ---------- APPROVALS ---------- */
  renderApprovals() {
    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Automated Approvals', 'Pending decisions and audit trail')}
        <div class="card">
          ${this.emptyState('No pending approvals')}
        </div>
      </div>
    `;
  },

  /* ---------- SETTINGS ---------- */
  renderSettings() {
    const s = State.getCollection('settings');
    const usage = StorageService.usage();
    const usageKB = (usage / 1024).toFixed(1);
    const usagePct = clamp(usage / (5 * 1024 * 1024) * 100, 0, 100);
    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Settings', 'Business profile, data management and security')}
        <div class="grid grid-2">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Business Profile</h3></div>
            <div class="form-group"><label class="form-label">Business Name</label><input class="form-input" id="setBizName" value="${escapeHtml(s.businessName)}"></div>
            <div class="form-group"><label class="form-label">Address</label><input class="form-input" id="setAddress" value="${escapeHtml(s.address)}"></div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="setPhone" value="${escapeHtml(s.phone)}"></div>
              <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="setEmail" value="${escapeHtml(s.email)}"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Tax PIN</label><input class="form-input" id="setPin" value="${escapeHtml(s.pin)}"></div>
              <div class="form-group"><label class="form-label">Currency</label><input class="form-input" id="setCurrency" value="${escapeHtml(s.currency)}"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Tax Rate (%)</label><input class="form-input" type="number" id="setTaxRate" value="${s.taxRate}"></div>
              <div class="form-group"><label class="form-label">Invoice Prefix</label><input class="form-input" id="setInvPrefix" value="${escapeHtml(s.invoicePrefix)}"></div>
            </div>
            <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Data & Storage</h3></div>
            <div class="mb-3">
              <div class="flex justify-between text-sm mb-1"><span>Storage Usage</span><span>${usageKB} KB / 5 MB</span></div>
              <div class="progress-bar"><div class="progress-bar-fill" style="width:${usagePct}%; background:${usagePct>80?'var(--danger)':'var(--primary)'};"></div></div>
            </div>
            <div class="flex gap-2 flex-wrap mb-3">
              <button class="btn btn-secondary btn-sm" id="exportJsonBtn">Export JSON Backup</button>
              <button class="btn btn-secondary btn-sm" id="importJsonBtn">Import JSON</button>
              <button class="btn btn-danger btn-sm" id="resetDemoBtn">Reset Demo Data</button>
            </div>
            <input type="file" id="importFileInput" accept=".json" style="display:none;">
            <div class="form-group">
              <label class="form-label">Shop Logo</label>
              <input type="file" id="logoUpload" accept="image/*" class="form-input">
            </div>
            <p class="text-xs text-muted">All data is stored locally in this browser. Device-specific. Export backups regularly.</p>
          </div>
        </div>
      </div>
    `;
    $('#saveSettingsBtn').onclick = () => {
      State.data.settings = {
        ...s,
        businessName: $('#setBizName').value, address: $('#setAddress').value,
        phone: $('#setPhone').value, email: $('#setEmail').value,
        pin: $('#setPin').value, currency: $('#setCurrency').value,
        taxRate: Number($('#setTaxRate').value) || 16, invoicePrefix: $('#setInvPrefix').value
      };
      State.persist('settings');
      State.audit('settings_updated', {});
      Toast.success('Settings saved');
      this.renderSidebar();
    };
    $('#exportJsonBtn').onclick = () => {
      const data = {};
      COLLECTIONS.forEach(c => data[c] = State.data[c]);
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sitecredit-backup-' + todayISO() + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      Toast.success('Backup exported');
    };
    $('#importJsonBtn').onclick = () => $('#importFileInput').click();
    $('#importFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          COLLECTIONS.forEach(c => { if (data[c]) State.data[c] = data[c]; });
          State.persistAll();
          Toast.success('Data imported successfully');
          this.navigate('dashboard');
        } catch (err) { Toast.error('Invalid backup file'); }
      };
      reader.readAsText(file);
    };
    $('#resetDemoBtn').onclick = () => {
      Modal.confirm('Reset Demo Data', 'This will clear all current data and restore the demo dataset. Are you sure?', () => {
        StorageService.clearAll();
        State.init();
        State.currentUser = State.getCollection('users').find(u => u.username === 'admin');
        StorageService.set('session', { userId: State.currentUser.id, loginAt: nowISO() });
        Toast.success('Demo data restored');
        this.renderApp();
      }, 'Reset Data', true);
    };
    $('#logoUpload').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        State.data.settings.logo = ev.target.result;
        State.persist('settings');
        this.renderSidebar();
        Toast.success('Logo updated');
      };
      reader.readAsDataURL(file);
    };
  },

  /* ---------- AUDIT ---------- */
  renderAudit() {
    const logs = State.getCollection('auditLogs').slice().reverse();
    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Audit Log', `${logs.length} entries`)}
        <div class="card">
          ${logs.length ? `<div class="table-wrapper"><table>
            <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
            <tbody>${logs.map(l => `<tr>
              <td class="text-sm">${Format.datetime(l.timestamp)}</td>
              <td>${escapeHtml(l.userName)}</td>
              <td>${Format.statusBadge(l.action)}</td>
              <td class="text-sm text-secondary">${escapeHtml(JSON.stringify(l.details || {}).slice(0, 120))}</td>
            </tr>`).join('')}</tbody>
          </table></div>` : this.emptyState('No audit entries')}
        </div>
      </div>
    `;
  },

  renderNotifications() {
    const notifications = State.getCollection('notifications');
    $('#contentArea').innerHTML = `
      <div class="page-view active">
        ${this.pageHeader('Notifications', `${notifications.length} notification(s)`)}
        <div class="card">
          ${notifications.length ? notifications.map(n => `<div class="card mb-2"><strong>${escapeHtml(n.title)}</strong><p class="text-sm text-secondary">${escapeHtml(n.message)}</p></div>`).join('') : this.emptyState('No notifications')}
        </div>
      </div>
    `;
  },

  /* ---------- COMMAND PALETTE ---------- */
  openCommandPalette() {
    $('#commandOverlay').classList.add('open');
    $('#commandInput').value = '';
    $('#commandInput').focus();
    this.renderCommandResults('');
  },

  closeCommandPalette() {
    $('#commandOverlay').classList.remove('open');
    State.commandSelectedIndex = 0;
  },

  renderCommandResults(query) {
    query = (query || '').toLowerCase();
    const results = [];
    const customers = State.getCollection('customers');
    const projects = State.getCollection('projects');
    const invoices = State.getCollection('invoices');
    const deliveries = State.getCollection('deliveries');
    const products = State.getCollection('products');
    if (!query) {
      results.push(
        { label: 'Go to Dashboard', type: 'page', action: () => this.navigate('dashboard') },
        { label: 'New Order', type: 'action', action: () => { this.navigate('orders'); setTimeout(() => this.showNewOrderModal(), 100); } },
        { label: 'Record Payment', type: 'action', action: () => { this.navigate('collections'); setTimeout(() => this.showRecordPaymentModal(), 100); } },
        { label: 'New Customer', type: 'action', action: () => this.showNewCustomerModal() },
        { label: 'New Delivery', type: 'action', action: () => { this.navigate('deliveries'); } },
        { label: 'View Reports', type: 'page', action: () => this.navigate('reports') },
      );
    }
    customers.forEach(c => { if (c.name.toLowerCase().includes(query)) results.push({ label: c.name, type: 'customer', action: () => { this.navigate('customers'); setTimeout(() => this.showCustomerDetail(c.id), 150); } }); });
    projects.forEach(p => { if (p.name.toLowerCase().includes(query)) results.push({ label: p.name, type: 'project', action: () => { this.navigate('projects'); setTimeout(() => this.showProjectDetail(p.id), 150); } }); });
    invoices.forEach(i => { if (i.invoiceNumber.toLowerCase().includes(query)) results.push({ label: i.invoiceNumber, type: 'invoice', action: () => { this.navigate('orders'); setTimeout(() => this.showInvoiceDetail(i.id), 150); } }); });
    deliveries.forEach(d => { if (d.deliveryNumber.toLowerCase().includes(query)) results.push({ label: d.deliveryNumber, type: 'delivery', action: () => { this.navigate('deliveries'); setTimeout(() => this.showDeliveryDetail(d.id), 150); } }); });
    products.forEach(p => { if (p.name.toLowerCase().includes(query)) results.push({ label: p.name, type: 'product', action: () => { this.navigate('inventory'); } }); });
    State.commandResults = results.slice(0, 12);
    State.commandSelectedIndex = 0;
    this.updateCommandSelection();
  },

  updateCommandSelection() {
    const container = $('#commandResults');
    if (!State.commandResults.length) {
      container.innerHTML = '<div class="empty-state" style="padding:24px;"><p>No results found</p></div>';
      return;
    }
    container.innerHTML = State.commandResults.map((r, i) => `
      <div class="command-item ${i === State.commandSelectedIndex ? 'selected' : ''}" data-index="${i}">
        <span>${escapeHtml(r.label)}</span>
        <span class="cmd-type">${escapeHtml(r.type)}</span>
      </div>
    `).join('');
    $$('.command-item').forEach(item => {
      item.addEventListener('click', () => {
        const idx = Number(item.dataset.index);
        State.commandResults[idx].action();
        this.closeCommandPalette();
      });
    });
  },
};

/* ============================================================
   TOUR
   ============================================================ */
const Tour = {
  steps: [
    { selector: '#sidebar', title: 'Welcome to SiteCredit', text: 'Your complete hardware trade operations platform. Navigate all modules from the sidebar. On mobile, use the bottom navigation tiles.' },
    { selector: '[data-page="dashboard"]', title: 'Dashboard', text: 'See receivables, overdue amounts, today\'s sales, deliveries, disputes and trends at a glance with live charts.' },
    { selector: '[data-page="customers"]', title: 'Customers & Contractors', text: 'Manage customers, view credit utilization, risk scores, statements and send payment reminders via WhatsApp.' },
    { selector: '[data-page="projects"]', title: 'Project Ledger', text: 'Track project profitability, deliveries, invoices and margin — know if the job is still profitable.' },
    { selector: '[data-page="orders"]', title: 'Orders & Invoices', text: 'Create quotations, orders and professional invoices. Credit checks block orders that exceed limits.' },
    { selector: '[data-page="deliveries"]', title: 'Delivery Verification', text: 'Capture proof-of-delivery with GPS, photos and signatures. Record exceptions and link disputes.' },
    { selector: '[data-page="collections"]', title: 'Collections', text: 'Aging buckets, promises to pay and dunning templates. Generate WhatsApp/SMS reminders.' },
    { selector: '[data-page="reports"]', title: 'Reports', text: 'Daily sales, aging, credit exposure, profitability and more. Export to CSV or print to PDF.' },
    { selector: '[data-page="settings"]', title: 'Settings', text: 'Configure business profile, logo, backup/restore and storage usage. Install as PWA for offline use.' },
  ],
  current: 0,
  start() {
    State.tourActive = true;
    this.current = 0;
    $('#tourOverlay').classList.add('open');
    this.showStep(0);
  },
  showStep(i) {
    if (i >= this.steps.length) { this.finish(); return; }
    this.current = i;
    const step = this.steps[i];
    const el = document.querySelector(step.selector);
    const highlight = $('#tourHighlight');
    const tooltip = $('#tourTooltip');
    if (el) {
      const rect = el.getBoundingClientRect();
      highlight.style.display = 'block';
      highlight.style.top = (rect.top - 4) + 'px';
      highlight.style.left = (rect.left - 4) + 'px';
      highlight.style.width = (rect.width + 8) + 'px';
      highlight.style.height = (rect.height + 8) + 'px';
      tooltip.style.display = 'block';
      let top = rect.bottom + 12;
      let left = rect.left;
      if (top + 200 > window.innerHeight) top = rect.top - 210;
      if (left + 340 > window.innerWidth) left = window.innerWidth - 360;
      if (left < 10) left = 10;
      if (top < 10) top = 10;
      tooltip.style.top = top + 'px';
      tooltip.style.left = left + 'px';
    } else {
      highlight.style.display = 'none';
      tooltip.style.top = '50%';
      tooltip.style.left = '50%';
      tooltip.style.transform = 'translate(-50%, -50%)';
    }
    $('#tourTitle').textContent = step.title;
    $('#tourText').textContent = step.text;
    $('#tourStep').textContent = `${i + 1} of ${this.steps.length}`;
    $('#tourNextBtn').textContent = i === this.steps.length - 1 ? 'Finish' : 'Next';
    $('#tourNextBtn').onclick = () => { this.showStep(this.current + 1); };
    $('#tourSkipBtn').onclick = () => this.finish();
  },
  finish() {
    State.tourActive = false;
    $('#tourOverlay').classList.remove('open');
    $('#tourHighlight').style.display = 'none';
    $('#tourTooltip').style.display = 'none';
    StorageService.set('tourCompleted', true);
    Toast.success('Tour complete — you\'re ready to go!');
  }
};
