function drawChart(){const canvas=$('#activityChart');if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,style=getComputedStyle(document.documentElement),line=style.getPropertyValue('--line'),muted=style.getPropertyValue('--muted'),green=style.getPropertyValue('--green'),lime=style.getPropertyValue('--lime'),blue=style.getPropertyValue('--blue');ctx.clearRect(0,0,w,h);const pad={l:30,r:8,t:10,b:28},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;ctx.font='10px system-ui';ctx.strokeStyle=line;ctx.fillStyle=muted;for(let i=0;i<5;i++){let y=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(String(100-i*25),2,y+3)}const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],series=[[75,82,78,91,87,68,80],[61,70,66,74,81,59,73],[88,86,90,84,93,76,89]],colors=[green,lime,blue],group=cw/7,bw=Math.min(10,group*.19);series.forEach((arr,s)=>arr.forEach((v,i)=>{let x=pad.l+i*group+group*.5+(s-1)*bw*1.25,y=pad.t+ch*(1-v/100);ctx.fillStyle=colors[s];ctx.beginPath();ctx.roundRect(x-bw/2,y,bw,ch*v/100,3);ctx.fill()}));ctx.fillStyle=muted;days.forEach((d,i)=>ctx.fillText(d,pad.l+i*group+group*.5-8,h-7))}

function closeModal(){$('#modalBackdrop').classList.remove('show')}
function saveForm(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());const map={guard:'guards',site:'sites',roster:'rosters',attendance:'attendance',patrol:'patrols',incident:'incidents',equipment:'equipment',invoice:'invoices',hr:'hr'};const key=map[activeForm];const prefix={guard:'G',site:'S',roster:'R',attendance:'A',patrol:'P',incident:'I',equipment:'EQ',invoice:'INV',hr:'HR'}[activeForm];data.id=prefix+'-'+Date.now().toString().slice(-6);if(activeForm==='site'){data.guards=Number(data.guards);data.charge=Number(data.charge)}if(activeForm==='equipment')data.qty=Number(data.qty);if(activeForm==='invoice')data.amount=Number(data.amount);if(activeForm==='attendance'&&!data.out)data.out='—';if(activeForm==='incident'&&!data.status)data.status='Open';db[key].unshift(data);saveDB();closeModal();render();toast('Record saved on this device.');}
function cycleStatus(key,id,values){const x=db[key].find(x=>x.id===id);if(!x)return;x.status=values[(values.indexOf(x.status)+1)%values.length];saveDB();render();toast('Status updated to '+x.status+'.')}
function clockAction(id){const x=db.attendance.find(x=>x.id===id);if(!x)return;if(x.out==='—'){x.out=new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit',hour12:false});toast('Clock-out recorded.')}else{x.in=new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit',hour12:false});x.out='—';toast('New clock-in recorded.')}saveDB();render()}
function adjustStock(id){const x=db.equipment.find(x=>x.id===id);if(!x)return;const n=prompt('Enter adjustment amount (e.g. 5 or -2):','1');if(n===null||n.trim()===''||!Number.isFinite(Number(n)))return;x.qty=Math.max(0,Number(x.qty)+Number(n));x.condition=x.qty<10?'Reorder':x.condition;saveDB();render();toast('Stock quantity updated.')}
function invoiceAction(id){const x=db.invoices.find(x=>x.id===id);if(!x)return;if(x.status!=='Paid'){x.status='Paid';saveDB();render();toast('Invoice marked paid in demo records.')}else{printInvoice(x)}}
function printInvoice(x){const w=window.open('','_blank','width=700,height=750');if(!w){toast('Allow pop-ups to print this invoice.');return}w.document.write(`<html><head><title>${esc(x.id)}</title><style>body{font:15px Arial;padding:40px;color:#18251f}h1{color:#167653}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{border-bottom:1px solid #ddd;padding:12px;text-align:left}.total{font-size:24px;font-weight:bold;text-align:right;margin-top:25px}</style></head><body><h1>SentinelOps Kenya</h1><p>Security services invoice</p><hr><h2>Invoice ${esc(x.id)}</h2><p>Client: ${esc(x.client)}<br>Site: ${esc(x.site)}<br>Due date: ${esc(x.due)}</p><table><tr><th>Description</th><th>Amount</th></tr><tr><td>Security services</td><td>${money(x.amount)}</td></tr></table><p class="total">Total: ${money(x.amount)}</p><p>Status: ${esc(x.status)}</p><p style="margin-top:55px;color:#777">Demonstration invoice — connect approved finance workflows before issuing official invoices.</p><script>window.print()<\/script></body></html>`);w.document.close()}
function exportCSV(key){const c=config[key],rows=branchFilter(db[c.data]);if(!rows.length){toast('No records to export.');return}const cols=Object.keys(rows[0]);const csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');downloadFile(key+'-sentinelops.csv',csv,'text/csv');toast('CSV export prepared.')}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function backupData(){downloadFile('sentinelops-backup.json',JSON.stringify(db,null,2),'application/json');toast('JSON backup prepared.')}
function resetData(){if(!confirm('Restore the original sample data? This replaces records saved in this browser.'))return;db=structuredClone(seed);saveDB();render();toast('Sample data restored.')}
function saveProfile(){currentUser=$('#profileName').value.trim()||'Alex Mwangi';currentRole=$('#profileRole').value;$('#sideUser').textContent=currentUser;$('#sideRole').textContent=currentRole;toast('Demo profile updated.');render()}
function logout(){if(!confirm('Log out of the current demo session?'))return;currentUser='Guest User';currentRole='Signed out';$('#sideUser').textContent=currentUser;$('#sideRole').textContent=currentRole;toast('Demo session signed out. This does not revoke a real authenticated session.');setPage('dashboard')}
function notify(){const items=db.incidents.filter(x=>x.status!=='Closed').length+' open incidents · '+db.rosters.filter(x=>x.status==='Needs cover').length+' shifts need cover · '+db.hr.filter(x=>x.status==='Due soon').length+' compliance tasks due soon.';alert('Operations alerts\n\n'+items)}
function bindNav(){ $$('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page))); }
$('#themeBtn').addEventListener('click',()=>{const root=document.documentElement;const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';$('#themeBtn').textContent=dark?'☀':'☾';localStorage.setItem('sentinelops_theme',root.dataset.theme);if(currentPage==='dashboard')drawChart()});
$('#branchSelect').addEventListener('change',()=>render());$('#notifyBtn').addEventListener('click',notify);$('#logoutBtn').addEventListener('click',logout);$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
bindNav();const savedTheme=localStorage.getItem('sentinelops_theme');if(savedTheme){document.documentElement.dataset.theme=savedTheme;$('#themeBtn').textContent=savedTheme==='dark'?'☀':'☾'}
window.addEventListener('resize',()=>{if(currentPage==='dashboard')drawChart()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body></html>
