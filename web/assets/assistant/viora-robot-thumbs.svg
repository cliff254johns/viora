<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-label="VIORA friendly white and silver robot assistant">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#f1f7ff"/><stop offset=".78" stop-color="#b8c9df"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#43f2ff"/><stop offset=".5" stop-color="#009fe0"/><stop offset="1" stop-color="#075b9c"/></linearGradient>
