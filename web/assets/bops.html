<script>
'use strict';

/* ============================= UTILITIES ============================= */
const UTIL={
  id:(p='id')=>p+'_'+Math.random().toString(36).slice(2,9),
  now:()=>new Date().toISOString(),
  day:(d=new Date())=>d.toISOString().slice(0,10),
  fmtDate:(s)=>new Date(s).toLocaleDateString('en-KE',{day:'2-digit',month:'short',year:'numeric'}),
  fmtTime:(s)=>new Date(s).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}),
  money:(minor)=>'KSh '+(Math.round(Number(minor)||0)/100).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2}),
  num:(n)=>Math.round(n||0).toLocaleString('en-KE'),
  escape:(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  phone:(s)=>{let n=String(s||'').replace(/\D/g,'');if(n.startsWith('0'))n='254'+n.slice(1);if(n.startsWith('7')||n.startsWith('1'))n='254'+n;return n?'+'+n:''},
  dateAgo:(days)=>{let d=new Date();d.setDate(d.getDate()-days);return d.toISOString()},
  download:(name,text,type='text/csv;charset=utf-8;')=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  csv:(rows)=>'\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),
  wa:(text)=>'https://wa.me/?text='+encodeURIComponent(text),
  ageDays:(iso)=>iso?(Date.now()-new Date(iso).getTime())/86400000:9999,
  isToday:(iso)=>String(iso||'').slice(0,10)===UTIL.day()
};

/* ============================= STORAGE ============================= */
const STORAGE={
  key:'opsgrid.v2',
  load(){try{return JSON.parse(localStorage.getItem(this.key)||'null')}catch(e){return null}},
  save(){try{localStorage.setItem(this.key,JSON.stringify(DB));const s=document.getElementById('storageState');if(s)s.textContent='Saved · '+new Date().toLocaleTimeString()}catch(e){const s=document.getElementById('storageState');if(s)s.textContent='Session only · storage unavailable'}},
  clear(){localStorage.removeItem(this.key)}
};

/* ============================= ADAPTER STUBS ============================= */
const SYNC={
  isConfigured(){return false},
  init(){throw Error('Sync adapter not configured')},
  push(){throw Error('Sync adapter not configured')},
  pull(){throw Error('Sync adapter not configured')}
};
const MPESA={
  isConfigured(){return false},
  stkPush(){throw Error('M-Pesa Daraja not configured')},
  queryStatus(){throw Error('M-Pesa Daraja not configured')},
  parseSms(sms){
    if(!/^[A-Z0-9]{10}\s+Confirmed/i.test(sms))return null;
    const code=(sms.match(/^([A-Z0-9]{10})/)||[])[1];
    const amt=(sms.match(/Ksh([\d,\.]+)/i)||sms.match(/Ksh\s*([\d,\.]+)/i)||[])[1];
    const name=(sms.match(/from\s+(.+?)\s+on/i)||[])[1];
    if(!code)return null;
    return {code,amountMinor:amt?Math.round(parseFloat(amt.replace(/,/g,''))*100):0,payer:name||''};
  }
};
const ETIMS={
  isConfigured(){return false},
  transmit(invoice){throw Error('eTIMS device not configured');return invoice}
};

/* ============================= RBAC ============================= */
const RBAC={
  matrix:{
    owner:['view','sale','refund','expense','inventory','transfer','till','settings','staff','supplier','customer','automation','report','backup','credit','developer'],
    ops_manager:['view','sale','refund','expense','inventory','transfer','till','staff','supplier','customer','automation','report','backup','credit'],
    branch_manager:['view','sale','refund','expense','inventory','transfer','till','staff','customer','report','credit'],
    cashier:['view','sale','till','customer'],
    storekeeper:['view','inventory','transfer','supplier'],
    developer:['view','developer','backup','report','automation']
  },
  can(role,action){return (this.matrix[role]||[]).includes(action)}
};

/* ============================= BRANCH CONTEXT ============================= */
const BranchContext={
  selectedBranchId:'all',
  set(id){this.selectedBranchId=id;try{sessionStorage.setItem('opsgrid.branch',id)}catch(e){}App.render()},
  get(){return this.selectedBranchId}
};

/* ============================= SAMPLE DATA ============================= */
let DB=STORAGE.load()||null;

const sampleDB=()=>{
  const branches=['Westlands','Kilimani','Karen','Mombasa Road','Nakuru CBD'].map((name,i)=>({id:'b'+(i+1),name,address:['Westlands, Nairobi','Kilimani, Nairobi','Karen, Nairobi','Mombasa Road, Nairobi','Nakuru CBD'][i],county:['Nairobi','Nairobi','Nairobi','Nairobi','Nakuru'][i],phone:'+25470000000'+i,active:true,managerId:'s'+(i+2),barcode:'BR-'+(i+1),kraPin:'P05'+(1000+i)+'X'}))

  const staffNames=[['Amina Hassan','owner',0],['David Kiprop','ops_manager',0],['Mary Njoki','branch_manager',0],['Peter Mwangi','cashier',1],['Grace Wanjiru','storekeeper',2],['Brian Otieno','cashier',3],['Sarah Wambui','branch_manager',4]];
  const staff=staffNames.map((x,i)=>({id:'s'+(i+1),name:x[0],role:x[1],branchId:'b'+(x[2]+1),phone:'+2547'+(10000000+i),badge:'EMP-'+String(i+1).padStart(3,'0'),pin:String(1000+i),active:true,hourlyRateMinor:45000}));

  const pn=[['Filter Coffee 250g',85000,'Coffee','0901.21.00'],['Ceramic Mug',120000,'Homeware','6912.00.00'],['Notebook A5',45000,'Stationery','4820.10.00'],['Pen Pack (5)',35000,'Stationery','9608.10.00'],['Reusable Tote',50000,'Accessories','4202.92.00'],['Gift Card — 2,000',200000,'Gift cards','—'],['Cold Brew Bottle',60000,'Coffee','2101.12.00'],['Pastry Box',90000,'Food','1905.90.00'],['Enamel Pin',30000,'Accessories','7117.19.00'],['Postcard Set',70000,'Stationery','4911.10.00']];
  const products=pn.map((p,i)=>({id:'p'+(i+1),name:p[0],sku:'NWG-'+String(i+1).padStart(3,'0'),barcode:'600100000'+String(i+1).padStart(3,'0'),category:p[2],hsCode:p[3],uom:'pcs',priceMinor:p[1],costMinor:Math.round(p[1]*.58),active:true,expiryManaged:i===7,vatCode:'B'}));

  const inventory=[];
  branches.forEach((b,bi)=>products.forEach((p,pi)=>inventory.push({id:'i'+bi+'_'+pi,productId:p.id,branchId:b.id,qty:[7,12,24,3,18,6,9,5,31,11][(pi+bi*2)%10],threshold:8,updatedAt:UTIL.now()})));

  const suppliers=[
    ['Kenya Coffee Traders','+254712345601','Coffee',0,'P051111222A'],
    ['Nairobi Merch Co.','+254712345602','Merchandise',320000,'P052222333B'],
    ['Coast Print Works','+254712345603','Printing',185000,'P053333444C']
  ].map((s,i)=>({id:'sup'+i,name:s[0],phone:s[1],category:s[2],balanceMinor:s[3],kraPin:s[4]}));

  const customers=['Njeri Muthoni','Hassan Ali','Fatuma Noor','Kevin Kimani','Wairimu Kariuki'].map((n,i)=>({id:'c'+i,name:n,phone:'+2547'+(20000000+i),branchId:branches[i%5].id,points:i*20,creditMinor:i===1?450000:0,kraPin:i===1?'P059999888Z':'',customerType:i===1?'business':'individual',county:'Nairobi'}));

  const sales=[];
  // Seed 15 sales TODAY so KPIs are meaningful
  for(let i=0;i<15;i++){
    const bi=i%5, pi=(i*3)%products.length, qty=1+(i%3);
    const dt=new Date(); dt.setHours(8+(i%10),(i*7)%60,0,0);
    const total=products[pi].priceMinor*qty;
    sales.push({

  /* ---- Domain helpers ---- */
  branchName(id){return DB.branches.find(b=>b.id===id)?.name||'Unknown'},

  inScope(x){return BranchContext.get()==='all'||x.branchId===BranchContext.get()},
  sales(){return DB.sales.filter(s=>this.inScope(s))},

  transactions(){return this.todaySales().length},

  alerts(){

    this.lowStock().forEach(i=>out.push({rule:'Low stock',branchId:i.branchId,detail:this.product(i.productId)?.name+' · '+i.qty+' left',action:'Restock',id:i.id}));
    DB.tills.filter(t=>t.status==='closed'&&Math.abs(t.varianceMinor)>50000&&this.inScope(t)).forEach(t=>out.push({rule:'Till variance',branchId:t.branchId,detail:this.branchName(t.branchId)+' · '+UTIL.money(t.varianceMinor),action:'Review till',id:t.id}));
    DB.creditNotes.filter(c=>c.status!=='paid'&&c.dueDate<UTIL.day()&&(BranchContext.get()==='all'||c.branchId===BranchContext.get())).forEach(c=>out.push({rule:'Credit overdue',branchId:c.branchId,detail:this.customerName(c.customerId)+' · '+UTIL.money(c.amountMinor-c.paidMinor),action:'Record payment',id:c.id}));
    DB.transfers.filter(t=>t.status==='in_transit'&&UTIL.ageDays(t.dispatchedAt)>1&&(BranchContext.get()==='all'||t.fromBranchId===BranchContext.get()||t.toBranchId===BranchContext.get())).forEach(t=>out.push({rule:'Transfer in transit > 24 hours',branchId:t.fromBranchId,detail:t.barcode+' · awaiting receipt',action:'Receive transfer',id:t.id}));
    if(!DB.lastExportAt||UTIL.ageDays(DB.lastExportAt)>7)out.push({rule:'Backup reminder',detail:'No recent JSON backup',action:'Export backup',id:'backup'});
    // Expiring product: expiryManaged + old updatedAt (proxy for demo)
    DB.products.filter(p=>p.expiryManaged).forEach(p=>{
      this.inventory().filter(i=>i.productId===p.id&&i.qty>0).forEach(i=>out.push({rule:'Expiring product',branchId:i.branchId,detail:p.name+' · check batch dates',action:'Review stock',id:i.id}));
    });
    // No sales in 30 min
    const openTills=DB.tills.filter(t=>t.status==='open'&&this.inScope(t));
    if(openTills.length&&!this.todaySales().some(s=>Date.now()-new Date(s.at).getTime()<30*60000))out.push({rule:'No sales in 30 minutes',detail:'No till sale while branches are active',action:'Check till',id:'nosales'});
    // Expense spike
    const todayExp=DB.expenses.filter(e=>UTIL.isToday(e.at)&&this.inScope(e)).reduce((a,e)=>a+e.amountMinor,0);
    const trailing=Array.from({length:14},(_,i)=>UTIL.day(new Date(Date.now()-(i+1)*86400000)));
    const avg=trailing.reduce((a,d)=>a+DB.expenses.filter(e=>e.at.slice(0,10)===d&&this.inScope(e)).reduce((x,e)=>x+e.amountMinor,0),0)/14;
    if(todayExp>0&&avg>0&&todayExp>avg*1.5)out.push({rule:'Expense spike',detail:'Today exceeds 150% of trailing average',action:'Review expenses',id:'expspike'});
    // Branch staff shortage
    const nowH=new Date().getHours();
    if(nowH>=DB.settings.openingHours.start&&nowH<DB.settings.openingHours.end){
      this.branches().forEach(b=>{
        const onShift=new Set(DB.shiftLogs.filter(l=>l.branchId===b.id&&l.direction==='in').map(l=>l.staffId));
        if(onShift.size<2)out.push({rule:'Branch staff shortage',branchId:b.id,detail:b.name+' · '+onShift.size+' on shift',action:'Review rota',id:'shortage_'+b.id});
      });
    }
    // Invoice overdue
    this.invoices().filter(inv=>inv.status!=='paid'&&inv.dueDate<UTIL.day()).forEach(inv=>out.push({rule:'Invoice overdue',branchId:inv.branchId,detail:inv.number+' · '+UTIL.money(inv.totalMinor),action:'Follow up',id:inv.id}));
    // eTIMS pending
    this.invoices().filter(inv=>inv.etimsStatus==='pending').forEach(inv=>out.push({rule:'eTIMS pending',branchId:inv.branchId,detail:inv.number+' not transmitted',action:'Transmit',id:inv.id}));

    return out.filter(a=>!DB.automationHistory.some(h=>h.id===a.id&&h.dismissed));
  },
  audit(action,entity,entityId,meta={}){
    DB.audit.push({id:UTIL.id('audit'),actor:this.user?.name||'system',action,entity,entityId,at:UTIL.now(),meta});
    DB.audit=DB.audit.slice(-200);STORAGE.save()
  },
  toast(msg){
    const el=document.createElement('div');el.className='toast';el.textContent=msg;
    const t=document.getElementById('toasts');if(t){t.append(el);setTimeout(()=>el.remove(),3400)}

  /* ---- UI helpers ---- */
  panel(title,body,span='span-4',footer=''){return `<section class="panel ${span}"><div class="panel-head"><h3>${title}</h3>${footer}</div>${body}</section>`},
  kpi(title,value,delta,vals){return this.panel(title,`<div class="kpi">${value}</div><div class="small ${String(delta).includes('↑')?'':'muted'}">${delta}</div>${Charts.spark(vals)}`,'span-3')},
  chartPanel(title,chart,span='span-4',hint='Tap chart to expand'){return this.panel(title,`<div onclick="App.openChart(this)" title="${hint}">${chart}</div><div class="small muted">${hint}</div>`,span)},

  downloadChart(btn){const svg=btn.parentElement.querySelector('svg');if(!svg)return;UTIL.download('ops-grid-chart.svg',svg.outerHTML,'image/svg+xml')},

  },

  /* ---- Render dispatch ---- */
  render(){
    if(!this.role)return;
    try{
      this.buildNav();
      const titles={dashboard:'Ops Grid',branches:'Branches',sales:'Sales',invoices:'Invoices',inventory:'Inventory',tills:'Tills',expenses:'Expenses',suppliers:'Suppliers',customers:'Customers',staff:'Staff',automations:'Automation Centre',reports:'Reports',settings:'Settings',developer:'Developer panel'};
      const tt=document.getElementById('topTitle');if(tt)tt.textContent=titles[this.page]||'Ops Grid';
      const c=document.getElementById('content');if(!c)return;
      c.classList.toggle('mobile-home',this.page==='dashboard'&&matchMedia('(max-width:760px)').matches);
      let html='';
      const mobile=this.page==='dashboard'&&matchMedia('(max-width:760px)').matches;
      switch(this.page){
        case 'dashboard': html=mobile?this.renderMobileHome():this.renderDashboard(); break;
        case 'branches': html=this.renderBranches(); break;
        case 'sales': html=this.renderSales(); break;
        case 'invoices': html=this.renderInvoices(); break;
        case 'inventory': html=this.renderInventory(); break;
        case 'tills': html=this.renderTills(); break;
        case 'expenses': html=this.renderExpenses(); break;
        case 'suppliers': html=this.renderSuppliers(); break;
        case 'customers': html=this.renderCustomers(); break;
        case 'staff': html=this.renderStaff(); break;
        case 'automations': html=this.renderAutomations(); break;
        case 'reports': html=this.renderReports(); break;
        case 'settings': html=this.renderSettings(); break;
        case 'developer': html=this.renderDeveloper(); break;
        default: html=this.renderDashboard();
      }
      c.innerHTML=html;
      this.bindTips(c);this.labelTables(c);
    }catch(e){
      console.error(e);
      const c=document.getElementById('content');
      if(c)c.innerHTML=`<div class="panel span-12"><h2>Render error</h2><p class="muted">${UTIL.escape(e.message)}</p><button onclick="location.reload()">Reload</button></div>`;
    }
  },

`).join('')}<button style="margin-top:10px" onclick="App.navigate('inventory')">View inventory →</button>`,'span-4')}${this.panel('Credit overdue',`<div class="kpi">${UTIL.money(DB.creditNotes.filter(c=>c.status!=='paid'&&c.dueDate<UTIL.day()).reduce((a,c)=>a+c.amountMinor-c.paidMinor,0))}</div><div class="small muted">Outstanding overdue credit</div><button style="margin-top:10px" onclick="App.navigate('customers')">Review credit →</button>`,'span-4')}${this.panel('Staff on shift',`<div class="kpi">${onShift.length}</div><div class="staff-strip">${onShift.slice(0,8).map(s=>`<div class="staff-chip"><span class="avatar">${s.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span>${UTIL.escape(s.name.split(' ')[0])}<span class="muted">${UTIL.escape(this.branchName(s.branchId))}</span></div>`).join('')}</div>`,'span-4')}${this.panel('Expenses today',`<div class="kpi">${UTIL.money(DB.expenses.filter(e=>UTIL.isToday(e.at)&&this.inScope(e)).reduce((a,e)=>a+e.amountMinor,0))}</div>${Charts.spark([3,5,4,8,7,9,11,8,10,12,9,13,11,14])}`,'span-4')}${this.panel('Live pulse · '+alerts.length+' active',`<div class="timeline">${alerts.slice(0,4).map(a=>`<div class="timeline-item ${a.rule==='Till variance'?'danger':''}"><b>${UTIL.escape(a.rule)}</b><div class="small">${UTIL.escape(a.detail||'Review local rule')}</div><button style="margin-top:7px" onclick="App.handleAlert('${a.id}')">${UTIL.escape(a.action)}</button></div>`).join('')||'<p class="muted">No active alerts for the selected branch.</p>'}</div><button style="margin-top:10px" onclick="App.navigate('automations')">Automation Centre →</button>`,'span-8')}</div>`

}</div><div class="grid" style="margin-top:8px">${this.kpi('Gross margin',UTIL.money(base.reduce((sum,s)=>sum+s.lines.reduce((a,l)=>a+(l.unitPriceMinor-(this.product(l.productId)?.costMinor||0))*l.qty,0),0)),'Period margin',[8,10,9,13,12,14,16,15,18,19,17,20,22,24])}${this.kpi('Transactions',UTIL.num(base.length),'Completed sales',[4,5,7,6,9,8,11,10,12,11,14,15,14,16])}${this.kpi('Avg basket',UTIL.money(base.length?Math.round(rev/base.length):0),'Revenue / transactions',[3,5,4,7,6,8,7,9,10,9,11,10,12,13])}${this.kpi('Till variance',UTIL.money(DB.tills.filter(t=>this.inScope(t)).reduce((a,t)=>a+t.varianceMinor,0)),'Across selected branches',[1,2,1,3,2,2,4,3,2,1,2,3,2,1])}${this.kpi('Stock value',UTIL.money(this.stockValue()),this.lowStock().length+' low stock',[18,17,20,19,22,21,23,24,23,25,26,25,27,28])}${this.kpi('Credit overdue',UTIL.money(DB.creditNotes.filter(c=>c.status!=='paid'&&c.dueDate<UTIL.day()).reduce((a,c)=>a+c.amountMinor-c.paidMinor,0)),'Needs follow-up',[3,3,4,5,5,6,7,6,8,9,8,10,11,11])}</div><section class="panel" style="margin-top:12px"><div class="panel-head"><h3>Today's actions</h3><button onclick="App.navigate('automations')">All alerts →</button></div><div class="timeline">${alerts.slice(0,5).map(a=>`<div class="timeline-item ${a.rule==='Till variance'?'danger':''}"><b>${UTIL.escape(a.rule)}</b><div class="small">${UTIL.escape(a.detail||'Review local rule')}</div><button style="margin-top:8px" onclick="App.handleAlert('${a.id}')">${UTIL.escape(a.action)}</button></div>`).join('')||'<div class="muted">All clear. No active alerts.</div>'}</div></section><section class="panel" style="margin-top:12px"><div class="panel-head"><h3>Staff on shift</h3><button onclick="App.navigate('staff')">View staff →</button></div><div class="staff-strip">${onShift.map(s=>`<div class="staff-chip"><span class="avatar">${s.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span>${UTIL.escape(s.name.split(' ')[0])}<span class="muted">${UTIL.escape(this.branchName(s.branchId))}</span></div>`).join('')||'<span class="muted">No active shift logs</span>'}</div></section><section class="panel" style="margin-top:12px"><h3>Account</h3><div class="list-row" onclick="App.navigate('settings')"><span>⚙ Settings</span><span>›</span></div><div class="list-row" onclick="App.logout()"><span>↪ Log out</span><span>›</span></div></section>`

  /* ---- Branches ---- */
  renderBranches(){
    const rows=this.branches();
    return `<div class="headrow"><div><h1>Branches</h1><p class="muted">Branch-level operations · sample data</p></div><button class="primary" onclick="App.branchEdit()">＋ Add branch</button></div><div class="grid">${this.chartPanel('Revenue by branch',Charts.bar(DB.branches.map(b=>({label:b.name,value:this.sumSales(this.activeSales().filter(s=>s.branchId===b.id))}))),'span-8')}${this.panel('Branch count',`<div class="kpi">${DB.branches.length}</div><div class="muted small">Active locations</div>`,'span-4')}<section class="panel span-12"><div class="table-wrap"><table><thead><tr><th>Branch</th><th>County</th><th>Address</th><th>Today's revenue</th><th>Transactions</th><th>Low stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(b=>`<tr onclick="App.branchDetail('${b.id}')"><td>${UTIL.escape(b.name)}</td><td>${UTIL.escape(b.county||'—')}</td><td>${UTIL.escape(b.address)}</td><td>${UTIL.money(this.sumSales(this.todaySales().filter(s=>s.branchId===b.id)))}</td><td>${this.todaySales().filter(s=>s.branchId===b.id).length}</td><td>${DB.inventory.filter(i=>i.branchId===b.id&&i.qty<=i.threshold).length}</td><td><span class="badge success">Active</span></td><td><button onclick="event.stopPropagation();App.branchDetail('${b.id}')">Inspect</button></td></tr>`).join('')}</tbody></table></div></section></div>`
  },
  branchEdit(id){
    const b=DB.branches.find(x=>x.id===id)||{id:'',name:'',address:'',county:'Nairobi',phone:'',barcode:''};
    this.openSheet(id?'Edit branch':'Add branch',`<form class="stack" onsubmit="event.preventDefault();App.saveBranch('${id||''}')"><label>Branch name<input id="brName" required value="${UTIL.escape(b.name)}"></label><label>County<input id="brCounty" value="${UTIL.escape(b.county||'')}"></label><label>Address<input id="brAddress" value="${UTIL.escape(b.address)}"></label><label>Phone<input id="brPhone" value="${UTIL.escape(b.phone)}"></label><label>KRA PIN<input id="brPin" value="${UTIL.escape(b.kraPin||'')}"></label><label>Barcode<input id="brBarcode" value="${UTIL.escape(b.barcode||'')}"></label><button class="primary">Save branch</button></form>`)
  },
  saveBranch(id){
    const name=document.getElementById('brName').value.trim();if(!name)return;
    const existing=id?DB.branches.find(x=>x.id===id):null;
    const b={id:id||UTIL.id('b'),name,county:document.getElementById('brCounty').value,address:document.getElementById('brAddress').value,phone:UTIL.phone(document.getElementById('brPhone').value),kraPin:document.getElementById('brPin').value,barcode:document.getElementById('brBarcode').value||(existing?.barcode||'BR-'+Date.now()),active:true};
    if(existing)Object.assign(existing,b);else DB.branches.push(b);
    this.audit(id?'update':'create','branch',b.id);STORAGE.save();this.closeSheet();this.render();this.toast('Branch saved')
  },
  branchDetail(id){
    const b=DB.branches.find(x=>x.id===id);if(!b)return;
    this.openSheet(b.name,`<p class="muted">${UTIL.escape(b.address)} · ${UTIL.escape(b.phone)}</p><div class="grid"><div class="panel span-6"><div class="small muted">Today's revenue</div><div class="kpi">${UTIL.money(this.sumSales(this.todaySales().filter(s=>s.branchId===id)))}</div></div><div class="panel span-6"><div class="small muted">Low-stock lines</div><div class="kpi">${DB.inventory.filter(i=>i.branchId===id&&i.qty<=i.threshold).length}</div></div></div><button onclick="App.setBranch('${id}');App.closeSheet();App.navigate('dashboard')">Set branch filter</button> <button onclick="App.branchEdit('${id}')">Edit branch</button>`)
  },

  /* ---- Sales ---- */
  renderSales(){
    const rows=this.sales().slice().sort((a,b)=>b.at.localeCompare(a.at));
    const revenue=this.sumSales(rows);
    return `<div class="headrow"><div><h1>Sales</h1><p class="muted">Sale history · sample transactions are labelled</p></div><div class="actions"><button onclick="App.scanSheet()">▦ Scan</button><button class="primary" onclick="App.saleSheet()">＋ Record sale</button></div></div><div class="grid">${this.chartPanel('Revenue by day',Charts.line([{name:'Revenue',values:Array.from({length:7},(_,i)=>this.sumSales(rows.filter(s=>s.at.slice(0,10)===UTIL.day(new Date(Date.now()-(6-i)*86400000)))))}],{labels:['-6d','-5d','-4d','-3d','-2d','-1d','Today']}),'span-8')}${this.panel('Revenue total',`<div class="kpi">${UTIL.money(revenue)}</div><div class="muted small">Completed sales only</div>`,'span-4')}<section class="panel span-12"><div class="headrow"><label>Filter status<select id="saleStatus" onchange="App.filterSales()"><option value="all">All statuses</option><option>completed</option><option>refunded</option><option>voided</option></select></label><label>Search<input id="saleSearch" placeholder="Sale number or cashier" oninput="App.filterSales()"></label></div><div class="table-wrap"><table id="salesTable"><thead><tr><th>Sale</th><th>Date / time</th><th>Branch</th><th>Cashier</th><th>Payment</th><th>Total</th><th>Status</th><th>Sample</th></tr></thead><tbody>${rows.map(s=>this.saleRow(s)).join('')}</tbody></table></div></section></div>`
  },
  saleRow(s){return `<tr onclick="App.saleDetail('${s.id}')"><td>${s.number}</td><td>${UTIL.fmtDate(s.at)} ${UTIL.fmtTime(s.at)}</td><td>${UTIL.escape(this.branchName(s.branchId))}</td><td>${UTIL.escape(this.staffName(s.cashierId))}</td><td>${[...new Set((s.payments||[]).map(p=>p.method))].join(' + ')}</td><td>${UTIL.money(s.totalMinor)}</td><td><span class="badge ${s.status==='completed'?'success':s.status==='refunded'?'danger':'warning'}">${s.status}</span></td><td>${s.sample?'<span class="badge">Sample</span>':'Live demo entry'}</td></tr>`},
  filterSales(){
    const q=(document.getElementById('saleSearch')?.value||'').toLowerCase(),st=document.getElementById('saleStatus')?.value||'all';
    const t=document.querySelector('#salesTable tbody');if(t)t.innerHTML=this.sales().filter(s=>(st==='all'||s.status===st)&&(s.number.toLowerCase().includes(q)||this.staffName(s.cashierId).toLowerCase().includes(q))).sort((a,b)=>b.at.localeCompare(a.at)).map(s=>this.saleRow(s)).join('')
  },
  saleSheet(){this.cart=[];this.saleRenderSheet()},
  saleRenderSheet(){
    this.openSheet('Record sale',`<div class="form-grid"><label>Branch<select id="posBranch">${this.branches().map(b=>`<option value="${b.id}" ${b.id===BranchContext.get()?'selected':''}>${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Product search / barcode<input id="posSearch" placeholder="Scan or search product" oninput="App.posProducts()"></label></div><div id="posProducts" class="grid" style="margin:12px 0">${this.posProductCards('')}</div><h3>Cart</h3><div id="cartLines">${this.cartHTML()}</div><div class="panel" style="margin:12px 0"><div class="list-row"><span>Subtotal (VAT inclusive)</span><b id="cartTotal">${UTIL.money(this.cart.reduce((a,x)=>a+x.priceMinor*x.qty,0))}</b></div><div class="list-row"><span>VAT portion · ${DB.settings.vatRate}%</span><b id="cartVat">${UTIL.money(Math.round(this.cart.reduce((a,x)=>a+x.priceMinor*x.qty,0)*DB.settings.vatRate/(100+DB.settings.vatRate)))}</b></div></div><form class="stack" onsubmit="event.preventDefault();App.completeSale()"><label>Payment method<select id="payMethod"><option value="cash">Cash</option><option value="mpesa">M-Pesa (simulated)</option><option value="card">Card (simulated)</option><option value="split">Split: cash + M-Pesa</option></select></label><label>Amount received (KES)<input id="payAmount" type="number" min="0" step="0.01" placeholder="Optional; defaults to total"></label><label>Customer (optional)<select id="payCustomer"><option value="">—</option>${DB.customers.map(c=>`<option value="${c.id}">${UTIL.escape(c.name)}</option>`).join('')}</select></label><label><span>Also create formal invoice (VAT)</span><input type="checkbox" id="payInvoice" style="width:22px;min-height:22px"></label><button class="primary">Complete sale & print receipt</button></form><button style="margin-top:8px" onclick="App.holdSale()">Hold sale</button>`)
  },
  posProductCards(q){return DB.products.filter(p=>p.active&&(p.name+' '+p.barcode+' '+p.sku).toLowerCase().includes(q.toLowerCase())).map(p=>`<div class="panel span-6"><b>${UTIL.escape(p.name)}</b><div class="small muted">${UTIL.escape(p.sku)} · ${UTIL.money(p.priceMinor)}</div><button style="margin-top:8px" onclick="App.addCart('${p.id}')">Add to cart</button></div>`).join('')||'<div class="empty span-12">No matching products</div>'},
  posProducts(){const el=document.getElementById('posProducts');if(el)el.innerHTML=this.posProductCards(document.getElementById('posSearch').value)},
  addCart(id){const p=this.product(id);if(!p)return;const line=this.cart.find(x=>x.productId===id);if(line)line.qty++;else this.cart.push({productId:id,qty:1,priceMinor:p.priceMinor});this.refreshCart()},
  cartHTML(){return this.cart.map(x=>`<div class="list-row"><div><b>${UTIL.escape(this.product(x.productId)?.name)}</b><div class="small muted">${UTIL.money(x.priceMinor)} each</div></div><div class="row-actions"><button onclick="App.cartQty('${x.productId}',-1)">−</button><b>${x.qty}</b><button onclick="App.cartQty('${x.productId}',1)">＋</button></div></div>`).join('')||'<p class="muted">No items yet.</p>'},
  cartQty(id,n){const x=this.cart.find(x=>x.productId===id);if(x)x.qty+=n;this.cart=this.cart.filter(x=>x.qty>0);this.refreshCart()},
  refreshCart(){
    const el=document.getElementById('cartLines');if(el)el.innerHTML=this.cartHTML();
    const total=this.cart.reduce((a,x)=>a+x.priceMinor*x.qty,0);
    const t=document.getElementById('cartTotal'),v=document.getElementById('cartVat');
    if(t)t.textContent=UTIL.money(total);
    if(v)v.textContent=UTIL.money(Math.round(total*DB.settings.vatRate/(100+DB.settings.vatRate)))
  },
  holdSale(){try{sessionStorage.setItem('opsgrid.heldSale',JSON.stringify(this.cart));this.toast('Sale held in this browser session')}catch(e){}},
  completeSale(){
    if(!this.cart.length){this.toast('Add at least one product');return}
    if(!RBAC.can(this.role,'sale')){this.toast('Not authorised to record sales');return}
    const branchId=document.getElementById('posBranch').value;
    const total=this.cart.reduce((a,x)=>a+x.priceMinor*x.qty,0);
    const method=document.getElementById('payMethod').value;
    const paidInput=Math.round(Number(document.getElementById('payAmount').value||0)*100);
    const paid=paidInput||total;
    if(paid<total){this.toast('Payment is below the sale total');return}
    let payments;
    if(method==='split'){
      const cash=Math.floor(total/2);
      payments=[{method:'cash',amountMinor:cash,reference:''},{method:'mpesa',amountMinor:total-cash,reference:'QGH'+Math.random().toString(36).slice(2,9).toUpperCase()}]
    }else payments=[{method,amountMinor:total,reference:method==='mpesa'?'QGH'+Math.random().toString(36).slice(2,9).toUpperCase():''}];
    const lines=this.cart.map(x=>({...x}));
    for(const line of lines){
      const inv=DB.inventory.find(i=>i.branchId===branchId&&i.productId===line.productId);
      if(!inv||inv.qty<line.qty){this.toast('Insufficient stock for '+this.product(line.productId)?.name);return}
    }
    lines.forEach(l=>{const inv=DB.inventory.find(i=>i.branchId===branchId&&i.productId===l.productId);inv.qty-=l.qty;inv.updatedAt=UTIL.now()});
    const sale={id:UTIL.id('sale'),number:'NWG-'+(++DB.sequence.sale),branchId,tillId:DB.tills.find(t=>t.branchId===branchId&&t.status==='open')?.id||null,cashierId:this.user.id,lines,subtotalMinor:total,vatMinor:Math.round(total*DB.settings.vatRate/(100+DB.settings.vatRate)),discountMinor:0,totalMinor:total,payments,at:UTIL.now(),status:'completed',sample:false};
    DB.sales.unshift(sale);
    const custId=document.getElementById('payCustomer').value;
    if(custId){const c=DB.customers.find(x=>x.id===custId);if(c)c.points+=Math.floor(total/10000)}
    let invoice=null;
    if(document.getElementById('payInvoice').checked){
      invoice=this.createInvoiceFromSale(sale,custId||'');
    }
    this.audit('create','sale',sale.id,{totalMinor:total});STORAGE.save();
    this.cart=[];this.closeSheet();this.render();
    if(invoice)this.openSheet('Sale & invoice',`${this.receiptHTML(sale)}<hr><h3>Formal VAT Invoice</h3>${this.invoiceHTML(invoice)}`);
    else this.openSheet('Sale complete',this.receiptHTML(sale));
    this.toast('Sale recorded · '+sale.number)
  },

  /* ---- Invoices ---- */
  createInvoiceFromSale(sale,customerId){
    const n=DB.sequence.invoice++;
    const inv={
      id:UTIL.id('inv'),number:'INV-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0'),
      saleId:sale.id,customerId:customerId||'',branchId:sale.branchId,
      lines:sale.lines.map(l=>({...l})),
      subtotalMinor:sale.totalMinor-sale.vatMinor,vatMinor:sale.vatMinor,totalMinor:sale.totalMinor,
      issuedAt:UTIL.now(),dueDate:UTIL.day(new Date(Date.now()+14*86400000)),
      status:'sent',etimsStatus:'pending',
      kraPin:DB.settings.kraPin,vatNumber:DB.settings.vatNumber
    };
    DB.invoices.unshift(inv);
    return inv
  },
  renderInvoices(){
    const rows=this.invoices().slice().sort((a,b)=>b.issuedAt.localeCompare(a.issuedAt));
    const paid=rows.filter(i=>i.status==='paid').reduce((a,i)=>a+i.totalMinor,0);
    const out=rows.filter(i=>i.status!=='paid').reduce((a,i)=>a+i.totalMinor,0);
    return `<div class="headrow"><div><h1>Invoices</h1><p class="muted">Formal VAT invoices · eTIMS-ready · Kenyan KRA fields</p></div><div class="actions"><button onclick="App.invoiceListSheet()">＋ New invoice</button></div></div><div class="grid">${this.panel('Outstanding',`<div class="kpi">${UTIL.money(out)}</div><div class="muted small">Unpaid + sent</div>`,'span-4')}${this.panel('Paid (sample)',`<div class="kpi">${UTIL.money(paid)}</div><div class="muted small">Settled invoices</div>`,'span-4')}${this.panel('eTIMS status',`<div class="kpi">${rows.filter(i=>i.etimsStatus==='transmitted').length}/${rows.length}</div><div class="muted small">Transmitted</div><button style="margin-top:10px" onclick="App.transmitAll()">Transmit pending</button>`,'span-4')}<section class="panel span-12"><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Branch</th><th>Issued</th><th>Due</th><th>Total</th><th>Status</th><th>eTIMS</th><th>Action</th></tr></thead><tbody>${rows.map(inv=>`<tr onclick="App.invoiceDetail('${inv.id}')"><td>${inv.number}</td><td>${UTIL.escape(this.customerName(inv.customerId))}</td><td>${UTIL.escape(this.branchName(inv.branchId))}</td><td>${UTIL.fmtDate(inv.issuedAt)}</td><td>${inv.dueDate}</td><td>${UTIL.money(inv.totalMinor)}</td><td><span class="badge ${inv.status==='paid'?'success':inv.status==='overdue'?'danger':'warning'}">${inv.status}</span></td><td><span class="badge ${inv.etimsStatus==='transmitted'?'success':'warning'}">${inv.etimsStatus}</span></td><td><button onclick="event.stopPropagation();App.invoiceDetail('${inv.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="9"><div class="empty">No invoices yet</div></td></tr>'}</tbody></table></div></section></div>`
  },
  invoiceListSheet(){
    this.openSheet('New invoice',`<form class="stack" onsubmit="event.preventDefault();App.saveInvoice()"><label>Branch<select id="invBranch">${this.branches().map(b=>`<option value="${b.id}">${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Customer<select id="invCustomer"><option value="">Walk-in</option>${DB.customers.map(c=>`<option value="${c.id}">${UTIL.escape(c.name)}</option>`).join('')}</select></label><label>Product<select id="invProduct">${DB.products.map(p=>`<option value="${p.id}">${UTIL.escape(p.name)} · ${UTIL.money(p.priceMinor)}</option>`).join('')}</select></label><label>Quantity<input id="invQty" type="number" min="1" step="1" value="1"></label><label>Due date<input id="invDue" type="date" value="${UTIL.day(new Date(Date.now()+14*86400000))}"></label><button class="primary">Create invoice</button></form>`)
  },
  saveInvoice(){
    const branchId=document.getElementById('invBranch').value;
    const customerId=document.getElementById('invCustomer').value;
    const p=this.product(document.getElementById('invProduct').value);
    const qty=Number(document.getElementById('invQty').value);
    if(!p||!Number.isInteger(qty)||qty<1)return this.toast('Invalid input');
    const total=p.priceMinor*qty, vat=Math.round(total*DB.settings.vatRate/(100+DB.settings.vatRate));
    const n=DB.sequence.invoice++;
    const inv={id:UTIL.id('inv'),number:'INV-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0'),saleId:null,customerId,branchId,lines:[{productId:p.id,qty,unitPriceMinor:p.priceMinor}],subtotalMinor:total-vat,vatMinor:vat,totalMinor:total,issuedAt:UTIL.now(),dueDate:document.getElementById('invDue').value,status:'sent',etimsStatus:'pending',kraPin:DB.settings.kraPin,vatNumber:DB.settings.vatNumber};
    DB.invoices.unshift(inv);this.audit('create','invoice',inv.id);STORAGE.save();this.closeSheet();this.render();this.invoiceDetail(inv.id)
  },
  invoiceDetail(id){
    const inv=DB.invoices.find(i=>i.id===id);if(!inv)return;
    this.openSheet(inv.number,this.invoiceHTML(inv)+`
      <div class="actions" style="margin-top:12px">
        <button class="primary" onclick="window.print()">Print / PDF</button>
        <button onclick="App.shareInvoiceWA('${id}')">Share via WhatsApp</button>
        <button onclick="App.markInvoicePaid('${id}')">Mark paid</button>
        <button onclick="App.transmitInvoice('${id}')">Transmit eTIMS</button>
      </div>`)
  },
  invoiceHTML(inv){
    const cust=DB.customers.find(c=>c.id===inv.customerId);
    const branch=DB.branches.find(b=>b.id===inv.branchId);
    return `<div class="receipt"><center><b>${UTIL.escape(DB.settings.businessName)}</b><br>KRA PIN: ${UTIL.escape(DB.settings.kraPin)}<br>VAT No: ${UTIL.escape(DB.settings.vatNumber)}<br>${UTIL.escape(branch?.address||'')}<hr><b>TAX INVOICE</b><br>${UTIL.escape(inv.number)}<br>Issued: ${UTIL.fmtDate(inv.issuedAt)} · Due: ${inv.dueDate}</center><hr>Bill to:<br><b>${UTIL.escape(cust?.name||'Walk-in customer')}</b>${cust?.kraPin?'<br>PIN: '+UTIL.escape(cust.kraPin):''}${cust?.phone?'<br>'+UTIL.escape(cust.phone):''}<hr><table style="width:100%"><thead><tr><th style="position:static;background:none;color:#000">Description</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead><tbody>${inv.lines.map(l=>`<tr><td>${UTIL.escape(this.product(l.productId)?.name)}</td><td>${l.qty}</td><td>${UTIL.money(l.unitPriceMinor)}</td><td>${UTIL.money(l.unitPriceMinor*l.qty)}</td></tr>`).join('')}</tbody></table><hr><div>Subtotal (excl. VAT) <span style="float:right">${UTIL.money(inv.subtotalMinor)}</span></div><div>VAT (${DB.settings.vatRate}%) <span style="float:right">${UTIL.money(inv.vatMinor)}</span></div><b>TOTAL <span style="float:right">${UTIL.money(inv.totalMinor)}</span></b><hr><center>Status: ${inv.status} · eTIMS: ${inv.etimsStatus}<br>${UTIL.escape(DB.settings.receiptFooter)}</center></div>`
  },
  markInvoicePaid(id){
    const inv=DB.invoices.find(i=>i.id===id);if(!inv)return;
    inv.status='paid';inv.paidAt=UTIL.now();this.audit('invoice_paid','invoice',id);STORAGE.save();this.closeSheet();this.render();this.toast('Invoice marked paid')
  },
  shareInvoiceWA(id){
    const inv=DB.invoices.find(i=>i.id===id);if(!inv)return;
    const text=`${DB.settings.businessName}\nTAX INVOICE ${inv.number}\nTo: ${this.customerName(inv.customerId)}\nTotal: ${UTIL.money(inv.totalMinor)}\nVAT: ${UTIL.money(inv.vatMinor)}\nDue: ${inv.dueDate}\nKRA PIN: ${DB.settings.kraPin}`;
    window.open(UTIL.wa(text),'_blank')
  },
  transmitInvoice(id){
    const inv=DB.invoices.find(i=>i.id===id);if(!inv)return;
    try{ETIMS.transmit(inv)}catch(e){
      // Stub behavior: log attempt, mark pending, show error
      DB.automationHistory.push({id:inv.id,rule:'eTIMS pending',action:'transmit_attempt',at:UTIL.now(),error:String(e.message||e)});
      STORAGE.save();this.toast('eTIMS not configured · '+e.message);
      return
    }
  },
  transmitAll(){
    let n=0;DB.invoices.filter(i=>i.etimsStatus==='pending').forEach(inv=>{
      try{ETIMS.transmit(inv);inv.etimsStatus='transmitted';n++}catch(e){}
    });
    STORAGE.save();this.render();this.toast(n?n+' transmitted':'eTIMS not configured · 0 transmitted')
  },

  /* ---- Inventory ---- */
  renderInventory(){
    const rows=this.inventory();
    return `<div class="headrow"><div><h1>Inventory</h1><p class="muted">Branch stock, stock-take and transfers · sample data</p></div><div class="actions"><button onclick="App.stocktakeSheet()">Stock-take</button><button onclick="App.transferSheet()">Transfer</button><button class="primary" onclick="App.adjustSheet()">Adjust stock</button></div></div><div class="grid">${this.chartPanel('Stock value by branch',Charts.bar(this.branches().map(b=>({label:b.name,value:DB.inventory.filter(i=>i.branchId===b.id).reduce((a,i)=>a+(this.product(i.productId)?.costMinor||0)*i.qty,0)}))),'span-8')}${this.panel('Low-stock items',`<div class="kpi">${this.lowStock().length}</div><button onclick="App.stocktakeSheet()">Start stock-take</button>`,'span-4')}<section class="panel span-12"><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU / barcode</th><th>Branch</th><th>On hand</th><th>Threshold</th><th>Stock value</th><th>Action</th></tr></thead><tbody>${rows.map(i=>{const p=this.product(i.productId);return `<tr><td>${UTIL.escape(p?.name)}</td><td>${p?.sku}<br><span class="muted small">${p?.barcode}</span></td><td>${UTIL.escape(this.branchName(i.branchId))}</td><td><span class="badge ${i.qty<=i.threshold?'warning':'success'}">${i.qty}</span></td><td>${i.threshold}</td><td>${UTIL.money((p?.costMinor||0)*i.qty)}</td><td><button onclick="App.productSheet('${i.productId}')">Inspect</button></td></tr>`}).join('')}</tbody></table></div></section><section class="panel span-12"><div class="panel-head"><h3>Transfers</h3><button onclick="App.transferSheet()">＋ New transfer</button></div>${DB.transfers.map(t=>`<div class="list-row"><div><b>${t.barcode}</b><div class="small muted">${this.branchName(t.fromBranchId)} → ${this.branchName(t.toBranchId)} · ${t.lines.length} lines</div></div><span class="badge ${t.status==='received'?'success':'warning'}">${t.status}</span><button onclick="App.transferDetail('${t.id}')">Open</button></div>`).join('')}</section></div>`
  },
  productSheet(id){
    const p=this.product(id);if(!p)return;
    this.openSheet(p.name,`<p class="muted">${p.sku} · ${p.barcode} · HS ${p.hsCode||'—'}</p><div class="kpi">${UTIL.money(p.priceMinor)}</div><div class="list-row"><span>Category</span><b>${UTIL.escape(p.category)}</b></div><h3>Stock by branch</h3>${DB.inventory.filter(i=>i.productId===id).map(i=>`<div class="list-row"><span>${UTIL.escape(this.branchName(i.branchId))}</span><b>${i.qty} units</b></div>`).join('')}<button onclick="App.adjustSheet('${id}')">Adjust stock</button> <button onclick="App.transferSheet('${id}')">Transfer stock</button> <button onclick="App.saleSheet();App.addCart('${id}')">Add to sale</button>`)
  },
  adjustSheet(productId){
    this.openSheet('Adjust stock',`<form class="stack" onsubmit="event.preventDefault();App.saveAdjustment('${productId||''}')"><label>Branch<select id="adjBranch">${this.branches().map(b=>`<option value="${b.id}">${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Product<select id="adjProduct">${DB.products.map(p=>`<option value="${p.id}" ${p.id===productId?'selected':''}>${UTIL.escape(p.name)}</option>`).join('')}</select></label><label>Quantity change (+/-)<input id="adjQty" type="number" step="1" required></label><label>Reason<select id="adjReason"><option>Stock count correction</option><option>Damaged goods</option><option>Opening stock</option><option>Other</option></select></label><button class="primary">Save adjustment</button></form>`)
  },
  saveAdjustment(){
    const b=document.getElementById('adjBranch').value,p=document.getElementById('adjProduct').value,q=Number(document.getElementById('adjQty').value);
    if(!Number.isInteger(q)||!q)return this.toast('Enter a non-zero whole quantity');
    let i=DB.inventory.find(x=>x.branchId===b&&x.productId===p);
    if(!i){i={id:UTIL.id('inv'),branchId:b,productId:p,qty:0,threshold:8};DB.inventory.push(i)}
    if(i.qty+q<0)return this.toast('Stock cannot become negative');
    i.qty+=q;i.updatedAt=UTIL.now();
    this.audit('stock_adjust','inventory',i.id,{qty:q,reason:document.getElementById('adjReason').value});
    STORAGE.save();this.closeSheet();this.render();this.toast('Stock adjustment saved')
  },
  stocktakeSheet(){
    this.openSheet('Stock-take',`<p class="muted">Scan a product barcode or select it manually.</p><form class="stack" onsubmit="event.preventDefault();App.saveStocktake()"><label>Branch<select id="stBranch">${this.branches().map(b=>`<option value="${b.id}">${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Scan / product barcode<input id="stBarcode" placeholder="Scan or enter barcode" oninput="App.lookupBarcode('stBarcode','stProduct')"></label><label>Product<select id="stProduct">${DB.products.map(p=>`<option value="${p.id}">${UTIL.escape(p.name)} · ${p.barcode}</option>`).join('')}</select></label><label>Counted quantity<input id="stQty" type="number" min="0" step="1" required></label><button class="primary">Save stock count</button></form>`)
  },
  saveStocktake(){
    const b=document.getElementById('stBranch').value,p=document.getElementById('stProduct').value,q=Number(document.getElementById('stQty').value);
    if(!Number.isInteger(q)||q<0)return this.toast('Enter a valid whole-number count');
    let i=DB.inventory.find(x=>x.branchId===b&&x.productId===p);
    if(!i){i={id:UTIL.id('inv'),branchId:b,productId:p,qty:0,threshold:8};DB.inventory.push(i)}
    const delta=q-i.qty;i.qty=q;i.updatedAt=UTIL.now();
    this.audit('stocktake','inventory',i.id,{count:q,delta});
    STORAGE.save();this.closeSheet();this.render();this.toast('Stock-take saved · variance '+delta)
  },
  transferSheet(productId){
    this.openSheet('Create stock transfer',`<form class="stack" onsubmit="event.preventDefault();App.saveTransfer()"><label>From branch<select id="trFrom">${this.branches().map(b=>`<option value="${b.id}">${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>To branch<select id="trTo">${this.branches().map(b=>`<option value="${b.id}" ${b.id!==BranchContext.get()?'selected':''}>${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Product<select id="trProduct">${DB.products.map(p=>`<option value="${p.id}" ${p.id===productId?'selected':''}>${UTIL.escape(p.name)}</option>`).join('')}</select></label><label>Quantity<input id="trQty" type="number" min="1" step="1" value="1" required></label><button class="primary">Create transfer draft</button></form>`)
  },
  saveTransfer(){
    const from=document.getElementById('trFrom').value,to=document.getElementById('trTo').value,p=document.getElementById('trProduct').value,q=Number(document.getElementById('trQty').value);
    if(from===to)return this.toast('Choose two different branches');
    if(!Number.isInteger(q)||q<1)return this.toast('Quantity must be a positive integer');
    const inv=DB.inventory.find(i=>i.branchId===from&&i.productId===p);
    if(!inv||inv.qty<q)return this.toast('Insufficient stock at source branch');
    const t={id:UTIL.id('tr'),fromBranchId:from,toBranchId:to,status:'draft',barcode:'TR-'+Date.now().toString().slice(-6),lines:[{productId:p,qty:q}],dispatchedAt:null,receivedAt:null};
    DB.transfers.unshift(t);this.audit('create','transfer',t.id);STORAGE.save();this.closeSheet();this.transferDetail(t.id)
  },
  transferDetail(id){
    const t=DB.transfers.find(x=>x.id===id);if(!t)return;
    this.openSheet('Transfer · '+t.barcode,`<div class="list-row"><span>Status</span><b>${t.status}</b></div><div class="list-row"><span>Route</span><b>${this.branchName(t.fromBranchId)} → ${this.branchName(t.toBranchId)}</b></div>${t.lines.map(l=>`<div class="list-row"><span>${UTIL.escape(this.product(l.productId)?.name)}</span><b>${l.qty}</b></div>`).join('')}<label>Scan transfer barcode<input id="transferScan" value="${t.barcode}" placeholder="Scan transfer ID"></label><div class="actions" style="margin-top:12px">${t.status==='draft'?`<button class="primary" onclick="App.dispatchTransfer('${id}')">Dispatch / scan-out</button>`:''}${t.status==='in_transit'?`<button class="primary" onclick="App.receiveTransfer('${id}')">Receive / scan-in</button>`:''}</div>`)
  },
  dispatchTransfer(id){
    const t=DB.transfers.find(x=>x.id===id);if(!t||t.status!=='draft')return;
    const scanned=(document.getElementById('transferScan')?.value||'').trim();
    if(scanned!==t.barcode){this.toast('Scan does not match transfer barcode');return}
    for(const l of t.lines){const i=DB.inventory.find(x=>x.branchId===t.fromBranchId&&x.productId===l.productId);if(!i||i.qty<l.qty)return this.toast('Insufficient stock to dispatch')}
    t.lines.forEach(l=>{DB.inventory.find(x=>x.branchId===t.fromBranchId&&x.productId===l.productId).qty-=l.qty});
    t.status='in_transit';t.dispatchedAt=UTIL.now();this.audit('transfer_dispatch','transfer',id);STORAGE.save();this.transferDetail(id);this.toast('Transfer dispatched')
  },
  receiveTransfer(id){
    const t=DB.transfers.find(x=>x.id===id);if(!t||t.status!=='in_transit')return;
    const scanned=(document.getElementById('transferScan')?.value||'').trim();
    if(scanned!==t.barcode){this.toast('Scan does not match transfer barcode');return}
    t.lines.forEach(l=>{let i=DB.inventory.find(x=>x.branchId===t.toBranchId&&x.productId===l.productId);if(!i){i={id:UTIL.id('inv'),branchId:t.toBranchId,productId:l.productId,qty:0,threshold:8};DB.inventory.push(i)}i.qty+=l.qty});
    t.status='received';t.receivedAt=UTIL.now();this.audit('transfer_receive','transfer',id);STORAGE.save();this.transferDetail(id);this.toast('Transfer received')
  },

  /* ---- Tills ---- */
  renderTills(){
    const rows=DB.tills.filter(t=>this.inScope(t));
    return `<div class="headrow"><div><h1>Tills</h1><p class="muted">Till sessions, floats and cash reconciliation</p></div><div class="actions"><button onclick="App.scanSheet()">▦ Scan till</button><button class="primary" onclick="App.openTillSheet()">＋ Open till</button></div></div><div class="grid">${this.chartPanel('Variance by branch',Charts.bar(this.branches().map(b=>({label:b.name,value:Math.abs(DB.tills.find(t=>t.branchId===b.id)?.varianceMinor||0)}))),'span-8')}${this.panel('Open sessions',`<div class="kpi">${rows.filter(t=>t.status==='open').length}</div><div class="muted small">Across selected branches</div>`,'span-4')}<section class="panel span-12"><table><thead><tr><th>Till</th><th>Branch</th><th>Opened by</th><th>Float</th><th>Expected cash</th><th>Variance</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.id}<br><span class="muted small">${t.barcode}</span></td><td>${UTIL.escape(this.branchName(t.branchId))}</td><td>${UTIL.escape(this.staffName(t.openedBy))}</td><td>${UTIL.money(t.floatMinor)}</td><td>${UTIL.money(t.expectedCashMinor)}</td><td class="${Math.abs(t.varianceMinor)>50000?'danger-text':''}">${UTIL.money(t.varianceMinor)}</td><td><span class="badge ${t.status==='open'?'success':''}">${t.status}</span></td><td>${t.status==='open'?`<button onclick="App.closeTillSheet('${t.id}')">Close till</button>`:`<button onclick="App.tillDetail('${t.id}')">Inspect</button>`}</td></tr>`).join('')}</tbody></table></section></div>`
  },
  openTillSheet(){
    this.openSheet('Open till',`<form class="stack" onsubmit="event.preventDefault();App.openTill()"><label>Branch<select id="tillBranch">${this.branches().map(b=>`<option value="${b.id}">${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Float (KES)<input id="tillFloat" type="number" min="0" step="0.01" value="5000" required></label><label>Till barcode<input id="tillBarcode" placeholder="Optional till scan"></label><button class="primary">Open till</button></form>`)
  },
  openTill(){
    if(!RBAC.can(this.role,'till')){this.toast('Not authorised');return}
    const b=document.getElementById('tillBranch').value;
    if(DB.tills.some(t=>t.branchId===b&&t.status==='open'))return this.toast('This branch already has an open till in the demo');
    const t={id:'t'+(++DB.sequence.till),branchId:b,openedBy:this.user.id,openedAt:UTIL.now(),closedAt:null,floatMinor:Math.round(Number(document.getElementById('tillFloat').value)*100),expectedCashMinor:0,countedCashMinor:0,varianceMinor:0,status:'open',barcode:document.getElementById('tillBarcode').value||'TILL-'+DB.sequence.till};
    DB.tills.push(t);this.audit('open','till',t.id);STORAGE.save();this.closeSheet();this.render();this.toast('Till opened')
  },
  closeTillSheet(id){
    const t=DB.tills.find(x=>x.id===id);
    this.openSheet('Close till · '+t.id,`<p class="muted">Expected cash includes opening float plus recorded cash sales for this till in this demo.</p><div class="list-row"><span>Opening float</span><b>${UTIL.money(t.floatMinor)}</b></div><label>Counted cash (KES)<input id="countedCash" type="number" min="0" step="0.01" value="${(t.floatMinor/100).toFixed(2)}"></label><button class="primary" style="margin-top:12px" onclick="App.closeTill('${id}')">Reconcile & close</button>`)
  },
  closeTill(id){
    const t=DB.tills.find(x=>x.id===id);if(!t||t.status!=='open')return;
    // FIX: count cash sales tied to this till OR same branch when tillId missing
    const cashSales=DB.sales.filter(s=>s.status==='completed'&&(s.tillId===id||(!s.tillId&&s.branchId===t.branchId))).flatMap(s=>s.payments||[]).filter(p=>p.method==='cash').reduce((a,p)=>a+p.amountMinor,0);
    t.expectedCashMinor=t.floatMinor+cashSales;
    t.countedCashMinor=Math.round(Number(document.getElementById('countedCash').value)*100);
    t.varianceMinor=t.countedCashMinor-t.expectedCashMinor;
    t.status='closed';t.closedAt=UTIL.now();
    this.audit('close','till',id,{varianceMinor:t.varianceMinor});STORAGE.save();this.closeSheet();this.render();
    this.toast('Till closed · variance '+UTIL.money(t.varianceMinor));
    if(Math.abs(t.varianceMinor)>50000)this.toast('Warning: variance exceeds KES 500')
  },
  tillDetail(id){
    const t=DB.tills.find(x=>x.id===id);
    this.openSheet('Till state · '+id,`<pre style="white-space:pre-wrap;overflow-wrap:anywhere">${UTIL.escape(JSON.stringify(t,null,2))}</pre>`)
  },

    if(!Number.isSafeInteger(amount)||amount<=0)return this.toast('Enter a valid amount');
