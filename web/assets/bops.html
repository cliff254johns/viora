  /* ---- Suppliers + PO receive ---- */
  renderSuppliers(){
    return `<div class="headrow"><div><h1>Suppliers</h1><p class="muted">Supplier directory and purchase order register</p></div><button class="primary" onclick="App.supplierSheet()">＋ Add supplier</button></div><div class="grid">${this.chartPanel('Supplier balances',Charts.hbar(DB.suppliers.map(s=>({label:s.name,value:s.balanceMinor}))),'span-6')}${this.panel('Supplier count',`<div class="kpi">${DB.suppliers.length}</div><div class="muted small">Registered suppliers</div>`,'span-6')}<section class="panel span-12"><table><thead><tr><th>Supplier</th><th>Phone</th><th>KRA PIN</th><th>Category</th><th>Balance</th><th>Purchase orders</th><th>Action</th></tr></thead><tbody>${DB.suppliers.map(s=>`<tr><td>${UTIL.escape(s.name)}</td><td>${UTIL.escape(s.phone)}</td><td>${UTIL.escape(s.kraPin||'—')}</td><td>${UTIL.escape(s.category)}</td><td>${UTIL.money(s.balanceMinor)}</td><td>${DB.purchaseOrders.filter(p=>p.supplierId===s.id).length}</td><td><button onclick="App.supplierSheet('${s.id}')">Edit</button> <button onclick="App.purchaseOrderSheet('${s.id}')">New PO</button></td></tr>`).join('')}</tbody></table></section><section class="panel span-12"><h3>Purchase orders</h3>${DB.purchaseOrders.map(p=>`<div class="list-row"><div><span>${p.number} · ${UTIL.escape(DB.suppliers.find(s=>s.id===p.supplierId)?.name||'Supplier')} · ${UTIL.money(p.totalMinor)}</span><div class="small muted">${p.lines.length} lines · ${this.branchName(p.branchId)}</div></div><span class="badge ${p.status==='received'?'success':'warning'}">${p.status}</span>${p.status!=='received'?`<button onclick="App.receivePO('${p.id}')">Receive into stock</button>`:''}</div>`).join('')||'<p class="muted">No purchase orders recorded.</p>'}</section></div>`
  },
  supplierSheet(id){
    const s=DB.suppliers.find(x=>x.id===id)||{name:'',phone:'',category:'',balanceMinor:0,kraPin:''};
    this.openSheet(id?'Edit supplier':'Add supplier',`<form class="stack" onsubmit="event.preventDefault();App.saveSupplier('${id||''}')"><label>Name<input id="supName" required value="${UTIL.escape(s.name)}"></label><label>Phone<input id="supPhone" value="${UTIL.escape(s.phone)}"></label><label>KRA PIN<input id="supPin" value="${UTIL.escape(s.kraPin||'')}"></label><label>Category<input id="supCat" value="${UTIL.escape(s.category)}"></label><label>Balance (KES)<input id="supBalance" type="number" step="0.01" value="${(s.balanceMinor/100).toFixed(2)}"></label><button class="primary">Save supplier</button></form>`)
  },
  saveSupplier(id){
    const s={id:id||UTIL.id('sup'),name:document.getElementById('supName').value.trim(),phone:UTIL.phone(document.getElementById('supPhone').value),kraPin:document.getElementById('supPin').value,category:document.getElementById('supCat').value,balanceMinor:Math.round(Number(document.getElementById('supBalance').value||0)*100)};
    if(!s.name)return this.toast('Name is required');
    if(id)Object.assign(DB.suppliers.find(x=>x.id===id),s);else DB.suppliers.push(s);
    STORAGE.save();this.closeSheet();this.render();this.toast('Supplier saved')
  },
  purchaseOrderSheet(id){
    this.openSheet('New purchase order',`<form class="stack" onsubmit="event.preventDefault();App.savePO('${id}')"><label>Branch<select id="poBranch">${this.branches().map(b=>`<option value="${b.id}">${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Product<select id="poProduct">${DB.products.map(p=>`<option value="${p.id}">${UTIL.escape(p.name)}</option>`).join('')}</select></label><label>Quantity<input id="poQty" type="number" min="1" step="1" value="10"></label><label>Unit cost (KES)<input id="poCost" type="number" min="0.01" step="0.01" required></label><label>Expected date<input id="poDate" type="date"></label><button class="primary">Create purchase order</button></form>`)
  },
  savePO(supplierId){
    const p=this.product(document.getElementById('poProduct').value);
    const qty=Number(document.getElementById('poQty').value);
    const cost=Math.round(Number(document.getElementById('poCost').value)*100);
    if(!p||!Number.isInteger(qty)||qty<1||cost<=0)return this.toast('Invalid PO line');
    const po={id:UTIL.id('po'),number:'PO-'+(DB.sequence.po++),supplierId,branchId:document.getElementById('poBranch').value,lines:[{productId:p.id,qty,unitCostMinor:cost}],totalMinor:qty*cost,status:'ordered',expectedAt:document.getElementById('poDate').value,createdAt:UTIL.now()};
    DB.purchaseOrders.push(po);this.audit('create','purchase_order',po.id);STORAGE.save();this.closeSheet();this.render();this.toast('Purchase order created')
  },
  receivePO(id){
    // FIX: actually add to inventory
    const po=DB.purchaseOrders.find(x=>x.id===id);if(!po)return;
    if(po.status==='received')return;
    if(!confirm('Receive '+po.number+' into '+this.branchName(po.branchId)+' inventory?'))return;
    po.lines.forEach(l=>{
      let i=DB.inventory.find(x=>x.branchId===po.branchId&&x.productId===l.productId);
      if(!i){i={id:UTIL.id('inv'),branchId:po.branchId,productId:l.productId,qty:0,threshold:8};DB.inventory.push(i)}
      i.qty+=l.qty;i.updatedAt=UTIL.now()
    });
    po.status='received';po.receivedAt=UTIL.now();
    this.audit('receive','purchase_order',id,{lines:po.lines.length});
    STORAGE.save();this.render();this.toast('PO received · stock updated')
  },

  /* ---- Customers + credit ---- */
  renderCustomers(){
    return `<div class="headrow"><div><h1>Customers</h1><p class="muted">Customer records, loyalty and credit notes</p></div><div class="actions"><button onclick="App.scanSheet()">▦ Check in</button><button class="primary" onclick="App.customerEdit()">＋ Add customer</button></div></div><div class="grid">${this.chartPanel('Credit ageing',Charts.bar([{label:'Current',value:DB.creditNotes.filter(c=>c.dueDate>=UTIL.day()).reduce((a,c)=>a+c.amountMinor-c.paidMinor,0)},{label:'Overdue',value:DB.creditNotes.filter(c=>c.dueDate<UTIL.day()&&c.status!=='paid').reduce((a,c)=>a+c.amountMinor-c.paidMinor,0)}]),'span-6')}${this.panel('Outstanding credit',`<div class="kpi">${UTIL.money(DB.creditNotes.reduce((a,c)=>a+c.amountMinor-c.paidMinor,0))}</div>`,'span-6')}<section class="panel span-12"><table><thead><tr><th>Customer</th><th>Phone</th><th>KRA PIN</th><th>Home branch</th><th>Points</th><th>Credit</th><th>Action</th></tr></thead><tbody>${DB.customers.map(c=>`<tr onclick="App.customerSheet('${c.id}')"><td>${UTIL.escape(c.name)}</td><td>${UTIL.escape(c.phone)}</td><td>${UTIL.escape(c.kraPin||'—')}</td><td>${UTIL.escape(this.branchName(c.branchId))}</td><td>${c.points}</td><td>${UTIL.money(c.creditMinor)}</td><td><button onclick="event.stopPropagation();App.customerSheet('${c.id}')">Open</button></td></tr>`).join('')}</tbody></table></section><section class="panel span-12"><h3>Credit notes</h3>${DB.creditNotes.map(c=>`<div class="list-row"><div><b>${UTIL.escape(this.customerName(c.customerId))}</b><div class="small muted">Due ${c.dueDate} · ${c.status}${c.reason?' · '+UTIL.escape(c.reason):''}</div></div><b>${UTIL.money(c.amountMinor-c.paidMinor)}</b><button onclick="App.creditPayment('${c.id}')">Record payment</button> <button onclick="App.printCreditNote('${c.id}')">Print</button></div>`).join('')||'<p class="muted">No credit notes.</p>'}</section></div>`
  },
  customerEdit(id){
    const c=DB.customers.find(x=>x.id===id)||{name:'',phone:'',branchId:DB.branches[0].id,points:0,creditMinor:0,kraPin:'',customerType:'individual',county:'Nairobi'};
    this.openSheet(id?'Edit customer':'Add customer',`<form class="stack" onsubmit="event.preventDefault();App.saveCustomer('${id||''}')"><label>Name<input id="custName" required value="${UTIL.escape(c.name)}"></label><label>Phone<input id="custPhone" value="${UTIL.escape(c.phone)}"></label><label>KRA PIN<input id="custPin" value="${UTIL.escape(c.kraPin||'')}"></label><label>Type<select id="custType"><option ${c.customerType==='individual'?'selected':''}>individual</option><option ${c.customerType==='business'?'selected':''}>business</option></select></label><label>County<input id="custCounty" value="${UTIL.escape(c.county||'')}"></label><label>Home branch<select id="custBranch">${DB.branches.map(b=>`<option value="${b.id}" ${b.id===c.branchId?'selected':''}>${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Loyalty points<input id="custPoints" type="number" min="0" value="${c.points}"></label><button class="primary">Save customer</button></form>`)
  },
  saveCustomer(id){
    const name=document.getElementById('custName').value.trim();if(!name)return this.toast('Name is required');
    const c={id:id||UTIL.id('c'),name,phone:UTIL.phone(document.getElementById('custPhone').value),kraPin:document.getElementById('custPin').value,customerType:document.getElementById('custType').value,county:document.getElementById('custCounty').value,branchId:document.getElementById('custBranch').value,points:Number(document.getElementById('custPoints').value||0),creditMinor:0};
    if(id){const old=DB.customers.find(x=>x.id===id);c.creditMinor=old.creditMinor;Object.assign(old,c)}else DB.customers.push(c);
    STORAGE.save();this.closeSheet();this.render();this.toast('Customer saved')
  },
  customerSheet(id){
    const c=DB.customers.find(x=>x.id===id);if(!c)return;
    this.openSheet(c.name,`<p>${UTIL.escape(c.phone)}${c.kraPin?' · PIN '+UTIL.escape(c.kraPin):''}</p><div class="list-row"><span>Home branch</span><b>${UTIL.escape(this.branchName(c.branchId))}</b></div><div class="list-row"><span>Loyalty points</span><b>${c.points}</b></div><div class="list-row"><span>Credit balance</span><b>${UTIL.money(c.creditMinor)}</b></div><button onclick="App.customerEdit('${id}')">Edit customer</button> <button onclick="App.customerCheckin('${id}')">Record visit</button> <button onclick="App.creditNoteSheet('${id}')">New credit note</button>`)
  },
  customerCheckin(id){
    const c=DB.customers.find(x=>x.id===id);if(!c)return;
    c.points+=1;this.audit('customer_checkin','customer',id);STORAGE.save();this.closeSheet();this.toast('Visit recorded · 1 loyalty point added')
  },
  creditNoteSheet(id){
    this.openSheet('New credit note',`<form class="stack" onsubmit="event.preventDefault();App.saveCredit('${id}')"><label>Amount (KES)<input id="creditAmount" type="number" min="0.01" step="0.01" required></label><label>Reason<input id="creditReason" placeholder="e.g. damaged goods return"></label><label>Original sale / invoice ref<input id="creditRef"></label><label>Due date<input id="creditDue" type="date" required value="${UTIL.day(new Date(Date.now()+7*86400000))}"></label><button class="primary">Create credit note</button></form>`)
  },
  saveCredit(id){
    const c=DB.customers.find(x=>x.id===id);if(!c)return this.toast('Customer not found');
    const amount=Math.round(Number(document.getElementById('creditAmount').value)*100);
    if(!amount||amount<=0)return this.toast('Invalid amount');
    const cr={id:UTIL.id('cr'),customerId:id,branchId:c.branchId,amountMinor:amount,paidMinor:0,dueDate:document.getElementById('creditDue').value,status:'open',reason:document.getElementById('creditReason').value,saleRef:document.getElementById('creditRef').value};
    DB.creditNotes.push(cr);c.creditMinor+=amount;this.audit('create','credit_note',cr.id);STORAGE.save();this.closeSheet();this.render();this.toast('Credit note created')
  },
  creditPayment(id){
    const c=DB.creditNotes.find(x=>x.id===id);if(!c)return;
    this.openSheet('Record credit payment',`<p>Outstanding: <b>${UTIL.money(c.amountMinor-c.paidMinor)}</b></p><form class="stack" onsubmit="event.preventDefault();App.saveCreditPayment('${id}')"><label>Payment (KES)<input id="creditPaid" type="number" min="0.01" max="${((c.amountMinor-c.paidMinor)/100).toFixed(2)}" step="0.01" required></label><button class="primary">Record payment</button></form>`)
  },
  saveCreditPayment(id){
    const c=DB.creditNotes.find(x=>x.id===id),amount=Math.round(Number(document.getElementById('creditPaid').value)*100);
    if(amount<=0||amount>c.amountMinor-c.paidMinor)return this.toast('Invalid payment amount');
    c.paidMinor+=amount;c.status=c.paidMinor>=c.amountMinor?'paid':'partial';
    const cust=DB.customers.find(x=>x.id===c.customerId);if(cust)cust.creditMinor=Math.max(0,cust.creditMinor-amount);
    this.audit('credit_payment','credit_note',id,{amountMinor:amount});STORAGE.save();this.closeSheet();this.render();this.toast('Credit payment recorded')
  },
  printCreditNote(id){
    const c=DB.creditNotes.find(x=>x.id===id);if(!c)return;
    this.openSheet('Credit note',`<div class="receipt"><center><b>${UTIL.escape(DB.settings.businessName)}</b><br>KRA PIN: ${UTIL.escape(DB.settings.kraPin)}<hr><b>CREDIT NOTE</b><br>${c.id}<br>${UTIL.fmtDate(new Date())}</center><hr>To: <b>${UTIL.escape(this.customerName(c.customerId))}</b><hr>Reason: ${UTIL.escape(c.reason||'—')}<br>Original ref: ${UTIL.escape(c.saleRef||'—')}<br><b>Amount: ${UTIL.money(c.amountMinor)}</b><br>Paid: ${UTIL.money(c.paidMinor)}<br>Outstanding: ${UTIL.money(c.amountMinor-c.paidMinor)}<hr><center>${UTIL.escape(DB.settings.receiptFooter)}</center></div><button onclick="window.print()">Print credit note</button>`)
  },

  /* ---- Staff ---- */
  renderStaff(){
    return `<div class="headrow"><div><h1>Staff</h1><p class="muted">Staff directory, branch assignments and attendance</p></div><div class="actions"><button onclick="App.clockSheet()">Clock in/out</button><button class="primary" onclick="App.staffEdit()">＋ Add staff</button></div></div><div class="grid">${this.chartPanel('Hours by staff · demo estimate',Charts.bar(DB.staff.map(s=>({label:s.name.split(' ')[0],value:DB.shiftLogs.filter(l=>l.staffId===s.id&&l.direction==='in').length*8})).filter(x=>x.value)),'span-8')}${this.panel('On shift',`<div class="kpi">${DB.shiftLogs.filter(s=>s.direction==='in'&&this.inScope(s)).length}</div><div class="muted small">Clock-in events in sample session</div>`,'span-4')}<section class="panel span-12"><table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Primary branch</th><th>Badge barcode</th><th>Status</th><th>Action</th></tr></thead><tbody>${DB.staff.filter(s=>this.inScope(s)).map(s=>`<tr><td>${UTIL.escape(s.name)}</td><td>${s.role}</td><td>${UTIL.escape(s.phone)}</td><td>${UTIL.escape(this.branchName(s.branchId))}</td><td>${s.badge}</td><td><span class="badge ${s.active?'success':'warning'}">${s.active?'Active':'Inactive'}</span></td><td><button onclick="App.staffDetail('${s.id}')">Inspect</button> <button onclick="App.printBadge('${s.id}')">Print badge</button></td></tr>`).join('')}</tbody></table></section><section class="panel span-12"><h3>Recent shift logs</h3>${DB.shiftLogs.slice(-12).reverse().map(l=>`<div class="list-row"><span>${UTIL.escape(this.staffName(l.staffId))} · ${UTIL.escape(this.branchName(l.branchId))}</span><span>${l.direction} · ${UTIL.fmtTime(l.at)}</span><span class="badge">${l.source}</span></div>`).join('')}</section></div>`
  },
  staffEdit(id){
    const s=DB.staff.find(x=>x.id===id)||{name:'',phone:'',role:'cashier',branchId:DB.branches[0].id,badge:'',hourlyRateMinor:0,active:true,pin:''};
    this.openSheet(id?'Edit staff':'Add staff',`<form class="stack" onsubmit="event.preventDefault();App.saveStaff('${id||''}')"><label>Name<input id="staffName" required value="${UTIL.escape(s.name)}"></label><label>Phone<input id="staffPhone" value="${UTIL.escape(s.phone)}"></label><label>Role<select id="staffRole">${['owner','ops_manager','branch_manager','cashier','storekeeper'].map(r=>`<option ${r===s.role?'selected':''}>${r}</option>`).join('')}</select></label><label>Primary branch<select id="staffBranch">${DB.branches.map(b=>`<option value="${b.id}" ${b.id===s.branchId?'selected':''}>${UTIL.escape(b.name)}</option>`).join('')}</select></label><label>Badge barcode<input id="staffBadge" value="${UTIL.escape(s.badge)}"></label><label>PIN (4 digits)<input id="staffPin" inputmode="numeric" value="${UTIL.escape(s.pin||'')}"></label><label>Hourly rate (KES)<input id="staffRate" type="number" min="0" step="0.01" value="${(s.hourlyRateMinor/100).toFixed(2)}"></label><button class="primary">Save staff</button></form>`)
  },
  saveStaff(id){
    const name=document.getElementById('staffName').value.trim();if(!name)return this.toast('Name is required');
    const s={id:id||UTIL.id('staff'),name,phone:UTIL.phone(document.getElementById('staffPhone').value),role:document.getElementById('staffRole').value,branchId:document.getElementById('staffBranch').value,badge:document.getElementById('staffBadge').value||('EMP-'+Date.now()),pin:document.getElementById('staffPin').value,hourlyRateMinor:Math.round(Number(document.getElementById('staffRate').value||0)*100),active:true};
    if(id)Object.assign(DB.staff.find(x=>x.id===id),s);else DB.staff.push(s);
    this.audit(id?'update':'create','staff',s.id);STORAGE.save();this.closeSheet();this.render();this.toast('Staff record saved')
  },
  staffDetail(id){
    const s=DB.staff.find(x=>x.id===id);if(!s)return;
    this.openSheet(s.name,`<div class="list-row"><span>Role</span><b>${s.role}</b></div><div class="list-row"><span>Phone</span><b>${UTIL.escape(s.phone)}</b></div><div class="list-row"><span>Badge</span><b>${s.badge}</b></div><button onclick="App.clockStaff('${id}','in')">Clock in</button> <button onclick="App.clockStaff('${id}','out')">Clock out</button> <button onclick="App.printBadge('${id}')">Print badge</button>`)
  },
  printBadge(id){
    const s=DB.staff.find(x=>x.id===id);if(!s)return;
    const badge=s.badge||'EMP-000';
    const bars=Array.from({length:48},(_,i)=>{const code=badge.charCodeAt(i%badge.length)||65;return `<rect x="${i*5+4}" y="4" width="${1+(code%3)}" height="48" fill="#000"/>`}).join('');
    this.openSheet('Staff badge',`<div class="receipt"><center><b>${UTIL.escape(DB.settings.businessName)}</b><hr><h2>${UTIL.escape(s.name)}</h2>${s.role}<br><h2>${UTIL.escape(badge)}</h2><svg viewBox="0 0 280 60" width="100%">${bars}</svg><small>Demo barcode artwork · not standards-compliant</small></center></div><button onclick="window.print()">Print badge</button>`)
  },
  clockSheet(){
    this.openSheet('Staff clock',`<form class="stack" onsubmit="event.preventDefault();App.clockByBadge()"><label>Badge barcode<input id="clockBadge" placeholder="EMP-001 or scan badge" required></label><label>Action<select id="clockDirection"><option value="in">Clock in</option><option value="out">Clock out</option></select></label><button class="primary">Record shift event</button></form><p class="small muted">Manual entry works with USB/Bluetooth barcode wedges.</p>`)
  },
  clockByBadge(){
    const badge=document.getElementById('clockBadge').value.trim();
    const s=DB.staff.find(x=>x.badge.toLowerCase()===badge.toLowerCase()||x.id===badge);
    if(!s)return this.toast('Staff badge not found');
    this.clockStaff(s.id,document.getElementById('clockDirection').value)
  },
  clockStaff(id,direction){
    const s=DB.staff.find(x=>x.id===id);if(!s)return;
    DB.shiftLogs.push({id:UTIL.id('shift'),staffId:id,branchId:s.branchId,direction,at:UTIL.now(),source:'manual'});
    this.audit('clock_'+direction,'shift',id);STORAGE.save();this.closeSheet();this.render();this.toast(s.name+' clocked '+direction)
  },

  /* ---- Automations ---- */
  renderAutomations(){
    const alerts=this.alerts();
    return `<div class="headrow"><div><h1>Automation Centre</h1><p class="muted">Local rule checks only · no external notifications</p></div><button onclick="App.runRuleTest()">Test rules</button></div><div class="grid">${this.panel('Rules configured',`<div class="kpi">${RULES.length}</div><div class="muted small">Device-local checks</div>`,'span-4')}${this.panel('Active matches',`<div class="kpi">${alerts.length}</div><div class="muted small">Across current scope</div>`,'span-4')}${this.panel('History entries',`<div class="kpi">${DB.automationHistory.length}</div><div class="muted small">Dismissals and snoozes</div>`,'span-4')}<section class="panel span-12"><h2>Rules and matched records</h2>${RULES.map(([name,desc,action])=>{const matches=alerts.filter(a=>a.rule===name);return `<div class="list-row" style="align-items:flex-start"><div style="flex:1"><b>${UTIL.escape(name)}</b><div class="small muted">${UTIL.escape(desc)}</div><div class="small">Suggested action: ${UTIL.escape(action)}</div>${matches.map(a=>`<div class="timeline-item ${name==='Till variance'?'danger':''}" style="margin-top:8px"><b>${UTIL.escape(a.detail||a.id)}</b><div class="row-actions" style="margin-top:7px"><button onclick="App.handleAlert('${a.id}')">${UTIL.escape(a.action)}</button><button onclick="App.dismissAlert('${a.id}','snooze')">Snooze</button><button onclick="App.dismissAlert('${a.id}','dismiss')">Dismiss</button></div></div>`).join('')||'<div class="small muted">No current matched records</div>'}</div><span class="badge ${matches.length?'warning':'success'}">${matches.length?'Matched '+matches.length:'Monitoring'}</span></div>`}).join('')}</section><section class="panel span-12"><h3>Automation history</h3>${DB.automationHistory.slice(-30).reverse().map(h=>`<div class="list-row"><span>${UTIL.escape(h.rule||h.id)} · ${h.action}${h.error?' · '+UTIL.escape(h.error):''}</span><span class="muted small">${UTIL.fmtDate(h.at)}</span></div>`).join('')||'<p class="muted">No history yet.</p>'}</section></div>`
  },
  handleAlert(id){
    const a=this.alerts().find(x=>x.id===id);if(!a){this.toast('Alert already resolved');return}
    if(a.rule==='Low stock'){this.closeSheet();this.navigate('inventory')}
    else if(a.rule==='Credit overdue'){this.creditPayment(id)}
    else if(a.rule==='Transfer in transit > 24 hours'){this.transferDetail(id)}
    else if(a.rule==='Backup reminder'){this.exportBackup()}
    else if(a.rule==='Till variance'){this.tillDetail(id)}
    else if(a.rule==='Invoice overdue'){this.invoiceDetail(id)}
    else if(a.rule==='eTIMS pending'){this.invoiceDetail(id)}
    else if(a.rule==='Expiring product'){this.navigate('inventory')}
    else if(a.rule==='Branch staff shortage'){this.navigate('staff')}
    else this.toast(a.action+' · review the related view')
  },
  dismissAlert(id,action){
    DB.automationHistory.push({id,rule:this.alerts().find(a=>a.id===id)?.rule||id,action,at:UTIL.now(),dismissed:action==='dismiss'});
    STORAGE.save();this.render();this.toast(action==='dismiss'?'Alert dismissed':'Alert snoozed')
  },
  runRuleTest(){
    const summary=RULES.map(r=>r[0]+': '+this.alerts().filter(a=>a.rule===r[0]).length+' match(es)').join('\n');
    this.openSheet('Rule test results',`<pre style="white-space:pre-wrap">${UTIL.escape(summary)}</pre><p class="muted small">Dry run only. No external notifications.</p>`)
  },

  /* ---- Reports ---- */
  renderReports(){
    const reports=['Sales report','Payment mix report','Branch comparison','Hourly heatmap','Product performance','Category profitability','Stock valuation','Stock movement report','Till & variance report','Expenses report','Supplier balances','Credit ageing','VAT summary','Staff attendance & hours'];
    return `<div class="headrow"><div><h1>Reports</h1><p class="muted">Chart-first reports · CSV and print · sample data</p></div><div class="actions"><button onclick="App.exportCSV()">Export CSV</button><button onclick="window.print()">Print report</button></div></div><div class="grid"><section class="panel span-12"><div class="form-grid"><label>Report<select id="reportType" onchange="App.renderReportBody()">${reports.map(r=>`<option>${r}</option>`).join('')}</select></label><label>Date range<select id="reportRange" onchange="App.renderReportBody()"><option>Today</option><option>Last 7 days</option><option>Last 30 days</option><option>All sample data</option></select></label></div><div id="reportBody" style="margin-top:16px">${this.reportBody('Sales report')}</div></section></div>`
  },
  reportSalesFiltered(){
    const range=document.getElementById('reportRange')?.value||'All sample data';
    return this.activeSales().filter(s=>{
      const age=UTIL.ageDays(s.at);
      if(range==='Today')return UTIL.isToday(s.at);
      if(range==='Last 7 days')return age<7;
      if(range==='Last 30 days')return age<30;
      return true
    })
  },
  reportData(type){
    const sales=this.reportSalesFiltered();
    if(type==='Payment mix report')return [['Payment method','Amount (minor units)'],...['cash','mpesa','card'].map(m=>[m,sales.flatMap(s=>s.payments||[]).filter(p=>p.method===m).reduce((a,p)=>a+p.amountMinor,0)])];
    if(type==='Branch comparison')return [['Branch','Revenue minor','Transactions'],...this.branches().map(b=>[b.name,this.sumSales(sales.filter(s=>s.branchId===b.id)),sales.filter(s=>s.branchId===b.id).length])];
    if(type==='Product performance'||type==='Category profitability')return [['Product / category','Units sold','Revenue minor'],...DB.products.map(p=>[p.name,sales.reduce((a,s)=>a+s.lines.filter(l=>l.productId===p.id).reduce((n,l)=>n+l.qty,0),0),sales.reduce((a,s)=>a+s.lines.filter(l=>l.productId===p.id).reduce((n,l)=>n+l.qty*l.unitPriceMinor,0),0)])];
    if(type==='Stock valuation')return [['Product','Branch','Qty','Stock value minor'],...this.inventory().map(i=>[this.product(i.productId)?.name,this.branchName(i.branchId),i.qty,i.qty*(this.product(i.productId)?.costMinor||0)])];
    if(type==='Expenses report')return [['Category','Branch','Amount minor','VAT input minor'],...DB.expenses.filter(e=>this.inScope(e)).map(e=>[e.category,this.branchName(e.branchId),e.amountMinor,e.vatInputMinor||0])];
    if(type==='Supplier balances')return [['Supplier','Phone','KRA PIN','Balance minor'],...DB.suppliers.map(s=>[s.name,s.phone,s.kraPin||'',s.balanceMinor])];
    if(type==='Credit ageing')return [['Customer','Due date','Outstanding minor'],...DB.creditNotes.map(c=>[this.customerName(c.customerId),c.dueDate,c.amountMinor-c.paidMinor])];
    if(type==='Till & variance report')return [['Till','Branch','Expected cash minor','Counted cash minor','Variance minor'],...DB.tills.filter(t=>this.inScope(t)).map(t=>[t.id,this.branchName(t.branchId),t.expectedCashMinor,t.countedCashMinor,t.varianceMinor])];
    if(type==='Staff attendance & hours')return [['Staff','Branch','Shift events'],...DB.staff.filter(s=>this.inScope(s)).map(s=>[s.name,this.branchName(s.branchId),DB.shiftLogs.filter(l=>l.staffId===s.id).length])];
    if(type==='VAT summary'){
      const outVat=sales.reduce((a,s)=>a+s.vatMinor,0);
      const inVat=DB.expenses.filter(e=>this.inScope(e)).reduce((a,e)=>a+(e.vatInputMinor||0),0);
      return [['Metric','Amount minor'],['Output VAT (sales)',outVat],['Input VAT (expenses)',inVat],['Net VAT payable',Math.max(0,outVat-inVat)]]
    }
    if(type==='Stock movement report')return [['Product','Branch','Qty on hand'],...this.inventory().map(i=>[this.product(i.productId)?.name,this.branchName(i.branchId),i.qty])];
    if(type==='Hourly heatmap'){
      const start=DB.settings.openingHours.start,end=DB.settings.openingHours.end,slots=end-start;
      return [['Day','Hour','Transactions'],...Array.from({length:7*slots},(_,i)=>[['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][Math.floor(i/slots)],`${i%slots+start}:00`,sales.filter(s=>new Date(s.at).getDay()===Math.floor(i/slots)&&new Date(s.at).getHours()===i%slots+start).length])]
    }
    return [['Sale','Date','Branch','Payment','Total minor','Status'],...sales.map(s=>[s.number,s.at,this.branchName(s.branchId),(s.payments||[]).map(p=>p.method).join('+'),s.totalMinor,s.status])]
  },
  reportBody(type){
    const data=this.reportData(type),headers=data[0],rows=data.slice(1);
    let chart;
    const sales=this.reportSalesFiltered();
    if(type==='Payment mix report')chart=Charts.donut(['cash','mpesa','card'].map(m=>({label:m,value:sales.flatMap(s=>s.payments||[]).filter(p=>p.method===m).reduce((a,p)=>a+p.amountMinor,0)})));
    else if(type==='Hourly heatmap'){
      const start=DB.settings.openingHours.start,end=DB.settings.openingHours.end,slots=end-start;
      chart=Charts.heatmap(Array.from({length:84},(_,i)=>sales.filter(s=>new Date(s.at).getDay()===Math.floor(i/slots)&&new Date(s.at).getHours()===i%slots+start).length),{startHour:start,endHour:end});
    }
    else if(type==='Product performance'||type==='Category profitability')chart=Charts.hbar(DB.products.map(p=>({label:p.name,value:sales.reduce((a,s)=>a+s.lines.filter(l=>l.productId===p.id).reduce((n,l)=>n+l.qty*l.unitPriceMinor,0),0)})).sort((a,b)=>b.value-a.value).slice(0,8));
    else if(type==='Stock valuation')chart=Charts.bar(this.branches().map(b=>({label:b.name,value:this.inventory().filter(i=>i.branchId===b.id).reduce((a,i)=>a+i.qty*(this.product(i.productId)?.costMinor||0),0)})));
    else if(type==='Expenses report')chart=Charts.bar([...new Set(DB.expenses.map(e=>e.category))].map(cat=>({label:cat,value:DB.expenses.filter(e=>e.category===cat&&this.inScope(e)).reduce((a,e)=>a+e.amountMinor,0)})));
    else if(type==='Till & variance report')chart=Charts.bar(DB.tills.filter(t=>this.inScope(t)).map(t=>({label:this.branchName(t.branchId),value:Math.abs(t.varianceMinor)})));
    else if(type==='Supplier balances')chart=Charts.hbar(DB.suppliers.map(s=>({label:s.name,value:s.balanceMinor})));
    else if(type==='Credit ageing')chart=Charts.bar([{label:'Current',value:DB.creditNotes.filter(c=>c.dueDate>=UTIL.day()).reduce((a,c)=>a+c.amountMinor-c.paidMinor,0)},{label:'Overdue',value:DB.creditNotes.filter(c=>c.dueDate<UTIL.day()).reduce((a,c)=>a+c.amountMinor-c.paidMinor,0)}]);
    else if(type==='Staff attendance & hours')chart=Charts.bar(DB.staff.filter(s=>this.inScope(s)).map(s=>({label:s.name.split(' ')[0],value:DB.shiftLogs.filter(l=>l.staffId===s.id).length*8})));
    else if(type==='VAT summary')chart=Charts.bar([{label:'Output VAT',value:sales.reduce((a,s)=>a+s.vatMinor,0)},{label:'Input VAT',value:DB.expenses.filter(e=>this.inScope(e)).reduce((a,e)=>a+(e.vatInputMinor||0),0)}]);
 else chart=Charts.bar(this.branches().map(b=>({label:b.name,value:this.sumSales(sales.filter(s=>s.branchId===b.id))})));
    return `<div class="small muted" style="margin-bottom:8px"><span class="chip">Showing sample data</span> · ${UTIL.escape(type)} · ${BranchContext.get()==='all'?'All branches':UTIL.escape(this.branchName(BranchContext.get()))} · ${document.getElementById('reportRange')?.value||'All sample data'}</div><div onclick="App.openChart(this)">${chart}</div><div class="table-wrap" style="margin-top:18px"><table><thead><tr>${headers.map(h=>`<th>${UTIL.escape(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr>${(Array.isArray(r)?r:[r]).map(v=>`<td>${UTIL.escape(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:14px"><button class="primary" onclick="App.exportCSV()">Download CSV</button><button onclick="window.print()">Print report</button></div>`
  },
  renderReportBody(){
    const el=document.getElementById('reportBody');if(!el)return;
    el.innerHTML=this.reportBody(document.getElementById('reportType').value);
    this.bindTips(el);this.labelTables(el)
  },
  exportCSV(){
    const type=document.getElementById('reportType')?.value||'Sales report';
    const data=this.reportData(type);
    UTIL.download(type.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv',UTIL.csv(data));
    DB.lastExportAt=UTIL.now();STORAGE.save();this.audit('export_csv','report',type);this.toast('CSV exported')
  },

  /* ---- Settings ---- */
  renderSettings(){
    return `<div class="headrow"><div><h1>Settings</h1><p class="muted">Business profile, KRA details, theme and local data</p></div></div><div class="grid"><section class="panel span-6"><h2>Business profile</h2><form class="stack" onsubmit="event.preventDefault();App.saveSettings()"><label>Business name<input id="setName" value="${UTIL.escape(DB.settings.businessName)}" required></label><label>KRA PIN<input id="setPin" value="${UTIL.escape(DB.settings.kraPin||'')}"></label><label>VAT number<input id="setVatNo" value="${UTIL.escape(DB.settings.vatNumber||'')}"></label><label>VAT rate (%)<input id="setVat" type="number" min="0" max="100" step="0.01" value="${DB.settings.vatRate}"></label><label>Receipt footer<input id="setFooter" value="${UTIL.escape(DB.settings.receiptFooter)}"></label><label>Theme<select id="setTheme"><option value="dark" ${document.documentElement.dataset.theme==='dark'?'selected':''}>Dark · default</option><option value="light" ${document.documentElement.dataset.theme==='light'?'selected':''}>Light</option></select></label><button class="primary">Save settings</button></form></section><section class="panel span-6"><h2>M-Pesa & eTIMS</h2><form class="stack" onsubmit="event.preventDefault();App.saveIntegrations()"><label>M-Pesa Till<input id="setTill" value="${UTIL.escape(DB.settings.mpesaTill||'')}"></label><label>M-Pesa Paybill<input id="setPaybill" value="${UTIL.escape(DB.settings.mpesaPaybill||'')}"></label><label>eTIMS environment<select id="setEtimsEnv"><option ${DB.settings.etimsEnv==='sandbox'?'selected':''}>sandbox</option><option ${DB.settings.etimsEnv==='production'?'selected':''}>production</option></select></label><label>eTIMS device ID<input id="setEtimsId" value="${UTIL.escape(DB.settings.etimsDeviceId||'')}"></label><div class="notice small">Both integrations are <b>stubs</b> in this demo — no external calls are made. Configure a real Daraja/eTIMS adapter in <code>MPESA</code>/<code>ETIMS</code>.</div><button class="primary">Save integrations</button></form></section><section class="panel span-6"><h2>Backup & restore</h2><p class="muted small">JSON backup contains local demo records. Keep it private if you add real data.</p><div class="stack"><button class="primary" onclick="App.exportBackup()">Export JSON backup</button><label>Restore JSON backup<input id="restoreFile" type="file" accept="application/json" onchange="App.importBackup(this.files[0])"></label><button onclick="App.exportCSV()">Export current report CSV</button><button class="danger" onclick="App.resetDemo()">Reset demo data</button><button onclick="App.logout()">Log out</button></div></section><section class="panel span-6"><h2>Local-only operation</h2><p class="muted">No cloud sync configured. Browser storage is not encrypted.</p><div class="list-row"><span>Data mode</span><b>Local</b></div><div class="list-row"><span>Sync adapter</span><b>Not configured</b></div><div class="list-row"><span>Session</span><b>${UTIL.escape(this.role)} · sessionStorage</b></div><div class="list-row"><span>Role</span><b>${UTIL.escape(this.user?.name||'')}</b></div></section></div>`
  },
  saveSettings(){
    DB.settings.businessName=document.getElementById('setName').value.trim();
    DB.settings.kraPin=document.getElementById('setPin').value;
    DB.settings.vatNumber=document.getElementById('setVatNo').value;
    DB.settings.vatRate=Number(document.getElementById('setVat').value);
    DB.settings.receiptFooter=document.getElementById('setFooter').value;
    const theme=document.getElementById('setTheme').value;
    document.documentElement.dataset.theme=theme;DB.settings.theme=theme;
    STORAGE.save();this.buildNav();this.render();this.toast('Settings saved')
  },
  saveIntegrations(){
    DB.settings.mpesaTill=document.getElementById('setTill').value;
    DB.settings.mpesaPaybill=document.getElementById('setPaybill').value;
    DB.settings.etimsEnv=document.getElementById('setEtimsEnv').value;
    DB.settings.etimsDeviceId=document.getElementById('setEtimsId').value;
    STORAGE.save();this.toast('Integrations saved (stubs only)')
  },
  exportBackup(){
    DB.lastExportAt=UTIL.now();STORAGE.save();
    UTIL.download('ops-grid-backup-'+UTIL.day()+'.json',JSON.stringify(DB,null,2),'application/json');
    this.audit('backup_export','database',STORAGE.key);this.toast('JSON backup exported')
  },
  importBackup(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const x=JSON.parse(reader.result);
        if(!x.branches||!x.sales||!x.products)throw Error('Invalid backup structure');
        if(!confirm('Replace current local demo data with this backup?'))return;
        const ref=sampleDB();
        DB=Object.assign(ref,x);
        DB.settings=Object.assign({},ref.settings,x.settings||{});
        DB.sequence=Object.assign({},ref.sequence,x.sequence||{});
        STORAGE.save();this.closeSheet();this.buildNav();this.render();this.toast('Backup restored')
      }catch(e){this.toast('Import failed: '+e.message)}
    };
    reader.readAsText(file)
  },
  resetDemo(){
    if(!confirm('Reset all local data to the original sample dataset?'))return;
    if(!confirm('Final confirmation: all changes in this browser will be lost. Continue?'))return;
    DB=sampleDB();STORAGE.save();this.render();this.toast('Demo data reset')
  },

  /* ---- Developer (FIXED: no wipe-dashboard bug) ---- */
  renderDeveloper(){
    if(this.role!=='developer')return '<div class="panel span-12"><h2>Not authorised</h2><p class="muted">Developer role required.</p></div>';
    return `<div class="headrow"><div><h1>Developer panel</h1><p class="muted">Local diagnostics · developer demo role only</p></div><span class="chip">LOCAL MODE</span></div><div class="grid"><section class="panel span-6"><h2>Data mode & sync</h2><label>Mode<select id="devMode"><option ${DB.settings.mode==='Local'?'selected':''}>Local</option><option ${DB.settings.mode==='Hybrid'?'selected':''}>Hybrid</option><option ${DB.settings.mode==='Cloud'?'selected':''}>Cloud</option></select></label><p class="small muted">Cloud and Hybrid are configuration stubs. No remote connection is implemented.</p><label>Firestore project ID<input placeholder="Project ID (not connected)"></label><label>Cloudflare Worker URL<input placeholder="Worker URL (not connected)"></label><label>Sync status<input disabled value="Not configured"></label><button onclick="App.testSync()">Test sync adapter</button></section><section class="panel span-6"><h2>Data tools</h2><div class="stack"><button onclick="App.exportBackup()">Export JSON</button><label>Import JSON<input type="file" accept="application/json" onchange="App.importBackup(this.files[0])"></label><button onclick="App.resetSequence()">Reset sequence generator</button><button class="danger" onclick="App.wipeData()">Wipe local data</button><button onclick="App.reseed()">Reseed sample data</button></div></section><section class="panel span-12"><h2>Domain inspectors</h2><div class="actions"><button onclick="App.inspect('branches')">Branch inspector</button><button onclick="App.inspect('tills')">Till-state inspector</button><button onclick="App.inspect('transfers')">Transfer inspector</button><button onclick="App.inspect('invoices')">Invoice inspector</button><button onclick="App.chartDebug()">Chart debug tool</button><button onclick="App.runRuleTest()">Automation rule tester</button></div><div id="devInspect" style="margin-top:12px"></div></section><section class="panel span-12"><div class="panel-head"><h2>Event log · last 200</h2><button onclick="App.clearLogs()">Clear log</button></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead><tbody>${DB.audit.slice(-200).reverse().map(a=>`<tr><td>${UTIL.fmtDate(a.at)} ${UTIL.fmtTime(a.at)}</td><td>${UTIL.escape(a.actor)}</td><td>${UTIL.escape(a.action)}</td><td>${UTIL.escape(a.entity)}</td><td>${UTIL.escape(a.entityId)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel span-12"><h2>Feature flags</h2>${Object.entries(DB.featureFlags||{}).map(([k,v])=>`<div class="list-row"><span>${k}</span><input style="width:22px;min-height:22px" type="checkbox" ${v?'checked':''} onchange="App.setFlag('${k}',this.checked)"></div>`).join('')}</section></div>`
  },
  testSync(){try{SYNC.init()}catch(e){this.toast(String(e.message||e))}},
  inspect(type){
    const obj=type==='branches'?DB.branches:type==='tills'?DB.tills:type==='transfers'?DB.transfers:DB.invoices;
    const el=document.getElementById('devInspect');
    if(el)el.innerHTML=`<pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto">${UTIL.escape(JSON.stringify(obj,null,2))}</pre>`
  },
  chartDebug(){
    const test=[{label:'A',value:15},{label:'B',value:28},{label:'C',value:9},{label:'D',value:36},{label:'E',value:21}];
    this.openSheet('Chart debug tool',`<div class="grid">${this.panel('line',Charts.line([{name:'Series A',values:[2000,6000,4000,9000,8000]},{name:'Series B',values:[3000,4000,5000,7000,6000]}]),'span-12')}${this.panel('bar',Charts.bar(test),'span-12')}${this.panel('hbar',Charts.hbar(test),'span-12')}${this.panel('donut',Charts.donut(test),'span-12')}${this.panel('spark',Charts.spark([2,6,4,9,8]),'span-12')}${this.panel('heatmap',Charts.heatmap(Array.from({length:84},(_,i)=>i%13),{startHour:8,endHour:20}),'span-12')}${this.panel('stackedBar',Charts.stackedBar([{label:'A',values:[2,5,3]},{label:'B',values:[4,2,6]}]),'span-12')}${this.panel('gauge',Charts.gauge(72),'span-12')}</div>`,true)
  },
  resetSequence(){
    if(!confirm('Reset next sale, till and invoice sequence numbers?'))return;
    DB.sequence={sale:1000,till:1,invoice:1,po:1};STORAGE.save();this.render();this.toast('Sequences reset')
  },
  wipeData(){
    if(!confirm('Wipe all local data?'))return;
    if(!confirm('This cannot be undone without a backup. Wipe now?'))return;
    STORAGE.clear();DB=sampleDB();STORAGE.save();this.render();this.toast('Data wiped and safe sample data reseeded')
  },
  reseed(){
    if(!confirm('Replace current data with sample data?'))return;
    DB=sampleDB();STORAGE.save();this.render();this.toast('Sample data restored')
  },
  clearLogs(){DB.audit=[];STORAGE.save();this.render();this.toast('Audit log cleared')},
  setFlag(k,v){DB.featureFlags[k]=v;STORAGE.save();this.toast(k+' '+(v?'enabled':'disabled'))},

  /* ---- Scanner ---- */
  scanSheet(){
    this.openSheet('Barcode scanner',`<p class="muted">Enter a barcode manually or use a USB/Bluetooth scanner. Camera depends on permissions and secure context.</p><form class="stack" onsubmit="event.preventDefault();App.handleScan(document.getElementById('scanValue').value)"><label>Scan or type barcode<input id="scanValue" placeholder="Product, staff, till, transfer or customer code" autocomplete="off" required></label><button class="primary">Look up barcode</button></form><div id="cameraBox" class="notice" style="margin-top:12px">Camera is optional; manual entry works without camera permission.</div><button style="margin-top:8px" onclick="App.startCamera()">Start camera preview</button><button style="margin-top:8px" onclick="App.stopCamera()">Stop camera</button>`)
  },
  handleScan(code){
    code=String(code||'').trim();if(!code)return;
    const p=DB.products.find(p=>p.barcode.toLowerCase()===code.toLowerCase()||p.sku.toLowerCase()===code.toLowerCase());
    if(p)return this.productSheet(p.id);
    const s=DB.staff.find(s=>s.badge.toLowerCase()===code.toLowerCase());
    if(s)return this.staffDetail(s.id);
    const t=DB.tills.find(t=>t.barcode.toLowerCase()===code.toLowerCase());
    if(t)return this.tillDetail(t.id);
    const tr=DB.transfers.find(t=>t.barcode.toLowerCase()===code.toLowerCase());
    if(tr)return this.transferDetail(tr.id);
    const c=DB.customers.find(c=>c.id.toLowerCase()===code.toLowerCase()||c.phone===UTIL.phone(code));
    if(c)return this.customerSheet(c.id);
    this.toast('Barcode not found · try manual search')
  },
  lookupBarcode(inputId,selectId){
    const code=document.getElementById(inputId)?.value?.trim();
    const p=DB.products.find(p=>p.barcode===code||p.sku===code);
    const sel=document.getElementById(selectId);
    if(p&&sel)sel.value=p.id
  },
  startCamera(){
    const box=document.getElementById('cameraBox');
    if(!navigator.mediaDevices?.getUserMedia){if(box)box.textContent='Camera API unavailable. Use manual entry or a USB/Bluetooth scanner.';return}
    if(!window.isSecureContext){if(box)box.textContent='Camera requires HTTPS or localhost. Use manual entry or hardware scanner.';return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
      this.cameraStream=stream;
      if(box)box.innerHTML='<video id="cameraVideo" autoplay playsinline style="width:100%;border-radius:8px"></video><p class="small">Camera preview started. Barcode decoding is not built into this no-library demo; enter the decoded value manually.</p>';
      const v=document.getElementById('cameraVideo');if(v)v.srcObject=stream
    }).catch(e=>{if(box)box.textContent='Camera permission unavailable: '+e.message})
  },
  stopCamera(){
    if(this.cameraStream){this.cameraStream.getTracks().forEach(t=>t.stop());this.cameraStream=null}
    const v=document.getElementById('cameraVideo');if(v)v.srcObject=null
  },
  branchSheet(){
    this.openSheet('Select branch',`<div class="stack"><button onclick="App.setBranch('all');App.closeSheet()">All branches</button>${DB.branches.map(b=>`<button onclick="App.setBranch('${b.id}');App.closeSheet()">${UTIL.escape(b.name)}</button>`).join('')}</div>`)
  },
  notificationsHTML(){
    return `<h3>Current local alerts</h3>${this.alerts().map(a=>`<div class="list-row"><span>${UTIL.escape(a.rule)}<div class="small muted">${UTIL.escape(a.detail||'')}</div></span><button onclick="App.handleAlert('${a.id}')">Open</button></div>`).join('')||'<p class="muted">No current alerts.</p>'}`
  }
};

/* ============================= BOOT ============================= */
App.showLogin();
App.restore();
if(DB.settings.theme)document.documentElement.dataset.theme=DB.settings.theme;
if(App.role){document.getElementById('loginRoot').classList.add('hidden');App.buildNav();App.render()}
else App.buildNav();

setInterval(()=>{
  if(App.role){
    const el=document.getElementById('topAlertCount');
    if(el)el.textContent=App.alerts().length+' alerts';
  }
},30000);

window.addEventListener('beforeunload',()=>{try{App.stopCamera()}catch(e){}});
</script>
</body>
