}

function checkoutModal() {
  if (!state.cart.length) return;
  const subtotal = state.cart.reduce((s,i)=>s+(i.price*i.qty),0);
  let discountCents = 0;
  if (posDiscount.type==='percent') discountCents = Math.round(subtotal*posDiscount.value/100);
  else if (posDiscount.type==='fixed') discountCents = Math.min(subtotal, posDiscount.value);
  const discounted = subtotal - discountCents;
  const vat = Math.round(discounted * state.settings.vatRate / (100 + state.settings.vatRate));
  const total = discounted;

  let body = '<div style="text-align:center;margin-bottom:1rem;"><div class="stat-label">Amount Due</div><div style="font-size:2rem;font-weight:900;color:var(--primary);">' + formatMoney(total) + '</div><div class="text-muted text-xs" style="font-weight:600;">VAT incl. ' + formatMoney(vat) + (discountCents?' · Discount '+formatMoney(discountCents):'') + '</div></div>';
  body += '<div class="form-group"><label>Payment Method</label><select class="form-input" id="payMethod"><option value="Cash">Cash</option><option value="M-Pesa">M-Pesa</option><option value="Credit">Credit (customer account)</option></select></div>';
  body += '<div id="cashSection"><div class="form-group"><label>Cash Received</label><input class="form-input" id="cashReceived" type="number" step="0.01" value="' + (total/100).toFixed(2) + '"></div><div id="changeDisplay" class="text-sm text-muted" style="font-weight:700;"></div></div>';
  body += '<div id="mpesaSection" style="display:none;"><div class="form-group"><label>M-Pesa Reference (10 characters)</label><input class="form-input" id="mpesaRef" placeholder="e.g. QK7X2M9P1A" maxlength="10"></div></div>';
  body += '<div id="creditSection" style="display:none;"><div class="text-xs text-muted" style="font-weight:600;">Sale will be posted to the selected customer\'s credit account. Customer required.</div></div>';
  body += '<div class="form-group"><label>Customer (optional)</label><select class="form-input" id="payCustomer"><option value="">— Walk-in —</option>';
  state.customers.forEach(c => { body += '<option value="' + c.id + '">' + esc(c.name) + ' — ' + c.loyaltyPoints + ' pts</option>'; });
  body += '</select></div>';
  body += '<div id="customerBalancePanel" class="card" style="padding:.7rem;margin-top:.4rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center;"><span class="text-sm" style="font-weight:600;">Customer account balance</span><strong id="customerBalanceValue" style="font-weight:800;">—</strong></div>';

  const footer = '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="completeSaleBtn">Complete Sale</button>';
  openModal('Checkout — ' + formatMoney(total), body, footer);

  $('#payMethod').onchange = (e) => {
    const v = e.target.value;
    $('#cashSection').style.display = v==='Cash'?'block':'none';
    $('#mpesaSection').style.display = v==='M-Pesa'?'block':'none';
    $('#creditSection').style.display = v==='Credit'?'block':'none';
  };
  const updateChange = () => {
    const received = parseMoneyToCents($('#cashReceived').value);
    if (isNaN(received)) { $('#changeDisplay').textContent = 'Invalid amount'; $('#changeDisplay').style.color='var(--danger)'; return; }
    const change = received - total;
    $('#changeDisplay').textContent = change>=0?'Change: '+formatMoney(change):'Insufficient amount';
    $('#changeDisplay').style.color = change>=0?'var(--success)':'var(--danger)';
  };
  $('#cashReceived').oninput = updateChange; updateChange();
  const updateCustomerBalance = () => {
    const id = $('#payCustomer').value; const customer = state.customers.find(c=>c.id===id);
    const value = $('#customerBalanceValue');
    if (!customer) { value.textContent = 'Walk-in customer'; value.style.color='var(--text-muted)'; return; }
    const balance = Number(customer.credit||0); value.textContent = formatMoney(balance); value.style.color = balance>0?'var(--warning)':'var(--success)';
  };
  $('#payCustomer').onchange = updateCustomerBalance; updateCustomerBalance();

  let busy = false;
  $('#completeSaleBtn').onclick = async () => {
    if (busy) return; busy = true; $('#completeSaleBtn').disabled = true; $('#completeSaleBtn').textContent = 'Processing...';
    try {
      const method = $('#payMethod').value;
      let mpesaRef = '', cashReceived = 0, change = 0;
      const customerId = $('#payCustomer').value;
      if (method === 'Cash') {
        cashReceived = parseMoneyToCents($('#cashReceived').value);
        if (isNaN(cashReceived) || cashReceived < total) { toast('Invalid/insufficient cash', 'danger'); return; }
        change = cashReceived - total;
      } else if (method === 'M-Pesa') {
        mpesaRef = $('#mpesaRef').value.trim().toUpperCase();
        if (!isValidMpesaRef(mpesaRef)) { toast('M-Pesa ref must be 10 alphanumeric chars', 'danger'); return; }
        if (state.sales.some(s => (s.mpesaRef||'').toUpperCase() === mpesaRef)) { toast('Duplicate M-Pesa reference', 'danger'); return; }
      } else if (method === 'Credit') {
        if (!customerId) { toast('Credit sale requires a customer', 'danger'); return; }
      }
      await completeSale(method, mpesaRef, cashReceived, change, customerId, { discountCents, subtotal });
    } finally { busy = false; const b=$('#completeSaleBtn'); if (b) { b.disabled=false; b.textContent='Complete Sale'; } }
  };
}

async function completeSale(method, mpesaRef, cashReceived, change, customerId, discountInfo) {
  const subtotal = state.cart.reduce((s,i)=>s+(i.price*i.qty),0);
  const discountCents = discountInfo ? discountInfo.discountCents : 0;
  const discounted = subtotal - discountCents;
  const vat = Math.round(discounted * state.settings.vatRate / (100 + state.settings.vatRate));
  const total = discounted;

  for (const item of state.cart) {
    const product = state.products.find(p => p.id === item.productId);
    if (!product) { toast('Product missing', 'danger'); return; }
    if (product.variants && product.variants.length) {
      const v = getVariant(product, item.size, item.colour);
      if (!v || v.stock < item.qty) { toast('Stock changed for ' + product.name, 'danger'); return; }
    } else if (totalVariantStock(product) < item.qty) { toast('Stock changed for ' + product.name, 'danger'); return; }
  }

  const counters = (await dbGetAll('settings')).find(s=>s.id==='counters') || { id:'counters', sales:0 };
  counters.sales = (counters.sales||0) + 1;
  const txnNo = 'RTX-' + String(counters.sales).padStart(4,'0');
  await dbPut('settings', counters);

  const sale = {
    id: genId('sale'), txnNo, items: deepClone(state.cart),
    subtotal, discount: discountCents, vat, total,
    paymentMethod: method, mpesaRef: mpesaRef || null,
    cashReceived: cashReceived || null, change: change || null,
    cashier: state.currentUser.name, customerId: customerId || null,
    date: nowISO(), isSample: false, status: 'completed'
  };
  await dbPut('sales', sale); state.sales.push(sale);

  for (const item of sale.items) {
    const product = state.products.find(p => p.id === item.productId);
    if (product) {
      if (product.variants && product.variants.length) deductVariantStock(product, item.size, item.colour, item.qty);
      else product.stock = Math.max(0, (product.stock||0) - item.qty);
      await dbPut('products', product);
      const mv = { id: genId('mv'), productId: product.id, productName: product.name, qty: -item.qty, type: 'sale', ref: sale.txnNo, date: nowISO(), user: state.currentUser.name, size: item.size, colour: item.colour };
      await dbPut('stockMovements', mv); state.stockMovements.push(mv);
    }
  }

  if (customerId) {
    const c = state.customers.find(x => x.id === customerId);
    if (c) {
      c.loyaltyPoints = (c.loyaltyPoints || 0) + Math.floor(total / 10000);
      if (method === 'Credit') c.credit = (c.credit||0) + total;
      await dbPut('customers', c);
    }
  }

  auditLog('sale', sale.txnNo + ' — ' + formatMoney(total) + ' via ' + method);
  toast('Sale completed! ' + sale.txnNo, 'success');
  state.cart = []; posDiscount = { type:'none', value:0, code:'' };

  const inv = await createInvoice(sale, customerId);
  showReceipt(sale, inv);
  renderPOS();
}

    res += '<div class="mt-1"><div class="form-group"><label>Select item(s) to return</label></div>';
    sale.items.forEach((it, i) => {
      res += '<div style="display:flex;gap:.4rem;align-items:center;margin-bottom:.35rem;flex-wrap:wrap;"><input type="checkbox" id="retItem' + i + '" checked style="flex-shrink:0;width:20px;height:20px;"><label class="text-sm" style="margin:0;flex:1;min-width:120px;font-weight:600;">' + esc(it.name) + (it.size||it.colour?' ('+[it.size,it.colour].filter(Boolean).join('/')+')':'') + ' × ' + it.qty + ' — ' + formatMoney(it.price*it.qty) + '</label><input class="form-input" id="retQty' + i + '" type="number" min="1" max="' + it.qty + '" value="' + it.qty + '" style="width:75px;min-height:38px;"></div>';
    });
    res += '<div class="form-group mt-1"><label>Reason</label><select class="form-input" id="retReason"><option>Customer changed mind</option><option>Damaged / faulty</option><option>Wrong size</option><option>Wrong item</option><option>Other</option></select></div>';
    res += '<div class="form-group"><label>Refund method</label><select class="form-input" id="retRefund"><option>Cash</option><option>M-Pesa</option><option>Credit note</option></select></div>';
    res += '<button class="btn btn-primary" id="retSubmitBtn">Process Return</button></div>';
    $('#retResult').innerHTML = res;
    $('#retSubmitBtn').onclick = async () => {
      let amount = 0; const returned = [];
      sale.items.forEach((it, i) => {
        const cb = $('#retItem' + i);
        if (cb && cb.checked) {
          const q = Math.min(parseInt($('#retQty' + i).value)||0, it.qty);
          if (q > 0) { amount += it.price * q; returned.push({...it, qty:q}); }
        }
      });
      if (!returned.length) { toast('Nothing selected', 'warning'); return; }
      const ret = { id: genId('ret'), saleId: sale.id, txnNo: sale.txnNo, items: returned, amount, reason: $('#retReason').value, refundMethod: $('#retRefund').value, date: nowISO(), user: state.currentUser.name };
      await dbPut('returns', ret); state.returns.push(ret);
      for (const it of returned) {
        const p = state.products.find(x=>x.id===it.productId);
        if (!p) continue;
        if (p.variants && p.variants.length) {
          const v = getVariant(p, it.size, it.colour) || ensureVariant(p, it.size, it.colour);
          v.stock += it.qty; syncProductStockFromVariants(p);
        } else p.stock = (p.stock||0) + it.qty;
        await dbPut('products', p);
        const mv = { id: genId('mv'), productId: p.id, productName: p.name, qty: it.qty, type: 'return', ref: sale.txnNo, date: nowISO(), user: state.currentUser.name, size: it.size, colour: it.colour };
        await dbPut('stockMovements', mv); state.stockMovements.push(mv);
      }
      if (ret.refundMethod === 'Credit note') {
        await dbPut('creditNotes', { id: genId('cn'), customerId: sale.customerId||null, amount, paid:0, status:'open', saleId: sale.id, date: nowISO() });
        state.creditNotes.push({ id: genId('cn'), customerId: sale.customerId||null, amount, paid:0, status:'open', saleId: sale.id, date: nowISO() });
      }
      auditLog('return', sale.txnNo + ' — ' + formatMoney(amount));
      toast('Return processed', 'success'); renderReturns();
    };
  };
}

async function createInvoice(sale, customerId) {
  const counters = (await dbGetAll('settings')).find(s=>s.id==='counters') || { id:'counters', invoices:0 };
  counters.invoices = (counters.invoices||0) + 1;
  await dbPut('settings', counters);
  const year = new Date().getFullYear();
  const number = 'INV-' + year + '-' + String(counters.invoices).padStart(4,'0');
  const inv = {
    id: genId('inv'), number, saleId: sale.id, customerId: customerId || null,
    items: deepClone(sale.items), subtotal: sale.total - sale.vat, vat: sale.vat, total: sale.total,
    issuedAt: nowISO(), dueDate: new Date(Date.now()+14*86400000).toISOString().slice(0,10),
    status: 'sent', etimsStatus: 'pending', etimsControlCode: null,
    kraPin: state.settings.kraPin, vatNumber: state.settings.vatNumber, isSample: false
  };
  await dbPut('invoices', inv); state.invoices.push(inv);
  auditLog('invoice_create', number + ' — ' + formatMoney(sale.total));
  return inv;
}

async function markInvoicePaid(id) {
  const inv = state.invoices.find(i => i.id === id); if (!inv) return;
  inv.status = 'paid'; inv.paidAt = nowISO(); await dbPut('invoices', inv);
  auditLog('invoice_paid', inv.number); toast('Invoice marked paid', 'success');
  closeModal(); navigate('invoices');
}
function transmitInvoiceETIMS(id) {
  const inv = state.invoices.find(i => i.id === id); if (!inv) return;
  try { ETIMS.transmit(inv); inv.etimsStatus = 'transmitted'; dbPut('invoices', inv); toast('Transmitted to eTIMS', 'success'); }
  catch (e) { inv.etimsStatus = 'error'; dbPut('invoices', inv); toast('eTIMS: ' + e.message, 'warning'); }
}

  } else if (invTab === 'alerts') {

        html += '<tr><td>' + new Date(sc.date).toLocaleDateString('en-KE') + '</td><td>' + esc(sc.user) + '</td><td>' + sc.lines.length + '</td><td class="' + (variance===0?'text-success':'text-danger') + '" style="font-weight:800;">' + (variance>0?'+':'') + variance + '</td><td>' + esc(sc.status) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
  } else if (invTab === 'transfers') {
    html += '<div class="card"><div class="card-title">Stock Transfers</div>';
    if (!state.stockTransfers.length) html += '<div class="text-muted text-sm" style="font-weight:600;">No transfers recorded.</div>';
    else {
      html += '<div class="table-wrap"><table><thead><tr><th>Date</th><th>From</th><th>To</th><th>Product</th><th>Qty</th></tr></thead><tbody>';
      state.stockTransfers.slice().reverse().forEach(t => {
        html += '<tr><td>' + new Date(t.date).toLocaleDateString('en-KE') + '</td><td>' + esc(t.from) + '</td><td>' + esc(t.to) + '</td><td style="font-weight:700;">' + esc(t.productName) + '</td><td>' + t.qty + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
  }

  html += '<div class="card"><div class="card-title">Recent Stock Movements</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Size</th><th>Colour</th><th>Qty</th><th>Type</th><th>Ref</th></tr></thead><tbody>';
  state.stockMovements.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,20).forEach(m => {
    html += '<tr><td>' + new Date(m.date).toLocaleDateString('en-KE') + '</td><td style="font-weight:700;">' + esc(m.productName) + '</td><td>' + esc(m.size||'—') + '</td><td>' + esc(m.colour||'—') + '</td><td class="' + (m.qty<0?'text-danger':'text-success') + '" style="font-weight:800;">' + (m.qty>0?'+':'') + m.qty + '</td><td>' + esc(m.type) + '</td><td>' + esc(m.ref||'—') + '</td></tr>';
  });
  html += '</tbody></table></div></div></div>';
  view.innerHTML = html; labelTables();
  $$('[data-invcat]').forEach(chip => chip.onclick = () => { invCategoryFilter = chip.dataset.invcat; renderInventory(); });
  $$('[data-tab]').forEach(chip => chip.onclick = () => { invTab = chip.dataset.tab; renderInventory(); });
}

  openModal(isEdit?'Edit Product':'Add Product', body, '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveProductBtn">' + (isEdit?'Update':'Add') + ' Product</button>');

  const vlist = $('#variantList');
  const addVariantRow = (v={size:'',colour:'',stock:0}) => {
    const row = document.createElement('div'); row.className='variant-row';
    row.innerHTML = '<input placeholder="Size" value="' + esc(v.size) + '"><input placeholder="Colour" value="' + esc(v.colour) + '"><input type="number" min="0" placeholder="Stock" value="' + (v.stock||0) + '"><span></span><button type="button" class="btn btn-xs btn-outline">✕ Remove</button>';
    row.querySelector('button').onclick = () => row.remove();
    vlist.appendChild(row);
  };
  if (product && product.variants && product.variants.length) product.variants.forEach(addVariantRow);
  else addVariantRow({size:'One Size',colour:'Default',stock:0});
  $('#addVariantBtn').onclick = () => addVariantRow({size:'',colour:'',stock:0});

  $('#saveProductBtn').onclick = async () => {
    const name = $('#pfName').value.trim(); const sku = $('#pfSku').value.trim();
    if (!name || !sku) { toast('Name and SKU required', 'danger'); return; }
    const price = parseMoneyToCents($('#pfPrice').value); const cost = parseMoneyToCents($('#pfCost').value);
    if (isNaN(price) || isNaN(cost) || price < 0 || cost < 0) { toast('Invalid price/cost', 'danger'); return; }
    const variants = [];
    $$('.variant-row', vlist).forEach(row => {
      const inputs = row.querySelectorAll('input');
      const size = inputs[0].value.trim() || 'One Size';
      const colour = inputs[1].value.trim() || 'Default';
      const stock = parseInt(inputs[2].value) || 0;
      if (stock < 0) return;
      variants.push({ id: genId('var'), size, colour, stock });
    });
    const item = {
      id: isEdit ? product.id : genId('prod'), name, sku,
      barcode: $('#pfBarcode').value.trim(),
      category: $('#pfCategory').value.trim() || 'General',
      image: $('#pfImage').value.trim(), price, cost,
      lowStockThreshold: parseInt($('#pfLow').value) || 5,
      variants, sizes: [...new Set(variants.map(v=>v.size))], colours: [...new Set(variants.map(v=>v.colour))],
      stock: variants.length ? variants.reduce((s,v)=>s+v.stock,0) : (parseInt($('#pfStock').value)||0),
      active: true, isSample: isEdit ? product.isSample : false
    };
    await dbPut('products', item);
    const idx = state.products.findIndex(p => p.id === item.id);
    if (idx >= 0) state.products[idx] = item; else state.products.push(item);
    auditLog(isEdit?'product_update':'product_create', name);
    toast(isEdit?'Product updated':'Product added', 'success');
    closeModal(); renderInventory();
  };
}
function adjustStockModal(pid) {
  let body = '<div class="form-group"><label>Product</label><select class="form-input" id="adjProduct">';
  state.products.forEach(p => { body += '<option value="' + p.id + '"' + (pid===p.id?' selected':'') + '>' + esc(p.name) + ' (stock: ' + totalVariantStock(p) + ')</option>'; });
  body += '</select></div><div id="adjVariantWrap"></div>';
  body += '<div class="form-group"><label>Type</label><select class="form-input" id="adjType"><option value="receipt">Stock Receipt (+)</option><option value="wastage">Wastage (−)</option><option value="correction">Correction</option></select></div>';
  body += '<div class="form-group"><label>Quantity</label><input class="form-input" id="adjQty" type="number" min="1" value="1"></div>';
  body += '<div class="form-group"><label>Note</label><input class="form-input" id="adjNote" placeholder="Optional reason"></div>';
  openModal('Adjust Stock', body, '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveAdjustBtn">Adjust Stock</button>');
  const renderVariantPickers = () => {
    const p = state.products.find(x => x.id === $('#adjProduct').value);
    const wrap = $('#adjVariantWrap'); wrap.innerHTML = '';
    if (p && p.variants && p.variants.length) {
      wrap.innerHTML = '<div class="form-group"><label>Variant</label><select class="form-input" id="adjVariant">' + p.variants.map((v,i)=>'<option value="'+i+'">'+esc(v.size)+' / '+esc(v.colour)+' (stock: '+v.stock+')</option>').join('') + '</select></div>';
    }
  };
  $('#adjProduct').onchange = renderVariantPickers; renderVariantPickers();
  $('#saveAdjustBtn').onclick = async () => {
    const p = state.products.find(x => x.id === $('#adjProduct').value);
    const type = $('#adjType').value; const qty = parseInt($('#adjQty').value)||0;
    if (!p || qty <= 0) { toast('Invalid adjustment', 'danger'); return; }
    const delta = type==='wastage' ? -qty : qty;
    let size = null, colour = null;
    if (p.variants && p.variants.length) {
      const vi = parseInt($('#adjVariant').value) || 0;
      const v = p.variants[vi];
      if (!v) { toast('Variant not found', 'danger'); return; }
      v.stock = Math.max(0, v.stock + delta); syncProductStockFromVariants(p);
      size = v.size; colour = v.colour;
    } else p.stock = Math.max(0, (p.stock||0) + delta);
    await dbPut('products', p);
    const mv = { id: genId('mv'), productId: p.id, productName: p.name, qty: delta, type, ref: $('#adjNote').value.trim()||type, date: nowISO(), user: state.currentUser.name, size, colour };
    await dbPut('stockMovements', mv); state.stockMovements.push(mv);
    auditLog('stock_adjust', p.name + ' ' + (delta>0?'+':'') + delta);
    toast('Stock adjusted', 'success'); closeModal(); renderInventory();
  };
}
function stockCountModal() {
  let body = '<div class="text-sm text-muted mb-1" style="font-weight:600;">Enter counted quantities per product. Variance will be recorded.</div><div id="countLines"></div>';
  openModal('New Stock Count', body, '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveCountBtn">Save Count</button>');
  const wrap = $('#countLines');
  state.products.forEach(p => {
    const row = document.createElement('div'); row.className='history-row';
    row.innerHTML = '<div style="font-weight:600;">' + esc(p.name) + ' <span class="text-muted text-xs">(exp ' + totalVariantStock(p) + ')</span></div><div><input class="form-input" type="number" min="0" value="' + totalVariantStock(p) + '" data-pid="' + p.id + '" style="width:85px;min-height:38px;"></div>';
    wrap.appendChild(row);
  });
  $('#saveCountBtn').onclick = async () => {
    const lines = [];
    $$('#countLines input').forEach(inp => {
      const p = state.products.find(x=>x.id===inp.dataset.pid);
      if (!p) return;
      lines.push({ productId: p.id, name: p.name, expected: totalVariantStock(p), counted: parseInt(inp.value)||0 });
    });
    const sc = { id: genId('count'), date: nowISO(), user: state.currentUser.name, lines, status: 'final' };
    await dbPut('stockCounts', sc); state.stockCounts.push(sc);
    for (const line of lines) {
      if (line.counted !== line.expected) {
        const p = state.products.find(x=>x.id===line.productId);
        if (p) { p.stock = line.counted; syncProductStockFromVariants(p); await dbPut('products', p); }
        const mv = { id: genId('mv'), productId: line.productId, productName: line.name, qty: line.counted-line.expected, type:'count', ref:'STOCK COUNT', date: nowISO(), user: state.currentUser.name };
        await dbPut('stockMovements', mv); state.stockMovements.push(mv);
      }
    }
    toast('Stock count saved', 'success'); closeModal(); renderInventory();
  };
}

  body += '<div class="form-group"><label>Valid until</label><input class="form-input" id="qValid" type="date" value="' + new Date(Date.now()+14*86400000).toISOString().slice(0,10) + '"></div>';
  body += '<div class="form-group"><label>Line items</label><div id="qItems"></div><button class="btn btn-xs btn-outline" id="addQLineBtn" type="button">+ Add line</button></div>';
  body += '<div class="form-group"><label>Discount (KES)</label><input class="form-input" id="qDiscount" type="number" step="0.01" value="0"></div>';
  body += '<div class="form-group"><label>Notes</label><textarea class="form-input" id="qNotes" rows="2"></textarea></div>';
  openModal('New Quotation', body, '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveQuotationBtn">Create Quotation</button>');
  const itemsWrap = $('#qItems');
  const addLine = (desc='', qty=1, price=0) => {
    const row = document.createElement('div'); row.className='variant-row';
    row.innerHTML = '<input placeholder="Description" value="' + esc(desc) + '" style="grid-column:span 2;"><input type="number" min="1" placeholder="Qty" value="' + qty + '"><input type="number" step="0.01" placeholder="Unit price (KES)" value="' + (price/100||'') + '"><button type="button" class="btn btn-xs btn-outline">✕</button>';
    row.querySelector('button').onclick = () => row.remove();
    itemsWrap.appendChild(row);
  };
  addLine('Sheer Voile Curtain — Ivory (200cm × 220cm)', 1, 350000);
  $('#addQLineBtn').onclick = () => addLine();
  $('#saveQuotationBtn').onclick = async () => {
    const items = [];
    $$('.variant-row', itemsWrap).forEach(row => {
      const inputs = row.querySelectorAll('input');
      const description = inputs[0].value.trim();
      const qty = parseInt(inputs[1].value)||0;
      const unitPrice = parseMoneyToCents(inputs[2].value)||0;
      if (description && qty > 0) items.push({ description, qty, unitPrice });
    });
    if (!items.length) { toast('Add at least one line item', 'danger'); return; }
    const subtotal = items.reduce((s,i)=>s+i.qty*i.unitPrice,0);
    const discount = parseMoneyToCents($('#qDiscount').value)||0;
    const vat = Math.round((subtotal-discount) * state.settings.vatRate / (100 + state.settings.vatRate));
    const total = subtotal - discount;
    const counters = (await dbGetAll('settings')).find(s=>s.id==='counters') || {id:'counters',quotations:0};
    counters.quotations = (counters.quotations||0)+1; await dbPut('settings', counters);
    const number = 'QT-' + new Date().getFullYear() + '-' + String(counters.quotations).padStart(4,'0');
    const siteId = $('#qSite').value || null;
    const site = siteId ? state.sites.find(s=>s.id===siteId) : null;
    const q = { id: genId('quot'), number, customerId: $('#qCustomer').value || null, customerName: '', siteId, siteName: site ? site.name : $('#qSiteName').value.trim(), date: nowISO(), validUntil: $('#qValid').value,
      items, subtotal, discount, vat, total, status: 'sent', notes: $('#qNotes').value.trim(), isSample: false };
    await dbPut('quotations', q); state.quotations.push(q);
    auditLog('quotation_create', number + ' — ' + formatMoney(total));
    toast('Quotation created', 'success'); closeModal(); renderQuotations(); quotationDetailModal(q.id);
  };
}

function paySupplierInvoiceModal(id) {
  const si = state.supplierInvoices.find(s=>s.id===id); if (!si) return;
  const remaining = si.total - (si.paid||0);
  let body = '<div class="text-sm mb-1" style="font-weight:600;">Invoice ' + esc(si.number) + ' — outstanding ' + formatMoney(remaining) + '</div><div class="form-group"><label>Payment amount (KES)</label><input class="form-input" id="sipayAmt" type="number" step="0.01" value="' + (remaining/100).toFixed(2) + '"></div>';
  openModal('Pay Supplier Invoice', body, '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="sipayBtn">Pay</button>');
  $('#sipayBtn').onclick = async () => {
    const amt = parseMoneyToCents($('#sipayAmt').value)||0;
    if (amt <= 0) { toast('Invalid amount', 'danger'); return; }
    si.paid = (si.paid||0) + amt;
    si.status = si.paid >= si.total ? 'paid' : 'partial';
    await dbPut('supplierInvoices', si);
    const sup = state.suppliers.find(s=>s.id===si.supplierId);
    if (sup) { sup.balance = Math.max(0, (sup.balance||0) - amt); await dbPut('suppliers', sup); }
    await dbPut('supplierPayments', { id: genId('sp'), supplierId: si.supplierId, invoiceId: si.id, amount: amt, date: nowISO() });
    toast('Payment recorded', 'success'); closeModal(); renderSuppliers();
  };
}

function renderFinance() {
  const view = $('#view');
  const completed = state.sales.filter(s => s.status === 'completed');
  const totalRevenue = completed.reduce((s,x)=>s+x.total,0);
  const totalCogs = completed.reduce((s,x)=>s+(x.items||[]).reduce((is,i)=>is+((i.cost||0)*i.qty),0),0);
  const totalExpenses = state.expenses.reduce((s,e)=>s+e.amount,0);
  const stockValueCost = state.products.reduce((s,p)=>s+(p.cost*totalVariantStock(p)),0);
  const stockValueRetail = state.products.reduce((s,p)=>s+(p.price*totalVariantStock(p)),0);
  const grossProfit = totalRevenue - totalCogs;
  const netProfit = grossProfit - totalExpenses;
  const supplierDue = state.supplierInvoices.reduce((s,si)=>s+(si.total-(si.paid||0)),0);

  let html = '<div style="display:flex;flex-direction:column;gap:1rem;">';
  html += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;"><button class="btn btn-primary" onclick="expenseFormModal()">+ Add Expense</button><button class="btn btn-outline" onclick="exportCSV(\'expenses\')">📥 CSV</button></div>';
  html += '<div class="stat-grid">';
  html += '<div class="stat-card highlight"><div class="stat-label">Revenue</div><div class="stat-value">' + formatMoney(totalRevenue) + '</div><div class="stat-sub">' + completed.length + ' sales</div></div>';
  html += '<div class="stat-card"><div class="stat-label">COGS</div><div class="stat-value">' + formatMoney(totalCogs) + '</div></div>';
  html += '<div class="stat-card success"><div class="stat-label">Gross Profit</div><div class="stat-value">' + formatMoney(grossProfit) + '</div><div class="stat-sub">' + (totalRevenue?Math.round(grossProfit/totalRevenue*100):0) + '% margin</div></div>';
  html += '<div class="stat-card warning"><div class="stat-label">Expenses</div><div class="stat-value">' + formatMoney(totalExpenses) + '</div></div>';
  html += '<div class="stat-card ' + (netProfit>=0?'success':'danger') + '"><div class="stat-label">Net Profit</div><div class="stat-value">' + formatMoney(netProfit) + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">Stock Value</div><div class="stat-value">' + formatMoney(stockValueCost) + '</div><div class="stat-sub">Retail: ' + formatMoney(stockValueRetail) + '</div></div>';
  html += '<div class="stat-card danger"><div class="stat-label">Supplier Payables</div><div class="stat-value">' + formatMoney(supplierDue) + '</div></div>';

  html += '<div class="card"><div class="card-title">Expenses</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>';

  html += '</tbody></table></div></div>';

  html += '<div class="chart-grid"><div class="card chart-wrap"><div class="card-title">Expenses by Category</div>' + svgDonutChart('Expenses by category', Object.keys(state.expenses.reduce((a,e)=>{a[e.category]=(a[e.category]||0)+e.amount;return a;},{})), Object.values(state.expenses.reduce((a,e)=>{a[e.category]=(a[e.category]||0)+e.amount;return a;},{}))) + '</div>';

function renderReports() {
  const view = $('#view');
  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate()).toISOString();
  const weekStart = new Date(today); weekStart.setDate(weekStart.getDate()-7);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const completed = state.sales.filter(s => s.status === 'completed');
  const todaySales = completed.filter(s => s.date >= todayStart);
  const weekSales = completed.filter(s => s.date >= weekStart.toISOString());
  const monthSales = completed.filter(s => s.date >= monthStart.toISOString());
  const sum = arr => arr.reduce((s,x)=>s+x.total,0);
  const sumVat = arr => arr.reduce((s,x)=>s+(x.vat||0),0);
  const sumCogs = arr => arr.reduce((s,x)=>s+(x.items||[]).reduce((is,i)=>is+((i.cost||0)*i.qty),0),0);

  let html = '<div style="display:flex;flex-direction:column;gap:1rem;">';
  html += '<div class="stat-grid">';
  html += '<div class="stat-card highlight"><div class="stat-label">Today</div><div class="stat-value">' + formatMoney(sum(todaySales)) + '</div><div class="stat-sub">' + todaySales.length + ' sales</div></div>';
  html += '<div class="stat-card"><div class="stat-label">This Week</div><div class="stat-value">' + formatMoney(sum(weekSales)) + '</div><div class="stat-sub">' + weekSales.length + ' sales</div></div>';
  html += '<div class="stat-card"><div class="stat-label">This Month</div><div class="stat-value">' + formatMoney(sum(monthSales)) + '</div><div class="stat-sub">' + monthSales.length + ' sales</div></div>';
  html += '<div class="stat-card success"><div class="stat-label">Gross Profit (Month)</div><div class="stat-value">' + formatMoney(sum(monthSales)-sumCogs(monthSales)) + '</div><div class="stat-sub">COGS: ' + formatMoney(sumCogs(monthSales)) + '</div></div></div>';

  html += '<div class="card"><div class="card-title">VAT Summary (' + state.settings.vatRate + '% inclusive)</div><div class="table-wrap"><table><thead><tr><th>Period</th><th>Gross Sales</th><th>VAT Portion</th><th>Net Sales</th></tr></thead><tbody>';
  [['Today',todaySales],['This Week',weekSales],['This Month',monthSales]].forEach(([label,arr]) => {
    const gross = sum(arr), vat = sumVat(arr);
    html += '<tr><td style="font-weight:700;">' + label + '</td><td>' + formatMoney(gross) + '</td><td>' + formatMoney(vat) + '</td><td>' + formatMoney(gross-vat) + '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  const trend = lastSevenDaysSales();
  html += '<div class="chart-grid"><div class="card chart-wrap"><div class="card-title">📈 Daily Revenue · 7 Days (KES)</div>' + svgBarChart('Daily revenue', trend.labels, trend.values) + '</div>';
  const payLabels = ['Cash','M-Pesa','Credit'];
  const payValues = payLabels.map(m=>completed.filter(s=>s.paymentMethod===m).length);
  html += '<div class="card chart-wrap"><div class="card-title">🧾 Sales by Payment Method</div>' + svgDonutChart('Payment methods', payLabels, payValues) + '</div></div>';

  const productSales = {};
  completed.forEach(s => (s.items||[]).forEach(i => {
    if (!productSales[i.productId]) productSales[i.productId] = { name: i.name, qty: 0, revenue: 0, lastSold: s.date };
    productSales[i.productId].qty += i.qty;
    productSales[i.productId].revenue += i.price * i.qty;
    if (s.date > productSales[i.productId].lastSold) productSales[i.productId].lastSold = s.date;
  }));
  const best = Object.values(productSales).sort((a,b)=>b.qty-a.qty).slice(0,6);
  const slow = state.products.filter(p => !productSales[p.id] || !inLastDays(productSales[p.id].lastSold, 30)).map(p => ({ name: p.name, stock: totalVariantStock(p), value: p.cost*totalVariantStock(p), lastSold: productSales[p.id]?productSales[p.id].lastSold:null })).sort((a,b)=>b.value-a.value).slice(0,8);

  html += '<div class="card"><div class="card-title">🏆 Best Sellers</div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead><tbody>';
  best.forEach(p => { html += '<tr><td style="font-weight:700;">' + esc(p.name) + '</td><td>' + p.qty + '</td><td>' + formatMoney(p.revenue) + '</td></tr>'; });
  html += '</tbody></table></div></div>';

  html += '<div class="card"><div class="card-title">🐢 Slow-Moving Stock (last 30 days)</div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th><th>Value at cost</th><th>Last sold</th></tr></thead><tbody>';
  slow.forEach(p => { html += '<tr><td style="font-weight:700;">' + esc(p.name) + '</td><td>' + p.stock + '</td><td>' + formatMoney(p.value) + '</td><td>' + (p.lastSold?new Date(p.lastSold).toLocaleDateString('en-KE'):'Never') + '</td></tr>'; });
  if (!slow.length) html += '<tr><td colspan="4" class="text-center text-muted" style="padding:1rem;font-weight:600;">All products sold recently.</td></tr>';
  html += '</tbody></table></div></div>';

  const stockByCat = {};
  state.products.forEach(p => { stockByCat[p.category] = (stockByCat[p.category]||0) + p.cost*totalVariantStock(p); });
  const stockTop = Object.entries(stockByCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  html += '<div class="chart-grid"><div class="card chart-wrap"><div class="card-title">📦 Stock Valuation by Category</div>' + svgDonutChart('Stock valuation (cost) by category', stockTop.map(x=>x[0]), stockTop.map(x=>x[1])) + '</div>';
  html += '<div class="card chart-wrap"><div class="card-title">💰 Revenue by Category</div>' + svgBarChart('Revenue by category', Object.keys(productSales).slice(0,6).map(k=>productSales[k].name), Object.values(productSales).slice(0,6).map(p=>p.revenue/100)) + '</div></div>';

  html += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;"><button class="btn btn-outline" onclick="exportCSV(\'sales\')">📥 Sales CSV</button><button class="btn btn-outline" onclick="exportCSV(\'products\')">📥 Products CSV</button><button class="btn btn-outline" onclick="exportCSV(\'invoices\')">📥 Invoices CSV</button><button class="btn btn-outline" onclick="exportCSV(\'expenses\')">📥 Expenses CSV</button><button class="btn btn-outline" onclick="printCurrentView()">🖨️ Print Report</button></div>';
  html += '</div>';
  view.innerHTML = html; labelTables();
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportCSV(type) {
  let data, filename;
  if (type === 'products') { data = state.products; filename = 'rtex_products.csv'; }
  else if (type === 'sales') { data = state.sales; filename = 'rtex_sales.csv'; }
  else if (type === 'invoices') { data = state.invoices; filename = 'rtex_invoices.csv'; }
  else if (type === 'expenses') { data = state.expenses; filename = 'rtex_expenses.csv'; }
  else return;
  if (!data.length) { toast('Nothing to export', 'warning'); return; }
  const headers = Object.keys(data[0]);
  let csv = '\uFEFF' + headers.join(',') + '\n';
  data.forEach(row => {
    csv += headers.map(h => { let val = row[h]; if (typeof val === 'object') val = JSON.stringify(val); return '"' + String(val??'').replace(/"/g,'""') + '"'; }).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url); toast('CSV exported', 'success');
}
async function exportBackup() {
  const backup = {};
  for (const store of STORES) backup[store] = await dbGetAll(store);
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'rtex_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  URL.revokeObjectURL(url); toast('Backup exported', 'success');
}
function importBackup() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text(); const data = JSON.parse(text);
      if (!data.products || !data.sales) { toast('Invalid backup file', 'danger'); return; }
      await dbClearAll(); memoryStore = {};
      for (const store of STORES) {
        if (data[store] && Array.isArray(data[store])) for (const item of data[store]) await dbPut(store, item);
      }
      await loadState(); toast('Backup restored', 'success'); navigate('dashboard');
    } catch (err) { toast('Import failed: ' + err.message, 'danger'); }
  };
  input.click();
}
function resetDataConfirm() {
  openModal('Reset Demo Data', '<p class="text-sm" style="font-weight:600;">This will delete all current data and restore the original sample data. This cannot be undone.</p><p class="text-sm font-bold text-danger mt-1">Are you sure?</p>', '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="confirmResetBtn">Yes, Reset</button>');
  $('#confirmResetBtn').onclick = async () => {
    closeModal(); await dbClearAll(); memoryStore = {};
    await seedSampleData(); await loadState(); toast('Data reset to sample', 'success'); navigate('dashboard');
  };
}

/* ============================================================
   BOOT
   ============================================================ */
async function init() {
  await openDB();
  await seedSampleData();
  await loadState();
  initTableLabeler();

  const savedUser = safeLocal(() => localStorage.getItem('rtx_user'), null);
  if (savedUser) {
    try {
      const u = JSON.parse(savedUser);
      state.currentUser = u.name ? { name: u.name, role: u.role } : null;
      state.currentRole = u.role || 'owner';
      state.currentUserObj = u;
      $('#loginScreen').style.display = 'none'; $('#app').classList.add('active');
      buildNav(); buildBottomNav(); navigate('dashboard'); updateStorageBadge();
    } catch (e) { renderLogin(); }
  } else renderLogin();

  $('#mobileMenu').onclick = toggleSidebar;
  $('#sidebarBackdrop').onclick = closeSidebar;
  $('#notifBtn').onclick = () => {
    const alerts = getAlerts();
    if (!alerts.length) { toast('No notifications', 'success'); return; }
    let body = alerts.map(a => '<div class="alert-card"><span class="alert-dot" style="background:' + (a.severity==='danger'?'var(--danger)':'var(--warning)') + ';"></span><div class="alert-body"><div class="alert-msg">' + esc(a.msg) + '</div><div class="alert-tag">' + esc(a.type.replace(/_/g,' ')) + '</div></div></div>').join('');
    openModal('Notifications', body, '<button class="btn btn-outline" onclick="closeModal()">Close</button>');
  };
  window.addEventListener('resize', debounce(() => {
    const isMobile = window.matchMedia('(max-width: 820px)').matches;
    if (state.currentView === 'dashboard') { if (isMobile) renderMobileHome(); else renderDashboard(); }
    if (isMobile && state.sidebarOpen) closeSidebar();
  }, 300));
  updateNotifications();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
