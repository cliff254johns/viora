<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#C45A2D">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1714">
  <script src="/guard.js?v=2" defer></script>
  <title>General Shop — Retail Manager</title>
  <style>
    :root {
      --primary: #C45A2D; --primary-light: #E07A4A; --primary-dark: #A0461F;
      --accent: #E8A33D; --accent-light: #F0C070;
      --success: #4A7C59; --success-light: #6BA07A;
      --warning: #D4942B; --danger: #B33A2B; --danger-light: #D45A4A;
      --bg: #FDF8F3; --card: #FFFFFF; --card-alt: #FBF4ED;
      --border: #EAD9CC; --border-light: #F2E8DF;
      --text: #2D1F16; --text-muted: #8C7A6B; --text-inverse: #FFFFFF;
      --shadow-sm: 0 1px 3px rgba(45,31,22,0.06);
      --shadow-md: 0 2px 8px rgba(45,31,22,0.08);
      --shadow-lg: 0 8px 24px rgba(45,31,22,0.10);
      --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 100px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --nav-height: 64px; --sidebar-width: 240px; --topbar-height: 56px;
    }
    [data-theme="dark"] {
      --primary: #E07A4A; --primary-light: #F0926A; --primary-dark: #C45A2D;
      --accent: #F0C070; --accent-light: #F5D89A;
      --success: #6BA07A; --success-light: #8BBF9A;
      --warning: #E0A840; --danger: #D45A4A; --danger-light: #E87A6A;
      --bg: #1C1714; --card: #2A221D; --card-alt: #332A24;
      --border: #3E322A; --border-light: #4A3C32;
      --text: #F0E6DC; --text-muted: #A8968A; --text-inverse: #1C1714;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      line-height: 1.5; min-height: 100vh; min-height: 100dvh;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.1rem; } h4 { font-size: 0.95rem; }
    a { color: var(--primary); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: inherit; color: inherit; }
    input, select, textarea {
      font-family: inherit; font-size: 16px; color: var(--text);
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    ::placeholder { color: var(--text-muted); opacity: 0.7; }

    #app { display: none; min-height: 100vh; min-height: 100dvh; }
    #app.active { display: flex; }

    #sidebar {
      width: var(--sidebar-width); background: var(--card);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0;
      z-index: 200; transition: transform 0.3s ease;
      overflow-y: auto; padding-bottom: env(safe-area-inset-bottom);
    }
    #sidebar.hidden { transform: translateX(-100%); }
    .sidebar-logo {
      padding: 20px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo .logo-icon {
      width: 36px; height: 36px; background: var(--primary);
      border-radius: var(--radius-sm); display: flex;
      align-items: center; justify-content: center;
      font-size: 1.2rem; color: var(--text-inverse); flex-shrink: 0;
    }
    .sidebar-logo .logo-text { font-weight: 700; font-size: 0.95rem; line-height: 1.2; color: var(--text); }
    .sidebar-logo .logo-sub { font-size: 0.7rem; color: var(--text-muted); font-weight: 400; }
    .sidebar-nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .sidebar-nav .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      font-size: 0.9rem; font-weight: 500; color: var(--text-muted);
      transition: all 0.15s; text-align: left; min-height: 44px;
    }
    .sidebar-nav .nav-item:hover { background: var(--card-alt); color: var(--text); }
    .sidebar-nav .nav-item.active { background: var(--primary); color: var(--text-inverse); }
    .sidebar-nav .nav-item .nav-icon { font-size: 1.1rem; width: 22px; text-align: center; }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); }
    #sidebarBackdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 199;
    }
    #sidebarBackdrop.active { display: block; }

    main {
      flex: 1; margin-left: var(--sidebar-width);
      display: flex; flex-direction: column;
      min-height: 100vh; min-height: 100dvh;
    }
    .topbar {
      height: var(--topbar-height); background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; padding-top: env(safe-area-inset-top);
      height: calc(var(--topbar-height) + env(safe-area-inset-top));
      position: sticky; top: 0; z-index: 100;
    }
    .topbar h2 { font-size: 1rem; flex: 1; font-weight: 600; }
    #mobileMenu {
      display: none; width: 44px; height: 44px;
      align-items: center; justify-content: center;
      border-radius: var(--radius-sm); font-size: 1.3rem;
      color: var(--text); flex-shrink: 0;
    }
    #mobileMenu:active { background: var(--card-alt); }
    #storageBadge {
      font-size: 0.65rem; padding: 3px 8px;
      border-radius: var(--radius-pill); background: var(--card-alt);
      color: var(--text-muted); white-space: nowrap; font-weight: 500;
    }
    #storageBadge.session { background: var(--warning); color: var(--text-inverse); }
    #notifBtn {
      width: 44px; height: 44px; display: flex;
      align-items: center; justify-content: center;
      border-radius: var(--radius-sm); font-size: 1.1rem;
      position: relative; flex-shrink: 0;
    }
    #notifBtn:active { background: var(--card-alt); }
    #notifBtn .notif-dot {
      position: absolute; top: 8px; right: 8px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger); display: none;
    }
    #notifBtn .notif-dot.visible { display: block; }
    #view {
      flex: 1; padding: 16px;
      padding-bottom: calc(var(--nav-height) + 24px + env(safe-area-inset-bottom));
      max-width: 100%; overflow-x: hidden;
    }

    #bottomNav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-top: 1px solid var(--border);
      z-index: 150; padding-bottom: env(safe-area-inset-bottom);
    }
    #bottomNav .bottom-tabs { display: flex; height: var(--nav-height); }
    #bottomNav .bottom-tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; font-size: 0.65rem; font-weight: 500;
      color: var(--text-muted); transition: all 0.2s;
      min-height: 44px; position: relative;
    }
    #bottomNav .bottom-tab .tab-icon { font-size: 1.25rem; transition: transform 0.2s; line-height: 1; }
    #bottomNav .bottom-tab.active { color: var(--text-inverse); }
    #bottomNav .bottom-tab.active .tab-icon { transform: translateY(-2px) scale(1.08); }
    #bottomNav .bottom-tab.active .tab-pill {
      position: absolute; top: 6px; left: 50%;
      transform: translateX(-50%); width: 44px; height: 28px;
      background: var(--primary); border-radius: var(--radius-pill);
      z-index: -1; display: flex; align-items: center; justify-content: center;
    }
    #bottomNav .bottom-tab .tab-label { position: relative; z-index: 1; }
    #bottomNav .bottom-tab.active .tab-label { color: var(--primary); font-weight: 600; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 18px; border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.9rem; transition: all 0.15s;
      min-height: 44px; white-space: nowrap; border: 1px solid transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: var(--text-inverse); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--card-alt); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--border-light); }
    .btn-success { background: var(--success); color: var(--text-inverse); }
    .btn-danger { background: var(--danger); color: var(--text-inverse); }
    .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; min-height: 36px; border-radius: var(--radius-sm); }
    .btn-block { width: 100%; }

    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: var(--radius-pill); font-size: 0.7rem;
      font-weight: 600; line-height: 1.4;
    }
    .badge-primary { background: var(--primary); color: var(--text-inverse); }
    .badge-success { background: var(--success); color: var(--text-inverse); }
    .badge-warning { background: var(--warning); color: var(--text-inverse); }
    .badge-danger  { background: var(--danger); color: var(--text-inverse); }
    .badge-muted   { background: var(--card-alt); color: var(--text-muted); }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 8px;
    }
    .card-header h3 { font-size: 0.95rem; }

    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px;
      box-shadow: var(--shadow-sm);
    }
    .stat-card .stat-label {
      font-size: 0.75rem; color: var(--text-muted);
      font-weight: 500; margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .stat-card .stat-value {
      font-size: 1.4rem; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text);
    }
    .stat-card .stat-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .stat-card.primary .stat-value { color: var(--primary); }
    .stat-card.success .stat-value { color: var(--success); }
    .stat-card.warning .stat-value { color: var(--warning); }
    .stat-card.danger .stat-value { color: var(--danger); }

    .table-wrap {
      overflow-x: auto; border-radius: var(--radius-md);
      border: 1px solid var(--border); background: var(--card);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead th {
      text-align: left; padding: 10px 12px; font-size: 0.72rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-muted); background: var(--card-alt);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody td {
      padding: 10px 12px; border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--card-alt); }

    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .text-muted { color: var(--text-muted); }
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .fw-bold { font-weight: 700; }
    .fw-semibold { font-weight: 600; }
    .fs-sm { font-size: 0.8rem; }
    .fs-xs { font-size: 0.7rem; }
    .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
    .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
    .flex { display: flex; } .flex-col { flex-direction: column; }
    .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .flex-wrap { flex-wrap: wrap; } .flex-1 { flex: 1; }

    #toasts {
      position: fixed; bottom: calc(var(--nav-height) + 16px + env(safe-area-inset-bottom));
      left: 16px; right: 16px; z-index: 500;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--text); color: var(--text-inverse);
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 500;
      box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease;
      pointer-events: auto;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.warning { background: var(--warning); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    #modalRoot {
      display: none; position: fixed; inset: 0;
      z-index: 300; align-items: center; justify-content: center;
      padding: 20px;
    }
    #modalRoot.active { display: flex; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
    .modal {
      position: relative; background: var(--card);
      border-radius: var(--radius-lg); width: 100%;
      max-width: 560px; max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-lg); animation: modalIn 0.25s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--card); z-index: 1;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .modal-header h3 { font-size: 1rem; }
    .modal-close {
      width: 36px; height: 36px; display: flex;
      align-items: center; justify-content: center;
      border-radius: var(--radius-sm); font-size: 1.2rem;
      color: var(--text-muted); flex-shrink: 0;
    }
    .modal-close:hover { background: var(--card-alt); }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 16px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; justify-content: flex-end;
      position: sticky; bottom: 0; background: var(--card);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.78rem;
      font-weight: 600; color: var(--text-muted); margin-bottom: 4px;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    #loginScreen {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: var(--bg); z-index: 400; padding: 20px;
      background-image: radial-gradient(ellipse at 30% 20%, rgba(196,90,45,0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(232,163,61,0.08) 0%, transparent 60%);
    }
    #loginScreen.hidden { display: none; }
    .login-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 32px 24px;
      width: 100%; max-width: 400px;
      box-shadow: var(--shadow-lg); text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px; background: var(--primary);
      border-radius: var(--radius-md); display: flex;
      align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 12px; color: var(--text-inverse);
    }
    .login-card h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .login-card .login-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
    .login-card .demo-note {
      font-size: 0.72rem; color: var(--text-muted);
      background: var(--card-alt); padding: 8px 12px;
      border-radius: var(--radius-sm); margin-bottom: 20px; line-height: 1.5;
    }
    .role-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .role-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--card);
      text-align: left; transition: all 0.15s; min-height: 52px; width: 100%;
    }
    .role-btn:hover { border-color: var(--primary); background: var(--card-alt); }
    .role-btn:active { transform: scale(0.98); }
    .role-btn .role-icon {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--primary); color: var(--text-inverse);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .role-btn .role-name { font-weight: 600; font-size: 0.9rem; }
    .role-btn .role-desc { font-size: 0.72rem; color: var(--text-muted); }

    .app-home { padding: 0; max-width: 640px; margin: 0 auto; }
    .app-greeting { padding: 8px 4px 16px; }
    .app-greeting h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    .app-greeting .greeting-date { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: var(--radius-lg); padding: 20px;
      color: var(--text-inverse); margin-bottom: 20px;
      cursor: pointer; transition: transform 0.15s;
      box-shadow: var(--shadow-md);
    }
    .hero:active { transform: scale(0.98); }
    .hero .hero-label {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.06em; opacity: 0.85; font-weight: 600;
    }
    .hero .hero-amount {
      font-size: 2rem; font-weight: 700;
      letter-spacing: -0.03em; margin: 4px 0 12px; line-height: 1.1;
    }
    .hero .hero-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .hero .hero-chip {
      background: rgba(255,255,255,0.2); border-radius: var(--radius-pill);
      padding: 3px 10px; font-size: 0.7rem; font-weight: 500;
      backdrop-filter: blur(4px);
    }
    .section-label {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.08em; font-weight: 700;
      color: var(--text-muted); margin-bottom: 10px; padding: 0 4px;
    }
    .tile-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; margin-bottom: 20px;
    }
    .tile {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px;
      min-height: 110px; display: flex; flex-direction: column;
      justify-content: flex-start; position: relative;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .tile:active { transform: scale(0.97); }
    .tile .tile-icon { font-size: 1.5rem; margin-bottom: 8px; line-height: 1; }
    .tile .tile-title { font-weight: 700; font-size: 0.9rem; color: var(--text); line-height: 1.3; }
    .tile .tile-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
    .tile .tile-badge {
      position: absolute; top: 12px; right: 12px;
      min-width: 20px; height: 20px; border-radius: var(--radius-pill);
      background: var(--danger); color: var(--text-inverse);
      font-size: 0.65rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }
    .tile .tile-badge.warning { background: var(--warning); }
    .quick-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 20px;
    }
    .mini-stat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 8px;
      text-align: center; box-shadow: var(--shadow-sm);
    }
    .mini-stat .mini-value { font-size: 1.1rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .mini-stat .mini-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; line-height: 1.3; }

    .alert-card {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      margin-bottom: 8px; box-shadow: var(--shadow-sm);
    }
    .alert-card .alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
    .alert-card .alert-dot.warning { background: var(--warning); }
    .alert-card .alert-dot.danger { background: var(--danger); }
    .alert-card .alert-dot.info { background: var(--primary); }
    .alert-card .alert-body { flex: 1; min-width: 0; }
    .alert-card .alert-msg { font-size: 0.82rem; font-weight: 500; line-height: 1.4; }
    .alert-card .alert-type {
      font-size: 0.65rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px;
    }

<script>
/* ============================================================
   1. UTIL
   ============================================================ */
const Util = (() => {
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const nairobiTime = () => new Date().toLocaleString('en-KE', { timeZone: 'Africa/Nairobi', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
  const nairobiDateLong = (d) => (d || new Date()).toLocaleDateString('en-KE', { timeZone: 'Africa/Nairobi', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const nairobiDateShort = (d) => (d || new Date()).toLocaleDateString('en-KE', { timeZone: 'Africa/Nairobi', year: 'numeric', month: '2-digit', day: '2-digit' });
  const todayStart = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
  const dayStart = (offset) => { const d = new Date(); d.setDate(d.getDate() + (offset || 0)); d.setHours(0,0,0,0); return d.getTime(); };
  const toCents = (amount) => Math.round(Number(amount) * 100);
  const fromCents = (cents) => cents / 100;
  const formatKES = (cents) => 'Ksh ' + fromCents(Math.round(cents || 0)).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const VAT_RATE = 0.16;
  const vatFromInclusive = (grossCents) => Math.round(grossCents - (grossCents / (1 + VAT_RATE)));
  const esc = (str) => {
    if (typeof str !== 'string') return String(str ?? '');
    return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  };
  const generateEAN13 = () => {
    let digits = '20';
    for (let i = 0; i < 10; i++) digits += Math.floor(Math.random() * 10);
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += parseInt(digits[i]) * (i % 2 === 0 ? 1 : 3);
    return digits + ((10 - (sum % 10)) % 10);
  };
  const validateEAN13 = (code) => {
    if (!/^\d{13}$/.test(code)) return false;
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += parseInt(code[i]) * (i % 2 === 0 ? 1 : 3);
    return (10 - (sum % 10)) % 10 === parseInt(code[12]);
  };
  const formatPhone = (phone) => {
    const clean = phone.replace(/\D/g, '');
    if (clean.startsWith('254')) return '+' + clean;
    if (clean.startsWith('0')) return '+254' + clean.slice(1);
    return phone;
  };
  const debounce = (fn, ms) => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); }; };
  return { uid, nairobiTime, nairobiDateLong, nairobiDateShort, todayStart, dayStart, toCents, fromCents, formatKES, VAT_RATE, vatFromInclusive, esc, generateEAN13, validateEAN13, formatPhone, debounce };
})();

/* ============================================================
   2. STORAGE
   ============================================================ */
const Storage = (() => {
  const DB_NAME = 'GeneralShopDB';
  const DB_VERSION = 1;
  let db = null;
  let useMemory = false;
  let memoryStore = {};
  const openDB = () => new Promise((resolve, reject) => {
    if (!window.indexedDB) { useMemory = true; reject('IndexedDB not supported'); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('store')) database.createObjectStore('store', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => { useMemory = true; reject(e.target.error); };
  });
  const idbGet = (key) => new Promise((resolve, reject) => {
    const tx = db.transaction('store', 'readonly');
    const req = tx.objectStore('store').get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => reject(req.error);
  });
  const idbSet = (key, value) => new Promise((resolve, reject) => {
    const tx = db.transaction('store', 'readwrite');
    const req = tx.objectStore('store').put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
  const idbClear = () => new Promise((resolve, reject) => {
    const tx = db.transaction('store', 'readwrite');
    const req = tx.objectStore('store').clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
  const get = async (key, fallback) => {
    if (useMemory) return memoryStore[key] !== undefined ? memoryStore[key] : (fallback !== undefined ? fallback : null);
    try { const val = await idbGet(key); return val !== null ? val : (fallback !== undefined ? fallback : null); }
    catch (e) { useMemory = true; return memoryStore[key] !== undefined ? memoryStore[key] : (fallback !== undefined ? fallback : null); }
  };
  const set = async (key, value) => {
    if (useMemory) { memoryStore[key] = value; return; }
    try { await idbSet(key, value); }
    catch (e) { useMemory = true; memoryStore[key] = value; }
  };
  const getAll = async () => {
    if (useMemory) return { ...memoryStore };
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('store', 'readonly');
        const req = tx.objectStore('store').getAll();
        req.onsuccess = () => { const result = {}; req.result.forEach(item => { result[item.key] = item.value; }); resolve(result); };
        req.onerror = () => reject(req.error);
      });
    } catch (e) { useMemory = true; return { ...memoryStore }; }
  };
  const clear = async () => {
    if (useMemory) { memoryStore = {}; return; }
    try { await idbClear(); } catch (e) { useMemory = true; memoryStore = {}; }
  };
  const isMemory = () => useMemory;
  const init = async () => { try { await openDB(); } catch (e) { useMemory = true; } };
  return { init, get, set, getAll, clear, isMemory };
})();

/* ============================================================
   3. SECURITY — Multiple users
   ============================================================ */
const Security = (() => {
  const USERS = {
    owner: { label: 'Grace Wanjiku', displayName: 'Grace W.', role: 'Owner', roleKey: 'owner', icon: '👑', desc: 'Full access to all modules', permissions: ['*'] },
    manager: { label: 'Peter Ochieng', displayName: 'Peter O.', role: 'Manager', roleKey: 'manager', icon: '📋', desc: 'Sales, inventory, reports, staff', permissions: ['dashboard', 'pos', 'inventory', 'suppliers', 'customers', 'staff', 'reports', 'settings', 'sales'] },
    cashier1: { label: 'Faith Muthoni', displayName: 'Faith M.', role: 'Cashier', roleKey: 'cashier', icon: '💰', desc: 'POS, sales, customers', permissions: ['dashboard', 'pos', 'customers', 'sales'] },
    cashier2: { label: 'John Kamau', displayName: 'John K.', role: 'Cashier', roleKey: 'cashier', icon: '💰', desc: 'POS, sales, customers', permissions: ['dashboard', 'pos', 'customers', 'sales'] },
    storekeeper: { label: 'Mary Achieng', displayName: 'Mary A.', role: 'Storekeeper', roleKey: 'storekeeper', icon: '📦', desc: 'Inventory, suppliers, stock take', permissions: ['dashboard', 'inventory', 'suppliers'] }
  };
  let currentUser = null;
  const hasPermission = (perm) => {
    if (!currentUser) return false;
    const user = USERS[currentUser.userKey];
    if (!user) return false;
    if (user.permissions.includes('*')) return true;
    return user.permissions.includes(perm);
  };
  const login = async (userKey) => {
    const user = USERS[userKey];
    if (!user) return false;
    currentUser = { id: Util.uid(), userKey, name: user.label, displayName: user.displayName, role: user.role, roleKey: user.roleKey, icon: user.icon, loginTime: Date.now() };
    localStorage.setItem('gs_session_user', userKey);
    await Storage.set('currentUser', currentUser);
    return true;
  };
  const logout = async () => {
    currentUser = null;
    localStorage.removeItem('gs_session_user');
    await Storage.set('currentUser', null);
  };
  const restoreSession = async () => {
    const saved = localStorage.getItem('gs_session_user');
    if (saved && USERS[saved]) {
      const user = USERS[saved];
      currentUser = { id: Util.uid(), userKey: saved, name: user.label, displayName: user.displayName, role: user.role, roleKey: user.roleKey, icon: user.icon, loginTime: Date.now() };
      return true;
    }
    return false;
  };
  const getUser = () => currentUser;
  const getRole = () => currentUser ? USERS[currentUser.userKey] : null;
  const getRoles = () => USERS;
  return { USERS, login, logout, restoreSession, getUser, getRole, getRoles, hasPermission };
})();

/* ============================================================
   4. INTEGRATIONS
   ============================================================ */
const BarcodeScanner = (() => {
  let stream = null, detector = null, scanning = false;
  let facingMode = 'environment', videoEl = null;
  let lastScanned = '', lastScannedTime = 0;
  const isSecureContext = () => window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const hasBarcodeDetector = () => 'BarcodeDetector' in window;
  const start = async (videoContainer) => {
    if (!isSecureContext()) throw new Error('Camera requires HTTPS or localhost. Use manual entry or a USB/Bluetooth scanner instead.');
    if (!hasBarcodeDetector()) throw new Error('BarcodeDetector not available in this browser. Use manual entry or a USB/Bluetooth scanner.');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera API not available. Use manual entry or a USB/Bluetooth scanner.');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } });
      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline', 'true');
      videoEl.setAttribute('autoplay', 'true');
      videoEl.style.width = '100%';
      videoEl.style.borderRadius = '12px';
      videoEl.srcObject = stream;
      if (videoContainer) { videoContainer.innerHTML = ''; videoContainer.appendChild(videoEl); }
      await videoEl.play();
      detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'code_128', 'code_39', 'qr_code'] });
      scanning = true;
      lastScanned = '';
      lastScannedTime = 0;
      return true;
    } catch (e) { throw new Error('Camera access denied or unavailable. Use manual entry or a USB/Bluetooth scanner.'); }
  };
  const scan = async () => {
    if (!scanning || !detector || !videoEl) return null;
    if (videoEl.readyState !== videoEl.HAVE_ENOUGH_DATA) return null;
    try {
      const barcodes = await detector.detect(videoEl);
      if (barcodes.length > 0) {
        const code = barcodes[0].rawValue;
        const now = Date.now();
        if (code === lastScanned && now - lastScannedTime < 2000) return null;
        lastScanned = code;
        lastScannedTime = now;
        return code;
      }
    } catch (e) { /* silent */ }
    return null;
  };
  const stop = () => {
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (videoEl) { videoEl.srcObject = null; videoEl = null; }
    detector = null;
  };
  return { start, scan, stop, isSecureContext, hasBarcodeDetector };
})();

const WedgeScanner = (() => {
  let buffer = '', lastKeyTime = 0, active = false, callback = null;
  const start = (cb) => { callback = cb; active = true; buffer = ''; document.addEventListener('keydown', handler); };
  const stop = () => { active = false; callback = null; document.removeEventListener('keydown', handler); };
  const handler = (e) => {
    if (!active || !callback) return;
    const now = Date.now();
    if (now - lastKeyTime > 100) buffer = '';
    lastKeyTime = now;
    if (e.key === 'Enter') {
      if (buffer.length >= 4) { e.preventDefault(); const code = buffer; buffer = ''; callback(code); }
      else buffer = '';
      return;
    }
    if (e.key.length === 1) buffer += e.key;
  };
  return { start, stop };
})();

const Print = (() => {
  const printHTML = (html) => {
    const win = window.open('', '_blank', 'width=400,height=600');
    if (!win) { Toast.show('Please allow pop-ups to print receipts', 'warning'); return; }
    win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt — General Shop</title>
      <style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Courier New',monospace;font-size:12px;padding:10px;max-width:300px;margin:0 auto;color:#000;background:#fff;}
      .header{text-align:center;margin-bottom:12px;}.header h1{font-size:16px;font-weight:bold;}.header p{font-size:11px;margin:2px 0;}
      .divider{border-top:1px dashed #000;margin:8px 0;}.line{display:flex;justify-content:space-between;margin:2px 0;}
      .total-line{font-weight:bold;font-size:13px;}.footer{text-align:center;margin-top:12px;font-size:11px;}.vat{font-size:10px;}
      table{width:100%;font-size:11px;}td{padding:2px 0;}</style></head><body>${html}
      <script>window.onload=function(){window.print();}<\/script></body></html>`);
    win.document.close();
  };
  const receiptHTML = (sale, businessInfo) => {
    const info = businessInfo || { name: 'General Shop', address: 'Tom Mboya Street, Nairobi CBD', phone: '+254 722 123 456' };

const Mpesa = (() => {
  const generateRef = () => {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let ref = '';
    for (let i = 0; i < 10; i++) ref += chars[Math.floor(Math.random() * chars.length)];
    return ref;
  };
  const simulate = async (amountCents) => new Promise((resolve) => {
    setTimeout(() => resolve({ success: true, ref: generateRef(), amountCents, timestamp: Date.now() }), 1000);
  });
  return { simulate, generateRef };
})();

const Automations = (() => {
  const checkAll = async () => {
    const alerts = [];
    const products = await Storage.get('products', []);
    const sales = await Storage.get('sales', []);
    products.forEach(p => {
      if (p.stock <= p.lowStockThreshold && p.active !== false) {
        alerts.push({ type: 'low_stock', severity: p.stock === 0 ? 'danger' : 'warning', message: `${p.name} is ${p.stock === 0 ? 'out of stock' : 'low on stock (' + p.stock + ' left)'}` });
      }
    });
    const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const soldIds = new Set();
    sales.forEach(s => { if (s.createdAt >= thirtyDaysAgo) s.items.forEach(i => soldIds.add(i.productId)); });
    products.forEach(p => { if (!soldIds.has(p.id) && p.stock > 0 && p.active !== false) alerts.push({ type: 'dormant', severity: 'info', message: `${p.name} has had no sales in 30 days` }); });
    const lastBackup = await Storage.get('lastBackupTime', 0);
    const daysSinceBackup = (Date.now() - lastBackup) / (24 * 60 * 60 * 1000);
    if (daysSinceBackup > 7 && sales.length > 10) alerts.push({ type: 'backup', severity: 'warning', message: `No backup in ${Math.floor(daysSinceBackup)} days. Export data in Settings.` });
    return alerts;
  };
  return { checkAll };
})();

const Reports = (() => {
  const getSalesInRange = async (startMs, endMs, includeSample) => {
    const sales = await Storage.get('sales', []);
    return sales.filter(s => s.createdAt >= startMs && s.createdAt <= endMs && s.status === 'completed' && (includeSample || !s.isSample));
  };
  const salesSummary = async (startMs, endMs, includeSample) => {
    const sales = await getSalesInRange(startMs, endMs, includeSample);
    const totalCents = sales.reduce((sum, s) => sum + s.totalCents, 0);
    const vatCents = sales.reduce((sum, s) => sum + (s.vatCents || 0), 0);
    return { sales, totalCents, count: sales.length, vatCents };
  };
  const paymentMix = async (startMs, endMs, includeSample) => {
    const sales = await getSalesInRange(startMs, endMs, includeSample);
    const mix = {};
    sales.forEach(s => { mix[s.paymentMethod] = (mix[s.paymentMethod] || 0) + s.totalCents; });
    return mix;
  };
  const productProfitability = async (startMs, endMs, includeSample) => {
    const sales = await getSalesInRange(startMs, endMs, includeSample);
    const products = await Storage.get('products', []);
    const map = {};
    sales.forEach(s => {
      s.items.forEach(item => {
        if (!map[item.productId]) {
          const prod = products.find(p => p.id === item.productId);
          map[item.productId] = { productId: item.productId, name: item.name, qty: 0, revenueCents: 0, costCents: 0, costPerUnit: prod ? prod.costCents : 0 };
        }
        map[item.productId].qty += item.qty;
        map[item.productId].revenueCents += item.totalCents;
        map[item.productId].costCents += map[item.productId].costPerUnit * item.qty;
      });
    });
    return Object.values(map).map(p => ({ ...p, profitCents: p.revenueCents - p.costCents, marginPct: p.revenueCents > 0 ? Math.round((p.revenueCents - p.costCents) / p.revenueCents * 100) : 0 })).sort((a, b) => b.profitCents - a.profitCents);
  };
  const stockValuation = async () => {
    const products = await Storage.get('products', []);
    let totalCostCents = 0, totalRetailCents = 0;
    const items = products.filter(p => p.active !== false).map(p => {
      const cost = p.costCents * p.stock;
      const retail = p.priceCents * p.stock;
      totalCostCents += cost;
      totalRetailCents += retail;
      return { ...p, costValueCents: cost, retailValueCents: retail };
    });
    return { items, totalCostCents, totalRetailCents };
  };
  const vatSummary = async (startMs, endMs, includeSample) => {
    const sales = await getSalesInRange(startMs, endMs, includeSample);
    return { totalVat: sales.reduce((sum, s) => sum + (s.vatCents || 0), 0), taxableSales: sales.reduce((sum, s) => sum + s.totalCents, 0) };
  };
  const bestSellers = async (startMs, endMs, includeSample, limit) => {
    const sales = await getSalesInRange(startMs, endMs, includeSample);
    const map = {};
    sales.forEach(s => { s.items.forEach(item => {
      if (!map[item.productId]) map[item.productId] = { productId: item.productId, name: item.name, qty: 0, revenueCents: 0 };
      map[item.productId].qty += item.qty;
      map[item.productId].revenueCents += item.totalCents;
    }); });
    return Object.values(map).sort((a, b) => b.qty - a.qty).slice(0, limit || 10);
  };
  return { getSalesInRange, salesSummary, paymentMix, productProfitability, stockValuation, vatSummary, bestSellers };
})();

const Toast = (() => {
  const show = (msg, type) => {
    const container = document.getElementById('toasts');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
  };
  return { show };
})();

const Modal = (() => {
  let onCloseCallback = null;
  const open = (title, bodyHTML, footerHTML, options) => {
    const root = document.getElementById('modalRoot');
    const content = document.getElementById('modalContent');
    content.innerHTML = `<div class="modal-header"><h3>${Util.esc(title)}</h3><button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button></div><div class="modal-body">${bodyHTML}</div>${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}`;
    root.classList.add('active');
    document.getElementById('modalCloseBtn').onclick = close;
    if (options && options.onOpen) setTimeout(() => options.onOpen(content), 50);
    const escHandler = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); } };
    document.addEventListener('keydown', escHandler);
    if (options && options.onClose) onCloseCallback = options.onClose;
    return content;
  };
  const close = () => {
    document.getElementById('modalRoot').classList.remove('active');
    document.getElementById('modalContent').innerHTML = '';
    if (onCloseCallback) { onCloseCallback(); onCloseCallback = null; }
  };
  return { open, close };
})();

          const cashInput = content.querySelector('#cashReceived');
          const changePreview = content.querySelector('#changePreview');
          const mpesaRef = content.querySelector('#mpesaRef');
          mpesaRef.value = Mpesa.generateRef();
          const updatePaymentView = () => {
            const method = payMethod.value;
            cashFields.classList.toggle('hidden', method === 'M-Pesa');
            mpesaFields.classList.toggle('hidden', method === 'Cash');
            if (method === 'M-Pesa') mpesaRef.value = Mpesa.generateRef();
            updateChange();
          };
          const updateChange = () => {
            const method = payMethod.value;
            if (method === 'M-Pesa') { changePreview.textContent = ''; return; }
            const received = Util.toCents(parseFloat(cashInput.value) || 0);
            if (received > 0) {
              const change = received - totalCents;
              if (change >= 0) changePreview.innerHTML = `Change: <strong>${Util.formatKES(change)}</strong>`;
              else changePreview.innerHTML = `<span class="text-danger">Short by ${Util.formatKES(Math.abs(change))}</span>`;
            } else changePreview.textContent = '';
          };
          payMethod.addEventListener('change', updatePaymentView);
          cashInput.addEventListener('input', updateChange);
          content.querySelector('#confirmSaleBtn').onclick = async () => {
            const method = payMethod.value;
            const receivedCents = Util.toCents(parseFloat(cashInput.value) || 0);
            let changeCents = 0, mpesaRefValue = '';
            if (method === 'Cash' || method === 'Split') {
              if (receivedCents < totalCents && method === 'Cash') { Toast.show('Cash received is less than total', 'error'); return; }
              changeCents = Math.max(0, receivedCents - totalCents);
            }
            if (method === 'M-Pesa' || method === 'Split') {
              mpesaRefValue = mpesaRef.value;
              const result = await Mpesa.simulate(totalCents);
              if (result.success) mpesaRefValue = result.ref;
              else { Toast.show('M-Pesa payment failed', 'error'); return; }
            }
            const productsList = await Storage.get('products', []);
            for (const item of cart) { const prod = productsList.find(p => p.id === item.productId); if (prod) prod.stock = Math.max(0, prod.stock - item.qty); }
            await Storage.set('products', productsList);
            const sale = {
              id: Util.uid(), txnNo: 'GS-' + Date.now().toString(36).toUpperCase(),
              items: cart.map(item => ({ productId: item.productId, name: item.name, qty: item.qty, priceCents: item.priceCents, totalCents: item.priceCents * item.qty })),
              subtotalCents: totalCents, vatCents, totalCents, discountCents: 0,
              paymentMethod: method, mpesaRef: mpesaRefValue, changeCents, cashReceivedCents: receivedCents,
              customerId: content.querySelector('#customerSelect').value || null,
              notes: content.querySelector('#saleNotes').value || '',
              cashier: Security.getUser()?.name || 'Unknown',
              createdAt: Date.now(), timeStr: Util.nairobiTime(), status: 'completed', isSample: false
            };
            const sales = await Storage.get('sales', []);
            sales.push(sale);
            await Storage.set('sales', sales);
            cart = [];
            await Storage.set('posCart', cart);
            Modal.close();
            Toast.show('Sale completed! ' + Util.formatKES(totalCents), 'success');
            const receipt = Print.receiptHTML(sale);
            Modal.open('Receipt', `<div style="font-family:monospace;font-size:0.8rem;white-space:pre-wrap;">${receipt.replace(/<[^>]*>/g, '')}</div>`, `<button class="btn btn-secondary" onclick="Modal.close()">Close</button><button class="btn btn-primary" onclick="Print.printHTML(Print.receiptHTML(${JSON.stringify(sale).replace(/"/g, '&quot;')}))">Print</button>`);
            await renderPOS();
          };
          updatePaymentView();
        }
      });
    },
    openBarcodeScanner: async () => {
      const bodyHTML = `<div id="scannerContainer" style="min-height:200px;background:var(--card-alt);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;"><p class="text-muted fs-sm">Camera preview</p></div><div class="form-group"><label>Or enter barcode manually</label><input type="text" id="manualBarcode" placeholder="e.g. 2001234567890" autocomplete="off"></div><div id="scannerStatus" class="fs-sm text-muted"></div>`;
      const footerHTML = `<button class="btn btn-secondary" onclick="BarcodeScanner.stop();Modal.close()">Close</button><button class="btn btn-primary" id="manualBarcodeBtn">Enter</button>`;
      Modal.open('Scan Barcode', bodyHTML, footerHTML, {
        onOpen: (content) => {
          const status = content.querySelector('#scannerStatus');
          const container = content.querySelector('#scannerContainer');
          if (!BarcodeScanner.isSecureContext()) {
            status.innerHTML = '<span class="text-danger">⚠️ Camera requires HTTPS or localhost. Use manual entry or USB/Bluetooth scanner.</span>';
            container.innerHTML = '<p class="text-muted fs-sm text-center" style="padding:20px;">Camera unavailable</p>';
          } else if (!BarcodeScanner.hasBarcodeDetector()) {
            status.innerHTML = '<span class="text-warning">⚠️ BarcodeDetector not available. Use manual entry or USB/Bluetooth scanner.</span>';
            container.innerHTML = '<p class="text-muted fs-sm text-center" style="padding:20px;">Barcode detection unavailable</p>';
          } else {
            BarcodeScanner.start(container).then(() => {
              status.textContent = '📷 Point camera at barcode…';
              const scanLoop = async () => {
                if (!document.getElementById('scannerContainer')) return;
                const code = await BarcodeScanner.scan();
                if (code) { BarcodeScanner.stop(); await POS.handleBarcode(code); Modal.close(); return; }
                requestAnimationFrame(scanLoop);
              };
              scanLoop();
            }).catch(e => { status.innerHTML = `<span class="text-danger">${Util.esc(e.message)}</span>`; });
          }
          content.querySelector('#manualBarcodeBtn').onclick = async () => {
            const code = content.querySelector('#manualBarcode').value.trim();
            if (code) { BarcodeScanner.stop(); await POS.handleBarcode(code); Modal.close(); }
          };
          content.querySelector('#manualBarcode').addEventListener('keydown', (e) => { if (e.key === 'Enter') content.querySelector('#manualBarcodeBtn').click(); });
          setTimeout(() => content.querySelector('#manualBarcode').focus(), 100);
        },
        onClose: () => BarcodeScanner.stop()
      });
    },
    handleBarcode: async (code) => {
      const productsList = await Storage.get('products', []);
      const prod = productsList.find(p => p.barcode === code || p.sku === code);
      if (prod) { await POS.addToCart(prod.id); Toast.show(`Added ${prod.name}`, 'success'); }
      else Toast.show(`No product found: ${code}`, 'warning');
    }
  };
  if (!shift || shift.status !== 'open') {
    setTimeout(() => Toast.show('No open shift. Open a shift from the Staff view.', 'warning'), 500);
  }
};

    },
    refund: async (id) => {
      const sale = allSales.find(s => s.id === id);
      if (!sale) return;
      if (sale.status === 'refunded') { Toast.show('Already refunded', 'warning'); return; }
      const bodyHTML = `<p class="fs-sm mb-12">Refund <strong>${Util.esc(sale.txnNo)}</strong> of <strong>${Util.formatKES(sale.totalCents)}</strong>?</p><p class="fs-sm text-muted">Stock will be restored.</p>`;
      const footerHTML = `<button class="btn btn-secondary" onclick="Modal.close()">Cancel</button><button class="btn btn-danger" id="confirmRefundBtn">Confirm Refund</button>`;
      Modal.open('Refund Sale', bodyHTML, footerHTML, {
        onOpen: (content) => {
          content.querySelector('#confirmRefundBtn').onclick = async () => {
            const productsList = await Storage.get('products', []);
            for (const item of sale.items) { const prod = productsList.find(p => p.id === item.productId); if (prod) prod.stock += item.qty; }
            await Storage.set('products', productsList);
            sale.status = 'refunded';
            sale.refundedAt = Date.now();
            await Storage.set('sales', allSales);
            Modal.close();
            Toast.show('Sale refunded', 'success');
            await renderSales();
          };
        }
      });
    },
    resumeHeld: async (idx) => {
      const held = heldSales[idx];
      if (!held) return;
      await Storage.set('posCart', held.items);
      await Storage.set('heldSales', heldSales.filter((_, i) => i !== idx));
      Toast.show('Sale resumed', 'success');
      navigate('pos');
    },
    exportCSV: async () => {
      const rows = [['Receipt', 'Date', 'Items', 'Total (KES)', 'VAT (KES)', 'Payment', 'Cashier', 'Sample']];
      sorted.forEach(s => rows.push([s.txnNo, s.timeStr, s.items.reduce((sum, i) => sum + i.qty, 0), Util.fromCents(s.totalCents).toFixed(2), Util.fromCents(s.vatCents).toFixed(2), s.paymentMethod, s.cashier, s.isSample ? 'Yes' : 'No']));
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sales-export-${Util.nairobiDateShort().replace(/\//g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      Toast.show('CSV exported', 'success');
    }
  };
};

  <div class="card mb-16"><div class="card-header"><h3>Business Info</h3></div><p class="fs-sm"><strong>General Shop</strong><br>Tom Mboya Street, Nairobi CBD<br>+254 722 123 456<br>VAT No: P051234567X</p></div>
  <div class="card"><div class="card-header"><h3>About</h3></div><p class="fs-sm text-muted">General Shop Retail Manager v1.0<br>Offline-first · KES · VAT 16% inclusive</p></div>`;
  window.SettingsView = {
    toggleTheme: () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('gs_theme', next);
      renderSettings();
    },
    exportBackup: async () => {
      const allData = await Storage.getAll();
      const backup = { version: 1, exportedAt: Date.now(), data: allData };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `general-shop-backup-${Util.nairobiDateShort().replace(/\//g, '-')}.json`;
      a.click();
      URL.revokeObjectURL(url);
      await Storage.set('lastBackupTime', Date.now());
      Toast.show('Backup exported', 'success');
      renderSettings();
    },
    importBackup: () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const backup = JSON.parse(text);
          if (!backup.data) { Toast.show('Invalid file', 'error'); return; }
          if (!confirm('Restore backup? This replaces all data.')) return;
          await Storage.clear();
          for (const [key, value] of Object.entries(backup.data)) await Storage.set(key, value);
          Toast.show('Backup restored. Reloading…', 'success');
          setTimeout(() => location.reload(), 1000);
        } catch (err) { Toast.show('Failed: ' + err.message, 'error'); }
      };
      input.click();
    },
    resetData: async () => {
      if (!confirm('⚠️ Delete ALL data and restore demo data?')) return;
      if (!confirm('⚠️ Absolutely sure?')) return;
      await Storage.clear();
      Toast.show('Data reset. Reloading…', 'success');
      setTimeout(() => location.reload(), 800);
    }
  };
};

const navigate = async (viewName) => {
  const user = Security.getUser();
  if (!user) return;
  document.getElementById('sidebar').classList.remove('drawer-open');
  document.getElementById('sidebarBackdrop').classList.remove('active');
  BarcodeScanner.stop();
  const titles = { dashboard: 'Home', pos: 'New Sale', inventory: 'Inventory', customers: 'Customers', suppliers: 'Suppliers', staff: 'Staff & Shifts', reports: 'Reports', sales: 'Sales History', settings: 'Settings' };
  document.getElementById('pageTitle').textContent = titles[viewName] || viewName;
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === viewName));
  document.querySelectorAll('.bottom-tab').forEach(el => el.classList.toggle('active', el.dataset.view === viewName));
  try {
    switch (viewName) {
      case 'dashboard': if (window.matchMedia('(max-width:760px)').matches) await renderMobileHome(); else await renderDashboard(); break;
      case 'pos': await renderPOS(); break;
      case 'inventory': await renderInventory(); break;
      case 'customers': await renderCustomers(); break;
      case 'suppliers': await renderSuppliers(); break;
      case 'staff': await renderStaff(); break;
      case 'reports': await renderReports(); break;
      case 'sales': await renderSales(); break;
      case 'settings': await renderSettings(); break;
      default: await renderDashboard();
    }
  } catch (err) {
    console.error('View render error:', err);
    Toast.show('Error loading view: ' + err.message, 'error');
  }
  window.scrollTo(0, 0);
  updateBottomNav(viewName);
  localStorage.setItem('gs_last_view', viewName);
};

/* FIX: Build login buttons with direct event listeners, not inline onclick */
const buildLoginUsers = () => {
  const roleList = document.getElementById('roleList');
  if (!roleList) return;
  const users = Security.getRoles();
  roleList.innerHTML = '';
  Object.entries(users).forEach(([key, user]) => {
    const btn = document.createElement('button');
    btn.className = 'role-btn';
    btn.type = 'button';
    btn.innerHTML = `
      <div class="role-icon">${user.icon}</div>
      <div>
        <div class="role-name">${user.label}</div>
        <div class="role-desc">${user.role} — ${user.desc}</div>
      </div>
    `;
    btn.addEventListener('click', () => handleLogin(key));
    roleList.appendChild(btn);
  });
};

const handleLogin = async (userKey) => {
  try {
    const success = await Security.login(userKey);
    if (!success) { Toast.show('Login failed', 'error'); return; }
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.add('active');
    buildNav();
    buildBottomNav();
    const lastView = localStorage.getItem('gs_last_view') || 'dashboard';
    await navigate(lastView);
  } catch (err) {
    console.error('Login error:', err);
    Toast.show('Login error: ' + err.message, 'error');
  }
};

const init = async () => {
  const savedTheme = localStorage.getItem('gs_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  await Storage.init();
  const badge = document.getElementById('storageBadge');
  if (badge) {
    if (Storage.isMemory()) { badge.textContent = 'Session only'; badge.classList.add('session'); }
    else badge.textContent = 'Local DB';
  }
  await seedData();
  buildLoginUsers(); // FIX: builds buttons with addEventListener
  const restored = await Security.restoreSession();
  if (restored) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.add('active');
    buildNav();
    buildBottomNav();
    const lastView = localStorage.getItem('gs_last_view') || 'dashboard';
    await navigate(lastView);
  }
  tableObserver.observe(document.getElementById('view'), { childList: true, subtree: true });
  let wasMobile = window.matchMedia('(max-width:760px)').matches;
  window.addEventListener('resize', Util.debounce(() => {
    const isMobile = window.matchMedia('(max-width:760px)').matches;
    if (isMobile !== wasMobile) {
      wasMobile = isMobile;
      const currentView = document.querySelector('.sidebar-nav .nav-item.active')?.dataset.view || 'dashboard';
      if (currentView === 'dashboard') navigate('dashboard');
    }
  }, 300));
  const updateNotifDot = async () => {
    const alerts = await Automations.checkAll();
    const dot = document.getElementById('notifDot');
    if (dot) dot.classList.toggle('visible', alerts.length > 0);
  };
  updateNotifDot();
  setInterval(updateNotifDot, 30000);
  console.log('🏪 General Shop Retail Manager — ready');
};

document.addEventListener('DOMContentLoaded', init);
