                    vy: Math.sin(angle) * speed - 0.5,
                    color: Math.random() > 0.4 ? 'rgba(233,17,77,0.8)' : 'rgba(255,200,50,0.6)',
                    decay: 0.008 + Math.random() * 0.012,
                });
            }
        }

        function updateParticles() {
            for (let i = particleSystem.length - 1; i >= 0; i--) {
                const p = particleSystem[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.985; p.vy += 0.03;
                p.alpha -= p.decay || 0.015;
                p.radius *= 0.997;
                if (p.alpha <= 0 || p.radius < 0.5) particleSystem.splice(i, 1);
            }
        }

        function drawParticles() {
            for (const p of particleSystem) {
                ctx.globalAlpha = Math.min(p.alpha, 1);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(p.radius, 0.5), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function paintGraphScene() {
            const w = canvas.width / (window.devicePixelRatio || 1);
            const h = canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, w, h);

            // 3D-ish grid with perspective offset
            const offset = (gameState.status === 'flying' || gameState.status === 'crashed') ? (gameState.elapsed * 0.08) % 40 : 0;
            ctx.strokeStyle = '#1d1f2b';
            ctx.lineWidth = 0.8;
            const margin = 60;
            const x1 = margin, y1 = h - margin;
            const x2 = w - margin, y2 = margin;
            for (let x = x1; x < x2; x += 40) {
                const ax = x - offset;
                if (ax >= x1 && ax <= x2) {
                    ctx.beginPath(); ctx.moveTo(ax, y2); ctx.lineTo(ax, y1); ctx.stroke();
                }
            }
            for (let y = y2; y < y1; y += 40) {
                const ay = y + offset;
                if (ay >= y2 && ay <= y1) {
                    ctx.beginPath(); ctx.moveTo(x1, ay); ctx.lineTo(x2, ay); ctx.stroke();
                }
            }

            // Depth vignette
            const vg = ctx.createRadialGradient(w * 0.5, h * 0.5, h * 0.1, w * 0.5, h * 0.5, h * 0.8);
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, w, h);

            if (gameState.status === 'waiting') {
                const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.003);
                ctx.globalAlpha = 0.15 + 0.15 * pulse;
                ctx.fillStyle = '#e9114d';
                ctx.beginPath();
                ctx.arc(w * 0.5, h * 0.5, 6 + pulse * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                return;
            }

            const progress = Math.min(1, gameState.elapsed / 9000);
            const px = x1 + (x2 - x1) * progress;
            const mult = gameState.multiplier;
            const normMult = Math.min((mult - 1) / 7, 1);
            const py = y1 - (y1 - y2) * normMult;

            // 3D-like gradient fill under curve
            const grad = ctx.createLinearGradient(x1, y1, px, py);
            grad.addColorStop(0, 'rgba(233,17,77,0.0)');
            grad.addColorStop(0.6, 'rgba(233,17,77,0.10)');
            grad.addColorStop(1, 'rgba(233,17,77,0.35)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(x1 + (px - x1) * 0.6, y1, px, py);
            ctx.lineTo(px, y1);
            ctx.closePath();
            ctx.fill();

            // Trail with depth
            if (gameState.status !== 'waiting') {
                const trailLen = Math.min(70, 20 + (mult - 1) * 6);
                for (let t = 0; t < trailLen; t += 2) {
                    const frac = t / trailLen;
                    const tx = px - frac * 20;
                    const ty = py - frac * 7 + Math.sin(t * 0.3 + gameState.elapsed * 0.002) * 3;
                    const alpha = 0.35 * (1 - frac);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#e9114d';
                    ctx.beginPath();
                    ctx.arc(tx, ty, 5 * (1 - frac) + 1, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // Main curve with glow
            ctx.shadowColor = '#e9114d';
            ctx.shadowBlur = 18;
            ctx.strokeStyle = gameState.status === 'crashed' ? '#e9114d' : '#e9114d';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(x1 + (px - x1) * 0.6, y1, px, py);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // "3D" plane marker — layered circles for depth
            const isCrashed = gameState.status === 'crashed';
            ctx.shadowBlur = isCrashed ? 0 : 30;
            ctx.shadowColor = '#e9114d';
            ctx.fillStyle = isCrashed ? '#475569' : '#ffffff';
            ctx.beginPath();
            ctx.arc(px, py, 9, 0, Math.PI * 2);
            ctx.fill();
            if (!isCrashed && gameState.status !== 'waiting') {
                // outer ring (3D depth)
                ctx.shadowBlur = 50;
                ctx.shadowColor = 'rgba(233,17,77,0.4)';
                ctx.strokeStyle = 'rgba(233,17,77,0.25)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, 18 + Math.sin(gameState.elapsed * 0.003) * 4, 0, Math.PI * 2);
                ctx.stroke();
                // inner highlight
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(px - 2, py - 2, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            if (gameState.status === 'flying') spawnParticles(px, py, 2);
            if (gameState.status === 'crashed' && Math.random() < 0.3) {
                spawnParticles(px + (Math.random() - 0.5) * 30, py + (Math.random() - 0.5) * 20, 1, 'rgba(255,150,50,0.4)');
            }

            updateParticles();
            drawParticles();

            if (gameState.status === 'crashed') {
                ctx.font = 'bold 18px system-ui';
                ctx.fillStyle = 'rgba(233,17,77,0.25)';
                ctx.textAlign = 'center';
                ctx.fillText('💥 CRASH', px, py - 52);
            }
        }

        // ──────────────────────────────────────────────────────────────
        // BOOT
        // ──────────────────────────────────────────────────────────────
        if (loadUser()) {
            loginOverlay.classList.add('hidden');
            appEl.style.display = 'flex';
            initApp();
        } else {
            loginOverlay.classList.remove('hidden');
            appEl.style.display = 'none';
        }
        phoneInput.focus();
    </script>
</body>
</html>
