/* ============================================================
   SCANNER
   ============================================================ */
function openScanner(context='lookup'){
  scanContext=context;
  stopScanner();
  const body=el('div','');
  body.append(el('p','notice','Camera requires HTTPS/localhost + BarcodeDetector (Chrome/Edge/Android). Manual/USB wedge works everywhere.'));
  const manual=el('input');
  manual.placeholder='Barcode or USB scanner (press Enter)';
  manual.onkeydown=e=>{if(e.key==='Enter'){processBarcode(manual.value,context);manual.value=''}};
  body.append(field('Manual input',manual));
  const cameraArea=el('div','');cameraArea.id='cameraArea';
  body.append(cameraArea);
  const controls=el('div','actions');
  controls.append(btn('Start camera',()=>startCamera('environment')),btn('Stop',stopScanner));
  body.append(controls);
  const status=el('p','muted','Ready.');status.id='scanStatus';
  body.append(status);
  openModal('Scanner',body,[btn('Close',()=>{stopScanner();closeModal()})]);
}
async function startCamera(facing){
  stopScanner();
  cameraFacing=facing;
  const status=$('#scanStatus');
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){if(status)status.textContent='Camera unavailable (needs HTTPS/localhost).';return}
  if(!('BarcodeDetector' in window)){if(status)status.textContent='BarcodeDetector not supported. Use manual entry or wedge scanner.';return}
  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});
    const video=el('video');
    video.autoplay=true;video.playsInline=true;
    video.style.width='100%';video.srcObject=scannerStream;
    $('#cameraArea').replaceChildren(video);
    let formats=[];
    try{formats=await BarcodeDetector.getSupportedFormats()}catch{}
    const wanted=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'];
    const supported=wanted.filter(f=>formats.includes(f));
    if(!supported.length){if(status)status.textContent='No supported barcode formats.';return}
    const detector=new BarcodeDetector({formats:supported});
    if(status)status.textContent='Point at a barcode. Supported: '+supported.join(', ');
    const loop=async()=>{
      if(!scannerStream||!video.isConnected)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length){processBarcode(codes[0].rawValue,scanContext);return}
      }catch{}
      scannerTimer=setTimeout(loop,200);
    };
    video.onloadeddata=loop;
  }catch(e){if(status)status.textContent='Camera failed: '+e.name}
}
function stopScanner(){
  if(scannerTimer)clearTimeout(scannerTimer);
  scannerTimer=null;
  if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}
}
function processBarcode(raw,context='lookup'){
  const value=String(raw||'').trim();
  if(!value)return;
  if(lastScan.value===value&&Date.now()-lastScan.at<1500){toast('Duplicate');return}
  lastScan={value,at:Date.now()};
  if(context==='cart'){scanToAddToCart(value);return}
  if(context==='stocktake'){
    const p=db.products.find(p=>p.barcode===value||p.sku===value);
    if(p){
      const sel=$('#takeProduct');if(sel)sel.value=p.id;
      const cnt=$('#takeCount');if(cnt)cnt.value=String(Number(cnt.value||0)+1);
      toast('+1 '+p.name);stopScanner();closeModal();
    }else toast('Not found');
    return;
  }
  if(context==='receiving'){
    const p=db.products.find(p=>p.barcode===value||p.sku===value);
    if(p){stopScanner();closeModal();toast('Matched: '+p.name);navigate('purchases');adjustStock(p)}
    else toast('Not found');
    return;
  }
  if(context==='customer'){
    const c=db.customers.find(c=>c.barcode===value||c.phone===value);
    if(c){stopScanner();openModal('Customer',table(['Field','Value'],[['Name',c.name],['Phone',c.phone],['Points',c.points],['Credit',money(c.credit)]]),[btn('Close',closeModal)])}
    else toast('No match');
    return;
  }
  if(context==='staff'){
    const person=db.staff.find(s=>s.barcode===value);
    if(person){
      const last=db.attendance.find(a=>a.staffId===person.id);
      clockStaff(last?.type==='in'?'out':'in',person.id,person.name);
      stopScanner();closeModal();
    }else toast('Badge not found');
    return;
  }
  const p=db.products.find(p=>p.barcode===value||p.sku===value);
  if(p){
    openModal('Product lookup',table(['Field','Value'],[['Name',p.name],['SKU',p.sku],['Price',money(p.price)],['Stock',fmtQty(p.stock)+' '+p.unit]]),[btn('Close',closeModal),btn('Add to basket',()=>{closeModal();addToCart(p.id)},'primary')]);
  }else toast('No match for '+value);
}
function scanToAddToCart(code){
  const p=db.products.find(p=>p.barcode===code||p.sku===code);
  if(!p)return toast('Not found');
  if(currentPage!=='pos')navigate('pos');
  addToCart(p.id);
  toast('Added '+p.name);
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function openCommandPalette(){
  const commands=[
    {label:'Home',run:()=>navigate('dashboard')},
    {label:'New sale / POS',run:()=>navigate('pos')},
    {label:'Meat gallery',run:()=>navigate('gallery')},
    {label:'Meat stock',run:()=>navigate('inventory')},
    {label:'Batch & expiry',run:()=>navigate('batches')},
    {label:'Cutting yield',run:()=>navigate('yield')},
    {label:'Food safety',run:()=>navigate('quality')},
    {label:'Orders',run:()=>navigate('orders')},
    {label:'Stock take',run:()=>navigate('stocktake')},
    {label:'Deliveries',run:()=>navigate('purchases')},
    {label:'Customers',run:()=>navigate('customers')},
    {label:'Staff & shifts',run:()=>navigate('staff')},
    {label:'Invoices',run:()=>navigate('invoices')},
    {label:'Automations',run:()=>navigate('automations')},
    {label:'Analytics 3D',run:()=>navigate('analytics')},
    {label:'Reports',run:()=>navigate('reports')},
    {label:'Expenses',run:()=>navigate('expenses')},
    {label:'Audit',run:()=>navigate('audit')},
    {label:'Settings',run:()=>navigate('settings')},
    {label:'Add product',run:()=>{navigate('inventory');setTimeout(productModal,100)}},
    {label:'Toggle theme',run:()=>{const cur=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=cur;try{localStorage.setItem('butchery_theme',cur)}catch{};toast('Theme: '+cur)}},
    {label:'Download backup',run:backupJSON},
    {label:'Log out',run:logout}
  ];
  const back=el('div','cmd-backdrop');
  const box=el('div','cmd-box');
  const inp=el('input','cmd-input');inp.placeholder='Type a command…';
  const list=el('div','cmd-list');
  box.append(inp,list);
  back.append(box);
  let filtered=commands.slice(),active=0;
  function render(){
    list.replaceChildren();
    if(!filtered.length){list.append(el('div','cmd-empty','No matches'));return}
    filtered.forEach((c,i)=>{
      const item=el('div','cmd-item'+(i===active?' active':''));
      item.textContent=c.label;
      item.onclick=()=>{document.body.removeChild(back);c.run()};
      list.append(item);
    });
  }
  render();
  inp.oninput=()=>{const q=inp.value.toLowerCase();filtered=commands.filter(c=>c.label.toLowerCase().includes(q));active=0;render()};
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(filtered.length-1,active+1);render()}
    else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(0,active-1);render()}
    else if(e.key==='Enter'){const c=filtered[active];if(c){document.body.removeChild(back);c.run()}}
    else if(e.key==='Escape'){document.body.removeChild(back)}
  };
  back.onclick=e=>{if(e.target===back)document.body.removeChild(back)};
  document.body.append(back);
  setTimeout(()=>inp.focus(),30);
}

// Barcode wedge — document-level
let wedgeBuffer='';
let wedgeTimer=null;
document.addEventListener('keydown',e=>{
  if(!session)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='Enter'&&wedgeBuffer.length>=6){const code=wedgeBuffer;wedgeBuffer='';if(currentPage==='pos')scanToAddToCart(code);return}
  if(e.key.length===1){wedgeBuffer+=e.key;clearTimeout(wedgeTimer);wedgeTimer=setTimeout(()=>wedgeBuffer='',300)}
});

(async()=>{
  const theme=localStorage.getItem('butchery_theme');
  if(theme)document.documentElement.dataset.theme=theme;
  await initStorage();
  ensureSchema();
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(raw){
      session=JSON.parse(raw);
      if(!session||!roleLabels[session.role])throw Error('invalid');
      $('#loginScreen').classList.add('hidden');
      $('#app').classList.remove('hidden');
      $('#sideUser').textContent=session.name+' · '+roleLabels[session.role];
      navigate('dashboard');
    }
  }catch{try{localStorage.removeItem(SESSION_KEY)}catch{}}
})();
