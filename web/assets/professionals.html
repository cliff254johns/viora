<!DOCTYPE html>
<html data-theme="light" lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B2545">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220">
  <meta name="description" content="Meridian Advisory Group — Professional Services Management System">
  <script src="/guard.js?v=2" defer></script>
  <title>Meridian Advisory Group — Professional Services Manager</title>
  <style>
    /* ===== 1. :root — LIGHT ===== */
    :root {
      --primary: #0B2545; --primary-600: #13315C; --primary-400: #1B3A6B;
      --accent: #2563EB; --accent-600: #1D4ED8; --accent-glow: rgba(37,99,235,0.35);
      --success: #0F766E; --warning: #B45309; --danger: #B91C1C; --info: #0284C7;
      --bg: #F7F9FC; --bg-elev: #F1F4F9; --card: #FFFFFF; --card-hover: #FAFBFD;
      --border: #E2E8F0; --border-strong: #CBD5E1;
      --text: #0F172A; --text-soft: #334155; --muted: #64748B;
      --shadow-xs: 0 1px 1px rgba(11,37,69,0.04);
      --shadow-sm: 0 1px 3px rgba(11,37,69,0.06), 0 1px 2px rgba(11,37,69,0.04);
      --shadow-md: 0 4px 14px rgba(11,37,69,0.08);
      --shadow-lg: 0 14px 40px rgba(11,37,69,0.14);
      --shadow-xl: 0 24px 60px rgba(11,37,69,0.18);
      --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-2xl: 20px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      --img-login: none; --img-hero: none; --img-portal: none; --img-firm: none;
      --img-avatar1: none; --img-avatar2: none; --img-empty: none;
      --img-report-sales: none; --img-report-util: none; --img-report-ar: none;
    }
    [data-theme="dark"] {
      --primary: #7DA0D0; --primary-600: #6B8FC4; --primary-400: #5A7EB8;
      --accent: #60A5FA; --accent-600: #3B82F6; --accent-glow: rgba(96,165,250,0.4);
      --success: #2DD4BF; --warning: #FBBF24; --danger: #F87171; --info: #38BDF8;
      --bg: #0B1220; --bg-elev: #0F1928; --card: #111C2E; --card-hover: #16233A;
      --border: #1E2A3B; --border-strong: #2A3A52;
      --text: #E2E8F0; --text-soft: #CBD5E1; --muted: #94A3B8;
      --shadow-xs: 0 1px 1px rgba(0,0,0,0.4);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.55);
      --shadow-lg: 0 18px 45px rgba(0,0,0,0.6);
      --shadow-xl: 0 28px 70px rgba(0,0,0,0.7);
    }
    /* ===== 2. Reset + typography ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      line-height: 1.55; min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
    h2 { font-size: 1.375rem; font-weight: 650; line-height: 1.25; letter-spacing: -0.015em; }
    h3 { font-size: 1.0625rem; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
    h4 { font-size: 0.9375rem; font-weight: 600; line-height: 1.4; }
    p, .body { font-size: 0.9375rem; font-weight: 400; }
    .small { font-size: 0.8125rem; }
    .tiny { font-size: 0.6875rem; }
    .money { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.01em; }
    .muted { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select, textarea { font-family: inherit; font-size: 0.9375rem; }
    img { max-width: 100%; display: block; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    th { font-weight: 600; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bg-elev); }
    td { font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }

    /* ===== 3. Layout shell ===== */
    #app { display: flex; min-height: 100vh; }
    #sidebar {
      width: 256px; background: var(--primary); color: #fff; display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
      overflow-y: auto;
      background-image: linear-gradient(180deg, rgba(37,99,235,0.04) 0%, transparent 40%);
    }
    .sidebar-logo { display: flex; align-items: center; gap: 11px; padding: 22px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo svg { flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
    .sidebar-logo .wordmark { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.015em; line-height: 1.2; color: #fff; }
    .sidebar-logo .wordmark small { display: block; font-weight: 400; font-size: 0.66rem; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .nav-section-label { font-size: 0.625rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); padding: 16px 20px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 20px; margin: 1px 10px; border-radius: 8px;
      color: rgba(255,255,255,0.72); font-size: 0.875rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s; position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-item.active { background: linear-gradient(90deg, rgba(37,99,235,0.28), rgba(37,99,235,0.10)); color: #fff; box-shadow: inset 0 0 0 1px rgba(37,99,235,0.3); }
    .nav-item.active::before { content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
    .nav-item svg { width: 18px; height: 18px; stroke-width: 1.9; flex-shrink: 0; }
    .nav-item .nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 0.625rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .nav-spacer { flex: 1; }
    .nav-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.75rem; color: rgba(255,255,255,0.55); }
    .nav-footer .user-name { color: #fff; font-weight: 600; margin-bottom: 1px; }
    .nav-footer .user-role { font-size: 0.6875rem; opacity: 0.65; }

    #main { flex: 1; margin-left: 256px; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left 0.3s cubic-bezier(0.22,1,0.36,1); }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 12px 24px;
      background: color-mix(in srgb, var(--card) 82%, transparent);
      backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    }
    .topbar .crumbs { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); margin-right: auto; flex-wrap: wrap; }
    .topbar .crumbs .crumb-current { color: var(--text); font-weight: 600; }
    .topbar .crumbs svg { width: 12px; height: 12px; opacity: 0.5; }
    .topbar .search-trigger {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 0.8125rem;
      cursor: pointer; min-width: 220px; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .topbar .search-trigger:hover { border-color: var(--accent); }
    .topbar .search-trigger kbd { margin-left: auto; font-family: var(--font); font-size: 0.6875rem; background: var(--card); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; color: var(--muted); }
    .topbar .badge { font-size: 0.625rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .badge-local { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
    .badge-session { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
    .badge-hybrid { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
    .badge-cloud { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); position: relative; transition: background 0.15s, color 0.15s; }
    .icon-btn:hover { background: var(--bg); color: var(--text); }
    .icon-btn svg { width: 19px; height: 19px; stroke-width: 1.9; }
    .notif-dot { position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 0.5875rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--card); }
    #view { padding: 24px; flex: 1; max-width: 1440px; margin: 0 auto; width: 100%; animation: viewIn 0.35s cubic-bezier(0.22,1,0.36,1); }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    #bottomNav { display: none; }
    #sidebarBackdrop { display: none; }

    /* ===== 4. Reusable components ===== */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 20px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .card:hover { border-color: var(--border-strong); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .card-header h3 { font-size: 0.9375rem; }
    .card-header .card-sub { font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 16px; border-radius: 8px; font-size: 0.8125rem; font-weight: 600;
      background: var(--accent); color: #fff; transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
      min-height: 40px; border: 1px solid transparent; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-600); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; stroke-width: 2; }
    .btn-secondary { background: var(--card); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--bg); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .btn-ghost { background: transparent; color: var(--accent); border-color: transparent; }
    .btn-ghost:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: none; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #991B1B; box-shadow: 0 4px 12px rgba(185,28,28,0.3); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #115E59; box-shadow: 0 4px 12px rgba(15,118,110,0.3); }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; min-height: 32px; border-radius: 7px; }
    .btn-sm svg { width: 14px; height: 14px; }
    .btn-icon { width: 36px; height: 36px; padding: 0; min-height: 36px; border-radius: 8px; }
    .input, .select, .textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--text); font-size: 0.9rem; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s; min-height: 42px;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .input::placeholder, .textarea::placeholder { color: var(--muted); }
    .textarea { min-height: 80px; resize: vertical; }
    .label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 6px; color: var(--text-soft); }
    .field { margin-bottom: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
    .pill-active { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
    .pill-won { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
    .pill-proposed { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
    .pill-hold { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning); }
    .pill-closed { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
    .pill-draft { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
    .pill-sent { background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); }
    .pill-partpaid { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning); }
    .pill-paid { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
    .pill-overdue { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
    .pill-writtenoff { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); text-decoration: line-through; }

    .kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--primary)); opacity: 0.7; }
    .kpi-card .kpi-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .kpi-card .kpi-icon { width: 32px; height: 32px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); display: flex; align-items: center; justify-content: center; }
    .kpi-card .kpi-icon svg { width: 16px; height: 16px; stroke-width: 2; }
    .kpi-card .kpi-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .kpi-card .kpi-value { font-size: 1.6rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: -0.02em; }
    .kpi-card .kpi-sub { font-size: 0.72rem; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .kpi-card .kpi-sub .delta-up { color: var(--success); font-weight: 600; }
    .kpi-card .kpi-sub .delta-down { color: var(--danger); font-weight: 600; }

    .data-notice {
      background: color-mix(in srgb, var(--info) 6%, transparent); border: 1px solid color-mix(in srgb, var(--info) 22%, transparent);
      border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 20px; font-size: 0.8125rem;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .data-notice svg { width: 20px; height: 20px; stroke-width: 1.9; color: var(--info); flex-shrink: 0; margin-top: 1px; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-state .empty-img { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 16px; background-size: cover; background-position: center; opacity: 0.9; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--card); color: var(--text); padding: 12px 16px; border-radius: 10px;
      box-shadow: var(--shadow-lg); font-size: 0.8125rem; font-weight: 500; max-width: 380px;
      animation: toastIn 0.25s cubic-bezier(0.22,1,0.36,1); display: flex; gap: 10px; align-items: center;
      border: 1px solid var(--border); border-left: 3px solid var(--accent);
    }
    .toast svg { width: 18px; height: 18px; stroke-width: 2; flex-shrink: 0; }
    .toast-success { border-left-color: var(--success); } .toast-success svg { color: var(--success); }
    .toast-error { border-left-color: var(--danger); } .toast-error svg { color: var(--danger); }
    .toast-warning { border-left-color: var(--warning); } .toast-warning svg { color: var(--warning); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ===== 5. Domain views ===== */
    .view-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .view-header h1 { font-size: 1.5rem; }
    .view-header .sub { font-size: 0.8125rem; color: var(--muted); margin-top: 2px; }
    .view-header .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-bar .input, .filter-bar .select { width: auto; min-width: 140px; flex: 0 1 auto; }
    .filter-bar .search { flex: 1 1 220px; min-width: 180px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-lg); }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
    .tab {
      padding: 10px 16px; font-size: 0.8125rem; font-weight: 600; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap; background: none; transition: color 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: var(--bg-elev); border-radius: 10px; padding: 12px 14px; }
    .stat-box .stat-label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 3px; }
    .stat-box .stat-value { font-size: 1.0625rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .progress-bar { height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; border-radius: 999px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }
    .progress-fill.ok { background: linear-gradient(90deg, var(--success), #14B8A6); }
    .progress-fill.warn { background: linear-gradient(90deg, var(--warning), #F59E0B); }
    .progress-fill.over { background: linear-gradient(90deg, var(--danger), #EF4444); }
    .automation-rule {
      display: flex; align-items: flex-start; gap: 14px; padding: 16px; border: 1px solid var(--border);
      border-radius: var(--radius-lg); margin-bottom: 12px; background: var(--card); transition: border-color 0.15s, box-shadow 0.15s;
    }
    .automation-rule:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .automation-rule.firing { border-left: 3px solid var(--warning); }
    .automation-rule .rule-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); flex-shrink: 0; }
    .automation-rule .rule-icon svg { width: 20px; height: 20px; stroke-width: 1.9; }
    .automation-rule .rule-body { flex: 1; min-width: 0; }
    .automation-rule .rule-name { font-weight: 650; font-size: 0.9rem; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .automation-rule .rule-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .automation-rule .rule-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.72rem; color: var(--muted); align-items: center; }
    .automation-rule .rule-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.firing { background: var(--warning); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning) 22%, transparent); animation: pulse 2s infinite; }
    .status-dot.idle { background: var(--success); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    .dev-panel { border: 2px dashed var(--warning); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; background: color-mix(in srgb, var(--warning) 3%, transparent); }
    .dev-panel h3 { color: var(--warning); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .log-entry { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-size: 0.72rem; padding: 4px 8px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
    .log-entry .log-time { color: var(--muted); flex-shrink: 0; }
    .log-entry .log-type { font-weight: 700; min-width: 80px; color: var(--accent); }

    /* ===== 6. MOBILE APP HOME ===== */
    .app-home { padding: 0; }
    .home-greeting { padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px; }
    .home-greeting .avatar { width: 44px; height: 44px; border-radius: 50%; background-size: cover; background-position: center; background-color: var(--border); flex-shrink: 0; border: 2px solid var(--card); box-shadow: var(--shadow-sm); }
    .home-greeting .greet-text { flex: 1; }
    .home-greeting .greet-text h2 { font-size: 1.0625rem; margin-bottom: 1px; }
    .home-greeting .greet-text .date { font-size: 0.72rem; color: var(--muted); }
    .home-greeting .mono-mark { width: 34px; height: 34px; flex-shrink: 0; opacity: 0.85; }
    .hero-card {
      margin: 0 16px 18px; border-radius: var(--radius-xl); padding: 22px; color: #fff;
      background-size: cover; background-position: center; position: relative; overflow: hidden;
      cursor: pointer; box-shadow: var(--shadow-md); transition: transform 0.15s, box-shadow 0.2s;
    }
    .hero-card:active { transform: scale(0.99); }
    .hero-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); opacity: 0.9; }
    .hero-card > * { position: relative; z-index: 1; }
    .hero-card .hero-label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.85; }
    .hero-card .hero-value { font-size: 2.1rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 6px 0 14px; letter-spacing: -0.02em; }
    .hero-card .hero-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .hero-card .hero-pill { background: rgba(255,255,255,0.18); border-radius: 999px; padding: 4px 11px; font-size: 0.7rem; font-weight: 600; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); }
    .section-header { padding: 0 16px; margin: 20px 0 10px; display: flex; align-items: center; justify-content: space-between; }
    .section-header h3 { font-size: 0.9rem; }
    .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
    .tile {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 16px 14px; min-height: 108px; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s; position: relative; box-shadow: var(--shadow-sm);
    }
    .tile:active { transform: scale(0.97); }
    .tile:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .tile .tile-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
    .tile .tile-icon svg { width: 20px; height: 20px; stroke-width: 2; }
    .tile .tile-title { font-weight: 650; font-size: 0.85rem; margin-top: 8px; }
    .tile .tile-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .tile .tile-badge { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff; min-width: 20px; height: 20px; border-radius: 10px; font-size: 0.66rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: var(--shadow-sm); }
    .glance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px 16px; }
    .glance-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow-sm); }
    .glance-card .glance-value { font-size: 1.0625rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .glance-card .glance-label { font-size: 0.66rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
    .alert-card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--warning); border-radius: 10px; padding: 12px 14px; margin: 0 16px 10px; display: flex; gap: 10px; align-items: flex-start; transition: box-shadow 0.15s; }
    .alert-card:hover { box-shadow: var(--shadow-sm); }
    .alert-card .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex-shrink: 0; margin-top: 6px; }
    .alert-card .alert-msg { flex: 1; font-size: 0.78rem; }
    .alert-card .alert-tag { font-size: 0.66rem; font-weight: 700; color: var(--warning); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .account-section { padding: 0 16px 24px; }
    .account-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
    .account-item:hover { background: var(--bg-elev); border-color: var(--border-strong); }
    .account-item svg { width: 19px; height: 19px; stroke-width: 1.9; color: var(--muted); }
    .account-item .acc-chevron { margin-left: auto; color: var(--muted); }
    #mobileTimerWidget { position: fixed; bottom: 70px; left: 12px; right: 12px; background: var(--primary); color: #fff; border-radius: 12px; padding: 10px 16px; display: none; align-items: center; gap: 12px; z-index: 90; box-shadow: var(--shadow-lg); font-size: 0.8125rem; }
    #mobileTimerWidget.active { display: flex; }
    #mobileTimerWidget .timer-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1rem; }
    #mobileTimerWidget .timer-eng { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
    #mobileTimerWidget button { color: #fff; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 12px; font-size: 0.72rem; font-weight: 600; }

    /* ===== 7. Print ===== */
    @media print {
      body { background: #fff !important; color: #000 !important; font-size: 11pt; }
      #sidebar, #bottomNav, .topbar, .no-print, #notifBtn, #mobileMenu, .btn, .filter-bar { display: none !important; }
      #main { margin-left: 0 !important; }
      #view { padding: 0 !important; max-width: 100% !important; }
      .card { box-shadow: none !important; border: 1px solid #ccc !important; }
      .money, .kpi-value { color: #000 !important; }
      .pill { border: 1px solid #999 !important; color: #000 !important; background: none !important; }
      a { color: #000 !important; text-decoration: none !important; }
      @page { margin: 18mm; }
    }

    /* ===== 8. Responsive ===== */
    @media (max-width: 1024px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main { margin-left: 0; }
      #sidebarBackdrop.open { display: block; position: fixed; inset: 0; background: rgba(11,37,69,0.5); z-index: 99; backdrop-filter: blur(2px); }
      #bottomNav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: color-mix(in srgb, var(--card) 92%, transparent);
        backdrop-filter: blur(14px); border-top: 1px solid var(--border); z-index: 80; padding-bottom: env(safe-area-inset-bottom, 0);
      }
      #bottomNav .bn-item {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px;
        color: var(--muted); font-size: 0.62rem; font-weight: 600; position: relative; min-height: 52px; transition: color 0.15s;
      }
      #bottomNav .bn-item svg { width: 22px; height: 22px; stroke-width: 1.9; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1); }
      #bottomNav .bn-item.active { color: var(--accent); }
      #bottomNav .bn-item.active svg { transform: translateY(-2px) scale(1.05); }
      #bottomNav .bn-item.active::before {
        content: ''; position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
        width: 32px; height: 28px; background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 999px; z-index: -1;
      }
      #view { padding: 16px; padding-bottom: 80px; }
      #mobileMenu { display: flex !important; }
      .topbar .search-trigger { min-width: 0; flex: 1; }
      .topbar .search-trigger span { display: none; }
    }
    @media (min-width: 1025px) {
      #mobileMenu { display: none !important; }
      #bottomNav { display: none !important; }
    }
    @media (max-width: 760px) {
      .field-row { grid-template-columns: 1fr; }
      .topbar { padding: 10px 12px; gap: 6px; }
      .topbar .crumbs { display: none; }
      .topbar .badge { display: none; }
      .kpi-strip { grid-template-columns: 1fr 1fr; gap: 10px; }
      .kpi-card { padding: 14px; }
      .kpi-card .kpi-value { font-size: 1.3rem; }
      .view-header h1 { font-size: 1.15rem; }
      .view-header .actions .btn span { display: none; }
      .view-header .actions .btn { padding: 8px 10px; min-width: 44px; }
      .tile-grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 12px; }
      .hero-card { margin: 0 12px 16px; }
      .home-greeting { padding: 16px 12px 10px; }
      .glance-grid { padding: 0 12px 12px; gap: 8px; }
      .alert-card { margin: 0 12px 8px; }
      .section-header { padding: 0 12px; }
      .account-section { padding: 0 12px 20px; }
      #toasts { bottom: 70px; right: 12px; left: 12px; }
      #toasts .toast { max-width: 100%; }
      .table-wrap { overflow: visible; }
      table thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; padding: 10px 12px; background: var(--card); box-shadow: var(--shadow-sm); }
      td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 5px 0; border: none; text-align: right; font-size: 0.8rem; min-height: 28px; flex-wrap: wrap; word-break: break-word; }
      td::before { content: attr(data-label); font-weight: 600; color: var(--muted); text-align: left; flex-shrink: 0; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
      td > * { word-break: break-word; overflow-wrap: anywhere; }
      td:last-child { border-bottom: none; }
      .modal-sheet .modal-content { border-radius: var(--radius-xl) var(--radius-xl) 0 0; max-height: 92vh; }
      .modal-sheet { align-items: flex-end; padding: 0; }
      .modal-sheet .modal-content { width: 100%; max-width: 100%; margin: 0; }
      .modal-sheet .modal-footer { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0)); }
      .modal-footer .btn { flex: 1; }
      .modal-sheet .modal-header { position: sticky; top: 0; background: var(--card); z-index: 1; }
      .input, .select, .textarea { font-size: 16px; }
      .btn { min-height: 44px; }
      .btn-icon { min-width: 44px; min-height: 44px; }
    }
    @media (max-width: 420px) {
      .tile-grid { grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; }
      .hero-card { margin: 0 8px 12px; padding: 16px; }
      .hero-card .hero-value { font-size: 1.5rem; }
      .glance-grid { grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 8px 8px; }
      .glance-card { padding: 8px; }
      .kpi-strip { grid-template-columns: 1fr; }
      .tile { min-height: 100px; padding: 12px 10px; }
      .tile .tile-title { font-size: 0.78rem; }
      .tile .tile-meta { font-size: 0.66rem; }
      td { font-size: 0.75rem; }
      .automation-rule { flex-direction: column; gap: 10px; }
      .automation-rule .rule-actions { width: 100%; }
      .automation-rule .rule-actions .btn { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .tile:active { transform: none; }
      #bottomNav .bn-item.active svg { transform: none; }
    }

    /* ===== 9. Modals, palette, login ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(11,37,69,0.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.18s ease; backdrop-filter: blur(2px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content { background: var(--card); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 580px; max-height: 85vh; display: flex; flex-direction: column; animation: slideUp 0.22s cubic-bezier(0.22,1,0.36,1); border: 1px solid var(--border); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 1.0625rem; }
    .modal-body { padding: 22px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .modal-close { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); transition: background 0.15s; }
    .modal-close:hover { background: var(--bg); }
    .modal-close svg { width: 20px; height: 20px; stroke-width: 2; }
    .scan-overlay { position: fixed; inset: 0; background: #000; z-index: 300; display: flex; flex-direction: column; }
    .scan-overlay video { flex: 1; object-fit: cover; width: 100%; }
    .scan-overlay .scan-msg { position: absolute; top: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 12px; border-radius: 10px; font-size: 0.85rem; text-align: center; }
    .scan-overlay .scan-close { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); }
    .skip-link { position: absolute; left: -9999px; top: 0; background: var(--accent); color: #fff; padding: 8px 16px; z-index: 10000; border-radius: 0 0 8px 0; }
    .skip-link:focus { left: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .login-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; z-index: 1000; padding: 20px; }
    .login-screen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(11,37,69,0.7) 0%, rgba(11,37,69,0.94) 100%); }
    .login-card { position: relative; z-index: 1; background: var(--card); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 420px; padding: 36px 32px; text-align: center; border: 1px solid var(--border); }
    .login-card .login-logo { margin: 0 auto 18px; }
    .login-card h1 { font-size: 1.25rem; color: var(--text); margin-bottom: 4px; }
    .login-card .sub { font-size: 0.8125rem; color: var(--muted); margin-bottom: 26px; }
    .login-card .demo-note { font-size: 0.7rem; color: var(--muted); margin-top: 20px; line-height: 1.6; }
    .login-card .demo-note strong { color: var(--text-soft); }
    .demo-user-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
    .demo-user-btn { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 0.72rem; font-weight: 600; color: var(--text-soft); text-align: left; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
    .demo-user-btn:hover { border-color: var(--accent); background: var(--card); }
    .demo-user-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .demo-user-btn.role-owner .dot { background: var(--primary); }
    .demo-user-btn.role-manager .dot { background: var(--accent); }
    .demo-user-btn.role-consultant .dot { background: var(--info); }
    .demo-user-btn.role-finance .dot { background: var(--success); }
    .demo-user-btn.role-client .dot { background: var(--warning); }
    .demo-user-btn.role-dev .dot { background: var(--danger); }

    /* Command palette */
    .palette-overlay { position: fixed; inset: 0; background: rgba(11,37,69,0.6); z-index: 500; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; animation: fadeIn 0.15s; backdrop-filter: blur(3px); }
    .palette-box { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); width: 100%; max-width: 560px; overflow: hidden; border: 1px solid var(--border); animation: slideUp 0.2s cubic-bezier(0.22,1,0.36,1); }
    .palette-input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 16px 20px; font-size: 1rem; background: transparent; color: var(--text); outline: none; }
    .palette-input::placeholder { color: var(--muted); }
    .palette-results { max-height: 380px; overflow-y: auto; padding: 8px; }
    .palette-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.875rem; transition: background 0.1s; }
    .palette-item.active, .palette-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .palette-item svg { width: 18px; height: 18px; stroke-width: 1.9; color: var(--muted); flex-shrink: 0; }
    .palette-item.active svg { color: var(--accent); }
    .palette-item .p-label { flex: 1; }
    .palette-item .p-hint { font-size: 0.6875rem; color: var(--muted); }
    .palette-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 0.8125rem; }

    /* Invoice preview */
    .invoice-preview { background: #fff; color: #000; border-radius: 10px; padding: 32px; font-size: 0.8125rem; border: 1px solid var(--border); }
    .invoice-preview .ip-header { display: flex; justify-content: space-between; border-bottom: 2px solid #0B2545; padding-bottom: 16px; margin-bottom: 20px; }
    .invoice-preview .ip-brand { font-size: 1.125rem; font-weight: 700; color: #0B2545; }
    .invoice-preview .ip-meta { text-align: right; font-size: 0.75rem; color: #555; }
    .invoice-preview table { margin: 16px 0; }
    .invoice-preview th { background: #f4f4f4; color: #333; }
    .invoice-preview .ip-total-row td { font-weight: 700; font-size: 0.9375rem; border-top: 2px solid #0B2545; }
    .invoice-preview .ip-footer { text-align: center; color: #555; font-size: 0.75rem; margin-top: 24px; border-top: 1px solid #ccc; padding-top: 12px; }

    /* Utility */
    .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
    .mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mb-4 { margin-bottom: 16px; }
    .text-center { text-align: center; } .w-full { width: 100%; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

    function open() {

      });

    }

        } catch (e) { useMemory = true; resolve(); }
      });
    }

    afterRender: function() {
      var self = this;
      var v = $('#view');
      self.labelTableCells();
      $$('[data-action]', v).forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          self.handleAction(el.getAttribute('data-action'), el.getAttribute('data-id'), el);
        });
      });
      $$('textarea', v).forEach(function(ta) { ta.addEventListener('input', function() { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }); });
      $$('.kpi-value', v).forEach(function(el) {
        var text = el.textContent;
        var m = text.match(/^([^\d]*)([\d,.]+)(.*)$/);
        if (!m) return;
        var prefix = m[1], target = parseFloat(m[2].replace(/,/g, '')), suffix = m[3];
        if (isNaN(target)) return;
        var start = 0, t0 = performance.now(), dur = 800;
        el.textContent = prefix + '0' + suffix;
        function tick(now) {
          var p = Math.min(1, (now - t0) / dur);
          var eased = 1 - Math.pow(1 - p, 3);
          var val = target * eased;
          var display = target >= 1000 ? Math.round(val).toLocaleString('en-KE') : val.toFixed(target % 1 !== 0 ? 1 : 0);
          el.textContent = prefix + display + suffix;
          if (p < 1) requestAnimationFrame(tick); else el.textContent = text;
        }
        requestAnimationFrame(tick);
      });
    },
    labelTableCells: function() {
      $$('table').forEach(function(table) {
        var headers = [];
        var th = table.querySelector('thead');
        if (th) $$('th', th).forEach(function(x) { headers.push(x.textContent.trim()); });
        $$('tbody tr', table).forEach(function(tr) { $$('td', tr).forEach(function(td, i) { if (headers[i]) td.setAttribute('data-label', headers[i]); }); });
      });
    },

      if (mb) { mb.textContent = mode.charAt(0).toUpperCase() + mode.slice(1); mb.className = 'badge badge-' + mode; }

      if (sb) { if (DB.isSessionOnly()) { sb.textContent = 'Session only'; sb.className = 'badge badge-session'; } else { sb.textContent = 'On-device'; sb.className = 'badge badge-local'; } }

      if (self.data.engagements) {

      }

    handleAction: function(action, id, el) {
      var self = this;
      if (action === 'scan') { BarcodeScanner.start(function(code) { BarcodeScanner.universalLookup(code); }); return; }
      if (action === 'export-csv') { self.exportCSV(id); return; }
      if (action === 'navigate') { self.navigate(id); return; }
      if (action === 'logout') { self.logout(); return; }
      if (action === 'new-engagement') { self.editEngagement(null); return; }
      if (action === 'edit-engagement') { self.editEngagement(id); return; }
      if (action === 'view-engagement') { self.viewEngagement(id); return; }
      if (action === 'new-time') { self.editTime(null); return; }
      if (action === 'approve-time') { self.approveTime(id); return; }
      if (action === 'new-disbursement') { self.editDisbursement(null); return; }
      if (action === 'new-client') { self.editClient(null); return; }
      if (action === 'edit-client') { self.editClient(id); return; }
      if (action === 'new-invoice') { self.editInvoice(null); return; }
      if (action === 'record-payment') { self.recordPayment(id); return; }

    importBackup: function() {
      var self = this;
      var input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
      input.onchange = function(e) {
        var f = e.target.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function(ev) {
          try {
            var p = JSON.parse(ev.target.result);
            if (!p.data || !p.version) throw new Error('Invalid schema');
            confirmDialog('Import Backup', 'Replace all current data?', function() {
              Object.keys(p.data).forEach(function(k) { if (self.data[k] !== undefined) self.data[k] = p.data[k]; });
              Promise.all(Object.keys(self.data).map(function(k) { return DB.put(k, self.data[k]); })).then(function() { toast('Imported.', 'success'); self.render(); });
            }, { danger: true });
          } catch (err) { toast('Invalid file: ' + err.message, 'error'); }
        };
        r.readAsText(f);
      };
      input.click();
    },

    editInvoice: function(id) {
      var self = this, d = self.data;
      var body = '<div class="field"><label class="label">Client</label><select class="select" id="iClient">' + d.clients.map(function(c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select></div><div class="field"><label class="label">Engagement</label><select class="select" id="iEng">' + d.engagements.filter(function(e) { return e.status === 'Active' || e.status === 'Won'; }).map(function(e) { return '<option value="' + e.id + '">' + esc(e.name) + '</option>'; }).join('') + '</select></div><div class="field"><label class="label">Fixed fee (KES) — 0 to pull time + disbursements</label><input type="number" class="input" id="iFixed" value="0"></div><div class="field"><label class="label">Due date</label><input type="date" class="input" id="iDue" value="' + addDays(todayISO(), 30) + '"></div>';
      var m = showModal('Raise Invoice', body, '<button class="btn btn-secondary" data-act="cancel">Cancel</button><button class="btn" data-act="save">Generate Invoice</button>');
      $('[data-act="cancel"]', m.overlay).addEventListener('click', m.close);
      $('[data-act="save"]', m.overlay).addEventListener('click', function() {
        var cid = $('#iClient').value, engId = $('#iEng').value;
        var eng = d.engagements.find(function(e) { return e.id === engId; });
        var fixed = Math.round(parseFloat($('#iFixed').value || 0) * 100);
        var lines = [], subtotal = 0;
        if (fixed > 0) { lines.push({ desc: 'Fixed fee — ' + (eng ? eng.name : ''), amount: fixed }); subtotal += fixed; }
        else {
          var time = d.timeEntries.filter(function(t) { return t.engagementId === engId && t.approved && t.billable && !t.invoiceId; });
          time.forEach(function(t) { var s = d.staff.find(function(x) { return x.id === t.staffId; }); var amt = Math.round(t.hours * (s ? s.billRate : 0) * 100); lines.push({ desc: t.narrative + ' (' + t.hours.toFixed(2) + ' hrs)', amount: amt }); subtotal += amt; t.invoiceId = 'pending'; });
          d.disbursements.filter(function(x) { return x.engagementId === engId && x.recoverable && !x.invoiced; }).forEach(function(x) { lines.push({ desc: 'Disbursement — ' + x.category + ' (ref ' + x.receiptRef + ')', amount: x.amount }); subtotal += x.amount; x.invoiced = true; });
        }
        if (!lines.length) { toast('Nothing to invoice.', 'warning'); return; }
        var vat = Math.round(subtotal * 0.16);
        var inv = { id: uid('inv'), number: 'MAG-' + new Date().getFullYear() + '-' + String(d.invoices.length + 1).padStart(3, '0'), clientId: cid, engagementId: engId, issueDate: todayISO(), dueDate: $('#iDue').value, subtotal: subtotal, vat: vat, total: subtotal + vat, status: 'Draft', lines: lines };
        d.invoices.push(inv);
        d.timeEntries.forEach(function(t) { if (t.invoiceId === 'pending') t.invoiceId = inv.id; });
        DB.put('invoices', d.invoices); DB.put('timeEntries', d.timeEntries); DB.put('disbursements', d.disbursements);
        m.close(); toast('Invoice ' + inv.number + ' generated.', 'success'); self.render();
      });
    },
    recordPayment: function(id) {
      var self = this, d = self.data;
      var inv = d.invoices.find(function(i) { return i.id === id; }); if (!inv) return;
      var paid = d.payments.filter(function(p) { return p.invoiceId === inv.id; }).reduce(function(a, p) { return a + p.amount; }, 0);
      var bal = inv.total - paid;
      var body = '<p class="small muted" style="margin-bottom:12px">Invoice ' + esc(inv.number) + ' — Balance: <strong>' + fmtMoney(bal) + '</strong></p><div class="field"><label class="label">Amount (KES)</label><input type="number" step="0.01" class="input" id="pAmount" value="' + (bal / 100) + '"></div><div class="field"><label class="label">Method</label><select class="select" id="pMethod"><option>Bank</option><option>M-Pesa</option><option>Cheque</option><option>Cash</option></select></div><div class="field"><label class="label">Reference</label><input class="input" id="pRef" placeholder="M-Pesa ref / cheque / bank ref"></div><div class="field"><label class="label">Date</label><input type="date" class="input" id="pDate" value="' + todayISO() + '"></div>';
      var m = showModal('Record Payment', body, '<button class="btn btn-secondary" data-act="cancel">Cancel</button><button class="btn btn-success" data-act="save">Record</button>');
      $('[data-act="cancel"]', m.overlay).addEventListener('click', m.close);
      $('[data-act="save"]', m.overlay).addEventListener('click', function() {
        var amt = Math.round(parseFloat($('#pAmount').value || 0) * 100); if (amt <= 0) { toast('Enter amount.', 'error'); return; } if (amt > bal) { toast('Exceeds balance.', 'warning'); return; }
        var ref = $('#pRef').value.trim(); if ($('#pMethod').value === 'M-Pesa' && ref && !/^[A-Z0-9]{8,12}$/i.test(ref)) { toast('M-Pesa ref should be 8–12 alphanumeric.', 'warning'); return; }
        d.payments.push({ id: uid('pay'), invoiceId: inv.id, method: $('#pMethod').value, reference: ref || '—', amount: amt, date: $('#pDate').value });
        inv.status = (paid + amt) >= inv.total ? 'Paid' : 'Part-paid';
        DB.put('payments', d.payments); DB.put('invoices', d.invoices);
        m.close(); toast('Payment recorded. Invoice ' + inv.status + '.', 'success'); self.render();
      });
    },
    generatePortalToken: function(cid) {
      var d = this.data;
      var ex = d.portalTokens.find(function(t) { return t.clientId === cid; });
      if (ex) { toast('Token: ' + ex.token, 'info'); return; }
      var tok = 'PORTAL:' + cid.toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
      d.portalTokens.push({ id: uid('pt'), clientId: cid, token: tok, createdAt: todayISO() });
      DB.put('portalTokens', d.portalTokens); toast('Generated: ' + tok, 'success'); this.render();
    },
    startTimer: function(engId) {
      var self = this;
      if (self._timerStart) { toast('Timer already running.', 'warning'); return; }
      self._timerEng = engId; self._timerStart = Date.now();
      self._timerInterval = setInterval(function() {
        var secs = Math.floor((Date.now() - self._timerStart) / 1000);
        var h = String(Math.floor(secs / 3600)).padStart(2, '0');
        var mi = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
        var s = String(secs % 60).padStart(2, '0');
        var d = $('#timerDisplay'); if (d) d.textContent = h + ':' + mi + ':' + s;
        var w = $('#mobileTimerWidget'); if (w) { w.classList.add('active'); w.innerHTML = '<span class="timer-time">' + h + ':' + mi + ':' + s + '</span><span class="timer-eng">' + esc((self.data.engagements.find(function(e) { return e.id === self._timerEng; }) || {}).name || '') + '</span><button data-action="toggle-timer">Stop</button>'; w.querySelector('[data-action="toggle-timer"]').addEventListener('click', function() { self.toggleTimer(); }); }
      }, 500);
      toast('Timer started.', 'success'); self.render();
    },
    toggleTimer: function() {
      var self = this;
      if (self._timerEng && self._timerStart) {
        var elapsed = (Date.now() - self._timerStart) / 3600000;
        clearInterval(self._timerInterval); self._timerInterval = null;
        var engId = self._timerEng; self._timerEng = null; self._timerStart = null;
        var hrs = Math.round(elapsed * 100) / 100;
        if (hrs < 0.01) { toast('Too short to log.', 'warning'); self.render(); return; }
        self.data.timeEntries.push({ id: uid('te'), staffId: self.session.staffId || 'st3', engagementId: engId, date: todayISO(), hours: hrs, billable: true, taskCode: 'GEN', narrative: 'Timer — auto-logged', approved: false, approvedBy: null, invoiceId: null, draft: false, createdAt: nowISO() });
        DB.put('timeEntries', self.data.timeEntries);
        toast('Timer stopped. ' + hrs.toFixed(2) + ' hrs logged.', 'success'); self.render();
      } else { self.render(); }
    },
    renderTimerWidget: function() {
      var w = $('#mobileTimerWidget');
      if (!w) return;
      if (this._timerStart) {
        w.classList.add('active');
        var secs = Math.floor((Date.now() - this._timerStart) / 1000);
        var h = String(Math.floor(secs / 3600)).padStart(2, '0');
        var mi = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
        var s = String(secs % 60).padStart(2, '0');
        var eng = this.data.engagements.find(function(e) { return e.id === App._timerEng; });
        w.innerHTML = '<span class="timer-time">' + h + ':' + mi + ':' + s + '</span><span class="timer-eng">' + esc(eng ? eng.name : '') + '</span><button data-action="toggle-timer">Stop</button>';
        w.querySelector('[data-action="toggle-timer"]').addEventListener('click', function() { App.toggleTimer(); });
      } else { w.classList.remove('active'); w.innerHTML = ''; }
    }
  };

      { label: 'Engagements', hint: 'View all', icon: 'briefcase', act: function() { App.navigate('engagements'); } },
      { label: 'Time & Expenses', hint: 'Log time', icon: 'clock', act: function() { App.navigate('time'); } },
      { label: 'Clients', hint: 'Client list', icon: 'users', act: function() { App.navigate('clients'); } },
      { label: 'Invoicing', hint: 'Raise invoice', icon: 'file-text', act: function() { App.navigate('invoicing'); } },
      { label: 'Reports', hint: 'All reports', icon: 'bar-chart', act: function() { App.navigate('reports'); } },
      { label: 'Automation Centre', hint: 'Rules', icon: 'zap', act: function() { App.navigate('automations'); } },
      { label: 'Settings', hint: 'Profile & data', icon: 'settings', act: function() { App.navigate('settings'); } },
      { label: 'Log time', hint: 'New entry', icon: 'clock', act: function() { App.navigate('time'); setTimeout(function() { App.editTime(null); }, 100); } },
      { label: 'New engagement', hint: 'Create', icon: 'briefcase', act: function() { App.editEngagement(null); } },
      { label: 'New client', hint: 'Create', icon: 'users', act: function() { App.editClient(null); } },
      { label: 'Raise invoice', hint: 'Create', icon: 'file-text', act: function() { App.editInvoice(null); } },
      { label: 'Record disbursement', hint: 'New expense', icon: 'receipt', act: function() { App.editDisbursement(null); } },
      { label: 'Scan barcode', hint: 'Camera', icon: 'grid', act: function() { BarcodeScanner.start(function(c) { BarcodeScanner.universalLookup(c); }); } },
      { label: 'Switch user', hint: 'Demo accounts', icon: 'user', act: function() { App.switchUser(); } },
      { label: 'Toggle theme', hint: 'Light / Dark', icon: 'settings', act: function() { App.toggleTheme(); } },
      { label: 'Export JSON backup', hint: 'Data', icon: 'database', act: function() { App.exportBackup(); } },
      { label: 'Reset demo data', hint: 'Danger', icon: 'alert', act: function() { App.resetDemo(); } },
      { label: 'Log out', hint: 'Sign out', icon: 'logout', act: function() { App.logout(); } }
    ];
    var filtered = items.slice(), activeIdx = 0;
    function render(q) {
      q = (q || '').toLowerCase().trim();
      filtered = items.filter(function(i) { return !q || i.label.toLowerCase().indexOf(q) >= 0 || i.hint.toLowerCase().indexOf(q) >= 0; });
      if (!filtered.length) { results.innerHTML = '<div class="palette-empty">No results for "' + esc(q) + '"</div>'; return; }
      activeIdx = Math.min(activeIdx, filtered.length - 1);
      results.innerHTML = filtered.map(function(i, idx) { return '<div class="palette-item' + (idx === activeIdx ? ' active' : '') + '" data-idx="' + idx + '">' + svgIcon(i.icon) + '<span class="p-label">' + esc(i.label) + '</span><span class="p-hint">' + esc(i.hint) + '</span></div>'; }).join('');
      $$('.palette-item', results).forEach(function(el) {
        el.addEventListener('click', function() { var idx = parseInt(el.getAttribute('data-idx')); close(); filtered[idx].act(); });
        el.addEventListener('mouseenter', function() { activeIdx = parseInt(el.getAttribute('data-idx')); $$('.palette-item', results).forEach(function(x) { x.classList.remove('active'); }); el.classList.add('active'); });
      });
    }
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown', eh); }
    function eh(e) {
      if (e.key === 'Escape') { close(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, filtered.length - 1); render(input.value); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); render(input.value); }
      else if (e.key === 'Enter') { e.preventDefault(); var sel = filtered[activeIdx]; if (sel) { close(); sel.act(); } }
    }
    document.addEventListener('keydown', eh);
    input.addEventListener('input', function() { activeIdx = 0; render(input.value); });
    ov.addEventListener('click', function(e) { if (e.target === ov) close(); });
    render('');
    setTimeout(function() { input.focus(); }, 50);
  }

  /* ============================================================
     12. BOOTSTRAP
     ============================================================ */
  document.addEventListener('DOMContentLoaded', function() {
    // Theme restore
    var savedTheme = localStorage.getItem('mag_theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

    App.init().then(function() {
      // Topbar bindings
      $('#themeToggle').addEventListener('click', function() { App.toggleTheme(); });
      $('#mobileMenu').addEventListener('click', function() { App.openMobileMenu(); });
      $('#sidebarBackdrop').addEventListener('click', function() { App.closeMobileMenu(); });
      $('#searchTrigger').addEventListener('click', function() { openPalette(); });

      // Notification button
      $('#notifBtn').addEventListener('click', function() {
        var ev = Automations.evaluate(App.data);
        var firing = ev.filter(function(e) { return e.firing && !e.dismissed; });
        showModal('Notifications', firing.length ? firing.map(function(f) { return '<div style="padding:10px 0;border-bottom:1px solid var(--border)"><strong>' + esc(f.rule.name) + '</strong> <span class="muted small">(' + f.count + ' matched)</span><div class="small muted" style="margin-top:2px">' + esc(f.rule.desc) + '</div></div>'; }).join('') : '<p class="muted small">No firing automations.</p>',
          '<button class="btn btn-secondary" data-act="close">Close</button><button class="btn" data-act="manage">Manage Automations</button>');
        $('#modalRoot [data-act="close"]').addEventListener('click', function() { $('#modalRoot .modal-close').click(); });
        $('#modalRoot [data-act="manage"]').addEventListener('click', function() { $('#modalRoot .modal-close').click(); App.navigate('automations'); });
      });

      // User menu
      $('#userMenuBtn').addEventListener('click', function() {
        var s = App.session; if (!s) return;
        var body = '<p class="small"><strong>Name:</strong> ' + esc(s.displayName) + '<br><strong>Role:</strong> ' + ROLES[s.role].label + '<br><strong>Username:</strong> ' + esc(s.username) + '</p><hr style="border:none;border-top:1px solid var(--border);margin:14px 0"><p class="small muted" style="margin-bottom:8px">Quick switch</p>';
        var users = [{ u: 'owner', n: 'Wanjiru Kamau', r: 'Partner' }, { u: 'manager', n: 'Otieno Odhiambo', r: 'Manager' }, { u: 'consultant', n: 'Fatuma Hassan', r: 'Consultant' }, { u: 'finance', n: 'Grace Njeri', r: 'Finance' }, { u: 'client', n: 'Savannah Capital', r: 'Client' }, { u: 'dev', n: 'Developer', r: 'Hidden' }];
        body += users.filter(function(x) { return x.u !== s.username; }).map(function(x) { return '<button class="account-item w-full" data-switch-user="' + x.u + '" style="text-align:left"><span style="font-weight:600">' + x.n + '</span><span class="muted small" style="margin-left:auto">' + x.r + '</span></button>'; }).join('');
        var m = showModal(s.displayName, body, '<button class="btn btn-secondary" data-act="close">Close</button><button class="btn btn-danger" data-act="logout">Log out</button>');
        $$('[data-switch-user]', m.overlay).forEach(function(b) {
          b.addEventListener('click', function() {
            var u = b.getAttribute('data-switch-user');
            var staffMap = { owner: 'st1', manager: 'st2', consultant: 'st3', finance: null, client: null, dev: null };
            var displayMap = { owner: 'Wanjiru Kamau', manager: 'Otieno Odhiambo', consultant: 'Fatuma Hassan', finance: 'Grace Njeri', client: 'Savannah Capital', dev: 'Developer' };
            var role = u === 'dev' ? 'developer' : u;
            App.session = { username: u, role: role, staffId: staffMap[u] || null, displayName: displayMap[u] };
            localStorage.setItem('mag_session', JSON.stringify(App.session));
            m.close(); App.route = 'dashboard'; App.showApp();
            toast('Switched to ' + displayMap[u], 'success');
          });
        });
        $('[data-act="close"]', m.overlay).addEventListener('click', m.close);
        $('[data-act="logout"]', m.overlay).addEventListener('click', function() { m.close(); App.logout(); });
      });

      // Global keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'l' && App.session) { e.preventDefault(); App.logout(); }
      });

      // Tab clicks inside views (delegated, since tabs are re-rendered)
      document.addEventListener('click', function(e) {
        var tab = e.target.closest('.tab[data-tab]');
        if (tab) {
          var container = tab.closest('.tabs');
          if (container) {
            $$('.tab', container).forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            var content = $('#tabContent');
            if (content) { content.innerHTML = App.renderTimeTab(tab.getAttribute('data-tab')); App.labelTableCells(); }
          }
        }
      });

      // Engagement filters
      document.addEventListener('input', debounce(function(e) {
        if (e.target.id === 'engSearch') { App.routeParams.search = e.target.value; App.render(); }
      }, 300));
      document.addEventListener('change', function(e) {
        if (e.target.id === 'engStatusFilter') { App.routeParams.filterStatus = e.target.value; App.render(); }
        if (e.target.id === 'engClientFilter') { App.routeParams.filterClient = e.target.value; App.render(); }
      });

      // Dev panel buttons
      document.addEventListener('click', function(e) {
        if (e.target.id === 'devTestFirestore') { toast('Not wired — stub throws "not configured".', 'warning'); }
        if (e.target.id === 'devTestWorker') { toast('Not wired — Worker stub throws "not configured".', 'warning'); }
        if (e.target.id === 'devConnect') { toast('Sync adapter: not configured.', 'warning'); }
      });

      // Resize re-render for dashboard
      window.addEventListener('resize', debounce(function() {
        if (App.route === 'dashboard' && App.session) App.render();
      }, 400));
    }).catch(function(err) {
      console.error('Boot failed:', err);
      toast('Boot error: ' + err.message, 'error');
    });
  });
  </script>
</body>
