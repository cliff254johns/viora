<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{background:var(--nav);color:#e8f2f8;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:3px 8px 14px;border-bottom:1px solid #ffffff1c}.logo{height:38px;width:38px;border-radius:12px;background:linear-gradient(135deg,#51ddd1,#168f9b);display:grid;place-items:center;color:#082b36;font-weight:900;font-size:18px}.brand strong{font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:#9db7c8;font-size:11px}.navlabel{font-size:10px;letter-spacing:1.5px;color:#86a5b9;padding:0 10px;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;color:#c5d8e5;text-align:left;border-radius:10px;padding:10px 11px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.ni{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff1c;padding:14px 8px;color:#a8c0d0;font-size:11px}.main{min-width:0}.topbar{height:74px;display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}.search{flex:1;max-width:560px;position:relative}.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 14px 11px 38px;color:var(--ink);outline:none}.search span{position:absolute;left:13px;top:10px;color:var(--muted)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.select,.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink);width:100%}.top-actions select{max-width:150px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:650}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#062f35;border-color:var(--accent)}.btn.ghost{background:transparent}.btn.small{font-size:12px;padding:6px 9px}.content{padding:26px;max-width:1600px;margin:auto}.pagehead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.eyebrow{color:var(--accent);font-weight:800;font-size:10px;letter-spacing:1.7px;text-transform:uppercase}.pagehead h1{font-size:26px;letter-spacing:-.8px;margin:4px 0}.pagehead p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{height:33px;width:33px;border-radius:10px;background:var(--accent2);display:grid;place-items:center;color:var(--accent);font-size:17px}.stat-num{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:12px 0 4px}.trend{font-size:11px;color:var(--good)}.muted{color:var(--muted)}.two{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-title h3{margin:0;font-size:15px}.section-title p{margin:3px 0 0;color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:750;background:var(--accent2);color:var(--accent)}.pill.warn{background:#fff1d7;color:#98620b}.pill.bad{background:#ffe5e5;color:#a33b3b}.pill.good{background:#dff6eb;color:#176b4a}[data-theme=dark] .pill.warn{background:#48371b;color:#ffd37c}[data-theme=dark] .pill.bad{background:#48262b;color:#ffaaaa}[data-theme=dark] .pill.good{background:#173b30;color:#86e2ba}.barlist{display:grid;gap:14px}.barrow{display:grid;grid-template-columns:115px 1fr 42px;align-items:center;gap:10px;font-size:12px}.track{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.track span{display:block;height:100%;border-radius:9px;background:var(--accent)}.feed{display:grid;gap:0}.feeditem{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.feeditem:last-child{border:0}.feedicon{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}.feeditem strong{display:block;font-size:12px}.feeditem small{color:var(--muted);font-size:11px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;background:var(--bg)}td strong{font-weight:750}.empty{padding:28px;text-align:center;color:var(--muted)}.modulegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.modulecard{padding:17px;border:1px solid var(--line);background:var(--panel);border-radius:14px;cursor:pointer;transition:.15s}.modulecard:hover{transform:translateY(-2px);border-color:var(--accent)}.modulecard .micon{width:40px;height:40px;border-radius:12px;background:var(--accent2);display:grid;place-items:center;font-size:20px;margin-bottom:12px}.modulecard h3{font-size:14px;margin:0 0 5px}.modulecard p{color:var(--muted);font-size:12px;margin:0 0 12px}.modulecard small{color:var(--accent);font-weight:750}.workflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.step{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:100px;flex:1}.step b{display:block;font-size:12px}.step small{color:var(--muted);font-size:10px}.arrow{color:var(--accent);font-weight:900}.exception{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.exception:last-child{border:0}.exmark{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-top:5px;flex-shrink:0}.exception.danger .exmark{background:var(--danger)}.exception strong{font-size:12px}.exception p{font-size:11px;color:var(--muted);margin:3px 0 7px}.exception .btn{margin-right:5px}.callout{border:1px solid #9be1d8;background:var(--accent2);border-radius:13px;padding:15px;color:var(--ink)}.callout strong{display:block;margin-bottom:4px}.callout p{font-size:12px;margin:0;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:750}.field.full{grid-column:1/-1}.field textarea{min-height:80px;resize:vertical}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.switchrow:last-child{border:0}.switch{appearance:none;width:38px;height:22px;background:#aab7c2;border-radius:20px;position:relative;cursor:pointer;flex-shrink:0}.switch:checked{background:var(--accent)}.switch:before{content:"";position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.15s}.switch:checked:before{left:19px}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:6px 9px;border-radius:8px;font-size:11px}.tag.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}.mobile-menu{display:none}.notice{position:fixed;bottom:20px;right:20px;background:var(--nav);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:30;max-width:360px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#08131e88;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:var(--panel);color:var(--ink);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:17px;padding:22px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modalhead h2{font-size:18px;margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.chatbubble{background:var(--bg);padding:12px;border-radius:12px;margin:8px 0;font-size:12px}.chatbubble.ai{border-left:3px solid var(--accent)}.bottomnav{display:none}.kpi-note{font-size:10px;color:var(--muted);margin-top:5px}.statusline{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.dot{height:7px;width:7px;border-radius:50%;background:var(--good)}.dot.off{background:var(--warn)}.chart{height:115px;display:flex;align-items:end;gap:8px;padding-top:12px}.chart .col{flex:1;min-width:8px;background:linear-gradient(180deg,var(--accent),#16a6a155);border-radius:5px 5px 0 0;position:relative}.chart .col span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}.chartwrap{padding-bottom:22px}.divider{height:1px;background:var(--line);margin:14px 0}
@media(max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.modulegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}.two{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.topbar{height:62px;padding:10px 14px}.top-actions .branchselect,.top-actions .rolelabel{display:none}.mobile-menu{display:inline-flex}.search input{padding:10px 10px 10px 32px}.top-actions{gap:5px}.top-actions .btn{padding:8px}.content{padding:17px 13px 88px}.pagehead{display:block}.pagehead h1{font-size:23px}.pagehead .actions{margin-top:14px}.stats{gap:9px}.card{padding:13px;border-radius:13px}.stat-num{font-size:22px}.modulegrid,.three{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.bottomnav button{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:3px;font-size:9px}.bottomnav button span{font-size:18px}.bottomnav button.active{color:var(--accent)}.barrow{grid-template-columns:90px 1fr 35px}.workflow{gap:5px}.step{min-width:82px;padding:9px}.arrow{display:none}.top-actions .iconbtn{display:none}}
@media(max-width:390px){.stats{grid-template-columns:1fr 1fr}.modulegrid,.three{grid-template-columns:1fr 1fr}.stat-num{font-size:20px}.top-actions .branchselect{display:none}.pagehead .actions .btn{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">◎</div><div><strong>OneCore</strong><small>One business. One system.</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="sidenav">
 <button class="active" data-page="overview"><span class="ni">⌂</span>Command centre</button>
 <button data-page="transactions"><span class="ni">⇄</span>Unified transactions</button>
 <button data-page="exceptions"><span class="ni">⚑</span>Exception centre <span class="pill bad" id="exceptionCount">4</span></button>
 <button data-page="analytics"><span class="ni">▥</span>Business intelligence</button>
 </nav></div>
 <div><div class="navlabel">Business modules</div><nav class="nav" id="modnav">
 <button data-page="sales"><span class="ni">▣</span>Sales & POS</button><button data-page="inventory"><span class="ni">▤</span>Inventory</button><button data-page="procurement"><span class="ni">⇣</span>Procurement</button><button data-page="finance"><span class="ni">◈</span>Finance</button><button data-page="customers"><span class="ni">♙</span>Customers & suppliers</button><button data-page="operations"><span class="ni">⚙</span>Operations & people</button>
 </nav></div>
 <div><div class="navlabel">Automation & intelligence</div><nav class="nav">
 <button data-page="workflows"><span class="ni">⌘</span>Workflow builder</button><button data-page="copilot"><span class="ni">✦</span>AI business copilot <span class="pill">BETA</span></button><button data-page="planning"><span class="ni">◷</span>Predictive planning</button>
 </nav></div>
 <div><div class="navlabel">Connections & control</div><nav class="nav">
 <button data-page="integrations"><span class="ni">⇆</span>Integrations & APIs</button><button data-page="portals"><span class="ni">♧</span>Customer/supplier portals</button><button data-page="documents"><span class="ni">▧</span>Documents & OCR</button><button data-page="security"><span class="ni">♙</span>Access & audit</button><button data-page="setup"><span class="ni">⚒</span>Setup & workspace</button>
 </nav></div>
 <div class="sidefoot">Prototype v2.0 · Demo environment<br>Unified data foundation · Kenya-ready design</div>
</aside>
<main class="main">
 <header class="topbar">
  <button class="btn mobile-menu" id="mobileMenu">☰</button>
  <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search anything or jump to a module… ( / )"></div>
  <div class="top-actions">
   <select class="select branchselect" id="branchSelect" aria-label="Branch"><option>Nairobi HQ</option><option>Mombasa Branch</option><option>Kisumu Branch</option><option>All branches</option></select>
   <button class="btn iconbtn" id="syncBtn" title="Simulate sync">⇄ <span id="syncLabel">Online</span></button>
   <button class="btn" id="themeBtn" title="Toggle theme">☾</button>
   <button class="btn primary" id="quickAdd">＋ Create</button>
  </div>
 </header>
 <div class="content" id="content"></div>
</main>
</div>
<nav class="bottomnav" id="bottomnav">
 <button class="active" data-page="overview"><span>⌂</span>Home</button><button data-page="transactions"><span>⇄</span>Activity</button><button data-page="sales"><span>▣</span>Sales</button><button data-page="inventory"><span>▤</span>Stock</button><button data-page="exceptions"><span>⚑</span>Alerts</button>
</nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>'KES '+Number(n).toLocaleString('en-KE',{maximumFractionDigits:0});
const state={page:'overview',theme:localStorage.getItem('oc-theme')||'light',online:true,branch:'Nairobi HQ',role:'Business owner',search:'',sales:[{id:'SO-1048',name:'Walk-in sale',customer:'Retail customer',amount:42800,status:'Paid',branch:'Nairobi HQ',time:'Today, 10:42',items:4},{id:'SO-1047',name:'Hardware order',customer:'Jitegemea Contractors',amount:127500,status:'Awaiting payment',branch:'Mombasa Branch',time:'Today, 10:18',items:12},{id:'SO-1046',name:'Counter sale',customer:'Retail customer',amount:6800,status:'Paid',branch:'Nairobi HQ',time:'Today, 09:55',items:2}],products:[{sku:'HW-001',name:'Cement 50kg',category:'Building materials',stock:42,reorder:30,cost:620,sell:750,branch:'Nairobi HQ'},{sku:'HW-002',name:'PVC pipe 3m',category:'Plumbing',stock:18,reorder:25,cost:240,sell:330,branch:'Nairobi HQ'},{sku:'HW-003',name:'Roofing nails 1kg',category:'Roofing',stock:76,reorder:20,cost:130,sell:190,branch:'Mombasa Branch'},{sku:'HW-004',name:'Emulsion paint 20L',category:'Paint',stock:9,reorder:12,cost:2800,sell:3450,branch:'Nairobi HQ'}],exceptions:[{id:1,title:'PVC pipe below reorder level',detail:'18 units available · Reorder point 25',type:'warn',action:'Create purchase order'},{id:2,title:'Payment not matched',detail:'KES 12,500 M-Pesa receipt awaiting reconciliation',type:'danger',action:'Review payment'},{id:3,title:'Approval required',detail:'Purchase order PO-208 · KES 86,000',type:'warn',action:'Review approval'},{id:4,title:'eTIMS queue needs review',detail:'One demo invoice is marked pending transmission',type:'warn',action:'Open integrations'}],transactions:[],audit:[{when:'10:42',who:'Cashier · Demo',action:'Created sale SO-1048',source:'Sales → Inventory → Finance'},{when:'10:20',who:'Store manager · Demo',action:'Updated stock count',source:'Inventory'},{when:'09:58',who:'System automation',action:'Low-stock exception generated',source:'Inventory → Exception centre'}],workflows:[{name:'Low stock → draft purchase order',trigger:'Stock falls below reorder point',status:true},{name:'Sale → inventory deduction → ledger entry',trigger:'Sale marked complete',status:true},{name:'M-Pesa receipt → payment reconciliation',trigger:'Payment notification received',status:false},{name:'Invoice due → customer reminder',trigger:'Invoice overdue by 3 days',status:true}],docs:[],integrations:[{name:'M-Pesa Daraja',desc:'Payment collection and callback reconciliation',status:'Demo connection'},{name:'KRA eTIMS',desc:'Invoice compliance connector architecture',status:'Sandbox concept'},{name:'Bank feeds',desc:'Statement import and matching',status:'Not connected'},{name:'SMS / WhatsApp',desc:'Customer notifications and reminders',status:'Not connected'}]};
// Restore demo records across refreshes on this device. This is local browser storage, not a shared production database.
try { const saved = JSON.parse(localStorage.getItem('onecore-demo-state') || '{}');
  ['page','branch','role','sales','products','exceptions','transactions','audit','workflows','docs','integrations'].forEach(k => { if (saved[k] !== undefined) state[k] = saved[k]; });
  if (!['overview','transactions','exceptions','analytics','sales','inventory','procurement','finance','customers','operations','workflows','copilot','planning','integrations','portals','documents','security','setup'].includes(state.page)) state.page='overview';
} catch (e) { /* Continue with sample defaults if browser storage is unavailable. */ }
function persistDemoState(){ try { localStorage.setItem('onecore-demo-state', JSON.stringify({page:state.page,branch:state.branch,role:state.role,sales:state.sales,products:state.products,exceptions:state.exceptions,transactions:state.transactions,audit:state.audit,workflows:state.workflows,docs:state.docs,integrations:state.integrations})); } catch(e) { /* Storage may be disabled or full. */ } }
const modules=[['sales','▣','Sales & POS','Quotations, orders, checkout, receipts and returns','Sales → stock → finance'],['inventory','▤','Inventory & barcode','Stock, batches, transfers, reorder and counts','Shared stock ledger'],['procurement','⇣','Procurement','Supplier quotes, purchase orders and receiving','PO → goods received → payable'],['finance','◈','Finance & payments','Cashbook, expenses, receivables and reconciliation','One financial record'],['customers','♙','Customers & suppliers','Shared contacts, credit limits, balances and history','One contact record'],['operations','⚙','Operations & people','Tasks, shifts, approvals, branches and staff','Role-based workflows']];
function header(eyebrow,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function cardTitle(title,sub='',right=''){return `<div class="section-title"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function stat(label,num,icon,trend,note=''){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${num}</div><div class="trend">${trend}</div>${note?`<div class="kpi-note">${note}</div>`:''}</div>`}
function pill(status){let c=/paid|complete|active|connected|approved|synced/i.test(status)?'good':/pending|await|demo|sandbox|review|draft|offline|low|not connected/i.test(status)?'warn':/overdue|failed|blocked|critical/i.test(status)?'bad':'';return `<span class="pill ${c}">${status}</span>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records match this view.</td></tr>`}</tbody></table></div>`}
function saleRows(){return state.sales.filter(s=>(state.branch==='All branches'||s.branch===state.branch)&&JSON.stringify(s).toLowerCase().includes(state.search.toLowerCase())).map(s=>`<tr><td><strong>${s.id}</strong></td><td>${s.customer}</td><td>${s.branch}</td><td><strong>${money(s.amount)}</strong></td><td>${pill(s.status)}</td><td>${s.time}</td><td><button class="btn small" onclick="viewTransaction('${s.id}')">Open</button></td></tr>`).join('')}
function productRows(){return state.products.filter(p=>(state.branch==='All branches'||p.branch===state.branch)&&JSON.stringify(p).toLowerCase().includes(state.search.toLowerCase())).map(p=>`<tr><td><strong>${p.sku}</strong></td><td>${p.name}<div class="muted">${p.category}</div></td><td>${p.branch}</td><td>${p.stock} ${p.stock<=p.reorder?pill('Low stock'):pill('In stock')}</td><td>${p.reorder}</td><td>${money(p.sell)}</td><td><button class="btn small" onclick="editStock('${p.sku}')">Adjust</button></td></tr>`).join('')}
function feed(){return `<div class="feed"><div class="feeditem"><div class="feedicon">▣</div><div><strong>Sale SO-1048 completed</strong><small>Stock deduction and payment entry connected · 10:42</small></div></div><div class="feeditem"><div class="feedicon">⇣</div><div><strong>Purchase order draft created</strong><small>Triggered by PVC pipe reorder rule · 10:30</small></div></div><div class="feeditem"><div class="feedicon">◈</div><div><strong>Payment needs matching</strong><small>KES 12,500 receipt · 10:15</small></div></div><div class="feeditem"><div class="feedicon">♙</div><div><strong>Branch stock count submitted</strong><small>Mombasa Branch · 09:58</small></div></div></div>`}
function exceptionsHTML(limit=9){return state.exceptions.slice(0,limit).map(e=>`<div class="exception ${e.type==='danger'?'danger':''}"><span class="exmark"></span><div style="flex:1"><strong>${e.title}</strong><p>${e.detail}</p><button class="btn small" onclick="resolveException(${e.id})">${e.action}</button><button class="btn small ghost" onclick="dismissException(${e.id})">Dismiss</button></div></div>`).join('')||'<div class="empty">All clear. No open exceptions.</div>'}
function overview(){return `${header('Unified workspace','Good morning. Here is your business at a glance.','One connected operating system across sales, stock, people, finance and branches.','<button class="btn" onclick="navigate(\'analytics\')">View insights ↗</button><button class="btn primary" onclick="openCreate()">＋ New transaction</button>')}

function documents(){return `${header('Document intelligence','Documents & OCR','Attach source documents to shared transactions and extract fields for human review.','<button class="btn primary" onclick="openDocument()">＋ Add document</button>')}<div class="callout" style="margin-bottom:15px"><strong>OCR is a review-assisted workflow</strong><p>This prototype simulates extraction status only. Real OCR requires a processing service, retention policy and validation before data posts into finance or stock.</p></div><div class="grid two"><div class="card">${cardTitle('Document inbox','Invoices, delivery notes, receipts and supplier bills')}<div id="docList">${state.docs.length?state.docs.map((d,i)=>`<div class="feeditem"><div class="feedicon">▧</div><div style="flex:1"><strong>${d.name}</strong><small>${d.type} · ${d.ref} · ${d.status}</small><div style="margin-top:6px">${pill(d.status)} <button class="btn small" onclick="reviewDoc(${i})">Review fields</button></div></div></div>`).join(''):'<div class="empty">No documents yet. Add a sample document to test the review flow.</div>'}</div></div><div class="card">${cardTitle('Document-to-record workflow')}<div class="workflow" style="display:grid;grid-template-columns:1fr"><div class="step"><b>1. Upload / capture</b><small>Attach to supplier or transaction</small></div><div class="arrow">↓</div><div class="step"><b>2. OCR extraction</b><small>Supplier, date, amount, invoice no.</small></div><div class="arrow">↓</div><div class="step"><b>3. Human validation</b><small>Check confidence and duplicates</small></div><div class="arrow">↓</div><div class="step"><b>4. Post to shared record</b><small>Permission checks + audit trail</small></div></div></div></div>`}
function security(){return `${header('Governance','Access control & audit','Role-based permissions, approvals and traceability apply across all modules.','<button class="btn" onclick="exportAudit()">⇩ Export audit</button>')}<div class="grid two"><div class="card">${cardTitle('Current demo role','Switch roles to preview the workspace perspective')}<div class="field"><label>Role preview</label><select id="roleSelect" onchange="state.role=this.value;render();toast('Role preview changed. This is not secure authentication.')">${['Business owner','Branch manager','Finance officer','Store manager','Cashier','Auditor'].map(r=>`<option ${r===state.role?'selected':''}>${r}</option>`).join('')}</select></div><div class="divider"></div>${[['Sales','Create / view / refund'],['Inventory','Receive / adjust / transfer'],['Finance','Reconcile / approve / report'],['People','Schedule / manage team'],['Settings','Configure roles / integrations']].map((r,i)=>`<div class="switchrow"><div><strong>${r[0]}</strong><div class="muted">${r[1]}</div></div><input type="checkbox" class="switch" ${state.role==='Business owner'||(state.role==='Auditor'&&i===3)?'checked':''} ${state.role==='Cashier'&&i>0?'disabled':''}></div>`).join('')}<p class="muted" style="font-size:11px">Role toggles are UI previews only. Real authorization must be enforced server-side for every API request.</p></div><div class="card">${cardTitle('Audit trail','Who did what, when, and through which workflow')}${table(['Time','Actor','Event','Module chain'],state.audit.map(a=>`<tr><td>${a.when}</td><td>${a.who}</td><td>${a.action}</td><td>${a.source}</td></tr>`).join(''))}</div></div>`}
function setup(){return `${header('Workspace configuration','Setup & configurable business workspace','Start simple, enable modules as needed, and keep all activated modules on the same shared foundation.','<button class="btn primary" onclick="toast(\'Setup checklist saved in this demo session.\')">Save configuration</button>')}<div class="grid two"><div class="card">${cardTitle('Business setup wizard','Configure company and branch structure')}<div class="formgrid"><div class="field"><label>Business name</label><input value="OneCore Demo Enterprise"></div><div class="field"><label>Industry template</label><select><option>Hardware / wholesale</option><option>Retail / general trade</option><option>Salon / beauty</option><option>Clinic / pharmacy</option><option>Farm / agribusiness</option><option>Hospitality / club</option><option>Professional services</option><option>Custom SME</option></select></div><div class="field"><label>Base currency</label><select><option>KES — Kenyan shilling</option></select></div><div class="field"><label>Tax configuration</label><select><option>Configure with accountant</option><option>VAT registered</option><option>Non-VAT registered</option></select></div><div class="field full"><label>Branch structure</label><div class="tagrow"><span class="tag on">Nairobi HQ</span><span class="tag on">Mombasa Branch</span><span class="tag on">Kisumu Branch</span><button class="tag" onclick="toast('Add branch form is planned for the production setup wizard.')">＋ Add branch</button></div></div></div><div class="divider"></div><div class="switchrow"><div><strong>Enable shared inventory</strong><div class="muted">Branch transfers and consolidated stock view</div></div><input class="switch" type="checkbox" checked></div><div class="switchrow"><div><strong>Enable approval policies</strong><div class="muted">Purchases, refunds and expenses</div></div><input class="switch" type="checkbox" checked></div></div><div class="card">${cardTitle('Modular workspace','Choose modules to enable in this demo')}<div class="muted" style="font-size:11px;margin-bottom:10px">Modules can be configured by industry, but they share one customer, product, transaction, permission and reporting model.</div>${modules.map(m=>`<div class="switchrow"><div><strong>${m[2]}</strong><div class="muted">${m[3]}</div></div><input class="switch" type="checkbox" checked></div>`).join('')}<button class="btn" style="margin-top:14px" onclick="exportCSV()">⇩ Export sample data</button></div></div><div class="card" style="margin-top:15px">${cardTitle('Import & migration readiness','Bring existing SME records into one source of truth')}<div class="grid three"><div><strong>Contacts</strong><p class="muted">CSV mapping + duplicate checks</p><button class="btn small" onclick="toast('Contacts CSV mapping wizard is a planned backend feature.')">Map contacts</button></div><div><strong>Products & stock</strong><p class="muted">SKU, barcode, unit and opening balance</p><button class="btn small" onclick="toast('Product import mapping wizard is a planned backend feature.')">Map products</button></div><div><strong>Opening balances</strong><p class="muted">Review and approve before posting</p><button class="btn small" onclick="toast('Opening balance review is simulated.')">Review balances</button></div></div></div>`}
function render(){document.documentElement.dataset.theme=state.theme;$('#themeBtn').textContent=state.theme==='dark'?'☀':'☾';$('#branchSelect').value=state.branch;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const pages={overview,transactions,exceptions,analytics,sales,inventory,procurement,finance,customers,operations,workflows,copilot,planning,integrations,portals,documents,security,setup};$('#content').innerHTML=(pages[state.page]||overview)();$('#exceptionCount').textContent=state.exceptions.length;$('#syncLabel').textContent=state.online?'Online':'Offline';persistDemoState();}
function navigate(p){state.page=p;state.search='';$('#globalSearch').value='';render();window.scrollTo({top:0,behavior:'smooth'});if(window.innerWidth<700)$('#sidenav').classList.add('hidden')}
function toast(msg){$('#toastRoot').innerHTML=`<div class="notice">${msg}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',3000)}
function modal(title,body,submitLabel='Save',onSave=''){ $('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" onclick="closeModal()">✕</button></div>${body}<div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="${onSave||'closeModal()'}">${submitLabel}</button></div></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function openCreate(){modal('Create a connected transaction',`<div class="formgrid"><div class="field"><label>Transaction type</label><select id="newType"><option>Sale</option><option>Expense</option><option>Payment received</option><option>Stock adjustment</option><option>Purchase order</option></select></div><div class="field"><label>Customer / reference</label><input id="newCustomer" value="Walk-in customer"></div><div class="field"><label>Amount (KES)</label><input id="newAmount" type="number" min="0" value="1500"></div><div class="field"><label>Branch</label><select id="newBranch"><option>Nairobi HQ</option><option>Mombasa Branch</option><option>Kisumu Branch</option></select></div><div class="field full"><label>Notes</label><textarea id="newNotes" placeholder="Optional transaction notes"></textarea></div></div><p class="muted" style="font-size:11px">Demo only: the transaction appears in this browser session. No real accounting or payment action is made.</p>`,'Create transaction','createTransaction()')}
function createTransaction(){const type=$('#newType').value,amount=Math.max(0,Number($('#newAmount').value)||0),id='SO-'+(1049+state.transactions.length);const rec={id,name:type,customer:$('#newCustomer').value||'Unassigned',amount,status:type==='Sale'?'Paid':'Draft',branch:$('#newBranch').value,time:'Just now',items:1};state.transactions.unshift(rec);if(type==='Sale')state.sales.unshift(rec);state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Created '+type+' '+id,source:'Unified transaction engine'});closeModal();state.page='transactions';render();toast('Demo transaction created. Connected production posting is not enabled.')}
function openProduct(){modal('Add product to shared catalogue',`<div class="formgrid"><div class="field"><label>SKU / barcode</label><input id="pSku" placeholder="e.g. HW-005" required></div><div class="field"><label>Product name</label><input id="pName" placeholder="Product name" required></div><div class="field"><label>Opening stock</label><input id="pStock" type="number" value="0"></div><div class="field"><label>Reorder point</label><input id="pReorder" type="number" value="10"></div><div class="field"><label>Cost price (KES)</label><input id="pCost" type="number" value="0"></div><div class="field"><label>Selling price (KES)</label><input id="pSell" type="number" value="0"></div></div>`,'Add product','saveProduct()')}
function saveProduct(){let sku=$('#pSku').value.trim(),name=$('#pName').value.trim();if(!sku||!name){toast('Enter both SKU and product name.');return}state.products.push({sku,name,category:'General',stock:+$('#pStock').value||0,reorder:+$('#pReorder').value||0,cost:+$('#pCost').value||0,sell:+$('#pSell').value||0,branch:state.branch==='All branches'?'Nairobi HQ':state.branch});state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Added product '+sku,source:'Inventory → Shared catalogue'});closeModal();render();toast('Product added to the demo catalogue.')}
function editStock(sku){const p=state.products.find(x=>x.sku===sku);if(!p)return;modal('Adjust stock · '+p.name,`<div class="field"><label>New on-hand quantity</label><input id="stockNew" type="number" value="${p.stock}"></div><div class="field" style="margin-top:10px"><label>Reason</label><select id="stockReason"><option>Stock count correction</option><option>Damaged goods</option><option>Opening balance correction</option></select></div>`,'Save adjustment',`saveStock('${sku}')`)}
function saveStock(sku){let p=state.products.find(x=>x.sku===sku);if(p){p.stock=Math.max(0,+$('#stockNew').value||0);state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Adjusted stock '+sku,source:'Inventory → Audit trail'});}closeModal();render();toast('Demo stock level updated.')}
function scanBarcode(){modal('Barcode lookup',`<div class="field"><label>Scan with a supported device or enter barcode / SKU</label><input id="barcodeInput" placeholder="Scan or type SKU…" autofocus></div><p class="muted" style="font-size:11px">This browser demo supports manual lookup. Hardware camera scanning and reliable offline queues require device permissions and a production PWA.</p>`,'Find product','lookupBarcode()')}
function lookupBarcode(){let q=$('#barcodeInput').value.trim().toLowerCase(),p=state.products.find(p=>p.sku.toLowerCase()===q||p.name.toLowerCase().includes(q));closeModal();if(p){toast(`${p.name} · ${p.stock} in stock · ${money(p.sell)}`)}else toast('No matching product found in the local demo catalogue.')}
function openPurchase(name=''){modal('Draft purchase order',`<div class="formgrid"><div class="field"><label>Supplier</label><select><option>Mwangaza Hardware Supplies</option><option>Lake Region Distributors</option><option>New supplier</option></select></div><div class="field"><label>Branch receiving stock</label><select><option>${state.branch==='All branches'?'Nairobi HQ':state.branch}</option><option>Mombasa Branch</option><option>Kisumu Branch</option></select></div><div class="field full"><label>Item / description</label><input id="poItem" value="${name}" placeholder="Item to order"></div><div class="field"><label>Quantity</label><input type="number" id="poQty" value="20"></div><div class="field"><label>Estimated total (KES)</label><input type="number" id="poTotal" value="25000"></div></div><p class="muted" style="font-size:11px">Production purchase orders require approval limits and goods-received matching before payable posting.</p>`,'Save draft','savePurchase()')}
function savePurchase(){const item=$('#poItem').value||'General stock';state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Drafted purchase order for '+item,source:'Procurement → Approvals'});closeModal();toast('Draft purchase order saved to demo audit trail.')}
function openFinance(){modal('Record payment',`<div class="formgrid"><div class="field"><label>Payment method</label><select id="payMethod"><option>M-Pesa</option><option>Cash</option><option>Bank transfer</option><option>Card</option></select></div><div class="field"><label>Amount (KES)</label><input id="payAmount" type="number" value="12500"></div><div class="field full"><label>Reference</label><input id="payRef" value="DEMO-PAY-001"></div></div><p class="muted" style="font-size:11px">No funds move and no external payment provider is called.</p>`,'Record demo payment','savePayment()')}
function savePayment(){state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Recorded '+$('#payMethod').value+' payment '+$('#payRef').value,source:'Finance → Reconciliation'});closeModal();toast('Demo payment record created. No actual payment processed.')}
function openContact(){modal('Add shared contact',`<div class="formgrid"><div class="field"><label>Contact name</label><input id="cName" placeholder="Business / person name"></div><div class="field"><label>Type</label><select id="cType"><option>Customer</option><option>Supplier</option><option>Both</option></select></div><div class="field"><label>Phone</label><input id="cPhone" placeholder="+254…"></div><div class="field"><label>Email</label><input id="cEmail" type="email" placeholder="name@example.com"></div></div>`,'Save contact','saveContact()')}
function saveContact(){let n=$('#cName').value.trim();if(!n){toast('Enter a contact name.');return}state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Added shared contact '+n,source:'Contacts → Sales / Procurement / Finance'});closeModal();toast('Contact creation event recorded in demo.')}
function openTask(){modal('Assign operational task',`<div class="formgrid"><div class="field full"><label>Task</label><input id="taskName" placeholder="Task description"></div><div class="field"><label>Assignee</label><select><option>Store manager</option><option>Finance officer</option><option>Cashier</option><option>Branch manager</option></select></div><div class="field"><label>Due</label><input type="date"></div></div>`,'Assign task','saveTask()')}
function saveTask(){let n=$('#taskName').value||'New operational task';state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Assigned task: '+n,source:'Operations → Task board'});closeModal();toast('Task assignment simulated.')}
function openDocument(){modal('Add document to shared record',`<div class="formgrid"><div class="field full"><label>Document name</label><input id="docName" placeholder="e.g. Supplier invoice 1024"></div><div class="field"><label>Document type</label><select id="docType"><option>Supplier invoice</option><option>Receipt</option><option>Delivery note</option><option>Expense claim</option><option>Other</option></select></div><div class="field"><label>Linked reference</label><input id="docRef" placeholder="PO / invoice / sale ID"></div></div><p class="muted" style="font-size:11px">File upload and OCR extraction are not active; this creates a sample document metadata record.</p>`,'Add document','saveDocument()')}
function saveDocument(){let n=$('#docName').value.trim();if(!n){toast('Enter a document name.');return}state.docs.unshift({name:n,type:$('#docType').value,ref:$('#docRef').value||'Unlinked',status:'Needs review'});closeModal();render();toast('Document metadata added. OCR is simulated.')}
function reviewDoc(i){const d=state.docs[i];modal('Review extracted fields',`<p><strong>${d.name}</strong></p><div class="field"><label>Supplier / issuer (demo extracted value)</label><input value="Review supplier name"></div><div class="field" style="margin-top:10px"><label>Invoice number</label><input value="${d.ref}"></div><div class="field" style="margin-top:10px"><label>Amount (KES)</label><input type="number" value="0"></div><p class="muted" style="font-size:11px">Confirm all fields against the original document before posting.</p>`,'Mark reviewed',`markDoc(${i})`)}
function markDoc(i){state.docs[i].status='Reviewed (demo)';closeModal();render();toast('Document marked reviewed in the demo.')}
function addWorkflow(){modal('Create automation rule',`<div class="field"><label>Rule name</label><input id="wfName" placeholder="e.g. Alert when invoice is overdue"></div><div class="field" style="margin-top:10px"><label>Trigger</label><select id="wfTrigger"><option>Stock falls below reorder point</option><option>Invoice becomes overdue</option><option>Payment received</option><option>Purchase order submitted</option><option>Sale completed</option></select></div>`,'Create rule','saveWorkflow()')}
function saveWorkflow(){let n=$('#wfName').value.trim();if(!n){toast('Enter a workflow name.');return}state.workflows.push({name:n,trigger:$('#wfTrigger').value,status:true});closeModal();render();toast('Demo workflow rule created.')}
function toggleWorkflow(i,v){state.workflows[i].status=v;state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:(v?'Activated':'Paused')+' workflow: '+state.workflows[i].name,source:'Workflow builder → Audit'});render();toast('Workflow status updated in demo.')}
function askCopilot(e){if(e)e.preventDefault();let q=$('#copilotInput').value.trim();if(!q)return;askPreset(q)}
function askPreset(q){if(state.page!=='copilot'){navigate('copilot')}setTimeout(()=>{const log=$('#chatlog');let answer='I can only answer from the demo dataset. Review the underlying records before making a decision.';if(/stock|reorder|inventory/i.test(q)){const low=state.products.filter(p=>p.stock<=p.reorder);answer=low.length?`There are ${low.length} items at or below their reorder point: ${low.map(p=>`${p.name} (${p.stock} on hand; reorder at ${p.reorder})`).join('; ')}. Suggested next step: review supplier lead times and create draft purchase orders.`:'No items are currently below reorder points in this demo catalogue.'}else if(/cash|flow|payment|receivable/i.test(q)){answer=`The demo shows ${money(638400)} in open receivables, ${money(482000)} in supplier payables, and one unmatched receipt of ${money(12500)}. Reconcile the unmatched receipt before relying on the cash position.`}else if(/sales|revenue|sell/i.test(q)){answer=`The sample dashboard reports ${money(284600)} sales today. The demo chart suggests an illustrative positive trend, but the chart values are not connected to a live accounting database.`}else if(/branch/i.test(q)){answer='The prototype includes Nairobi HQ, Mombasa Branch and Kisumu Branch views. In production, branch-level access and consolidated reports should share the same transaction model with strict tenant and branch permissions.'}log.innerHTML+=`<div class="chatbubble"><strong>You</strong><br>${q.replace(/</g,'&lt;')}</div><div class="chatbubble ai"><strong>OneCore copilot · demo</strong><br>${answer}<div style="margin-top:8px"><button class="btn small" onclick="toast('Suggestion copied into a demo review task; no business action executed.')">Create review task</button></div></div>`;$('#copilotInput').value='';log.scrollTop=log.scrollHeight},50)}
function integrationDetail(name){modal('Configure · '+name,`<p>This is a connector setup preview. Production configuration must use secure server-side credentials and provider-approved environments.</p><div class="field"><label>Environment</label><select><option>Sandbox / test</option><option>Production (requires verified setup)</option></select></div><div class="field" style="margin-top:10px"><label>Connection status</label><input value="${state.integrations.find(i=>i.name===name)?.status||'Not connected'}" readonly></div><div class="switchrow"><div><strong>Enable event logging</strong><div class="muted">Record requests, responses and reconciliation IDs</div></div><input type="checkbox" class="switch" checked></div>`,'Save preview','closeModal()')}
function viewTransaction(id){let s=state.sales.find(x=>x.id===id)||state.transactions.find(x=>x.id===id);if(!s){toast('Transaction not found.');return}modal('Transaction '+s.id,`<div class="grid two"><div><div class="muted">Customer</div><strong>${s.customer}</strong></div><div><div class="muted">Amount</div><strong>${money(s.amount)}</strong></div><div><div class="muted">Branch</div><strong>${s.branch}</strong></div><div><div class="muted">Status</div>${pill(s.status)}</div></div><div class="divider"></div><strong>Linked events</strong><div class="feeditem"><div class="feedicon">▣</div><div><strong>Order record</strong><small>${s.id} · shared transaction reference</small></div></div><div class="feeditem"><div class="feedicon">▤</div><div><strong>Inventory movement</strong><small>Would link SKU-level stock changes in production</small></div></div><div class="feeditem"><div class="feedicon">◈</div><div><strong>Payment / finance record</strong><small>Status: ${s.status} · no live ledger posting in demo</small></div></div>`,'Close','closeModal()')}
function resolveException(id){const e=state.exceptions.find(x=>x.id===id);if(!e)return;modal('Resolve exception',`<p><strong>${e.title}</strong></p><p>${e.detail}</p><div class="field"><label>Resolution note</label><textarea id="resNote" placeholder="Describe the review or follow-up"></textarea></div><p class="muted" style="font-size:11px">Demo resolution only. Critical financial or compliance exceptions should require verified permission in production.</p>`,'Mark reviewed',`finishException(${id})`)}
function finishException(id){const e=state.exceptions.find(x=>x.id===id);state.exceptions=state.exceptions.filter(x=>x.id!==id);state.audit.unshift({when:'Just now',who:state.role+' · Demo',action:'Reviewed exception: '+e.title,source:'Exception centre → Audit trail'});closeModal();render();toast('Exception marked reviewed in demo.')}
function dismissException(id){state.exceptions=state.exceptions.filter(x=>x.id!==id);render();toast('Exception dismissed in demo.')}
function exportCSV(){const rows=[['Reference','Customer','Branch','Amount','Status','Time'],...state.sales.map(s=>[s.id,s.customer,s.branch,s.amount,s.status,s.time])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='onecore-transactions-demo.csv';a.click();URL.revokeObjectURL(a.href);toast('Demo transaction CSV exported.')}
function exportAudit(){const rows=[['Time','Actor','Event','Module chain'],...state.audit.map(a=>[a.when,a.who,a.action,a.source])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='onecore-audit-demo.csv';a.click();URL.revokeObjectURL(a.href);toast('Demo audit CSV exported.')}
$('#sidenav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});$('#modnav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});$('#bottomnav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b))}));
$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('oc-theme',state.theme);render()};
$('#branchSelect').onchange=e=>{state.branch=e.target.value;render();toast('Branch view changed. Sample records filter by branch where supported.')};
$('#syncBtn').onclick=()=>{state.online=!state.online;render();toast(state.online?'Online mode simulated.':'Offline mode simulated: cached demo records remain visible.');};
$('#quickAdd').onclick=openCreate;$('#mobileMenu').onclick=()=>{modal('Navigate OneCore',`<div class="grid" style="grid-template-columns:1fr 1fr">${[['overview','⌂','Command centre'],['transactions','⇄','Transactions'],['sales','▣','Sales'],['inventory','▤','Inventory'],['exceptions','⚑','Exceptions'],['analytics','▥','Analytics'],['workflows','⌘','Workflows'],['integrations','⇆','Integrations'],['security','♙','Access & audit'],['setup','⚒','Setup']].map(([p,i,n])=>`<button class="btn" style="text-align:left" onclick="closeModal();navigate('${p}')">${i} ${n}</button>`).join('')}</div>`,'Close','closeModal()')};
$('#globalSearch').addEventListener('input',e=>{state.search=e.target.value;if(['sales','inventory','transactions'].includes(state.page)){const value=e.target.value,start=e.target.selectionStart;render();$('#globalSearch').focus();$('#globalSearch').setSelectionRange(start,start)}});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();let map=[['stock','inventory'],['product','inventory'],['sale','sales'],['transaction','transactions'],['payment','finance'],['cash','finance'],['customer','customers'],['supplier','customers'],['workflow','workflows'],['mpesa','integrations'],['etims','integrations'],['branch','setup'],['audit','security'],['exception','exceptions'],['forecast','planning'],['document','documents'],['copilot','copilot']];let hit=map.find(([k])=>q.includes(k));if(hit){navigate(hit[1]);state.search=e.target.value;$('#globalSearch').value=e.target.value;render()}else toast('Search across products, transactions, contacts and modules is ready in this demo.')}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape')closeModal()});
render();
</script>
</body></html>
